      // Somebody else's source wears the name. Say so and leave it alone: the
      // landscape overlay is already written, and this one can be added later.
      log(t("log.verticalskipped", { n: want }), "warn");
      return Promise.resolve();
    }
    return makeOrWrite(scene, want, taken, verticalUrl(), 1080, 1920, false, false)
      .then(function () { log(t("log.verticalcreated", { n: want }), "ok"); })
      .catch(function (e) { log(t("log.verticalfail", { m: e.message }), "warn"); });
  }

  function resolveBarName(want) {
    var existing = targets.filter(function (r) { return r.name === want; })[0];
    var taken = inputNames.indexOf(want) !== -1;
    if (!taken) return Promise.resolve({ name: want, overwrite: false });
    if (existing && existing.match && existing.isBar) {
      return Promise.resolve({ name: want, overwrite: true });
    }
    return ask(t("dlg.title"), t("dlg.src", { n: want }), [
      { label: "dlg.cancel", value: "cancel" },
      { label: "dlg.rename", value: "rename" },
      { label: "dlg.overwrite", value: "overwrite", primary: true }
    ]).then(function (answer) {
      if (answer === "cancel") return null;
      if (answer === "overwrite") {
        log(t("log.overwrote", { n: want }), "warn");
        return { name: want, overwrite: true };
      }
      var fresh = uniqueName(want, inputNames);
      log(t("log.renamed", { a: want, b: fresh }), "warn");
      return { name: fresh, overwrite: false };
    });
  }

  /**
   * The browser source is made here rather than by hand.
   *
   * Asking a broadcaster to add an empty browser source, uncheck "shutdown when
   * not visible", and set it to 1920x1080 before this page can do anything is
   * three chances to get it wrong, and the page can simply do all three.
   * is_local_file has to be false: OBS ignores the url field while it is set,
   * and the local-file field has nowhere to put the settings.
   *
   * `reroute` is "Control audio via OBS", and the overlay needs it on. Left off
   * — which is the OBS default, and which this page used to write explicitly on
   * every push — the page's sound goes to the machine's playback device instead
   * of into OBS. The broadcaster hears the shutter and **the audience does
   * not**, unless a Desktop Audio capture happens to be in the scene, and then
   * it arrives welded to every other sound the machine makes. So the one thing
   * this extension can put in the broadcast — §2.4 forbids the viewer's frame
   * from making any (CLAUDE.md) — reached nobody it was for.
   *
   * On, the audio becomes a track on this input: one path to the stream on
   * every machine, with its own fader, and nothing for a Desktop Audio source
   * to pick up twice.
   *
   * The bar passes false. It is the same page with `#bar`, and that page never
   * calls ensureAudio() — an audio track that is silent by construction is
   * clutter in the mixer.
   */
  /* `enabled` is the scene item, not the source: false makes it and leaves it
   * switched off in the scene it was made in. Only the vertical source passes
   * it — it is made in a landscape scene because that is the only kind
   * obs-websocket can reach, and it belongs to a scene the plugin owns. Note
   * the source itself still runs (shutdown is false), which is what the
   * broadcaster wants: by the time they add it to their vertical scene it has
   * already connected and is ready. */
  function makeOrWrite(scene, name, overwrite, url, w, h, reroute, enabled) {
    var settings = {
      is_local_file: false,
      url: url,
      width: w,
      height: h,
      shutdown: false,           // it has to keep running while hidden
      reroute_audio: !!reroute
    };
    if (overwrite) {
      return request("SetInputSettings", { inputName: name, inputSettings: settings, overlay: true });
    }
    return request("CreateInput", {
      sceneName: scene, inputName: name, inputKind: "browser_source",
      inputSettings: settings, sceneItemEnabled: enabled !== false
    }).then(function () { log(t("log.created", { n: name, s: scene }), "ok"); });
  }

  function buildAll() {
    if (building) return;
    if (!identified) { log(t("log.needconn"), "warn"); status("bad", t(failKey || "st.idle"), true); return; }

    building = true;
    renderBuildState();

    var hostScene = "";
    var chosenName = "";
    var builtSig = "";      // the settings the sources were actually built with

    resolveCaptureScene()
      .then(function (capture) {
        if (!capture) return null;                   // the broadcaster said no
        cfg.src = capture;
        ui.capName = capture;
        saveUi();
        saveCfg(cfg);
        // The host scene cannot be the scene being photographed, or the overlay
        // ends up in its own picture. Re-read the list now that the capture
        // scene is settled, and only then ask where the overlay goes.
        return request("GetSceneList").then(function (res) {
          scenes = (res.scenes || []).map(function (x) { return x.sceneName; }).sort(function (a, b) {
            return a.localeCompare(b);
          });
          return renderHostScenes();
        }).then(function () {
          hostScene = el.newSrcScene.value;
          if (!hostScene) { log(t("log.needscene"), "warn"); return null; }
          return resolveOverlayName();
        });
      })
      .then(function (pick) {
        if (!pick) return null;
        chosenName = pick.name;
        ui.srcName = pick.name;
        ui.hostScene = hostScene;
        saveUi();
        // One reading of the settings for both sources and for the record of
        // what was written, for the reason writeAll() gives: creating them
        // takes several round trips, and the page is live throughout.
        builtSig = currentSig();
        return makeOrWrite(hostScene, pick.name, pick.overwrite, overlayUrl(), 1920, 1080, true)
          .then(function () {
            // The bar gets a source of its own, so OBS can place it, size it,
            // and put it in one scene and not another — none of which it could
            // do while it was drawn inside the overlay's canvas (§4.11).
            //
            // The suffix is English on every channel. It is a name in OBS, and
            // a name that changed when the broadcaster changed this page's
            // language would leave the old source behind, unwritten, drawing.
            var barName = pick.name + " bar";
            // barUrl(), not the overlay's: a bar never connects to OBS, so it
            // never takes the password back out of its own URL.
            // 480x56: one row, smaller than the 560x64 it replaced. The bar is a
            // small part of the effect, not its headline; the type gets its
            // size from filling the row rather than from a bigger box. An
            // existing 560x64 source still fits — the strip sizes itself off
            // whatever box it is given (overlay shell.html, the #bar block).
            return resolveBarName(barName)
              .then(function (bar) {
                // The overlay is already written by now, so "no" here is only
                // "no bar" — said, because a source that quietly did not
                // appear looks like one that failed.
                if (!bar) { log(t("log.barskipped"), "warn"); return; }
                return makeOrWrite(hostScene, bar.name, bar.overwrite, barUrl(), 480, 56, false)
                  .then(function () { log(t("log.barcreated", { n: bar.name }), "ok"); });
              })
              .then(function () { return makeVertical(hostScene, pick.name); })
              .catch(function (e) {
                // The overlay is the half that matters. A bar that failed to
                // appear is something the broadcaster can add later.
                log(t("log.barcreatefail", { m: e.message }), "warn");
              });
          })
          .then(function () { return true; });
      })
      .then(function (done) {
        if (!done) return null;
        target = chosenName;
        return loadScenes()
          .then(scanTargets)
          .then(function () { return arrangeIn(hostScene); })
          .then(reloadSources)
          .then(function () { markPushed(builtSig); });
      })
      .catch(function (e) { log(t("log.createfail", { m: e.message }), "bad"); })
      .then(function () {
        building = false;
        renderBuildState();
        renderDock();
      });
  }

  function renderBuildState() {
    var made = !!(target && cfg.src);
    el.build.textContent = building ? t("build.busy") : (made ? t("build.again") : t("build.go"));
    el.build.disabled = building || !identified;
    el.refresh.disabled = !identified;
    el.shot.disabled = !identified || !cfg.src;
    el.buildReady.hidden = !made;
    if (made) el.buildReady.textContent = t("build.ready", { c: cfg.src, o: target });
  }

  /** Which scene the overlay goes in — never the one being photographed. */
  function renderHostScenes() {
    var keep = el.newSrcScene.value || ui.hostScene;
    el.newSrcScene.textContent = "";
    scenes.forEach(function (name) {
      if (name === cfg.src) return;
      var o = document.createElement("option");
      o.value = name;
      o.textContent = name;
      el.newSrcScene.appendChild(o);
    });
    if (keep && scenes.indexOf(keep) !== -1 && keep !== cfg.src) {
      el.newSrcScene.value = keep;
      return Promise.resolve();
    }
    // Nothing remembered: the scene that is on air is the one the broadcaster
    // is looking at, and the only defensible guess.
    if (!identified) return Promise.resolve();
    return request("GetCurrentProgramScene").then(function (r) {
      var live = r.sceneName || r.currentProgramSceneName || "";
      if (live && live !== cfg.src && scenes.indexOf(live) !== -1) el.newSrcScene.value = live;
    }).catch(function () {});
  }

  el.newSrcScene.addEventListener("change", function () {
    ui.hostScene = el.newSrcScene.value;
    saveUi();
  });

  /* ---- proving the capture path from here, before writing anything ---- */

  function testCapture() {
    // Not "dropped": this is reachable before anything was ever connected.
    if (!identified) { status("bad", t(failKey || "st.idle"), true); return; }
    if (!cfg.src) { log(t("log.picksrc"), "warn"); return; }
    request("GetSourceScreenshot", {
      sourceName: cfg.src, imageFormat: "jpg", imageWidth: 640, imageCompressionQuality: 70
    }).then(function (d) {
      if (!d.imageData) throw new Error("empty imageData");
      el.preview.src = d.imageData;
      el.preview.hidden = false;
      log(t("log.shot", { kb: Math.round(d.imageData.length / 1024) }), "ok");
    }).catch(function (e) {
      el.preview.hidden = true;
      if (/render/i.test(e.message)) log(t("log.norender"), "bad");
      else log(t("log.reqfail", { m: e.message }), "bad");
    });
  }

  /* ================= writing the settings into OBS =================

     The overlay used to carry this panel on the broadcast canvas, which meant a
     failed capture could throw the broadcaster's connection details on stream.
     Configuration lives here now, and reaches the overlay the only way that is
     both local and invisible: this page holds an obs-websocket connection, so it
     writes the browser source's own URL. */

  /* The overlay is in a folder beside this file, and this is the only line that
   * says so. It used to be "../overlay/index.html", because this page used to
   * live in a setup/ folder of its own — which is also why the zip had three
   * things in it and a README explaining which one to open (変更 D).
   *
   * One rule, no branch. There is no old layout to stay compatible with: the
   * releases so far were downloaded once each, by the person who built them
   * (docs/onboarding-plan.md §前提). A branch that picks ./ or ../ by looking at
   * its own path would be a second thing to be wrong, guarding nobody. */
  var OVERLAY_URL = new URL("./overlay/index.html", location.href).href;

  /** Everything the overlay needs, small enough to ride in a URL fragment. */
  function overlayConfig() {
    var c = {
      host: cfg.host, port: cfg.port, pw: cfg.pw, src: cfg.src,
      preset: cfg.preset, accent: cfg.accent, place: cfg.place, scale: cfg.scale,
      // The language the broadcaster chose on this page is the one their whole
      // audience will read the overlay in (§4.8). Sending it is what keeps the
      // overlay from falling back to the language of whatever browser OBS
      // happens to embed — the same page, a different machine, a different PC's
      // idea of what language a stream is in.
      lang: cfg.lang || lang,
      ebs: cfg.ebs, ch: cfg.ch, ebsToken: cfg.ebsToken,
      saveDir: cfg.saveDir || "", scenes: cfg.scenes || "", gateSet: cfg.gateSet || "", testUntil: String(cfg.testUntil || ""),
      // What to keep and how heavy. Sent even though the overlay has defaults
      // for them: a default that matches is not the same as a value that was
      // chosen, and the difference only shows when somebody changes it.
      saveFrom: cfg.saveFrom, saveParty: cfg.saveParty, saveSize: cfg.saveSize,
      // What the prints say underneath. Two settings, because the two answer
      // different questions: on screen the clock is competing with a name for
      // width, and on disk it is competing with nothing.
      stampShot: cfg.stampShot, stampSave: cfg.stampSave,
      // The bar's glass. Only the bar source draws it, but it rides with
      // everything else: barConfig() is overlayConfig() with pieces taken
      // out, so a key that is not here never reaches the bar either.
      glass: cfg.glass,
      // The theme the glass is drawn in, and the pack of images laid on it —
      // the folder's name and which files are in it, never the images
      // (docs/theme-pack-plan.md §5). The overlay resolves themes/<pack>/
      // beside itself; the card, being the same file, resolves the same.
      theme: cfg.theme, pack: cfg.pack, packSlots: cfg.packSlots
    };
    /* An empty password is "I do not have one", never "erase the one you have".
     *
     * The overlay is the only page that ends up holding it: it takes the
     * password out of its own URL once it has authenticated and keeps it in
     * storage instead (overlay: scrubSecretsFromUrl). From then on this page
     * can be reopened somewhere that remembers nothing — a different origin, a
     * cleared profile — and the box is blank while OBS is still working.
     *
     * Sent as "" that blankness travels: the overlay lets the URL win over
     * what it remembered, so the empty string lands on top of the real
     * password and is saved there. The next OBS start cannot authenticate, and
     * nothing anywhere still knows what the password was.
     *
     * Left out entirely it means nothing at all, and the overlay keeps what it
     * has. Which is the honest reading of a blank box on a page that never had
     * the password to begin with. Changing it still works — a password that is
     * actually typed is not empty, so it rides along and wins as before.
     *
     * Erasing one deliberately is not on this path: the reset button clears
     * what this page remembers, and a broadcaster who turns authentication off
     * in OBS is not asking for anything to be scrubbed. */
    if (!c.pw) delete c.pw;
    return c;
  }

  /* ?v= before the fragment, not inside it.
     A query is ignored when the file is opened and counted when the cache is
     consulted, so this is what makes CEF fetch a changed overlay rather than
     the copy it already has (the same trick the photo URLs use — draft 115). */
  function overlayUrl() {
    return OVERLAY_URL + "?v=" + encodeURIComponent(BUILD) +
      "#c=" + encodeURIComponent(JSON.stringify(overlayConfig()));
  }

  /* The same page, same settings, for the vertical scene.
   *
   * The flag changes NOTHING about how the page behaves — it measures its own
   * frame and lays itself out from that (shell.html, the safe band). It is
   * there so this page can tell the two sources apart: they are otherwise the
   * same URL, and 55-what-obs-has.js picks the overlay to write to by finding
   * exactly one that matches. Two identical ones and it finds none, which is
   * how a broadcaster ends up with a page that cannot see its own source.
   *
   * So: the same trick the bar and the card already use, for the same reason —
   * the flag is the only difference in the URL — except that this one is read
   * by nobody but this page. */
  function verticalUrl() {
    return OVERLAY_URL + "?v=" + encodeURIComponent(BUILD) +
      "#c=" + encodeURIComponent(JSON.stringify(overlayConfig())) + "&vertical";
  }

  /* What the bar is allowed to carry.
   *
   * The overlay takes the two secrets in its URL and then takes them back out:
   * it connects, finds its own browser source and rewrites the URL without them
   * (overlay: scrubSecretsFromUrl). A bar never connects to OBS — it has
   * nothing to photograph with — so that clean-up never runs on it, and
   * anything it was handed stayed in the source properties and in the scene
   * collection file for as long as the source existed.
   *
   * So it is never handed one. The folder goes with the password for the same
   * reason: neither is any use to a page that only draws a number, and
   * CLAUDE.md keeps both of them on this machine.
   *
   * The EBS token is different, and it is here for a different reason: the bar
   * genuinely needs it, because the number it draws comes from the EBS. It is
   * withheld anyway, because the token is the one secret that is worth
   * something to somebody who is not sitting at this machine (docs/plan.md
   * §3.2.2), and there is another way to get it to the bar: the two sources are
   * the same file under the same origin, so the overlay's storage is the bar's
   * storage, and the bar reads the token from there instead (overlay:
   * ebsTokenNow). That is also why this must not be a blank — see below.
   *
   * Removed rather than blanked. The two sources share one localStorage, and
   * the overlay lets its URL win over what it remembered — so a bar carrying
   * pw:"" wrote that emptiness over the password the overlay had just stored,
   * every time it loaded (measured 2026-09-03; the overlay side now refuses to
   * store at all, and this is the same fix from the other end). A key that is
   * not there says nothing, which is what a bar has to say about all three. */
  function barConfig() {
    var c = overlayConfig();
    delete c.pw;
    delete c.ebsToken;
    delete c.saveDir;
    return c;
  }

  function barUrl() {
    return OVERLAY_URL + "?v=" + encodeURIComponent(BUILD) +
      "#c=" + encodeURIComponent(JSON.stringify(barConfig())) + "&bar";
  }

  /**
   * Point one source at an address, and settle its audio routing while there.
   *
   * `reroute` is carried here and not left alone for the reason makeOrWrite()
   * gives — but this is the path that made it invisible. Writing it false on
   * every push means a broadcaster who ticks "Control audio via OBS" by hand
   * has it silently unticked the next time they change a setting: the box goes
   * back, the sound leaves the broadcast, and nothing in the log mentions
   * audio. Fixing only the creation path would have left that intact for
   * everybody who already has a source.
   */
  function setUrl(name, url, reroute) {
    return request("SetInputSettings", {
      inputName: name,
      inputSettings: { is_local_file: false, url: url, reroute_audio: !!reroute },
      overlay: true
    });
  }

  /**
   * Write the settings to both of the broadcaster's sources.
   *
   * They carry the same configuration and differ only by the bar flag, so
   * writing one and leaving the other is how a bar ends up drawing last week's
   * channel. The bar is optional — a broadcaster who never made one, or deleted
   * it, simply has nothing in the second slot.
   *
   * The settings are read ONCE here and the signature of what was written comes
   * back with the promise. Writing is not instant, the page stays live while it
   * happens, and a broadcaster who moves a slider in that gap used to end up
   * with a dock reporting the new value as delivered while OBS held the URL
   * built before the change. Whoever records the write records THIS, not
   * whatever the page says by the time OBS answers.
   */
  /* ---- the settings that hold the machine together ----

     Blanking any of these stops the extension dead: no capture scene is
     nothing to photograph, and no EBS, channel or pairing code is no way for a
     viewer's press to arrive at all. None of the four is something a
     broadcaster empties on purpose — unlike the save folder, or the list of
     scenes the button works in, which are answers and may legitimately be "no".

     So they are the ones worth asking about, and the rest are left alone: a
     guard that fires on a deliberate change is one that gets clicked through
     without reading, which would cost more than it saves. */
  var SPINE = ["src", "ebs", "ch", "ebsToken"];

  /**
   * Which of the four this write would empty in OBS.
   *
   * Compared against what OBS is carrying, not against what this page last
   * wrote: the record of a write lives in the same storage as everything else,
   * so the case this exists for — a page that has forgotten everything — has
   * forgotten that too.
   *
   * 2026-09-03: this page was opened from a different address than the one it
   * had been set up under. Chrome treats those as separate sites with separate
   * memories, so every box was blank while OBS was still holding a complete,
   * working configuration. Typing the obs-websocket password into that blank
   * page and pressing write put the emptiness into OBS, and the stream showed
   * 「いまは撮れません」 until the whole set-up was typed in again from the
   * scene collection file. Nothing was wrong with either copy; they simply
   * could not see each other.
   */
  function wouldBlank() {
    var row = targets.filter(function (r) { return r.name === target; })[0];
    var have = row ? urlConfig(row.url) : null;
    if (!have) return [];              // nothing there to lose
    var next = overlayConfig();
    return SPINE.filter(function (k) { return have[k] && !next[k]; });
  }

  function writeAll() {
    if (!target) return Promise.reject(new Error("no target"));
    var losing = wouldBlank();
    /* Cancel is the primary, and Escape lands on it (see ask()).
     *
     * The other way round this is a dialog that is dismissed into the damage:
     * whoever is reading it has just been told that something they cannot see
     * is about to go, and the safe answer has to be the one under their hands
     * already. Writing anyway stays available — a broadcaster really is
     * allowed to clear their own settings — it just cannot be the default. */
    var asked = losing.length
      ? ask(t("dlg.blankTitle"), t("dlg.blank", { n: losing.length }), [
          { label: "dlg.cancel", value: "cancel", primary: true },
          { label: "dlg.blankGo", value: "go" }
        ])
      : Promise.resolve("go");
    return asked.then(function (answer) {
      // "" rather than a rejection: nothing failed. Both callers read the
      // signature as "what reached OBS", and nothing did.
      if (answer !== "go") { log(t("log.blankstop"), "warn"); return ""; }
      var sig = currentSig();
      var jobs = [setUrl(target, overlayUrl(), true)];
      if (barTarget) jobs.push(setUrl(barTarget, barUrl(), false));
      // The vertical source carries the same settings as the landscape one —
      // it is the same overlay — so a change the broadcaster makes here has to
      // reach both, or the two scenes drift apart in what they draw.
      if (verticalTarget) jobs.push(setUrl(verticalTarget, verticalUrl(), false));
      return Promise.all(jobs).then(function () { return sig; });
    });
  }

  /**
   * Make OBS read the page again, and read it from disk.
   *
   * Two separate problems, one button in OBS. Settings ride in the fragment,
   * and OBS does not reload a browser source when only the fragment changes
   * (measured — §6), so appearance changes sat in the URL doing nothing until
   * something else happened to reload the source. And a changed overlay file
   * under an address CEF has already fetched is answered from the cache, so an
   * updated release kept running the old one. "refreshnocache" is the property
   * button OBS shows as "Refresh cache of current page", and it fixes both.
   */
  function reloadSources() {
    var names = [];
    if (target) names.push(target);
    if (barTarget) names.push(barTarget);
    if (verticalTarget) names.push(verticalTarget);
    if (!names.length) return Promise.resolve();
    return Promise.all(names.map(function (n) {
      return request("PressInputPropertiesButton", { inputName: n, propertyName: "refreshnocache" });
    })).then(function () {
      log(t("log.refreshed"), "ok");
    }).catch(function () {
      // Older obs-websocket, or a property name OBS renamed. Nothing is broken;
      // the broadcaster just has to press it themselves.
      log(t("log.refreshfail"), "warn");
    });
  }

  /* ---- the dock ----

     Whether what is on screen has reached OBS. This used to be step 7, which
     meant the answer was only visible from the bottom of the page — and the
     question it answers comes up every time anything is touched. */

  var pushing = false;

  function currentSig() {
    return JSON.stringify(overlayConfig()) + "|" + BUILD;
  }

  /**
   * Record what OBS is now carrying.
   *
   * The signature belongs to the write, so it is passed in — writeAll() hands
   * back the one it built its URLs from. Falling back to the current settings
   * is for the callers that have not written anything asynchronously; taking
   * the current settings after an await is what marked unwritten changes clean.
   */
  function markPushed(sig) {
    ui.pushedSig = sig || currentSig();
    ui.pushedAt = String(Date.now());
    saveUi();
    renderDock();
  }

  /** The build stamp OBS is actually carrying, or "" when there is no source. */
  function targetBuild() {
    var row = targets.filter(function (r) { return r.name === target; })[0];
    return row ? urlBuild(row.url) : "";
  }

  function dockState() {
    /* Not connected is not "nowhere to write".
     *
     * The target is never stored — it is found again by scanning OBS for the
     * browser source running the overlay — so before a session exists it is
     * empty for a reason that has nothing to do with what OBS contains. Read
     * as "none", that emptiness told a broadcaster whose source was sitting
     * right there to go and build it: an instruction pointing at a place with
     * nothing to do, on the one screen that is supposed to say what is left.
     * "Build it in OBS first" is true only once we have looked and not found
     * it, which is the branch below. */
    if (!identified) return "off";
    if (!target) return "none";
    var carried = targetBuild();
    if (carried && carried !== BUILD) return "stale";
    if (ui.pushedSig !== currentSig()) return "dirty";
    return "clean";
  }

  function renderDock() {
    var state = pushing ? "dirty" : dockState();
    el.dock.dataset.state = state;
    var msg = { off: "dock.off", none: "dock.notarget", dirty: "dock.dirty", stale: "dock.stale", clean: "dock.clean" }[state];
    el.dockState.textContent = pushing ? t("dock.pushing") : t(msg);
    // Said whether or not there is somewhere to write right now. When the page
    // is reopened this is the only thing it still knows for certain — it is
    // stored, and the target is not — and it is the one a broadcaster comes
    // back asking about. Withholding it until a session existed meant the
    // answer was missing exactly when it was the only answer available.
    if (!ui.pushedAt) el.dockLast.textContent = t("dock.never");
    else el.dockLast.textContent = t("dock.last", { t: new Date(Number(ui.pushedAt)).toLocaleTimeString() });
    el.push.disabled = pushing || !identified || !target;
    renderReady();
  }

  function pushNow() {
    if (pushing) return;
    if (!identified) { log(t("log.needconn"), "warn"); return; }
    if (!target) { log(t("log.needtarget"), "warn"); return; }
    pushing = true;
    renderDock();
    var sig = "";
    writeAll()
      .then(function (written) {
        // Refused at the dialog: OBS still holds what it held, so there is
        // nothing to reload and nothing to record. Recording it would mark the
        // page clean against a write that never happened, and the dock is the
        // one place that answers "has this reached OBS".
        if (!written) return null;
        sig = written;               // carried past the reload, which returns nothing
        log(t("log.pushed", { n: target }), "ok");
        return reloadSources()
          .then(scanTargets)
          .then(function () { markPushed(sig); });
      })
      .catch(function (e) { log(t("log.pushfail", { m: e.message }), "bad"); })
      .then(function () { pushing = false; renderDock(); });
  }

  /**
   * Send a safety decision to OBS the moment it is made.
   *
   * Everything else on this page can wait for the dock, because it is
   * appearance. This is not: between deciding and pushing, the overlay is
   * still refusing to shoot, and the broadcaster is looking at a page that
   * says they have decided. Three separate sessions were lost to exactly that
   * gap. No reload is needed — the gate and the test deadline are re-read on
   * every press, so they land without one.
   *
   * Quiet when there is nowhere to write: the dock will carry it, and the
   * broadcaster has not got that far yet.
   */
  function pushSafety() {
    if (!target || !identified) { renderDock(); return; }
    writeAll()
      .then(function (sig) {
        if (!sig) { renderDock(); return; }   // refused; see pushNow()
        log(t("log.pushed", { n: target }), "ok");
        markPushed(sig);
      })
      .catch(function (e) { log(t("log.pushfail", { m: e.message }), "bad"); });
  }

  /* ================= broadcaster settings =================

     Streams differ in what they can afford to give an overlay. A preset moves
     every parameter at once, because nobody tunes eight numbers by hand.
     Size is deliberately independent: "Hype but small" has to be reachable. */

  /* @generated presets — src/shared/presets.json。手で書き換えない */
  var PRESETS = {
    standard: { flash: "full", vol: 55, mute: false, sparkCap: 40, flashFromTier: 3,  sparkMul: 1,    photo: 1,    dwell: 1500 },
    hype:     { flash: "full", vol: 70, mute: false, sparkCap: 56, flashFromTier: 2,  sparkMul: 1.4,  photo: 1.1,  dwell: 1800 },
    subtle:   { flash: "soft", vol: 32, mute: false, sparkCap: 18, flashFromTier: 99, sparkMul: 0.5,  photo: 0.78, dwell: 1200 },
    quiet:    { flash: "off",  vol: 0,  mute: true,  sparkCap: 10, flashFromTier: 99, sparkMul: 0.35, photo: 0.9,  dwell: 2200 }
  };
  /* @end presets */

  var P = PRESETS.standard;
  var ovScale = 1;
  var stackSide = "bl";

  function setRadio(groupId, attr, value) {
    var all = document.querySelectorAll("#" + groupId + " button");
    for (var i = 0; i < all.length; i++) {
      all[i].setAttribute("aria-pressed", String(all[i].dataset[attr] === value));
    }
  }

  /* Each of these tells the sample.
   *
   * The sample is the overlay, so it cannot read what was chosen — it is on an
   * origin of its own and this page's storage is closed to it. What it draws
   * is what it is handed, and the moment it should be handed something is the
   * moment the setting changes. tellSample() is a no-op until the frame
   * exists, so the boot pass through these costs nothing. */
  function applyPreset(name) {
    P = PRESETS[name] || PRESETS.standard;
    cfg.preset = PRESETS[name] ? name : "standard";
    setRadio("grpPreset", "preset", cfg.preset);
    saveCfg(cfg);
    renderRail();
    tellSample();
  }

  function applyAccent(name) {
    cfg.accent = name;
    document.documentElement.setAttribute("data-accent", name);
    setRadio("grpAccent", "accent", name);
    saveCfg(cfg);
    renderRail();
    tellSample();
  }

  function applyScale(v) {
    ovScale = Number(v) || 1;
    cfg.scale = String(ovScale);
    setRadio("grpScale", "scale", cfg.scale);
    saveCfg(cfg);
    tellSample();
  }

  function applyPlace(side) {
    stackSide = side === "br" ? "br" : "bl";
    cfg.place = stackSide;
    setRadio("grpPlace", "place", stackSide);
    saveCfg(cfg);
    tellSample();
  }

  /* Whether a bought print carries the clock.
   *
   * Only the bought ones: a free print has nothing written under it, and that
   * is not a setting (docs/stamp-plan.md §1.C). "On" is not "always" either —
   * it means the clock appears when there is room for it beside the name, and
   * steps aside when there is not, because the name is what the Bits bought
   * and the time is what the caption can pay with (plan.md §4.12). A control
   * offering "always" would be offering to cut a paying viewer's name. */
  function applyStampShot(v) {
    cfg.stampShot = v === "off" ? "off" : "on";
    setRadio("grpStampShot", "stampshot", cfg.stampShot);
    saveCfg(cfg);
    tellSample();
  }

  /* What the glass is made of — the goal bar's tube and the party's plates
     share this one setting (本人の決定 2026-09-11). The liquid inside takes the
     accent. It rides to both sources like everything else. */
  function applyGlass(v) {
    cfg.glass = v === "light" || v === "dark" ? v : "clear";
    setRadio("grpGlass", "glass", cfg.glass);
    saveCfg(cfg);
    tellSample();
  }

  /* ---- the theme, and the pack laid on it (docs/theme-pack-plan.md §6) ----
   *
   * The theme is one of the ids this build knows (THEMES, generated from
   * src/shared/themes.json), and the buttons are made from that list so a
   * theme added there appears here without a line of markup. The pack is a
   * code the site made, pasted whole (32-theme-pack.js): it names the folder
   * and the files, and the images stay on this machine. What is written to
   * OBS is what the code was accepted as — never the raw text of the box. */
  function renderThemeButtons() {
    var box = $("grpTheme");
    box.textContent = "";
    THEMES.forEach(function (id) {
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("data-theme", id);
      b.textContent = t("theme." + id);
      box.appendChild(b);
    });
    setRadio("grpTheme", "theme", cfg.theme);
  }

  function applyThemeChoice(id) {
    cfg.theme = THEMES.indexOf(id) !== -1 ? id : THEMES[0];
    setRadio("grpTheme", "theme", cfg.theme);
    saveCfg(cfg);
    tellSample();
  }

  var packCheck = null;        // the last answer about the files, for repainting
  var packCheckGen = 0;

  /**
   * Take a pasted code — or the box as it stands when the page opens.
   *
   * `pasted` is what separates the two: a code just pasted also brings the
   * look the pack was designed for (accent, glass, preset), once. On boot it
   * must not — the broadcaster may have changed those since, and a page that
   * put the pack's taste back on every open would be undoing their choice.
   * An unreadable code changes nothing and says so; the pack OBS has stays.
   */
  function applyPack(raw, pasted) {
    raw = String(raw || "").trim();
    if (!raw) {
      cfg.pack = "";
      cfg.packSlots = "";
      packCheck = null;
      saveCfg(cfg);
      tellSample();
      renderPackInfo();
      return;
    }
    var code = parseThemeCode(raw);
    if (!code) { packCheck = "bad"; renderPackInfo(); return; }
    cfg.theme = code.theme;
    setRadio("grpTheme", "theme", cfg.theme);
    cfg.pack = code.pack;
    cfg.packSlots = code.slots.join(",");
    saveCfg(cfg);
    if (pasted && code.recommend) {
      var r = code.recommend;
      // Each through its own apply*, which is where the value is held to what
      // exists; the accent is checked against the swatches first because
      // applyAccent takes any name it is given.
      if (/^[a-z]+$/.test(r.accent) && $("grpAccent").querySelector('[data-accent="' + r.accent + '"]')) applyAccent(r.accent);
      if (r.glass) applyGlass(r.glass);
      if (r.preset && PRESETS[r.preset]) applyPreset(r.preset);
    }
    tellSample();
    packCheck = "checking";
    renderPackInfo();
    var gen = ++packCheckGen;
    checkPackImages(code.pack, code.slots, function (result) {
      if (gen !== packCheckGen) return;      // a newer paste has overtaken this one
      packCheck = result;
      renderPackInfo();
    });
  }

  /** What the box holds, in words: nothing, unreadable, checking, or the files. */
  function renderPackInfo() {
    var warn = false, text;
    if (!cfg.pack) text = t("pack.empty");
    else if (packCheck === "bad") { text = t("pack.bad"); warn = true; }
    else if (packCheck === "checking" || !packCheck) text = t("pack.checking");
    else {
      var lines = [t("pack.found", { n: packCheck.found.length, p: cfg.pack })];
      if (packCheck.missing.length) { lines.push(t("pack.missing", { l: packCheck.missing.join(", ") })); warn = true; }
      if (packCheck.big.length) { lines.push(t("pack.big", { l: packCheck.big.join(", ") })); warn = true; }
      text = lines.join(" ");
    }
    // A bad paste is said over the pack that is still in force, so the box
    // keeps what was typed and the words say why it did not take.
    if (packCheck === "bad" && cfg.pack) text = t("pack.bad");
    el.packInfo.textContent = text;
    el.packInfo.className = warn ? "note warn" : "note";
  }

  function wireGroup(id, attr, fn) {
    $(id).addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (b && b.dataset[attr] !== undefined) fn(b.dataset[attr]);
    });
  }

  wireGroup("grpPreset", "preset", applyPreset);
  wireGroup("grpAccent", "accent", applyAccent);
  wireGroup("grpScale", "scale", applyScale);
  wireGroup("grpStampShot", "stampshot", applyStampShot);
  wireGroup("grpGlass", "glass", applyGlass);
  wireGroup("grpPlace", "place", applyPlace);
  wireGroup("grpTheme", "theme", applyThemeChoice);

  /* ================= the sample =================

     The effects live on the overlay, and until now the only way to look at
     them was to write to OBS, open the thirty-minute window and press the
     button on your own channel — three steps, through three programs, for one
     of a hundred and forty-four combinations (docs/look-tab-plan.md §0).

     So the overlay is put on this page, in an iframe, drawing itself with
     invented presses. It is the same file OBS runs: there is no second
     implementation of the effects to keep in step, because there is no second
     implementation.

     TWO THINGS HOLD THE LINE, and both are needed (未決3, measured).

       - `sandbox="allow-scripts"` puts the frame on an origin of its own.
         file:// pages share localStorage — across directories, measured — and
         this page's storage holds the obs-websocket password and the EBS
         token. Without the sandbox the sample reads them, and reaching them
         does not need the URL: measured, an overlay in a plain iframe opened
         wss://…/stream?ch=…&t=<the real token> having been told nothing but a
         preset and a colour. It also writes that storage, so looking at the
         sample rewrote the settings being looked at.
       - `#demo` on the overlay side cuts storage, OBS, the EBS and sound.
         The sandbox alone would not do it: a sandboxed frame can still open a
         WebSocket (measured), and with storage unreadable the overlay falls
         back to its defaults — which are 127.0.0.1:4455, the real OBS.

     Nothing about the sample is written down twice. The settings it draws are
     the ones on screen, sent as they change; there is no copy of the effects
     here, and the only thing this file knows about the overlay is the name of
     one message. */

  // 16:9 at the size the effects were built for. Scaled down by CSS rather
  // than resized: the placement corners and the three sizes only mean anything
  // against the shape they will really be drawn in, and a frame squeezed to
  // the width of a column would put them somewhere they will never be.
  /* The two canvases a broadcaster can be standing on.
   *
   * The vertical one is not a variant of the horizontal: Twitch's dual format
   * sends two tracks, and the broadcaster builds a second scene at 1080x1920
   * for the mobile one (docs/vertical-plan.md §2). The same overlay URL goes
   * into both, and the page decides which shape it is in by measuring — so the
   * only thing the sample has to do to show the vertical layout is BE that
   * shape. Nothing is passed to it.
   *
   * Worth showing rather than describing, because the vertical canvas is where
   * the safe band lives: Twitch draws its own interface over the top and the
   * bottom, the page keeps 7% clear at each end, and 7% is a provisional
   * number taken from three screenshots of one handset (§5.3). A broadcaster
   * looking at the sample is the first person who can say it looks wrong. */
  var SHAPES = { wide: [1920, 1080], tall: [1080, 1920] };
  var shape = "wide";
  var SAMPLE_W = SHAPES.wide[0];
  var SAMPLE_H = SHAPES.wide[1];

  var sampleFrame = null;
  var sampleReady = false;

  /**
   * Everything the sample is allowed to know.
   *
   * A list of what to send, not a copy of overlayConfig() with the dangerous
   * parts deleted. That difference is the whole point: overlayConfig() carries
   * nineteen keys and grows whenever a setting is added, so a copy-and-delete
   * would leak the next one by default. This has to be edited to leak anything,
   * and tools/overlay-invariants.mjs refuses any key that is not one of these.
   */
  function demoConfig() {
    return {
      preset: cfg.preset,
      accent: cfg.accent,
      place: cfg.place,
      scale: cfg.scale,
      lang: cfg.lang || lang,
      // The clock is part of how a print looks, so the sample has to be told
      // about it. stampSave is not here: the sample has no OBS and saves
      // nothing, so it would be a key that travels and does nothing.
      stampShot: cfg.stampShot,
      // The sample draws the bar too (92-bar-and-party.js), so it has to know
      // what the glass is made of.
      glass: cfg.glass,
      // The theme, and the pack's name and slot list — never an image. The
      // sample cannot show a pack's images anyway: a sandboxed frame is
      // refused file: images (measured, docs/theme-pack-plan.md §9-5), so it
      // draws the theme, and the pack is seen in OBS or on the site.
      theme: cfg.theme, pack: cfg.pack, packSlots: cfg.packSlots
    };
  }

  /** The address the frame is pointed at. Carries the look and nothing else. */
  function sampleUrl() {
    return OVERLAY_URL + "?v=" + encodeURIComponent(BUILD) +
      "#demo&c=" + encodeURIComponent(JSON.stringify(demoConfig()));
  }

  /**
   * Fit the frame to whatever width the column has.
   *
   * Read off the box rather than from the breakpoint: the stylesheet owns the
   * 880px, and a copy of that number here would be a second place to forget
   * when it moves (docs/refactor-plan.md §2.2).
   */
  function fitSample() {
    var box = el.sampleBox;
    if (!box || box.hidden) return;
    var w = box.clientWidth;
    if (!w) return;
    var k = w / SAMPLE_W;
    /* A vertical canvas scaled to the column is taller than the page.
       Measured at a 714px column: 1269px of frame, which pushes everything
       below the sample off the screen and makes the broadcaster scroll to see
       a thing whose whole point is being seen at a glance. So it is capped by
       the window as well, and the cap only ever binds on the tall shape — at
       the same column the wide one comes to 402px. */
    var cap = Math.max(260, Math.round(window.innerHeight * 0.62));
    if (SAMPLE_H * k > cap) k = cap / SAMPLE_H;
    /* Centred by moving the frame, not by narrowing the box.
       ----------------------------------------------------
       The box's width is where `w` comes from two lines up, so writing a width
       back onto it feeds the next call its own answer: measured, it went 781 →
       347 → 195 and would have kept going. The frame is moved inside a box
       that still spans the column instead. transform-origin is the top left,
       and the translate is written first — so it is applied last, and is not
       multiplied by the scale. */
    var pad = Math.max(0, Math.round((w - SAMPLE_W * k) / 2));
    el.sample.style.transform = "translateX(" + pad + "px) scale(" + k + ")";
    el.sample.style.width = SAMPLE_W + "px";
    el.sample.style.height = SAMPLE_H + "px";
    box.style.height = Math.round(SAMPLE_H * k) + "px";
  }

  /* Switch the sample between the two canvases.
   *
   * The frame is rebuilt rather than resized. A browser source reads its size
   * once, at load, and so does the page inside it: the overlay measures the
   * viewport as it starts and lays the wall out from that (90-paid-wall.js).
   * It does listen for resize now — but what the broadcaster is here to see is
   * what OBS will show them, and OBS gives the page its size at load. Loading
   * it again is the honest imitation. */
  function setSampleShape(next) {
    if (!SHAPES[next] || next === shape) return;
    shape = next;
    SAMPLE_W = SHAPES[next][0];
    SAMPLE_H = SHAPES[next][1];
    setRadio("sampleShape", "shape", next);
    if (sampleFrame) {
      sampleFrame.remove();
      sampleFrame = null;
      sampleReady = false;
    }
    startSample();
    fitSample();
  }

  /**
   * Hand the frame the settings that are on screen now.
   *
   * By message, not by reloading it. A fragment change does not reload a frame
   * (the same property the overlay's own hashchange handler exists for), and
   * pointing src somewhere new would re-read 341 KB and start the sample over
   * every time a colour is touched. Measured: postMessage crosses between two
   * file:// documents in both directions, sandboxed or not (未決3).
   *
   * Addressed to "*" because there is no origin to address: a sandboxed frame
   * is opaque, so its origin is the string "null" and naming it is not
   * possible. Nothing sensitive goes out — demoConfig() is five keys — and the
   * frame ignores anything not carrying its own name.
   */
  function tellSample(extra) {
    if (!sampleFrame || !sampleReady) return;
    var m = demoConfig();
    m.to = "shutterparty-demo";
    m.act = "look";
    if (extra) for (var k in extra) m[k] = extra[k];
    try { sampleFrame.contentWindow.postMessage(m, "*"); } catch (e) { /* gone */ }
  }

  /** Build it once, on the first visit to the tab that shows it. */
  function startSample() {
    if (sampleFrame) { tellSample(); return; }
    sampleFrame = document.createElement("iframe");
    sampleFrame.id = "sampleFrame";
    sampleFrame.width = SAMPLE_W;
    sampleFrame.height = SAMPLE_H;
    // allow-scripts and nothing else. Adding allow-same-origin would hand the
    // frame this page's storage back and undo the whole arrangement.
    sampleFrame.setAttribute("sandbox", "allow-scripts");
    sampleFrame.setAttribute("title", t("sample"));
    sampleFrame.addEventListener("load", function () {
      sampleReady = true;
      tellSample();
    });
    sampleFrame.src = sampleUrl();
    el.sample.appendChild(sampleFrame);
    fitSample();
  }

  /**
   * The whole cycle, when it is asked for.
   *
   * Not on a loop: it runs forty-six seconds — the winner's name, the
   * countdown, twenty seconds of party, the contact sheet, the cooldown — and
   * nobody choosing a colour wants to wait that out. What changes with the
   * settings is the press, and the press is what repeats on its own (未決2).
   */
  function sampleParty() {
    tellSample({ act: "party" });
  }

  /* What the sample is played over (shell.html, .sampleBox[data-bg]).
   *
   * This page's, not the overlay's: the overlay is transparent and OBS puts
   * the broadcast under it, so the backdrop is drawn behind the frame and the
   * sample is told nothing. Kept with the open tab (ui), not with the
   * settings: it is how the broadcaster is looking, not what goes on air. */
  function applySampleBg(v) {
    ui.sampleBg = v === "bright" ? "bright" : "dim";
    el.sampleBox.setAttribute("data-bg", ui.sampleBg);
    setRadio("grpSampleBg", "samplebg", ui.sampleBg);
    saveUi();
  }
  wireGroup("grpSampleBg", "samplebg", applySampleBg);
  // Not kept in `ui`: which canvas you last looked at is not how you are
  // looking at it, and a broadcaster who opens this page again is opening it
  // for the scene they are building now.
  wireGroup("sampleShape", "shape", setSampleShape);

  // The language is part of what the sample is told, so a change reaches it
  // like any other. It is drawn with t() at the moment each word appears, so
  // the next press comes out in the new language without a reload.
  if (window.ResizeObserver) new ResizeObserver(fitSample).observe(document.body);
  else window.addEventListener("resize", fitSample);
  /* ================= the EBS link is checked here, not held open ================= */

  var esState = "off";

  function ebsSetState(s) { esState = s; renderEbs(); }

  /* ---- the pairing code ----

     One string carrying the three values that have to reach this machine: where
     the EBS is, which channel this is, and the token that opens that channel's
     socket.

       sp1.<base64url of {"e": ebs, "c": channel, "t": token}>

     Three separate fields is three chances to paste one into the wrong box, and
     two of them look enough alike to swap. The Twitch config panel builds this
     (src/extension/config/index.html, contractCode); there is no build step and
     nothing shared between the two files, so the format is written out in both.

     base64 is not encryption. The code is exactly as secret as the token inside
     it, which is why it is never shown on the broadcast. */

  function b64url(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function contractCode(ebs, ch, token) {
    if (!ebs || !ch || !token) return "";
    return "sp1." + b64url(JSON.stringify({ e: ebs, c: ch, t: token }));
  }

  /** The three values back out, or null for anything that is not one of ours. */
  function readContract(code) {
    var raw = String(code || "").trim();
    if (raw.slice(0, 4) !== "sp1.") return null;
    try {
      var b64s = raw.slice(4).replace(/-/g, "+").replace(/_/g, "/");
      var bin = atob(b64s + "=".repeat((4 - b64s.length % 4) % 4));
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var d = JSON.parse(new TextDecoder().decode(bytes));
      if (!d || typeof d.e !== "string" || typeof d.c !== "string" || typeof d.t !== "string") return null;
      // The address is used to open a socket, so it has to be one — a code that
      // decodes into something else is not one of ours whatever it says.
      if (!/^https?:\/\//.test(d.e)) return null;
      if (!d.c || !d.t) return null;
      return { ebs: d.e.replace(/\/+$/, ""), ch: d.c, token: d.t };
    } catch (e) {
      return null;
    }
  }

  /** Say what the code turned out to hold, so a wrong paste is visible at once. */
  function showPairInfo() {
    if (!cfg.ebs || !cfg.ch) { el.pairInfo.hidden = true; return; }
    el.pairInfo.hidden = false;
    el.pairInfo.textContent = t("pair.reads", { s: cfg.ebs, c: cfg.ch });
  }

  function applyPairCode() {
    var raw = el.pairCode.value.trim();
    if (!raw) {
      /* An empty box is only an erasure once it is known to be empty.
       *
       * Before secretsOpen() lands this box is empty because nothing has been
       * put in it yet, and erasing on that would throw away a pairing code the
       * broadcaster still has. The button is shut until then (99-go.js); this
       * is the same guard where the decision is actually made. */
      if (secretState === "loading") return;
      cfg.ebs = cfg.ch = cfg.ebsToken = "";
      saveCfg(cfg);
      /* Emptying the box by hand IS an erasure — but only of the token. The
       * obs-websocket password is not what was emptied, so it is written back
       * alongside the now-empty token. When there is no password either there
       * is nothing left to keep, and the store is cleared outright, which
       * takes the key as well as the ciphertext: leaving the key would leave
       * the tool that opens whatever copy is sitting in a backup. */
      if (cfg.pw) saveSecrets(); else secretsClear();
      ebsSetState("off");
      showPairInfo();
      renderRail();
      return;
    }
    var got = readContract(raw);
    if (!got) {
      el.pairInfo.hidden = false;
      el.pairInfo.textContent = t("pair.bad");
      return;
    }
    cfg.ebs = got.ebs;
    cfg.ch = got.ch;
    cfg.ebsToken = got.token;
    saveCfg(cfg);
    saveSecrets();
    ebsSetState("off");
    showPairInfo();
    renderRail();
  }

  // Which attempt is the current one. Each press opens its own socket and its
  // own six-second timer, and `done` below is local to that attempt — so a
  // second press while the first was still waiting let the first one's
  // give-up land on the second one's "live" and repaint it as an error. Only
  // the newest attempt may speak; older ones just close their socket.
  var ebsAttempt = 0;

  function checkEbs() {
    applyPairCode();
    if (!cfg.ebs || !cfg.ch || !cfg.ebsToken) { log(t("log.ebs.need"), "warn"); return; }

    // Open it, see whether it is accepted, and let go. Holding it open here
    // would make the EBS believe an overlay is listening when none is.
    var base = cfg.ebs.replace(/\/+$/, "");
    var url = base.replace(/^http/, "ws") + "/stream?ch=" + encodeURIComponent(cfg.ch) +
      "&t=" + encodeURIComponent(cfg.ebsToken);
    ebsSetState("connecting");
    // The attempt is the newest from the moment it is asked for, before the
    // socket exists: if the constructor throws, the previous attempt must not
    // stay the newest and later paint this "error" over with its own "live".
    var mine = ++ebsAttempt;
    var sock;
    try { sock = new WebSocket(url); } catch (e) { ebsSetState("error"); return; }
    var done = false;
    /** Close this attempt; true when it is also the one allowed to report. */
    function settle() {
      if (done) return false;
      done = true;
      clearTimeout(giveUp);
      return mine === ebsAttempt;
    }
    var giveUp = setTimeout(function () {
      var speak = settle();
      try { sock.close(); } catch (e) {}
      if (!speak) return;
      ebsSetState("error");
      log(t("log.ebs.fail"), "bad");
    }, 6000);
    sock.onopen = function () {
      var speak = settle();
      try { sock.close(); } catch (e) {}
      if (!speak) return;
      ebsSetState("live");
      log(t("log.ebs.ok"), "ok");
    };
    sock.onclose = function () {
      if (!settle()) return;
      ebsSetState("error");
      log(t("log.ebs.fail"), "bad");
    };
  }

  function renderEbs() {
    var m = { off: t("ebs.off"), connecting: t("ebs.connecting"), live: t("ebs.ok"), error: t("ebs.error") };
    el.ebsState.textContent = m[esState] || esState;
    el.ebsState.dataset.state = esState;
    el.ebsConnect.textContent = t("ebs.check");
  }

  /* ================= which scenes the button may work in =================

     The point of the list is the scene a broadcaster steps away to: the camera
     is still running and OBS will still composite the capture scene on demand,
     so without this a viewer can photograph someone who believes they are off
     camera.

     Two answers, and they are exclusive. "Every scene" is a checkbox; anything
     else is a list built one scene at a time. Neither of them is the absence
     of the other — an empty list with the box unticked is a shutter that
     cannot open, and it says so. That used to be the way to allow everything,
     which put the widest possible answer behind doing nothing.

     The names ride in a URL fragment as one string; scene names cannot contain
     a newline, so a newline separates them. */

  function gateList() {
    return String(cfg.scenes || "").split("\n").filter(function (n) { return n; });
  }

  // Said once per set, not once per render: paint() redraws this on every
  // language change, and a warning that repeats itself is one nobody reads.
  var goneSaid = "";

  function renderGate() {
    var chosen = gateList();
    // Ticked means the answer is "all of them", which is a decision and not an
    // empty list. Both are stored, and only one of them opens the shutter.
    var all = String(cfg.gateSet || "") === "1" && !chosen.length;
    el.gateAll.checked = all;
    el.gatePick.hidden = all;

    // The picker offers only what is not already listed, so choosing is always
    // an addition and never a press that appears to do nothing.
    el.gate.textContent = "";
    var add = document.createElement("option");
    add.value = "";
    add.textContent = t("gate.add");
    el.gate.appendChild(add);
    for (var i = 0; i < scenes.length; i++) {
      if (chosen.indexOf(scenes[i]) !== -1) continue;
      var o = document.createElement("option");
      o.value = scenes[i];
      o.textContent = scenes[i];
      el.gate.appendChild(o);
    }
    // Back to the invitation, so the control always reads as "add one more"
    // rather than as a field holding the last thing that was added.
    el.gate.value = "";

    // A scene that was allowed and has since been renamed or deleted stays on
    // screen: it is still in the config, only the broadcaster knows which of
    // the two happened, and dropping it would change the setting without a
    // word. Only asked once OBS has told us what it has — before that every
    // name looks missing.
    var known = scenes.length ? scenes : null;
    el.gateChips.textContent = "";
    for (var j = 0; j < chosen.length; j++) {
      el.gateChips.appendChild(gateChip(chosen[j], !!known && known.indexOf(chosen[j]) === -1));
    }

    // Nothing listed and no blanket answer is not "everything". It is the one
    // state this whole control exists to make visible.
    el.warnGate.hidden = all || chosen.length > 0;

    var gone = known ? chosen.filter(function (n) { return known.indexOf(n) === -1; }) : [];
    var said = gone.join(", ");
    if (said && said !== goneSaid) log(t("log.gategone", { n: said }), "warn");
    goneSaid = said;
  }

  /** One allowed scene, carrying the way to take it back. */
  function gateChip(name, gone) {
    var chip = document.createElement("span");
    chip.className = gone ? "gchip gone" : "gchip";
    var txt = document.createElement("span");
    txt.textContent = name;
    chip.appendChild(txt);
    var x = document.createElement("button");
    x.type = "button";
    x.className = "gx";
    x.textContent = "×";
    // Named, because a row of bare crosses says nothing to a screen reader and
    // little to anyone reading the page in a hurry.
    x.title = t("gate.remove", { n: name });
    x.setAttribute("aria-label", x.title);
    x.addEventListener("click", function () { saveGate(gateList().filter(function (n) { return n !== name; })); });
    chip.appendChild(x);
    return chip;
  }

  /**
   * Store a list of scenes, and say what it means.
   *
   * gateSet is what tells the overlay the question has been answered at all.
   * An empty list can no longer answer it: "every scene" has a control of its
   * own now, so nothing listed means nothing allowed, and the overlay keeps
   * the shutter shut rather than opening it on everything.
   */
  function saveGate(list) {
    cfg.scenes = list.join("\n");
    cfg.gateSet = list.length ? "1" : "";
    saveCfg(cfg);
    renderGate();
    if (list.length) log(t("log.gateset", { n: list.join(", ") }), "ok");
    else log(t("log.gatenone"), "warn");
    pushSafety();
  }

  function addGateScene() {
    var name = el.gate.value;
    // The invitation itself, chosen by a keyboard walking down the list.
    if (!name) return;
    var list = gateList();
    if (list.indexOf(name) !== -1) { el.gate.value = ""; return; }
    // Appended, not sorted: the order is the one the broadcaster built, and a
    // list that rearranges itself after every press is one you have to re-read.
    list.push(name);
    saveGate(list);
  }

  function applyGateAll() {
    if (el.gateAll.checked) {
      // The blanket answer replaces the list rather than sitting on top of it,
      // because that is exactly what the overlay is told: gateSet with nothing
      // named means every scene.
      cfg.scenes = "";
      cfg.gateSet = "1";
      saveCfg(cfg);
      renderGate();
      log(t("log.gateall"), "ok");
      pushSafety();
      return;
    }
    // Unticking is an answer too, and it has to be written. Leaving gateSet
    // at "1" would keep the shutter open on everything while the page had
    // stopped saying so.
    cfg.gateSet = "";
    saveCfg(cfg);
    renderGate();
    log(t("log.gatenone"), "warn");
    pushSafety();
  }

  var TEST_MS = 30 * 60 * 1000;
  // A write is in flight. Without this a second press lands on a config the
  // first press has already changed and undoes it.
  var testBusy = false;

  /**
   * Let the shutter work off-air for half an hour.
   *
   * The effects only exist on the overlay, and the overlay only draws what a
   * viewer press produces — so with the off-air rule in place there is no way
   * to look at them without going live. This is that way, and it is written
   * as a deadline rather than a switch: a control that opens the shutter on a
   * channel nobody is watching is precisely the one that must not be possible
   * to leave on. Pressing it again extends it; doing nothing ends it.
   */
  function startTestWindow() {
    // Thirty minutes is counted from the press, so it cannot be stored before
    // it can be delivered: a deadline that starts ticking here and reaches the
    // overlay ten minutes later is a twenty-minute window wearing the wrong
    // label. Nothing is stored until there is somewhere to write it.
    //
    // Order matters, and getting it wrong is silent: writeAll() reads the
    // config as it builds the URL, so calling it before the deadline is set
    // sends the previous one — the page counts down, OBS is never told, and
    // both look like they are working.
    if (!target || !identified) {
      // Said where the press happened, not only in the log. A button that
      // answers in a panel somewhere else reads as a button that does nothing.
      el.testNote.textContent = t("dock.notarget");
      log(t("dock.notarget"), "warn");
      return;
    }
    // A string, like every other setting: both sides copy only strings across,
    // so a number is dropped without a word on the way in.
    var was = cfg.testUntil;
    cfg.testUntil = String(Date.now() + TEST_MS);
    saveCfg(cfg);
    // Redrawn before the write, not after it.
    //
    // The button is a toggle, so what it does next is decided by what the
    // config says — and until this ran, the config said "open" while the label
    // still said "start". The next press read the config, not the label, and
    // ended the window it looked like it was starting.
    // Set before the redraw: drawTestLeft() is the only thing that touches
    // el.test.disabled, so flipping the flag behind it left the button live
    // for the whole write it was supposed to be dead for.
    testBusy = true;
    drawTestLeft();
    writeAll().then(function (sig) {
      // Refused at the dialog is not a failure, so it arrives here and not in
      // the catch — but nothing reached OBS all the same (writeAll() hands back
      // "" for exactly that), and it has already said so. The same rule as the
      // catch below then: the window that was never delivered is not open, and
      // recording "" would mark the page clean against a write that never
      // happened (markPushed falls back to the current settings).
      if (!sig) {
        cfg.testUntil = was;
        saveCfg(cfg);
        return;
      }
      log(t("test.left", { n: 30 }), "ok");
      markPushed(sig);
    }).catch(function (e) {
      // Undelivered is not open. The deadline is counted from the press, and a
      // page counting down a window OBS was never told about is the thing this
      // whole path exists to avoid.
      cfg.testUntil = was;
      saveCfg(cfg);
      log(t("log.pushfail", { m: e.message }), "bad");
    }).then(function () {
      testBusy = false;
      drawTestLeft();
    });
  }

  /**
   * The window, and the way out of it.
   *
   * A deadline is a good default and a bad only option: the broadcaster who
   * opened it is the one person who knows it is no longer wanted, and telling
   * them to wait out twenty-six minutes on a shutter they want shut is the
   * opposite of what the deadline is for. The button says which of the two it
   * is doing, so there is no separate control to find.
   */
  function drawTestLeft() {
    var left = Math.ceil((Number(cfg.testUntil || 0) - Date.now()) / 60000);
    var on = left > 0;
    el.testNote.textContent = on ? t("test.left", { n: left }) : t("n.test");
    el.test.textContent = on ? t("test.stop") : t("test");
    el.test.disabled = testBusy;
  }
  // Often enough that the button is not still offering to end a window that
  // ran out four minutes ago.
  setInterval(drawTestLeft, 15000);

  function endTestWindow() {
    cfg.testUntil = "";
    saveCfg(cfg);
    testBusy = true;
    drawTestLeft();
    // Locally true whatever OBS says: the deadline is this page's to hold, and
    // a failed write must not leave the page showing a window it has stopped
    // counting. The overlay hears about it on the next write in that case.
    if (!target || !identified) { log(t("log.testend"), "ok"); testBusy = false; drawTestLeft(); return; }
    writeAll()
      .then(function (sig) {
        // "" is the dialog's no: the window is still over on this page (see
        // above), but OBS was not told, and the dock must keep saying so. The
        // same shape as pushNow() — a refused write is recorded nowhere.
        if (!sig) return;
        log(t("log.testend"), "ok");
        markPushed(sig);
      })
      .catch(function (e) { log(t("log.pushfail", { m: e.message }), "bad"); })
      .then(function () { testBusy = false; drawTestLeft(); });
  }

  function toggleTestWindow() {
    if (testBusy) return;
    if (Number(cfg.testUntil || 0) > Date.now()) endTestWindow();
    else startTestWindow();
  }

  /* ================= where the photos go =================

     Nothing was ever written to disk before, and that stays the default: OBS
     writes the file itself through SaveSourceScreenshot, which is synchronous
     and heavy enough that the plan builds the whole 150ms aggregation around
     not calling it too often. Turning it on is the broadcaster's decision. */

  /**
   * Take back what Explorer adds.
   *
   * "Copy as path" in Windows Explorer wraps the path in double quotes, and a
   * quoted path is not a path OBS will write to — it fails with a directory
   * that does not exist, which reads like the folder is wrong rather than the
   * pasting. Strip them rather than explain them.
   */
/* @generated save-sizes — src/shared/save-sizes.json。手で書き換えない */
  var SAVE_SIZES = {
    std: { w: 1280, q: 90, kb: 186 },
    small: { w: 960, q: 80, kb: 87 },
    min: { w: 640, q: 70, kb: 37 },
  };
/* @end save-sizes */

  /* How many photographs a full SHUTTER PARTY can write.
   *
   * Twenty seconds of party, one capture per 150ms window — the two numbers the
   * whole product is paced by (PARTY_MS and AGGREGATE_MS on the EBS side). It is
   * a ceiling rather than a typical: it needs somebody pressing in every window
   * for the whole twenty seconds. Shown as a ceiling for that reason, because
   * the question a broadcaster is asking here is how bad it can get. */
  var PARTY_SHOTS = 133;

/* @generated save-tiers — src/shared/skus.json。手で書き換えない */
  var SAVE_TIERS = [10, 100, 250, 500, 1000];
/* @end save-tiers */

  /**
   * Build the "keep from" dial.
   *
   * One number instead of a box per product. The catalogue grows in two
   * directions (§4.4) — patterns at the same amount, and new amounts — and a
   * checkbox each would reach twenty-eight of them and ask the broadcaster to
   * decide again every time one is added. A threshold survives both: a new tier
   * simply appears in this list, and a new pattern changes nothing.
   *
   * Rebuilt on every repaint because the words carry the number, so they have to
   * come back through t() when the language changes.
   */
  function paintSaveFrom() {
    var sel = el.saveFrom;
    if (!sel) return;
    var was = cfg.saveFrom || "0";
    sel.textContent = "";
    var all = document.createElement("option");
    all.value = "0";
    all.textContent = t("saveFrom.all");
    sel.appendChild(all);
    for (var i = 0; i < SAVE_TIERS.length; i++) {
      var o = document.createElement("option");
      o.value = String(SAVE_TIERS[i]);
      o.textContent = t("saveFrom.at", { n: SAVE_TIERS[i] });
      sel.appendChild(o);
    }
    sel.value = was;
    if (!sel.value) sel.value = "0";
  }

  function cleanPath(v) {
    var out = String(v || "").trim();
    if (out.length > 1 && (out.charAt(0) === "\"" || out.charAt(0) === "'") &&
        out.charAt(out.length - 1) === out.charAt(0)) {
      out = out.slice(1, -1).trim();
    }
    return out;
  }

  function tidySaveDir() {
    var raw = el.saveDir.value;
    var clean = cleanPath(raw);
    if (clean === raw) return clean;
    el.saveDir.value = clean;
    if (raw.trim() !== clean) log(t("log.unquoted"), "warn");
    return clean;
  }

  /* What the two switches and the size add up to.
   *
   * Numbers rather than adjectives. "Small" tells a broadcaster nothing about
   * whether their disk will survive the week, and the only figures anyone can
   * act on are the two this can state without guessing how often people press:
   * what one photograph weighs, and what one full SHUTTER PARTY weighs.
   *
   * Deliberately NOT an hourly or per-stream total. That would need a press
   * rate, there is no measurement of one, and a made-up rate presented beside
   * two measured numbers would be read as equally solid.
   *
   * The party line disappears when party photos are not kept, because then the
   * answer is not a smaller number — it is that the question stops applying.
   */
  function showSaveEstimate() {
    var sz = SAVE_SIZES[cfg.saveSize] || SAVE_SIZES.std;
    /* Three answers, because the ceiling belongs to the free presses.
     *
     * PARTY_SHOTS is what a party writes when somebody fills every 150ms window,
     * and the people filling them are pressing for free. With free photos not
     * kept, what lands during a party is only what was bought — a number nobody
     * here can predict — so quoting the ceiling would not be a rough figure, it
     * would be wrong by two orders of magnitude in the direction that scares
     * somebody off a setting that is in fact the cheap one (実測 2026-08-26:
     * this said 24MB with free set to "do not keep"). */
    var party = cfg.saveParty === "0" ? t("save.est.noparty")
      : cfg.saveFrom !== "0" ? t("save.est.partypaid")
      : t("save.est.party", { mb: Math.round(PARTY_SHOTS * sz.kb / 1024) });
    el.saveEstimate.textContent = t("save.est", { w: sz.w, kb: sz.kb }) + " " + party;
  }

  /* What a saved print says underneath.
   *
   * Four choices rather than two, because nothing is competing for the width
   * here: the caption band on a card is a fixed 210px, so the shape costs
   * nothing to offer. "A date, but not the hour I stream at" is a real answer
   * and two choices cannot express it (docs/stamp-plan.md §1.B).
   *
   * The product's own name is not one of the four: the card already carries it
   * in the corner (.cmark), for every saved print, paid or free. */
  function applyStampSave() {
    var v = el.stampSave.value;
    cfg.stampSave = ({ datetime: 1, date: 1, time: 1, off: 1 })[v] ? v : "datetime";
    saveCfg(cfg);
  }

  function applySaveMode() {
    var on = el.saveMode.value === "dir";
    el.fSaveDir.hidden = !on;
    el.hFramed.hidden = !on;
    el.hSaveDir.hidden = !on;
    el.fSaveFrom.hidden = !on;
    el.fSaveParty.hidden = !on;
    el.fSaveSize.hidden = !on;
    el.fStampSave.hidden = !on;
    el.hSaveWhat.hidden = !on;
    el.saveEstimate.hidden = !on;
    el.saveTest.hidden = !on;
    el.recDir.hidden = !on;
    cfg.saveDir = on ? tidySaveDir() : "";
    // Read back from the controls rather than trusted: these only ever narrow
    // what is written, so anything unrecognised has to fall to the widest
    // reading — the overlay does the same (keepThisShot / saveSize).
    // Anything unrecognised falls to the widest reading — keep everything —
    // for the reason the comment above gives.
    cfg.saveFrom = SAVE_TIERS.indexOf(Number(el.saveFrom.value)) === -1
      ? "0" : el.saveFrom.value;
    cfg.saveParty = el.saveParty.value === "0" ? "0" : "1";
    cfg.saveSize = ({ std: 1, small: 1, min: 1 })[el.saveSize.value] ? el.saveSize.value : "std";
    showSaveEstimate();
    saveCfg(cfg);
  }

  /**
   * There is no folder browser here, and there cannot be one.
   *
   * A page can open a directory picker, but what it gets back is a handle, not
   * a path — and OBS is the one writing the file, so a path is exactly what is
   * needed. The nearest honest thing is to ask OBS for a folder it is already
   * writing into, which is one click and always correct.
   */
  function useRecordDir(announce) {
    return request("GetRecordDirectory")
      .then(function (r) {
        var dir = r.recordDirectory || "";
        if (!dir) throw new Error("no record directory");
        el.saveDir.value = dir;
        applySaveMode();
        if (announce) log(t("log.recdir", { p: dir }), "ok");
      })
      .catch(function () { if (announce) log(t("log.norecdir"), "warn"); });
  }

  function suggestSaveDir() {
    if (el.saveDir.value.trim()) return;
    useRecordDir(false);
  }

  /**
   * Prove the path before a viewer's press depends on it.
   *
   * A folder that does not exist, or that OBS cannot write to, fails silently
   * from the overlay's point of view — it is mid-capture and has nowhere to put
   * the complaint. Finding out here costs one file.
   */
  function testSave() {
    var dir = tidySaveDir();
    if (!dir) { log(t("log.needdir"), "warn"); return; }
    if (!cfg.src) { log(t("log.picksrc"), "warn"); return; }
    var path = joinPath(dir, "shutterparty-test.jpg");
    request("SaveSourceScreenshot", {
      sourceName: cfg.src, imageFormat: "jpg", imageFilePath: path, imageCompressionQuality: 90
    }).then(function () { log(t("log.saved", { p: path }), "ok"); })
      .catch(function (e) { log(t("log.savefail", { m: e.message }), "bad"); });
  }

  function joinPath(dir, name) {
    var sep = dir.indexOf("/") >= 0 && dir.indexOf("\\") === -1 ? "/" : "\\";
    return dir.replace(/[\\/]+$/, "") + sep + name;
  }

  /* ================= putting the pieces into a broadcast scene =================

     The one rule that matters is that the overlay renders above whatever is
     being photographed. obs-websocket exposes scene order only as an index, and
     the protocol does not say which end of it is the front, so nothing here
     relies on knowing: OBS puts a newly created scene item on top, and that is
     the only ordering fact used. An item that is already there is re-created
     first and the old one removed second, so a failure leaves a duplicate the
     broadcaster can see rather than a scene missing its overlay. */

  function sceneItemId(scene, source) {
    return request("GetSceneItemId", { sceneName: scene, sourceName: source })
      .then(function (r) { return r.sceneItemId; })
      .catch(function () { return null; });      // not in the scene
  }

  /** Put source into scene, on top, however it got there before. */
  function raiseToTop(scene, source) {
    var kept = null;
    // Shown or hidden is the broadcaster's, like the transform: an overlay they
    // switched off on purpose must not come back on because it was re-stacked.
    // A new item is shown, which is what OBS does for one made by hand.
    var shown = true;
    return sceneItemId(scene, source)
      .then(function (old) {
        if (old === null) return null;
        return request("GetSceneItemEnabled", { sceneName: scene, sceneItemId: old })
          .then(function (r) { if (typeof r.sceneItemEnabled === "boolean") shown = r.sceneItemEnabled; })
          .catch(function () {})
          .then(function () {
            return request("GetSceneItemTransform", { sceneName: scene, sceneItemId: old });
          })
          .then(function (r) { kept = r.sceneItemTransform; return old; })
          .catch(function () { return old; });
      })
      .then(function (old) {
        // Create before removing: a failure here leaves the scene as it was.
        return request("CreateSceneItem", { sceneName: scene, sourceName: source, sceneItemEnabled: shown })
          .then(function (r) {
            if (old === null) return r.sceneItemId;
            return request("RemoveSceneItem", { sceneName: scene, sceneItemId: old })
              .then(function () { return r.sceneItemId; })
              .catch(function () { return r.sceneItemId; });
          });
      })
      .then(function (fresh) {
        if (!kept) return fresh;
        return request("SetSceneItemTransform", {
          sceneName: scene, sceneItemId: fresh, sceneItemTransform: kept
        }).then(function () { return fresh; }).catch(function () { return fresh; });
      });
  }

  /**
   * Put the overlay above what is on air, and touch nothing else.
   *
   * This used to nest the capture scene into the broadcast scene as well,
   * because §4.1's diagram draws it that way. That diagram describes a setup
   * built from nothing, where the capture scene IS what the broadcaster shows.
   * A broadcaster who already has a scene of their own gets a full-canvas
   * second copy laid over the layout they arranged — which is the accident
   * this page exists to prevent, arriving from the page itself.
   *
   * Where the capture scene belongs is a composition decision, and it is
   * theirs. The one thing that is genuinely ours is the order: a photograph
   * with the overlay under it is a photograph of the effects.
   */
  function arrangeIn(scene) {
    if (!scene || !target) return Promise.resolve();
    return raiseToTop(scene, target)
      .then(function () { log(t("log.arranged", { s: scene, o: target }), "ok"); })
      .then(warnFrozenCapture)
      .catch(function (e) { log(t("log.arrangefail", { m: e.message }), "bad"); });
  }

  /**
   * The one case where not nesting costs something.
   *
   * OBS does not render a scene it is not showing. A scene screenshot still
   * composites correctly — that much was measured — but a browser source
   * inside one stays on the frame it was created with, so the photographs
   * come back with that part frozen. Nothing else is affected, so this says
