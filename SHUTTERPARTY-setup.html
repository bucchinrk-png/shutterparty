   * so rather than rearranging the broadcaster's scenes on their behalf.
   */
  function warnFrozenCapture() {
    var capture = scenes.indexOf(cfg.src) >= 0 ? cfg.src : null;
    if (!capture) return;
    return scenesHolding(capture).then(function (found) {
      if (found.length) return;                  // it is inside something
      return request("GetSceneItemList", { sceneName: capture }).then(function (d) {
        var web = (d.sceneItems || []).some(function (i) {
          return i.sceneItemEnabled !== false && i.inputKind === "browser_source";
        });
        if (web) log(t("log.frozen", { c: capture }), "warn");
      }).catch(function () {});
    }).catch(function () {});
  }

  /** Which scenes is this source sitting in? */
  function scenesHolding(source) {
    return Promise.all(scenes.map(function (scene) {
      return sceneItemId(scene, source).then(function (id) { return id === null ? null : scene; });
    })).then(function (found) { return found.filter(Boolean); });
  }

  /* ================= wiring ================= */

  el.connect.addEventListener("click", function () {
    if (identified) disconnect();
    else connect();
  });
  el.build.addEventListener("click", buildAll);
  el.shot.addEventListener("click", testCapture);
  el.refresh.addEventListener("click", function () {
    if (identified) loadScenes().then(scanTargets);
  });
  el.push.addEventListener("click", pushNow);
  el.gate.addEventListener("change", addGateScene);
  el.gateAll.addEventListener("change", applyGateAll);
  el.test.addEventListener("click", toggleTestWindow);
  el.sampleParty.addEventListener("click", sampleParty);
  // Written as it is pasted. Before, these values only reached the config
  // when the connection was tested, so a broadcaster who filled them in and
  // went straight to writing sent an overlay with no channel.
  el.pairCode.addEventListener("input", applyPairCode);
  // A pasted theme code is read as it is pasted, and brings the look the
  // pack was designed for with it (70-broadcaster-settings.js applyPack).
  el.themeCode.addEventListener("input", function () { applyPack(el.themeCode.value, true); });
  el.packNone.addEventListener("click", function () { el.themeCode.value = ""; applyPack("", true); });
  el.ebsConnect.addEventListener("click", checkEbs);
  el.saveMode.addEventListener("change", applySaveMode);
  el.saveFrom.addEventListener("change", applySaveMode);
  el.saveParty.addEventListener("change", applySaveMode);
  el.saveSize.addEventListener("change", applySaveMode);
  el.stampSave.addEventListener("change", applyStampSave);
  el.saveDir.addEventListener("change", applySaveMode);
  el.saveTest.addEventListener("click", testSave);
  el.recDir.addEventListener("click", function () { useRecordDir(true); });

  /* Asked first, because there is no way back.
   *
   * This page already asks before overwriting a browser source — a change that
   * rewrites one URL and destroys nothing. This one takes the OBS password, the
   * pairing code and the gate, and the gate going means the shutter closes. It
   * was the only thing here that did all that on a single click.
   *
   * Nothing is marked primary, so focus lands on the first button, which is the
   * one that changes nothing. Escape does the same (see ask()). "primary" means
   * "the answer you probably want" everywhere else in this page, and the answer
   * you probably want here is not a button. */
  el.reset.addEventListener("click", function () {
    ask(t("dlg.resetTitle"), t("dlg.reset"), [
      { label: "dlg.cancel", value: "cancel" },
      { label: "dlg.resetGo", value: "go" }
    ]).then(function (answer) { if (answer === "go") wipeEverything(); });
  });

  function wipeEverything() {
    try { localStorage.removeItem(CFG_KEY); localStorage.removeItem(UI_KEY); } catch (e) {}
    /* The ciphertext AND the key, or "everything" is not what happened.
     *
     * Removing only the config would leave the encrypted secrets behind under
     * a key that still opens them — and the next load would quietly put the
     * password back into a page that has just been told it was erased.
     * secretsClear() does both and reads both back (shared: secret-store.js).
     *
     * Its answer is WAITED FOR, at the bottom of this function, because it is
     * the one part of "erase everything" that can fail on its own. It used to
     * be fired and forgotten, and the page said 「全ての設定を消去しました」
     * whether or not the key had gone — which is precisely the shape this
     * store was written to avoid: telling somebody a secret is gone while the
     * tool that opens it is still on their disk (Codex 3巡目 HIGH;
     * docs/from-worddrop.md §2). Everything else here is memory and
     * localStorage and cannot half-happen.
     *
     * The generation is bumped before it returns either way, so a decrypt
     * still in flight from boot cannot land afterwards and undo this. */
    var cleared = secretsClear();
    cfg = defaultCfg();
    ui = loadUi();
    el.pairCode.value = ""; el.pairInfo.hidden = true;
    applyPreset(cfg.preset); applyAccent(cfg.accent); applyScale(cfg.scale); applyPlace(cfg.place);
    applyStampShot(cfg.stampShot); applyGlass(cfg.glass);
    applyThemeChoice(cfg.theme);
    el.themeCode.value = "";
    applyPack("", false);
    el.host.value = cfg.host;
    el.port.value = cfg.port;
    el.pw.value = "";
    el.capName.value = "";
    el.newSrcName.value = "";
    // The saving controls too: they are read back out of the form the next time
    // anything touches them, so a cleared config with a stale folder still on
    // screen puts that folder back the moment the broadcaster changes anything.
    el.saveDir.value = cfg.saveDir;
    el.saveMode.value = "off";
    el.saveFrom.value = cfg.saveFrom;
    el.saveParty.value = cfg.saveParty;
    el.saveSize.value = cfg.saveSize;
    el.stampSave.value = cfg.stampSave;
    applySaveMode();
    scenes = [];
    targets = [];
    target = barTarget = "";
    renderGate();                          // no scene is allowed-listed any more
    pickLang();
    disconnect();
    paint();
    /* Back to the first tab, because that is what was just asked for.
     *
     * paint() redraws every word and every row, but the pane on screen is
     * chosen by showPane() alone — so without this the page erased everything
     * and stayed on the tab it was erased from, with `ui.pane` in memory
     * already saying "obs". The two only agreed
     * again at the next reload. It also scrolls to the top, which is the right
     * place to be standing after starting over. */
    showPane(ui.pane);
    applySampleBg(ui.sampleBg);
    /* Said last, and said differently when it did not finish.
     *
     * Pressing Reset again retries: nothing here is half-applied, and the
     * store's clear is idempotent. So the sentence for the failure is an
     * instruction rather than an apology. */
    cleared.then(function (gone) {
      log(t(gone ? "log.reset" : "log.reset.kept"), gone ? "warn" : "bad");
    });
  }

  /* ================= go ================= */

  el.host.value = cfg.host;
  el.port.value = cfg.port;
  el.capName.value = ui.capName || cfg.src || "";
  el.newSrcName.value = ui.srcName || "";
  el.saveDir.value = cfg.saveDir || "";
  el.saveMode.value = cfg.saveDir ? "dir" : "off";
  // Widest reading when the stored value is unknown, matching the overlay.
  paintSaveFrom();
  el.saveFrom.value = cfg.saveFrom || "0";
  if (!el.saveFrom.value) el.saveFrom.value = "0";
  el.saveParty.value = cfg.saveParty === "0" ? "0" : "1";
  el.saveSize.value = ({ std: 1, small: 1, min: 1 })[cfg.saveSize] ? cfg.saveSize : "std";
  el.stampSave.value = ({ datetime: 1, date: 1, time: 1, off: 1 })[cfg.stampSave] ? cfg.stampSave : "datetime";

  /* One line, before anything is tried.
   *
   * The overlay has written one since it existed (99-go.js over there) and this
   * page had none — so when a broadcaster opens the log because something is
   * wrong, the first thing in it is whatever went wrong, with nothing above it
   * saying what they were running or what they had.
   *
   * That cost a live diagnosis on 2026-08-30: the viewers' button had stopped
   * working, and the answer turned out to be a pairing code pointing at a
   * development server. Both facts — which build, which server — existed on
   * this machine and neither was written down anywhere a person would look.
   *
   * The password is never in it, only whether there is one; the same for the
   * EBS token, which the guide page tells broadcasters not to put on screen.
   * The EBS is named by host alone for the same reason the rail names it that
   * way: it is the part that tells production from a machine in this room.
   */
  log("boot" +
    " build=" + BUILD +
    " lang=" + lang +
    " obs=" + cfg.host + ":" + cfg.port +
    " ebs=" + (ebsHost() || "(none)") +
    " ch=" + (cfg.ch || "(none)") +
    " src=" + (cfg.src || "(none)") +
    " gate=" + (String(cfg.gateSet || "") === "1" ? (cfg.scenes ? cfg.scenes.split("\n").length + " scene(s)" : "every scene") : "UNSET") +
    " save=" + (cfg.saveDir || "(off)"));

  applyPreset(cfg.preset);
  applyAccent(cfg.accent);
  applyScale(cfg.scale);
  applyPlace(cfg.place);
  applyStampShot(cfg.stampShot);
  applyGlass(cfg.glass);
  // The pack as the settings remember it, back in the box, and its files
  // checked again — a folder renamed since is the kind of thing this catches.
  // Not as a paste: the pack's recommended look is not put back over a
  // choice the broadcaster made since.
  applyThemeChoice(cfg.theme);
  el.themeCode.value = themeCodeOf(cfg);
  applyPack(el.themeCode.value, false);
  applySaveMode();
  showPane(ui.pane);
  applySampleBg(ui.sampleBg);
  paint();
  /* Always, and not `if (cfg.pw)`.
   *
   * The condition that used to be here was guarding against a failure that does
   * not exist: obs-websocket lets a broadcaster switch authentication off, and
   * onHello() identifies immediately when the server offers no challenge
   * (src/shared/parts/obs-ws.js). So the people the old comment described as
   * being spared a guaranteed failure were in fact the people pressing Connect
   * by hand every time they opened this page.
   *
   * What made this safe to remove is that a failed attempt now says why, on the
   * rail, without the log being opened (docs/onboarding-plan.md §4.B). Before
   * that, connecting on load meant failing on load with nothing to read.
   *
   * It waits for the secrets, which is the one part of the config that is not
   * ready when the page is (shared: secret-store.js). Connecting first would
   * offer OBS an empty password and put 「パスワードが違います」 on the rail of a
   * page whose password is fine and half a tick away.
   *
   * Two fields wait with it, for the same reason: the password box and the
   * pairing box are the two things on this page that ARE the secrets. Filled
   * before the store answered they would show blank, and a blank box on this
   * page is not nothing — it is what a broadcaster corrects by typing over it,
   * which is how the 2026-09-03 outage was typed into OBS. */
  /* The two buttons that READ the secret fields are shut until the fields have
   * been filled.
   *
   * Connect takes whatever is in the password box (52-obs-hooks.js:
   * obsBeforeConnect) and the pairing button takes whatever is in the pairing
   * box (75-ebs-link.js: applyPairCode) — and for the first moments after this
   * page opens, both boxes are empty for a reason that has nothing to do with
   * what the broadcaster has: the decrypt has not landed yet. Pressed in that
   * window, Connect wrote two blanks back over the store and the stored
   * password and pairing token were erased, key and all (Codex 1巡目 CRITICAL).
   *
   * The store now refuses to read emptiness as erasure, which is the belt.
   * This is the braces, and it is the half a broadcaster can see: a button
   * that is briefly unavailable is a button that was not lying about what it
   * would do. Both come back in the same tick as the fields they read. */
  el.connect.disabled = true;
  el.ebsConnect.disabled = true;

  secretsOpen().then(function (r) {
    // The store fills in what this page did not already have. It does not
    // overwrite: a value already in cfg came from the query string, which wins
    // over storage here exactly as it does for every other setting (loadCfg).
    SECRETS.forEach(function (k) { if (!cfg[k] && r.values[k]) cfg[k] = r.values[k]; });

    el.pw.value = cfg.pw;
    el.pairCode.value = contractCode(cfg.ebs, cfg.ch, cfg.ebsToken);
    // Together with the values, never before them.
    el.connect.disabled = false;
    el.ebsConnect.disabled = false;
    showPairInfo();
    renderRail();
    renderDock();

    // Said once, after the answer exists — and never as "empty". A profile
    // that has ciphertext it can no longer open has a password that is neither
    // lost nor usable, and that needs its own sentence (docs/from-worddrop.md §2).
    if (r.state === "locked") log(t("log.secret.locked"), "bad");
    else if (r.state === "nostore") log(t("log.secret.nostore"), "warn");
    log("secrets " + r.state +
      " pw=" + (cfg.pw ? "set" : "EMPTY") +
      " token=" + (cfg.ebsToken ? "set" : "EMPTY"));

    /* Anything this page brought that the store does not have yet is written
     * down now. That is the migration: a config saved before this existed has
     * both secrets in plain text, and this is the moment they move — quietly,
     * because the broadcaster did not press anything. */
    var bring = SECRETS.some(function (k) { return cfg[k] && r.values[k] !== cfg[k]; });
    return bring ? saveSecrets(true) : null;
  }).then(function () {
    connect();
  });

  booting = false;
})();
</script>
