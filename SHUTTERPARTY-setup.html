<!doctype html>
<meta charset="utf-8">
<!-- What this page is allowed to reach.

     It reaches almost nothing, and that was true before this line existed: the
     two distributed pages load no external script, no external stylesheet and
     no font, and they contain no eval, no new Function, no innerHTML and no
     document.write (実測 2026-09-10 — all six searched, all zero). So there is
     no known way into this page for code that is not in it. This is the belt
     for the day one of those six stops being zero.

     A <meta> CSP does work on file:// (実測 — docs/from-worddrop.md §3), and it
     has to come before every <script>: after one, the first script has already
     run under no policy at all.

     Line by line, because each one is a decision:

       default-src 'none'   Everything not named below is refused. The list is
                            short enough to be exhaustive, and the alternative —
                            naming only what to forbid — is a list nobody can
                            finish.
       script-src           'unsafe-inline' and no sources: the page is one
                            inline script, and no <script src> from anywhere may
                            load. A hash would also block an INJECTED inline
                            script, and was not taken: the stamp already has a
                            fixed point that cost a day to solve (§3.2.2 手当て2),
                            a hash of the script inside the same file adds a
                            second one, and the failure mode of getting it wrong
                            is a blank overlay on air. There is no injection
                            vector to close — see the six zeroes above.
       style-src            The page is one inline stylesheet, and it sets
                            element styles from script.
       img-src              file: is the photographs — the contact sheet is
                            handed file:///…/shot.png addresses, because a
                            file:// page is refused the PIXELS of a file:// image
                            and can only draw it (§6). data: is OBS's own
                            screenshots coming back over obs-websocket, and the
                            sample's stand-in picture. blob: was
                            listed and is gone again: nothing in either page makes one
                            (createObjectURL: 実測 0 件), and an allowance nobody
                            needs is a hole nobody is watching.
       connect-src          ws: is obs-websocket, and it is deliberately not
                            pinned to 127.0.0.1: the host is a field on the setup
                            page, and a broadcaster whose OBS is on another
                            machine would be cut off by a policy — silently,
                            which is the one thing a policy must not be here.
                            The EBS is pinned to *.workers.dev, which is where it
                            is and where it would move to; http://localhost and
                            http://127.0.0.1 are a development EBS (Phase 3).
                            https: and http: to anywhere else are refused, which
                            is the easy way out for anything that should not be
                            leaving.
       frame-src            file: is the sample — this page draws the overlay in an
                            iframe so the effects can be seen before they go on
                            the air (72-the-sample.js).
       base-uri / form-action
                            Neither page has a <base> or a <form>; naming them
                            'none' is what keeps that true. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src file: data:; connect-src ws: https://*.workers.dev wss://*.workers.dev http://127.0.0.1:* http://localhost:*; base-uri 'none'; form-action 'none'; frame-src file:">
<title>SHUTTERPARTY — setup</title>
<!--
  The broadcaster's setup page.

  Opened in the broadcaster's own browser — never in OBS. It holds an
  obs-websocket connection and writes the overlay's settings into the browser
  source's own URL, so nothing about this configuration is ever on the canvas.

  Why file:// and not a hosted page: an HTTPS origin cannot reach ws://127.0.0.1
  (measured; see docs/plan.md §2.2). file:// can, and is a secure context, so
  crypto.subtle is available for the obs-websocket SHA-256 challenge.

  The obs-websocket password never leaves this page.

  Layout: a rail of four areas, one shown at a time, over a docked bar that
  writes to OBS from wherever the broadcaster happens to be. The page used to be
  seven numbered steps stacked vertically, which meant the one control that made
  any of it take effect was the one furthest from the setting being changed.
-->

<style>
  :root {
    --acc-rgb: 176, 62, 52;
    --pre-rgb: 224, 176, 96;
    --ink: #e7eaf0;
    --dim: #97a1b1;
    --line: rgba(255, 255, 255, .11);
    --bg: #0b0e13;
    --bg2: #141a22;
    --bg3: #1b212a;
    --ok: #4cbc86;
    --bad: #ff7a6a;
    --warn: #d9a03e;
    --font: "Segoe UI", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --r: 9px;
  }

  /* ---------- concept colours ----------
     --acc is the brand / session colour, --pre is the "someone paid" treatment.
     Every preset keeps the two distinct, or the paid frame dissolves into the
     background. Values are the desaturated set from the prototype; a broadcast
     overlay at full chroma is fatiguing to watch. */
  /* @generated accents — src/shared/accents.json。手で書き換えない */
  :root, :root[data-accent="safelight"] { --acc-rgb: 176,62,52;  --pre-rgb: 224,176,96; }
  :root[data-accent="neon"]             { --acc-rgb: 198,72,140; --pre-rgb: 116,202,218; }
  :root[data-accent="ocean"]            { --acc-rgb: 44,118,142; --pre-rgb: 226,178,102; }
  :root[data-accent="forest"]           { --acc-rgb: 64,118,80;  --pre-rgb: 206,172,104; }
  :root[data-accent="violet"]           { --acc-rgb: 120,90,188; --pre-rgb: 230,196,124; }
  :root[data-accent="mono"]             { --acc-rgb: 88,94,106;  --pre-rgb: 226,186,108; }
  :root[data-accent="pink"]             { --acc-rgb: 122,46,69;  --pre-rgb: 240,135,159; }
  :root[data-accent="peach"]            { --acc-rgb: 122,74,30;  --pre-rgb: 242,172,104; }
  :root[data-accent="lemon"]            { --acc-rgb: 119,102,26; --pre-rgb: 239,215,102; }
  :root[data-accent="mint"]             { --acc-rgb: 38,96,60;   --pre-rgb: 132,206,153; }
  :root[data-accent="sky"]              { --acc-rgb: 31,86,112;  --pre-rgb: 117,190,218; }
  :root[data-accent="lavender"]         { --acc-rgb: 69,49,114;  --pre-rgb: 162,148,218; }
  :root[data-accent="rose"]             { --acc-rgb: 110,43,87;  --pre-rgb: 226,148,198; }
  :root[data-accent="apricot"]          { --acc-rgb: 122,59,38;  --pre-rgb: 241,156,124; }
  /* @end accents */

  * { box-sizing: border-box; }

  /* Fixed sizes, not clamp(vw). The rules here were written for a 1920x1080 OBS
     canvas the broadcaster sees scaled down; this page is only ever read in a
     normal browser window, where type that resizes with the window is just
     type that will not hold still. */
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ---------- shell ---------- */
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  .top {
    position: sticky; top: 0; z-index: 6;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 13px 24px;
    background: rgba(11, 14, 19, .96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .top h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .01em; }
  .top .grow { flex: 1 1 auto; }
  /* Below the header rather than inside it: the header is sticky, and a
     paragraph that never scrolls away costs the same two lines on every
     screen for a sentence that is read once. */
  /* Wide enough to read a scene name in full: these are the broadcaster's own
     names and a truncated one is not recognisable. */
  .dest { max-width: 420px; margin: 10px 0 14px; }
  .dest select { width: 100%; }

  .lede {
    margin: 0 0 18px;
    padding: 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--dim);
    max-width: 1080px;
  }

  /* ---------- connection chip ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--bg3);
    border: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12px;
    white-space: nowrap;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .chip[data-state="ok"]   .dot { background: var(--ok); }
  .chip[data-state="bad"]  .dot { background: var(--bad); }
  .chip[data-state="wait"] .dot { background: var(--warn); animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .chip[data-state="wait"] .dot { animation: none; } }

  .langpick { display: flex; align-items: center; gap: 8px; }
  .langpick select {
    font-family: var(--font);
    font-size: 13px;
    padding: 5px 9px;
    border-radius: var(--r);
    border: 1px solid var(--line);
    background: var(--bg3);
    color: var(--ink);
  }
  .langpick .globe { color: var(--dim); font-size: 14px; }

  /* ---------- rail ---------- */
  .body { flex: 1 1 auto; display: grid; grid-template-columns: 234px minmax(0, 1fr); }

  /* The column, not the tablist, is what sticks — so the foot of it can sit at
     the bottom of the screen while the tabs stay at the top. */
  .railCol {
    /* --topH is the header's measured height, set on load and whenever it
       changes size. It wraps on a narrow window, so a constant here is wrong
       by a whole row exactly when the screen can least afford it.

       --logH is the same idea at the other end: the open log is a fixed panel
       at bottom: 0, up to 34vh, and this column's foot sits flush with the
       bottom of the screen. Without subtracting it, opening the log put BOTH
       of the foot's buttons underneath the panel — the one that closes the log,
       and the primary write-to-OBS button (実測 2026-08-26: log at y531-805,
       the two buttons at y718-746 and y754-793, elementFromPoint returning the
       log's own lines). It is 0px whenever the log is shut. */
    position: sticky; top: var(--topH, 58px); align-self: start;
    height: calc(100vh - var(--topH, 58px) - var(--logH, 0px));
    display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
  }

  .rail {
    display: flex; flex-direction: column; gap: 4px;
    padding: 18px 12px;
    /* Yield to the foot when the window is short: the tabs can scroll, the
       write button may not go off the bottom of the screen. */
    min-height: 0; overflow-y: auto;
  }

  .railFoot {
    margin-top: auto;
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--line);
  }
  .railFoot .dockRow { padding: 0 2px 2px; }
  .railFoot button { width: 100%; }
  .railBtn {
    display: flex; flex-direction: column; gap: 1px;
    width: 100%; text-align: left;
    padding: 9px 12px;
    border: 1px solid transparent;
    border-radius: var(--r);
    background: transparent;
    color: var(--ink);
    font-family: var(--font);
    cursor: pointer;
  }
  .railBtn:hover { background: #151b23; }
  .railBtn[aria-selected="true"] { background: var(--bg2); border-color: var(--line); }
  .railBtn[aria-selected="true"] .rTitle { color: rgb(var(--acc-rgb)); }
  .rTitle { font-size: 14px; font-weight: 640; }
  /* A row can now carry a value rather than a word — a host name, a preset
     and a colour — and the column is 200px wide. Cut it rather than let it
     wrap: the rail is read at a glance, and a title carries the whole. */
  .rState {
    font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .02em;
    display: block; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .railBtn[data-ok="1"] .rState { color: var(--ok); }

  /* ---------- panes ---------- */
  /* The same subtraction for the reading column: the panel is fixed, so without
     this the last step of whichever tab is open sits under it and cannot be
     scrolled to. */
  .pane { padding: 20px 26px calc(48px + var(--logH, 0px)); max-width: 880px; min-width: 0; }
  /* One tab is not a reading column.
     880px is a measure for prose, and every other tab is prose with controls
     in it. The look tab is a control panel with its own result beside it, and
     the result is 16:9 — squeezed into a reading measure it becomes a stamp.
     The width is opened only for that tab, and only from here: showPane()
     stamps the name, so there is no second copy of the list of tabs. */
  .pane[data-pane="look"] { max-width: 1360px; }
  .tabpane[hidden] { display: none; }

  /* ---------- the look tab: settings left, the result right ----------
     Two columns so that changing something and seeing it changed are one
     movement rather than a scroll. The right one holds its place while the
     left is being worked through — the sample is the reason for the settings,
     so it must not leave when the settings get long. */
  #paneLook { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 0 26px; align-items: start; }
  #paneLook > .step { border-top: 0; }
  #paneLook > #stepSample { position: sticky; top: 12px; }
  /* Narrow: back to one column, the sample under the settings. The number is
     the point at which the right column stops being able to show a 16:9 frame
     at a useful size — below it, two columns are worse than one. */
  @media (max-width: 1180px) {
    #paneLook { grid-template-columns: minmax(0, 1fr); gap: 0; }
    #paneLook > .step + .step { border-top: 1px solid var(--line); }
    #paneLook > #stepSample { position: static; }
  }

  .step { padding: 20px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 11px; }
  .step:first-child { border-top: 0; padding-top: 4px; }
  .step > h2 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .01em; }

  .note { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.6; max-width: 78ch; }
  .note.warn { color: var(--warn); border-left: 2px solid var(--warn); padding-left: 10px; }
  .note.good { color: var(--ok); border-left: 2px solid var(--ok); padding-left: 10px; font-family: var(--mono); font-size: 12.5px; }
  /* Not background information: the one line that says what a photograph will
     actually show. */
  .note.contents { color: var(--ink); border-left: 2px solid rgb(var(--acc-rgb)); padding-left: 10px; overflow-wrap: anywhere; }
  .notice {
    margin: 0;
    padding: 9px 13px;
    border-radius: var(--r);
    background: rgba(217, 160, 62, .13);
    border: 1px solid var(--warn);
    color: var(--warn);
    font-size: 13px;
  }

  /* ---------- fields ---------- */
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .row .wide { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field.port { max-width: 130px; }
  .field > label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .field input, .field select {
    font-family: var(--mono);
    font-size: 14px;
    padding: 9px 11px;
    border-radius: var(--r);
    border: 1px solid var(--line);
    background: var(--bg3);
    color: var(--ink);
    width: 100%;
    min-width: 0;
  }

  /* ---------- the scenes the button works in ----------
     One row per allowed scene, each carrying the way to take it back. The
     list is short by nature — a channel has a handful of scenes — so it is
     laid out to be counted at a glance rather than scrolled. */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chips:empty { display: none; }
  .gchip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 4px 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(var(--acc-rgb), .55);
    background: rgba(var(--acc-rgb), .12);
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink);
    max-width: 100%;
  }
  .gchip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A scene OBS no longer has. Kept on screen rather than dropped, because it
     is still in the config and only the broadcaster can say whether it was
     renamed or removed — but it must not read as one that is working. */
  .gchip.gone { border-color: var(--warn); background: transparent; color: var(--warn); }
  .gchip .gx {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1;
    font-weight: 700;
    padding: 0;
    width: 20px; height: 20px;
    flex: none;
    border-radius: 999px;
    border: 0;
    background: transparent;
    color: inherit;
    opacity: .7;
  }
  .gchip .gx:hover { opacity: 1; background: rgba(var(--acc-rgb), .25); }
  .field input:focus-visible, .field select:focus-visible,
  .langpick select:focus-visible {
    outline: 2px solid rgb(var(--acc-rgb));
    outline-offset: 1px;
  }
  /* A checkbox is not a labelled field: the words sit beside it and are part
     of the target, and it must not take the width a text input would. */
  label.check {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 14px; color: var(--ink); cursor: pointer;
  }
  label.check input { width: 17px; height: 17px; flex: none; accent-color: rgb(var(--acc-rgb)); }

  /* ---------- the sample ----------
     A 1920x1080 frame, shrunk by transform rather than resized. The corners
     and the three sizes only mean something against the shape the effects will
     really be drawn in; squeezed to the width of this column they would point
     somewhere the broadcast has not got. */
  .sampleBox {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--r);
    /* The page's own ground, not black: what sits beside a vertical canvas is
       this page, and a black margin would read as part of the picture. */
    background: var(--panel);
  }
  /* What the sample is played over. Never black: no broadcast is, and the
     effects are glass and outlined white, which black flatters and a real
     scene does not. Two stand-ins, drawn rather than shipped (a picture would
     go in the zip): a dim one — an evening room, a dark game — and a bright
     one, sky and daylight, where white type and clear glass have the least to
     stand on. Nothing in them is a subject, so they compete with nothing. */
  /* Drawn on the frame, not on the box around it. They were the same thing
     while there was one canvas — the frame filled the column — but a vertical
     canvas is about half as wide as the column it sits in, and a backdrop that
     spanned the box would say the broadcast reached places it does not. The
     scale applies to it like everything else, which is right: this is what is
     BEHIND the overlay, so it belongs to the canvas. */
  .sampleBox[data-bg="dim"] .sampleScale {
    background:
      radial-gradient(ellipse 45% 40% at 62% 42%, rgba(255,200,150,.22), rgba(255,200,150,0) 70%),
      radial-gradient(ellipse 30% 25% at 20% 25%, rgba(140,180,255,.14), rgba(140,180,255,0) 70%),
      linear-gradient(180deg, #465460 0%, #3e4852 48%, #37352f 52%, #2c2b28 100%);
  }
  .sampleBox[data-bg="bright"] .sampleScale {
    background:
      radial-gradient(circle at 78% 18%, rgba(255,250,215,.9) 0 5%, rgba(255,250,215,0) 16%),
      linear-gradient(180deg, #86c4f2 0%, #bfe2fa 50%, #e8f4fb 58%, #a9d68c 58.5%, #8cc36f 76%, #b49a74 100%);
  }
  .sampleScale {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    transform-origin: top left;
  }
  /* The size is written by 72-the-sample.js now, because there are two: the
     16:9 canvas and the 9:16 one a dual-format broadcaster builds for mobile
     (docs/vertical-plan.md). Left here as the starting shape so the first
     paint is not 0x0 before the script runs. */
  .sampleScale, #sampleFrame { width: 1920px; height: 1080px; }
  #sampleFrame { display: block; border: 0; }

  /* Which canvas the sample stands on has no style of its own: it is .opts,
     the same row of buttons the presets and the sizes use. Two buttons rather
     than a toggle, because the broadcaster is choosing a thing to look at —
     and nothing about the overlay changes when they press it. */

  /* ---------- buttons ---------- */
  .btns { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  /* The pasted theme code and the button that empties it, on one line. */
  .packRow { display: flex; gap: 9px; align-items: stretch; }
  .packRow .field { flex: 1 1 auto; }
  .packRow .field input { width: 100%; box-sizing: border-box; }
  button {
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 17px;
    border-radius: var(--r);
    border: 1px solid var(--line);
    background: #232935;
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { background: #2d3543; }
  button.primary { background: rgb(var(--acc-rgb)); border-color: transparent; color: #fff; }
  button.primary:hover { filter: brightness(1.12); }
  button.ghost { background: transparent; }
  button.ghost:hover { background: #151b23; }
  button.big { font-size: 15px; padding: 12px 26px; }
  button.mini { font-family: var(--mono); font-size: 11.5px; font-weight: 500; padding: 6px 11px; }
  /* Dim until it is looked at. The colour is the second thing holding this
     button back — the first is that it is nowhere near what it erases. */
  /* Pinned right at every width. `.grow` pushes it there while the header is
     one line, but a narrow window wraps it onto a line of its own — where it
     landed at the LEFT edge, first thing under the title, which is the
     opposite of the point, measured at 620px. */
  .top button.danger { margin-left: auto; }
  button.danger { color: var(--dim); border-color: transparent; }
  button.danger:hover, button.danger:focus-visible {
    color: var(--bad); border-color: var(--bad); background: transparent;
  }
  button:disabled { opacity: .42; cursor: default; }
  button:disabled:hover { background: #232935; filter: none; }
  button.primary:disabled:hover { background: rgb(var(--acc-rgb)); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .ebs-badge {
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--dim);
  }
  .ebs-badge [data-state="live"] { color: var(--ok); }
  .ebs-badge [data-state="error"] { color: var(--bad); }
  .ebs-badge [data-state="connecting"] { color: var(--warn); }

  /* ---------- disclosure ---------- */
  details.more { border: 1px solid var(--line); border-radius: var(--r); background: #0f141a; }
  details.more > summary {
    cursor: pointer;
    padding: 9px 13px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    list-style: none;
  }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "\25B8  "; }
  details.more[open] > summary::before { content: "\25BE  "; }
  details.more > summary:hover { color: var(--ink); }
  details.more .inner { padding: 0 13px 13px; }

  /* ---------- look controls ---------- */
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  /* In the left column there is room for one group at a time, and the four
     read as a list rather than a grid that happens to have one column. */
  #paneLook .settings { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  @media (max-width: 1180px) {
    #paneLook .settings { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  }
  .grp { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .grp > label {
    font-family: var(--mono);

            </div>

          </div>

      </section>

      <!-- ================= where the photos go ================= -->
      <section class="tabpane" id="paneSave" role="tabpanel" aria-labelledby="tabSave" hidden>
        <section class="step">
          <h2 id="sSave"></h2>
          <p class="note" id="nSave"></p>
          <div class="row">
            <div class="field">
              <label for="saveMode" id="lSaveMode"></label>
              <select id="saveMode">
                <option value="off" id="oSaveOff"></option>
                <option value="dir" id="oSaveDir"></option>
              </select>
            </div>
            <!-- What is kept, and how heavy each one is. Two questions rather
                 than one because they trade against different things: the first
                 decides how many files exist, the second how big each is, and a
                 broadcaster who wants every photograph can still want small
                 ones. Nothing here can delete a file (docs/plan.md Phase 6), so
                 both of them only ever act at the moment of writing. -->
            <!-- A dial, not two switches. The amounts come from the catalogue
                 (SAVE_TIERS, generated from src/shared/skus.json), so a tier
                 added later appears here without anybody deciding again — which
                 is the same reason §4.12 keyed bundling to the amount rather
                 than to the SKU. The options are built in JS because their words
                 carry the number. -->
            <div class="field" id="fSaveFrom" hidden>
              <label for="saveFrom" id="lSaveFrom"></label>
              <select id="saveFrom"></select>
            </div>
            <div class="field" id="fSaveParty" hidden>
              <label for="saveParty" id="lSaveParty"></label>
              <select id="saveParty">
                <option value="1" id="oPartyKeep"></option>
                <option value="0" id="oPartyDrop"></option>
              </select>
            </div>
            <div class="field" id="fSaveSize" hidden>
              <label for="saveSize" id="lSaveSize"></label>
              <select id="saveSize">
                <option value="std" id="oSizeStd"></option>
                <option value="small" id="oSizeSmall"></option>
                <option value="min" id="oSizeMin"></option>
              </select>
            </div>
            <!-- Four, not two. Nothing is competing for the width down here —
                 the caption band on a saved card is a fixed 210px — so the
                 shape can be chosen without costing anything, and "a date but
                 not the hour I stream at" is a real answer. -->
            <div class="field" id="fStampSave" hidden>
              <label for="stampSave" id="lStampSave"></label>
              <select id="stampSave">
                <option value="datetime" id="oStampBoth"></option>

              <input id="saveDir" spellcheck="false">
            </div>
          </div>
          <p class="note" id="saveEstimate" hidden></p>
          <p class="note" id="hSaveWhat" hidden></p>
          <p class="note" id="hFramed" hidden></p>
          <p class="note" id="hSaveDir" hidden></p>
          <div class="btns">
            <button class="mini" id="btnRecDir" hidden></button>
            <button class="mini" id="btnSaveTest" hidden></button>
          </div>
        </section>
      </section>

    </main>
  </div>

  <!-- The log needs the width of the page, so it stays down here and the
       button that opens it lives in the rail.

       It therefore carries its own way out. The opener is in the rail, which on
       a narrow window is at the TOP of the page and scrolled away by the time
       anybody reads the log — and on a wide one the rail's foot sits at the
       bottom of the viewport, exactly where this panel lands. A panel that can
       cover its own switch has to have a switch of its own (報告 2026-08-26).

       The bar is outside the scroller on purpose: inside it, the way out would
       scroll off the top the moment the log had anything in it. -->
  <footer class="logdock">
    <div id="logpanel" hidden>
      <div class="logbar">
        <span class="logbarTtl" id="logTtl"></span>
        <button class="ghost mini" id="btnLogClose"></button>
      </div>
      <div class="logwrap" id="logwrap"><div class="log" id="log"></div></div>
    </div>
  </footer>
</div>

  /* ================= the rail ================= */

  function setRailState(id, text, ok, whole) {
    $(id).textContent = text;
    // The row is cut to the column's width, so the untrimmed value goes where
    // it can still be read.
    $(id).title = whole || text;

  /**
   * The host the pairing code points at, short enough for the rail.
   *
   * Named rather than confirmed. "設定済み" was true of a code pointing at the
   * production worker, at a development server on this machine, and at a worker
   * that had been replaced — three different situations wearing one green word,
   * and the only place the difference showed was a line inside a tab you had to
   * open. A broadcaster went live against a stale code and the viewers' button
   * said "not shooting right now"; nothing on the screen they were looking at
   * disagreed with it (報告 2026-08-30).
   *
   * This is the same mistake the gate made twice and the saving row nearly made
   * a third time: a control that answers "done or not" cannot show WHICH answer
   * was given (docs/plan.md draft 89 / 235, docs/look-tab-plan.md 未決7).
   */
  function ebsHost() {
    var raw = String(cfg.ebs || "");
    if (!raw) return "";
    // Written by hand into the Config panel, so it may not parse. Whatever is
    // there is better than nothing: the point is to be recognisable, not valid.
    try { return new URL(raw).host || raw; } catch (e) { return raw.replace(/^\w+:\/\//, ""); }
  }

  function renderRail() {
    // `failKey` is obs-ws.js's word for why there is no session — an i18n key,
    // empty while one is up or none has been tried. Read here rather than
    // written in from there because this runs on every repaint, including a
    // language change, and a row that recomputed itself from `identified` alone
    // put "not connected" back over the reason (docs/onboarding-plan.md §4.B).
    /* A locked store outranks the connection's own reason.
     *
     * With ciphertext that will not open, the password box is blank and OBS is
     * asked with nothing — so failKey lands on 「パスワードを入れてください」,
     * which is true and useless: it describes the symptom of a saved password
     * this profile can no longer read, and it reads as though nothing was ever
     * saved. Said here rather than only in the log, because the log is behind a
     * button and this is the row the broadcaster is already looking at
     * (docs/onboarding-plan.md §2.D). */
    var lockedOut = secretState === "locked" && !identified;
    setRailState("rObsSt",
      identified ? t("st.ok") : t(lockedOut ? "st.secret.locked" : (failKey || "st.idle")),
      identified);
    // Where it points, not that it points. The green still says the three
    // values are present; the words now say which three.
    var paired = !!(cfg.ebs && cfg.ch && cfg.ebsToken);
    setRailState("rExtSt", paired ? ebsHost() : t("nav.todo"), paired,
                 paired ? t("pair.reads", { s: cfg.ebs, c: cfg.ch }) : "");
    setRailState("rLookSt", t("preset." + cfg.preset) + " · " + t("accent." + cfg.accent), false);
    /* The setting, not whether it is finished.
     *
     * The two rows above say "done" or "to do", because connecting and pairing
     * are jobs with an end. Choosing is not one: "do not keep" is an answer,
     * and painting it "not set" would repeat the mistake the gate made — where
     * a decision and an unfinished page looked the same (draft 89, draft 235).
     * So this row echoes the words the broadcaster picked, and stays neutral.
     * It is deliberately the same shape as the look row above it. */
    setRailState("rSaveSt", t(cfg.saveDir ? "save.dir" : "save.off"), false);
    renderConnected();
    renderReady();
  }

  /* How much of the OBS tab exists yet.
   *
   * Two of its three steps are conversations with a program that has not
   * answered: building the scenes, and deciding when the shutter works. Every
   * control in them is disabled or empty until it does, so the first screen was
   * mostly explanations of things that could not be pressed — 891 characters,
   * nine fields, five dead buttons (docs/onboarding-plan.md §2.B).
   *
   * The three connection fields fold away with them. They are 127.0.0.1 and
   * 4455 for almost everyone, and the password cannot be the one left showing:
   * a broadcaster who turned authentication off in OBS has no password, so
   * "show the password, fold the rest" is a screen built for half the audience
   * (未決3). What is left is the rail and one button.
   *
   * WHEN THE FOLD OPENS ITSELF. `failKey` already knows: a missing or a wrong
   * password is a question about a field in there, and an OBS that is not
   * running is not — that one is answered in OBS, and opening a box of settings
   * would be pointing at the wrong place. Reading failKey rather than listing
   * the states that should open it means a state added later does not silently
   * join the wrong side.
   */
  var FOLD_OPENING = { "st.needpw": 1, "st.authfail": 1 };
  function renderConnected() {
    $("stepBuild").hidden = !identified;
    $("stepGate").hidden = !identified;
    // Settled once there is a session; the button beneath it turns into
    // Disconnect, and the address is not the question any more.
    if (identified) el.dConn.open = false;
    else if (FOLD_OPENING[failKey]) el.dConn.open = true;
  }

  function showPane(name) {
    var panes = { obs: "paneObs", ext: "paneExt", look: "paneLook", save: "paneSave" };
    if (!panes[name]) name = "obs";
    Object.keys(panes).forEach(function (k) { $(panes[k]).hidden = k !== name; });
    Array.prototype.forEach.call(el.rail.querySelectorAll(".railBtn"), function (b) {
      var on = b.getAttribute("data-pane") === name;
      b.setAttribute("aria-selected", String(on));
      // One stop for the whole set, not one per tab.
      //
      // role="tab" is a promise about how the thing is operated, and the rail
      // was only keeping half of it: a screen reader announced four tabs while
      // Tab walked through all four and the arrow keys did nothing. Splitting
      // the pane made that four rows instead of three, so it is fixed here
      // rather than left to grow.
      b.tabIndex = on ? 0 : -1;
    });
    // Stamped so the stylesheet can widen one tab without a second list of
    // which tabs exist. The look tab is the only one that uses it today.
    document.querySelector(".pane").dataset.pane = name;
    ui.pane = name;
    saveUi();
    // Built on the first visit rather than at boot: it is a whole second copy
    // of the overlay, and a broadcaster who never opens this tab should not be
    // made to load one.
    if (name === "look") startSample();
    // The column the sample sits in only gets its width once this tab is the
    // one on screen, so the scale is taken after the switch, not before it.
    fitSample();
    window.scrollTo(0, 0);
  }

  /* The header's real height, published to the CSS.
   *
   * The rail column sticks under the header and is exactly as tall as what is
   * left of the screen, so both numbers are this one. It is measured rather
   * than written down because the header wraps: on a narrow window it becomes
   * two rows, and a constant would leave the column hanging a row too low with
   * its write button off the bottom edge. */
  function measureHeader() {
    var h = Math.round(document.querySelector(".top").getBoundingClientRect().height);
    if (h > 0) document.documentElement.style.setProperty("--topH", h + "px");
  }
  /* Which way the rail is lying, said out loud.
   *
   * aria-orientation was written into the markup as "vertical" and stayed
   * there, but the rail turns into a row of tabs on a narrow window — so a
   * screen reader was being told one thing while the screen showed the other.
   * The arrow keys take both axes either way, so nothing was unusable; what
   * was wrong was the description.
   *
   * Read off the layout rather than from the breakpoint. The 880px is written
   * once, in the stylesheet, and a copy of it here would be a second place to
   * forget (docs/refactor-plan.md §2.2). */
  function tellOrientation() {
    var row = getComputedStyle(el.rail).flexDirection.indexOf("row") === 0;
    el.rail.setAttribute("aria-orientation", row ? "horizontal" : "vertical");
  }

  function onResize() { measureHeader(); tellOrientation(); }
  onResize();
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(document.querySelector(".top"));
  else window.addEventListener("resize", onResize);
  // The header does not change height when the rail turns, so its observer
  // alone can miss the turn. This is the event that cannot.
  if (window.matchMedia) {
    var narrow = window.matchMedia("(max-width: 880px)");
    if (narrow.addEventListener) narrow.addEventListener("change", tellOrientation);
    else if (narrow.addListener) narrow.addListener(tellOrientation);
  }

  el.rail.addEventListener("click", function (e) {
    var b = e.target.closest(".railBtn");
    if (b) showPane(b.getAttribute("data-pane"));
  });

  /* Both axes, because the rail turns.
   *
   * aria-orientation says vertical, and it is — until the window is narrow
   * enough that the rail lies down as a row of tabs (the 880px rule in
   * shell.html). Whoever is reaching for an arrow key is looking at whichever
   * of those two it is, so both pairs move, and Home/End go to the ends. */
  var STEP = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
  el.rail.addEventListener("keydown", function (e) {
    var tabs = Array.prototype.slice.call(el.rail.querySelectorAll(".railBtn"));
    var at = tabs.indexOf(e.target.closest(".railBtn"));
    if (at === -1 || !tabs.length) return;
    var to;
    if (STEP[e.key]) to = (at + STEP[e.key] + tabs.length) % tabs.length;
    else if (e.key === "Home") to = 0;
    else if (e.key === "End") to = tabs.length - 1;
    else return;
    e.preventDefault();
    showPane(tabs[to].getAttribute("data-pane"));
    // After showPane, which is what sets the new stop: focusing first would
    // move onto an element still carrying tabindex="-1".
    tabs[to].focus();
  });

  /* ================= the log ================= */

  function log(msg, cls) {
    var line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = msg;
    el.log.appendChild(line);
    el.logWrap.scrollTop = el.logWrap.scrollHeight;
    // OBS mirrors browser-source console output into its own log file
    console.log("[SHUTTERPARTY] " + msg);
  }

  /* Opening and closing it, and telling the layout how much room it took.
   *
   * The panel is fixed at the bottom of the screen and the rail column's foot
   * sits flush with that same edge, so an open log used to cover both of the
   * foot's buttons: the one that closes it, and the primary write-to-OBS button
   * (実測 2026-08-26 — the log at y531-805, the buttons at y718-746 and
   * y754-793, elementFromPoint returning the log's own lines). Publishing the
   * height the way the header publishes --topH lets the column and the reading
   * pane stop where the panel starts, rather than underneath it.
   *
   * Measured rather than written down for the same reason --topH is: the panel
   * grows with its contents up to 34vh, so any constant is wrong until it is
   * full and wrong afterwards.
   */
  function setLogOpen(open) {
    el.logPanel.hidden = !open;
    el.logBtn.setAttribute("aria-expanded", String(open));
    var h = open ? Math.round(el.logPanel.getBoundingClientRect().height) : 0;
    document.documentElement.style.setProperty("--logH", h + "px");
    if (open) el.logWrap.scrollTop = el.logWrap.scrollHeight;
  }

  el.logBtn.addEventListener("click", function () { setLogOpen(el.logPanel.hidden); });
  el.logClose.addEventListener("click", function () {
    setLogOpen(false);
    // Back to the control that opened it, so a keyboard is not left on a button
    // that has just been hidden.
    el.logBtn.focus();
  });
  // The panel covers the bottom of the screen without taking focus, so the key
  // people try on anything that behaves like that should work.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !el.logPanel.hidden) { setLogOpen(false); el.logBtn.focus(); }
  });
  // It grows as lines arrive, and each line moves where the foot has to stop.
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      if (el.logPanel.hidden) return;
      document.documentElement.style.setProperty(
        "--logH", Math.round(el.logPanel.getBoundingClientRect().height) + "px");
    }).observe(el.logPanel);
  }

  /* Where the OBS connection says what it is doing.
   *
   * The OBS tab, not the header badge. Every caller of this is about the
   * socket to OBS — connecting, lost, authenticated — and the tab is the thing
   * on this page that is about OBS. The header answers a different question
   * (see renderReady), and answering it with this made the badge a second copy
   * of the tab that could never say anything the tab did not.
   *
   * `state` is kept in the signature: it is what tells the row whether this is
   * good news, and renderRail needs the same answer when it repaints. */
  var chipTimer = null;
  function status(state, text, sticky) {
    setRailState("rObsSt", text, state === "ok");
    renderReady();
    clearTimeout(chipTimer);
    if (!sticky) chipTimer = setTimeout(function () { renderRail(); }, 4000);
  }

  /**
   * Is this channel set up — all of it, not one part of it.
   *
   * OBS answered, the extension paired, and the settings actually written to
   * the browser source. Any one of those missing and pressing the button on a
   * stream does nothing, so "done" is the only useful thing a single badge at
   * the top of the page can say. The parts say which part in the rail.
   */
  function renderReady() {
    var paired = !!(cfg.ebs && cfg.ch && cfg.ebsToken);
    var done = identified && paired && dockState() === "clean";
    el.chip.dataset.state = done ? "ok" : "wait";
    el.chipText.textContent = t(done ? "hdr.ready" : "hdr.setup");
  }

  /* ================= a question this page has to ask =================

     Only ever about a name that is already taken. The two cases are not the
     same question and must not share an answer: a scene holds the broadcaster's
     own work and is never emptied, while a browser source we recognise holds
     nothing but a URL and overwriting it is the whole point. */

  var modalResolve = null;
  // Where the keyboard was before this opened, so it can be put back. A dialog
  // that drops focus on the body sends the next Tab to the top of the page —
  // and this one is asked in front of a button that erases everything.
  var modalReturnTo = null;

  function ask(title, body, choices) {
    return new Promise(function (resolve) {
      el.modalTitle.textContent = title;
      el.modalBody.textContent = body;
      el.modalBtns.textContent = "";
      choices.forEach(function (c) {
        var b = document.createElement("button");
        b.textContent = t(c.label);
        if (c.primary) b.className = "primary";
        b.addEventListener("click", function () { closeAsk(c.value); });
        el.modalBtns.appendChild(b);
      });
      modalResolve = resolve;
      modalReturnTo = document.activeElement;
      el.modal.hidden = false;
      var first = el.modalBtns.querySelector("button.primary") || el.modalBtns.firstChild;
      if (first) first.focus();
    });
  }

  function closeAsk(value) {
    el.modal.hidden = true;
    var back = modalReturnTo;
    modalReturnTo = null;
    var r = modalResolve;
    modalResolve = null;
    // Back to the control that asked, before the promise settles: whoever is
    // waiting on it may redraw the page, and focus has to land somewhere real
    // first.
    if (back && back.focus && document.contains(back)) back.focus();
    if (r) r(value);
  }

  document.addEventListener("keydown", function (e) {
    if (!modalResolve) return;
    if (e.key === "Escape") { closeAsk("cancel"); return; }
    /* Tab stays inside.
     *
     * The dialog says aria-modal, which is a promise to a screen reader that
     * the rest of the page is not there. Without this, Tab walked straight out
     * of it into the page behind — and the page behind, at the moment this
     * dialog is up, still has the button that erases everything on it. Two
     * buttons is a small ring, so the ends simply meet. */
    if (e.key !== "Tab") return;

    if (!btns.length) return;
    var first = btns[0];
    var last = btns[btns.length - 1];
    var here = document.activeElement;
    if (!el.modal.contains(here)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && here === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && here === last) { e.preventDefault(); first.focus(); }
  });

  /* ================= obs-websocket =================

     One client, two pages. The overlay photographs a scene and tells the EBS
     whether it can; the setup page reads a form and redraws itself. Everything
     else — the handshake, the SHA-256 challenge, matching a response to the
     request that asked for it, the backoff — is the same protocol answered the
     same way, and it was written out twice.

     The two copies had already drifted. 実測 2026-08-26: the overlay's
     teardown() rejects its pending requests, and the setup page's did not, so a
     disconnect there left them to time out ten seconds later — against whatever
     connection existed by then. Nothing errors; a scene list just arrives empty
     for a session that is connected and fine.

     A check could not have caught it. The two are legitimately different
     wherever the page's own behaviour differs, so comparing them either fails
     always or is loosened until it means nothing (docs/refactor-plan.md
     Stage 0). The difference has to stop existing instead.

     WHAT EACH PAGE STILL OWNS, as eight functions this file calls and neither
     defines. They are declarations in the same scope, so order does not matter:

       obsEvents()            which obs-websocket event categories to subscribe
                              to. The overlay watches the program scene and the
                              stream state; the setup page watches nothing.
       obsBeforeConnect()     last chance to decide where to connect. The setup
                              page reads its form into cfg here.
       obsSaying(url)         how this page announces the attempt in its log.
       obsNoPassword()        what to do when OBS asks for one and there is
                              none. The setup page can ask; the overlay cannot
                              — it has no UI, and the password lives elsewhere.
       obsOnEvent(m)          a subscribed event arrived (op 5).
       obsOnClosed()          the socket closed, identified already cleared.
       obsOnIdentified()      authenticated, and this page may start work.
       obsOnDisconnect()      a deliberate disconnect, sockets already down.

     WHAT EACH PAGE READS OUT OF HERE. Both parts end up in the same closure, so
     these are plain variables rather than getters — `identified` was already
     being read this way by the setup page's rail:

       identified             is there an authenticated session right now.
       failKey                why there is not, as an i18n KEY, or "" when the
                              socket is up or was never tried. A key and not a
                              sentence because the page is repainted whole on a
                              language change, and a stored sentence would come
                              back in the language it was written in.

     Everything below this line is the protocol. If you are changing it for one
     page, you are changing it for both — which is the point. */

  function b64(bytes) {
    var s = "";
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }

  function sha256b64(str) {
    return crypto.subtle
      .digest("SHA-256", new TextEncoder().encode(str))
      .then(function (buf) { return b64(new Uint8Array(buf)); });
  }

  var ws = null;
  var identified = false;
  var reqSeq = 0;
  var waiting = {};
  var retry = 0;
  var manualClose = false;
  /* Why the connection is not up, as an i18n key.
   *
   * The reason existed before this variable did — it was written to the log and
   * nowhere else, and the log has to be opened by pressing a button. What the
   * screen showed was the generic "not connected", which is the one thing the
   * broadcaster could already see (docs/onboarding-plan.md §2.D).
   *
   * It is state rather than an argument to status() because a single write does
   * not survive: obsOnClosed() repaints the rail, and so does every language
   * change, and both of those recompute the row from `identified` alone. The
   * needpw path made that visible — it closes the socket itself, so its own
   * status() call was overwritten by onclose a tick later (実測). Anything that
   * repaints now reads this. */
  var failKey = "";
  var retryTimer = null;
  // Bumped by every connect and disconnect, so a timer that was already in
  // flight when the user reconnected by hand can tell that it is stale.
  var connectGen = 0;

  function request(type, data) {
    return new Promise(function (resolve, reject) {
      if (!identified) return reject(new Error("not connected"));
      var id = "r" + ++reqSeq;
      waiting[id] = { resolve: resolve, reject: reject };
      ws.send(JSON.stringify({ op: 6, d: { requestType: type, requestId: id, requestData: data || {} } }));
      setTimeout(function () {
        if (waiting[id]) { delete waiting[id]; reject(new Error(type + " timed out")); }
      }, 10000);
    });
  }

  /* The handshake has a deadline, the same way a request does.
     op 6 requests time out after ten seconds, but the op 0 → op 1 → op 2 that
     comes before them had none: a socket that OPENS and then says nothing —
     OBS accepted the connection and never sent Hello, or never answered
     Identify — never fires onclose, so the backoff below never runs and the
     page sits on "connecting" for as long as the broadcast lasts. From here it
     looks exactly like a slow start, so it is given the same ten seconds and
     then closed, which hands it to onclose and the backoff that already exists
     (Codex 2026-09-15 round 7). OBS stalled on the graphics lock is one way in,
     which is the same failure the capture window guards against. */
  var handshakeTimer = null;
  function cancelHandshake() { clearTimeout(handshakeTimer); handshakeTimer = null; }

  function teardown() {
    cancelHandshake();
    if (!ws) return;
    ws.onopen = ws.onclose = ws.onerror = ws.onmessage = null;
    try { ws.close(); } catch (e) {}
    ws = null;
    // Nothing is coming back for these. Left alone they answer ten seconds
    // later, by which time the page can be connected again — and a failure
    // handler that reaches for another photograph would take it against
    // whatever is on air now rather than what the press was aimed at. The same
    // ten seconds on the setup page ended with a scene list arriving empty for
    // a connection that was healthy: the copy that did not do this is the
    // reason there is now only one copy.
    for (var id in waiting) {
      var w = waiting[id];
      delete waiting[id];
      w.reject(new Error("disconnected"));
    }
  }

  function connect() {
    teardown();
    cancelRetry();
    connectGen++;
    manualClose = false;
    identified = false;
    failKey = "";

    obsBeforeConnect();

    var url = "ws://" + cfg.host + ":" + cfg.port;
    status("wait", t("st.connecting"), true);
    obsSaying(url);

    var sock;
    try {
      sock = new WebSocket(url);
      ws = sock;
    } catch (e) {
      failKey = "st.failed";
      log(t("log.failed"), "bad");
      status("bad", t(failKey), true);
      scheduleRetry();
      return;
    }

    sock.onopen = function () {
      if (sock !== ws) return;
      retry = 0;
      // The clock on the handshake starts when the socket opens, not when it was
      // asked for: until then the failure is a refused connection, which onclose
      // already reports. Tied to the generation, like the retry below, so one
      // armed before the broadcaster reconnected by hand cannot close the new one.
      var gen = connectGen;
      cancelHandshake();
      handshakeTimer = setTimeout(function () {
        handshakeTimer = null;
        if (gen !== connectGen || identified || sock !== ws) return;
        // No word of its own: closing hands this to onclose, which already says
        // what a connection that did not come up says, in twelve languages.
        try { sock.close(); } catch (e) { /* onclose carries it on */ }
      }, 10000);
    };

    sock.onclose = function (ev) {
      if (sock !== ws) return; // a socket we already replaced
      var wasIdentified = identified;
      identified = false;

      /* Decided BEFORE obsOnClosed(), because that hook repaints the page and
       * the repaint reads failKey. A deliberate close keeps whatever reason
       * asked for it — the needpw path sets one, pressing Disconnect does not.
       *
       * `wasIdentified` is what separates the last two. Saying "dropped —
       * reconnecting" to somebody whose OBS was never running is a lie about
       * the one thing they need to fix, and it was the FIRST thing the page
       * said on a fresh machine: new WebSocket() does not throw when nothing is
       * listening, so an unstarted OBS arrives here rather than at the catch
       * above (docs/onboarding-plan.md §2.D). */
      if (!manualClose) {
        if (!wasIdentified && ev.code === 4009) failKey = "st.authfail";
        else if (!wasIdentified) failKey = "st.failed";
        else failKey = "st.lost";
      }

      obsOnClosed();
      status("bad", t(failKey || "st.idle"), true);

      if (manualClose) return;
      if (failKey === "st.authfail") {
        // obs-websocket closes with 4009 on a bad auth
        log(t("log.authfail"), "bad");
        return; // a wrong password will not fix itself; do not spin
      }
      if (!wasIdentified) log(t("log.failed"), "bad");
      scheduleRetry();
    };

    sock.onerror = function () { /* onclose carries the detail */ };

    sock.onmessage = function (ev) {
      if (sock !== ws) return;
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }

      if (m.op === 0) return onHello(sock, m.d);
      if (m.op === 2) return onIdentified();
      // Only what obsEvents() asked for arrives here. Anything else is not
      // subscribed to and is ignored rather than guessed at.
      if (m.op === 5) return obsOnEvent(m);
      if (m.op === 7) {
        var w = waiting[m.d.requestId];
        if (!w) return;
        delete waiting[m.d.requestId];
        var st = m.d.requestStatus || {};
        if (st.result) w.resolve(m.d.responseData || {});
        else w.reject(new Error(st.comment || st.code || "request failed"));
      }
    };
  }

  function onHello(sock, d) {
    log(t("log.hello", { v: d.obsWebSocketVersion || "?" }), "ok");
    var a = d.authentication;
    if (!a) {
      log(t("log.noauth"), "warn");
      sock.send(JSON.stringify({ op: 1, d: { rpcVersion: d.rpcVersion, eventSubscriptions: obsEvents() } }));
      return;
    }
    if (!cfg.pw) {
      // Closed by us, so onclose takes the manualClose branch — and that branch
      // used to write "not connected" over this. It reads failKey now.
      failKey = "st.needpw";
      log(t("log.needpw"), "bad");
      manualClose = true;
      try { sock.close(); } catch (e) {}
      obsNoPassword();
      return;
    }
    // Hashing is asynchronous, and the socket can be replaced while it runs.
    // Sending this challenge's answer to a socket that never saw the challenge
    // would fail authentication on a connection that was otherwise fine.
    sha256b64(cfg.pw + a.salt)
      .then(function (secret) { return sha256b64(secret + a.challenge); })
      .then(function (auth) {
        if (sock !== ws) return;
        sock.send(JSON.stringify({
          op: 1,
          d: { rpcVersion: d.rpcVersion, authentication: auth, eventSubscriptions: obsEvents() }
        }));
      })
      .catch(function (e) {
        if (sock !== ws) return;
        failKey = "st.failed";
        log(t("log.reqfail", { m: e.message }), "bad");
        status("bad", t(failKey), true);
        try { sock.close(); } catch (e2) {}
      });

  function onIdentified() {
    identified = true;
    retry = 0;
    failKey = "";
    cancelHandshake();
    cancelRetry();
    log(t("log.auth"), "ok");
    obsOnIdentified();
  }

  function disconnect(silent) {
    manualClose = true;
    teardown();
    cancelRetry();
    connectGen++;
    identified = false;
    // Asked for. There is no reason to show, and the previous one is stale:
    // teardown() nulls the handlers, so onclose never runs to clear it.
    failKey = "";
    obsOnDisconnect();
    if (!silent) status("bad", t("st.idle"), true);
  }

  function cancelRetry() {
    clearTimeout(retryTimer);
    retryTimer = null;
  }

  function scheduleRetry() {
    if (manualClose) return;
    retry = Math.min(retry + 1, 6);
    var wait = Math.min(1000 * Math.pow(1.8, retry), 30000);
    var gen = connectGen;
    cancelRetry();
    // Without the generation check, a retry armed before the broadcaster hit
    // connect by hand would fire afterwards and tear the healthy socket down.
    retryTimer = setTimeout(function () {
      retryTimer = null;
      if (manualClose || gen !== connectGen) return;
      connect();
    }, wait);
  }
  /* ================= what this page does with a socket =================

     The eight functions src/shared/parts/obs-ws.js calls and does not define.
     This page has a form and a screen, so most of them are about redrawing:
     the connect button says the opposite of what it is, the rail shows how far
     the setup has got, and the dock shows whether OBS is carrying the settings
     that are on screen. Every one of those is wrong the moment the socket
     changes state, so every one of them is redrawn here rather than polled. */

  function obsEvents() {
    // None. This page asks OBS questions and gets answers; it never needs to be
    // told about a change it did not ask for, and a subscription it ignores is
    // a message it has to be careful not to mistake for a response.
    return 0;
  }

  /**
   * The form is the address.
   *
   * Read here rather than when the field changes: the value that matters is the
   * one on screen at the moment connect was pressed, and saving it here means a
   * broadcaster who typed the right port and then reloaded still has it.
   */
  function obsBeforeConnect() {
    cfg.host = el.host.value.trim() || "127.0.0.1";
    cfg.port = el.port.value.trim() || "4455";
    cfg.pw = el.pw.value;
    saveCfg(cfg);
    // ...and into the encrypted store, which is the only place it is kept.
    saveSecrets();
  }

  function obsSaying(url) { log(t("log.connecting", { u: url })); }

  /** This page is where a password can be typed, so it asks for one.
   *
   * The fold is opened here rather than left to renderConnected(): this runs
   * from onHello, and the repaint that would have opened it does not happen
   * until onclose a tick later. focus() into a closed <details> is a no-op —
   * the content is not rendered — so the cursor would have gone nowhere and the
   * field it was pointing at would still have been out of sight. */
  function obsNoPassword() {
    showPane("obs");
    el.dConn.open = true;
    el.pw.focus();
  }

  // Nothing is subscribed to, so nothing arrives. Kept as a function rather
  // than left out: obsEvents() is one edit away from returning something, and a
  // missing handler would be a crash at exactly the moment somebody is trying
  // to find out what OBS is saying.
  function obsOnEvent(m) {}

  function obsOnClosed() {
    el.shot.disabled = true;
    el.connect.textContent = t("connect");
    renderRail();
    renderBuildState();
    renderDock();
  }

  function obsOnIdentified() {
    status("ok", t("st.ok"), true);
    el.connect.textContent = t("disconnect");
    renderRail();
    suggestSaveDir();
    loadScenes().then(scanTargets);
  }

  function obsOnDisconnect() {
    el.connect.textContent = t("connect");
    renderRail();
    renderBuildState();
    renderDock();
  }
  /* ================= what OBS has =================

     Only scenes are ever photographed. That is a safety property, not a
     simplification.

     SaveSourceScreenshot takes a SOURCE, and a source knows nothing about the
     scene it sits in. Everything a broadcaster does to keep something off
     stream — cropping in the scene item's transform, laying another source over
     it, shrinking it into a bounding box — lives in the scene, and none of it
     reaches a photo of the source. All three measured (docs/plan.md §5.2); only
     a Crop/Pad filter, which belongs to the source, survives.

     The subject here is a camera pointed at somebody's room, so what leaks is
     their home, into a file that is saved, posted and reposted. Photographing
     the scene is right by construction — what the scene composites IS the
     photo, whatever was done to build it. */

  var scenes = [];         // every scene name OBS knows
  var inputNames = [];     // every input name, so a new one cannot collide
  var targets = [];        // { name, url, isLocal, match, isBar, isCard, isVertical }
  var target = "";         // the overlay: photographs and effects
  var barTarget = "";      // the goal bar, which OBS places on its own
  var verticalTarget = ""; // the same overlay, sized for a 9:16 scene

  function loadScenes() {
    return request("GetSceneList").catch(function () { return { scenes: [] }; })
      .then(function (res) {
        scenes = (res.scenes || []).map(function (x) { return x.sceneName; }).sort(function (a, b) {
          return a.localeCompare(b);
        });
        // A capture target chosen before the scene-only rule existed may well
        // be a source. Say why it went, and leave it empty rather than picking
        // something plausible: whatever it used to photograph may have been
        // cropped for a reason.
        if (cfg.src && scenes.indexOf(cfg.src) === -1) {
          log(t("log.wasSource", { n: cfg.src }), "warn");
          cfg.src = "";
          saveCfg(cfg);
        }
        renderGate();
        log(t("log.scenes", { n: scenes.length }), "ok");
        return renderHostScenes();
      })
      .then(function () {
        renderBuildState();
        if (cfg.src) checkCaptureScene(cfg.src);
        return request("GetInputList").then(function (d) {
          inputNames = (d.inputs || []).map(function (i) { return i.inputName; });
        }).catch(function () {});
      });
  }

  /** The build stamp riding on a source's URL, or "" for one written before it. */
  function urlBuild(u) {
    var m = /[?&]v=([^&#]*)/.exec(String(u || ""));
    return m ? decodeURIComponent(m[1]) : "";
  }

  /**
   * The settings riding on a source's URL, or null when it carries none.
   *
   * What OBS is holding right now, read back rather than remembered. This page
   * is the only thing that writes those URLs, but it is not the only copy of
   * this page: opened from a different address it is a different origin with a
   * different memory, and it starts knowing nothing while OBS is still working
   * perfectly (measured 2026-09-03). The URL is the one record that survives
   * that, so it is the one worth asking before overwriting it.
   *
   * Split on "&" the same way the overlay reads it: a bar's fragment is
   * "c=…&bar", and a folder or scene name inside the JSON can spell anything.

  function urlConfig(u) {
    var parts = String(u || "").split("#").slice(1).join("#").split("&");
    for (var i = 0; i < parts.length; i++) {

      try { return JSON.parse(decodeURIComponent(parts[i].slice(2))); } catch (e) { return null; }
    }
    return null;

  /* ---- the same file, in one of its other modes ----

     The overlay is not the only browser source running overlay/index.html. The
     bar is that file with #bar, and the framed-save card is that file with
     #card — and the card is created by the OVERLAY, named "do not delete", so
     every broadcaster who has ever saved a photo has one sitting in OBS.

     Neither is somewhere to write settings to, and mistaking one for the
     overlay is not cosmetic: the target is only chosen when exactly ONE
     candidate matches, so a single unrecognised mode leaves the page with
     nowhere to write while OBS sits there connected. That is what happened —
     the card was matching, and the dock said "build it in OBS first" to
     broadcasters who had already built it (実測 2026-08-30).

     rather than by pattern: `card` and `card=1` are the same flag, and only one
     of them looked like one here. */
  function hashFlagIn(v, name) {
    var str = String(v || "");
    var at = str.indexOf("#");
    if (at === -1) return false;
    return str.slice(at + 1).split("&").some(function (p) {
      return p === name || p === name + "=1";
    });

    return hashFlagIn(s.url, name) || hashFlagIn(s.local_file, name);
  }

  /** The same file in bar mode: the flag is the only difference in the URL. */
  function looksLikeBar(s) {
    return hasMode(s, "bar");
  }

  /** ...and in card mode, which the overlay makes and writes to itself. */
  function looksLikeCard(s) {
    return hasMode(s, "card");
  }

  /** ...and the one for the vertical scene, which behaves identically and is
   *  marked only so this page can tell it from the landscape one. */
  function looksLikeVertical(s) {
    return hasMode(s, "vertical");
  }

  /** Does this browser source point at our overlay file? */
  function looksLikeOverlay(s) {
    var where = String(s.local_file || "") + " " + String(s.url || "");
    return /overlay[\/\\%]/i.test(where) && /index\.html/i.test(where);
  }

  function scanTargets() {
    if (!identified) return Promise.resolve();
    return request("GetInputList", { inputKind: "browser_source" })
      .then(function (d) {
        var names = (d.inputs || []).map(function (i) { return i.inputName; });
        return Promise.all(names.map(function (name) {
          return request("GetInputSettings", { inputName: name })
            .then(function (r) {
              var s = r.inputSettings || {};
              return { name: name, url: s.url || s.local_file || "", isLocal: !!s.is_local_file, match: looksLikeOverlay(s), isBar: looksLikeBar(s), isCard: looksLikeCard(s), isVertical: looksLikeVertical(s) };
            })
            .catch(function () { return { name: name, url: "", isLocal: false, match: false, isBar: false, isCard: false, isVertical: false }; });
        }));
      })
      .then(function (rows) {
        targets = rows;
        // The bar, the card and the vertical source are the same file with a
        // flag, so they match too — and counted here, a broadcaster who has
        // them looks like a broadcaster with none preselected. The vertical
        // one is the reason the flag exists at all: it is the same URL and the
        // same settings as the landscape source, and without a mark on it the
        // page would find two candidates and settle on neither.
        var hits = rows.filter(function (r) { return r.match && !r.isBar && !r.isCard && !r.isVertical; });
        var bars = rows.filter(function (r) { return r.match && r.isBar; });
        var talls = rows.filter(function (r) { return r.match && r.isVertical; });
        barTarget = bars.length === 1 ? bars[0].name : "";
        verticalTarget = talls.length === 1 ? talls[0].name : "";
        if (hits.length === 1) target = hits[0].name;
        else if (targets.every(function (r) { return r.name !== target; })) target = "";
        renderBuildState();
        renderDock();
        log(t("log.scan", { n: rows.length }), rows.length ? "ok" : "warn");
      })
      .catch(function (e) { log(t("log.reqfail", { m: e.message }), "bad"); });
  }

  /**
   * A browser source running the overlay is the one thing that must never be
   * photographed, or put in a scene that is. Capturing a scene returns what it
   * composites, so the overlay's own flash would come back in the picture.

  function selfId() {

    return href.split("?")[0].split("#")[0].replace(/\\/g, "/");
  }

    for (var i = 0; i < candidates.length; i++) {

      if (!v) continue;
      var norm = decodeURIComponent(String(v)).toLowerCase().split("?")[0].split("#")[0].replace(/\\/g, "/");
      if (!norm) continue;

      if (me.indexOf(norm) !== -1 || norm.indexOf(me.replace(/^file:\/+/, "")) !== -1) return true;
    }
    return false;
  }

  // One level of nesting is checked: a scene item that is itself a scene.
  function sceneContainsSelf(sceneName, depth) {
    return request("GetSceneItemList", { sceneName: sceneName }).then(function (d) {
      var items = d.sceneItems || [];
      var browsers = items.filter(function (i) { return i.inputKind === "browser_source"; });
      var nested = (depth || 0) < 1
        ? items.filter(function (i) { return i.isGroup || i.sourceType === "OBS_SOURCE_TYPE_SCENE"; })
        : [];

      return Promise.all(browsers.map(function (i) {
        return request("GetInputSettings", { inputName: i.sourceName })
          .then(function (r) { return looksLikeSelf(r.inputSettings || {}); })
          .catch(function () { return false; });

        if (!nested.length) return false;
        return Promise.all(nested.map(function (i) {
          return sceneContainsSelf(i.sourceName, (depth || 0) + 1).catch(function () { return false; });
        })).then(function (deep) { return deep.some(Boolean); });

  }

  /**
   * What a photograph of this scene would actually contain.
   *
   * The gate decides WHEN the shutter works; this is WHAT it takes, and it is
   * the one that produces accidents. Naming the contents is the only way this
   * page can show that before it happens rather than after.
   *
   * Hidden items are left out: a scene renders what is enabled, so what is
   * switched off in OBS is not in the picture either.
   */
  function sceneContents(sceneName, depth) {
    return request("GetSceneItemList", { sceneName: sceneName }).then(function (d) {
      var items = (d.sceneItems || []).filter(function (i) {
        return i.sceneItemEnabled !== false;
      });
      var out = [];
      var deeper = [];
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var isScene = it.isGroup || it.sourceType === "OBS_SOURCE_TYPE_SCENE";
        if (isScene && (depth || 0) < 1) deeper.push(it.sourceName);
        else out.push(it.sourceName);
      }
      if (!deeper.length) return out;
      return Promise.all(deeper.map(function (n) {
        return sceneContents(n, (depth || 0) + 1).catch(function () { return [n]; });
      })).then(function (lists) {
        return out.concat.apply(out, lists);
      });
    });
  }

  function checkCaptureScene(name) {
    el.notice.hidden = true;
    el.contents.hidden = true;
    if (!name || !identified || scenes.indexOf(name) === -1) return;
    sceneContainsSelf(name, 0).then(function (hit) {
      if (cfg.src !== name) return;                  // the choice moved on
      if (hit) {
        el.notice.textContent = t("warn.self");
        el.notice.hidden = false;
        log(t("log.selfinscene", { n: name }), "warn");
      } else {
        log(t("log.sceneok", { n: name }), "ok");
      }
    }).then(function () {
      // Named, not counted. "7 sources" tells a broadcaster nothing; the name
      // of the one they forgot tells them everything.
      return sceneContents(name, 0);
    }).then(function (list) {
      if (cfg.src !== name || !list) return;
      el.contents.textContent = list.length
        ? t("src.contents", { n: list.join(", ") })
        : t("src.empty");
      el.contents.hidden = false;
    }).catch(function () { /* older obs-websocket: skip the check */ });
  }

  /* ================= building the pieces in OBS =================

     One button. Choosing which existing scene to photograph was a way to point
     the camera at the live scene by mistake, and choosing which existing
     browser source to write to was a way to overwrite something else — so
     neither choice is offered any more. What is offered instead is the names,
     folded away, and a question whenever one of them is already taken. */

  var building = false;

  function capNameWanted() { return el.capName.value.trim() || t("capDefault"); }
  function srcNameWanted() { return el.newSrcName.value.trim() || t("newSrcDefault"); }

  /** "X", then "X 2", "X 3" — the first one nothing else answers to. */
  function uniqueName(base, taken) {
    if (taken.indexOf(base) === -1) return base;
    for (var i = 2; i < 200; i++) {
      if (taken.indexOf(base + " " + i) === -1) return base + " " + i;
    }
    return base + " " + Date.now();
  }

  /**
   * Settle on a capture scene.
   *
   * A scene that already exists is never emptied and never rebuilt. It holds
   * the broadcaster's own work, and the only thing this page wants from it is
   * its name — so the question is whether to point the camera at it, not
   * whether to destroy it.
   */
  function resolveCaptureScene() {
    var want = capNameWanted();
    if (scenes.indexOf(want) === -1) {
      return request("CreateScene", { sceneName: want }).then(function () {
        log(t("log.made", { n: want }), "ok");
        log(t("log.madeNext", { n: want }), "warn");
        return want;
      });
    }
    return ask(t("dlg.title"), t("dlg.scene", { n: want }), [
      { label: "dlg.cancel", value: "cancel" },
      { label: "dlg.rename", value: "rename" },
      { label: "dlg.use", value: "use", primary: true }
    ]).then(function (answer) {
      if (answer === "cancel") return null;
      if (answer === "use") { log(t("log.reuse", { n: want }), "ok"); return want; }
      var fresh = uniqueName(want, scenes);
      return request("CreateScene", { sceneName: fresh }).then(function () {
        log(t("log.renamed", { a: want, b: fresh }), "warn");
        el.capName.value = fresh;
        return fresh;
      });
    });
  }

  /**
   * Settle on a name for the overlay's browser source.
   *
   * Overwriting one of ours is the ordinary case and needs no question — it is
   * how a returning broadcaster gets this release's settings. Overwriting
   * something that is not ours is the case that needs asking, and the answer
   * changes only where that source points; nothing about it is destroyed.
   */
  function resolveOverlayName() {
    var want = srcNameWanted();
    var existing = targets.filter(function (r) { return r.name === want; })[0];
    var taken = inputNames.indexOf(want) !== -1;
    if (!taken) return Promise.resolve({ name: want, overwrite: false });
    // Already ours, already pointing at the overlay: this is the same setup
    // being written again, which is exactly what the button is for.
    if (existing && existing.match && !existing.isBar && !existing.isCard) {
      return Promise.resolve({ name: want, overwrite: true });
    }
    return ask(t("dlg.title"), t("dlg.src", { n: want }), [
      { label: "dlg.cancel", value: "cancel" },
      { label: "dlg.rename", value: "rename" },
      { label: "dlg.overwrite", value: "overwrite", primary: true }
    ]).then(function (answer) {
      if (answer === "cancel") return null;
      if (answer === "overwrite") {
        log(t("log.overwrote", { n: want }), "warn");
        return { name: want, overwrite: true };
      }
      var fresh = uniqueName(want, inputNames);
      log(t("log.renamed", { a: want, b: fresh }), "warn");
      el.newSrcName.value = fresh;
      return { name: fresh, overwrite: false };
    });
  }

  /**
   * Settle on a name for the bar's browser source, by the same rule.
   *
   * The bar used to skip the question: a name already in use was overwritten
   * on sight. But inputNames is every input OBS has, of every kind, so the
   * name could belong to a text source or a camera — and a browser source's
   * settings were then written into it without a word (Codex 巡回 2026-09-13).
   * Only a bar of ours is the ordinary case; anything else gets the question
   * the overlay's name gets.
   */
  /* The source for a vertical scene.
   *
   * WHY THIS PAGE MAKES IT. A broadcaster who streams dual format builds a
   * second scene at 1080x1920 (docs/vertical-plan.md §2), and the overlay
   * belongs in it — it is the same page, and it lays itself out for whatever
   * frame it is given. What it cannot do is be given the wrong one: OBS's
   * browser source takes its size from its own properties, and dragging the
   * source bigger on the canvas is a transform the page never sees. Stretched
   * that way it draws the landscape layout squeezed into a tall box. So the
   * one number that matters is one this page can simply set.
   *
   * WHY IT LANDS IN THE NORMAL SCENE, DISABLED. The vertical canvas belongs to
   * a plugin — Aitum Vertical — and obs-websocket cannot reach it: of the 21
   * requests the plugin registers, every one switches scenes, reads status or
   * starts a stream, and none creates a source (confirmed against
   * Aitum/obs-vertical-canvas, 2026-09-14). A source, though, is a source:
   * made here in a normal scene, it is in OBS's input list, and the plugin's
   * own "+" adds an existing one to a vertical scene. That is the published
   * route. It arrives switched off so it does not draw a 1080x1920 rectangle
   * across the landscape scene while it waits to be picked up.
   *
   * SILENT. reroute false, like the bar: the landscape source already carries
   * the shutter into OBS, and a second one routed the same way would put it in
   * twice. Whether the two make any sound together once BOTH canvases are live
   * is not something this repository can measure (§5.2) — but nothing is
   * routed into the mix from here, so the broadcast cannot double. */
  function makeVertical(scene, baseName) {
    // English on every channel, for the reason the bar's suffix is.
    var want = baseName + " vertical";
    var existing = targets.filter(function (r) { return r.name === want; })[0];
    var taken = inputNames.indexOf(want) !== -1;
    if (taken && !(existing && existing.match && existing.isVertical)) {
