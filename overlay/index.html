  /**
   * Draw one slot into an element's skin, or leave the skin empty.
   *
   * Sized to the element as it is laid out right now, in device pixels, and
   * drawn once. A tiled slot (the papers) repeats from the top-left, scaled so
   * that a tile at the slot's ceiling width covers the element once — the
   * print on the wall and the card in the folder then wear the same pattern
   * at their own sizes. An icon (a slot that must be transparent) is fitted
   * inside the box; everything else covers it. The element says which slot it
   * wears in data-skin, and the theme's own drawing (the SVG glyph, the glass)
   * is what shows when the attribute is absent.
   */
  function paintSkin(host, slot) {
    if (!host) return false;
    var img = packImage(slot);
    var c = skinOf(host);
    var w = host.clientWidth, h = host.clientHeight;
    if (!img || !(w > 0 && h > 0)) {
      c.width = 0;
      c.height = 0;
      host.removeAttribute("data-skin");
      return false;
    }
    var rule = THEME_PACK_RULES.slots[slot];
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    var ctx = c.getContext("2d");
    ctx.scale(dpr, dpr);
    var iw = img.naturalWidth, ih = img.naturalHeight;
    if (rule.tile) {
      var tw = w * iw / rule.w, th = tw * ih / iw;
      for (var y = 0; y < h; y += th) for (var x = 0; x < w; x += tw) ctx.drawImage(img, x, y, tw, th);
    } else {
      var k = rule.alpha ? Math.min(w / iw, h / ih) : Math.max(w / iw, h / ih);
      var dw = iw * k, dh = ih * k;
      ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
    }
    host.setAttribute("data-skin", slot);
    return true;
  }

  /**
   * The icons: the camera in three places, the stopwatch in one.
   *
   * One drawing of each glyph, in a <template>, and every box is filled from
   * it here — the banner's camera used to be cloned from the bar's once at
   * load, which meant a theme applied later reached one of them and not the
   * other (docs/theme-pack-plan.md §6). Painted all together, from the same
   * source, so the three cameras are always the same picture; the
   * invariants compare them.
   */
  var ICON_BOXES = [["cam", ".g-cam", "camGlyph"], ["clock", ".g-clock", "clockGlyph"]];

  function paintIcons() {
    // Whether the theme handed over a drawing of its own (--cam-glyph /
    // --clock-glyph, shell.html). Read from the root once per repaint and
    // marked on the box, because the swap needs `display` on the template's
    // svg and that is not a property a theme may write. A pack, when it has
    // one, still covers both.
    var root = getComputedStyle(document.documentElement);
    ICON_BOXES.forEach(function (row) {
      var tpl = document.getElementById(row[2]);
      var own = (root.getPropertyValue("--" + row[0] + "-glyph") || "").trim();
      var mine = !!own && own !== "none";
      var boxes = document.querySelectorAll(row[1]);
      for (var i = 0; i < boxes.length; i++) {
        if (!boxes[i].querySelector("svg")) boxes[i].appendChild(tpl.content.firstElementChild.cloneNode(true));
        if (mine) boxes[i].setAttribute("data-glyph", ""); else boxes[i].removeAttribute("data-glyph");
        paintSkin(boxes[i], row[0]);
      }
    });
  }

  /** The glass that is always on the page: the two tubes, the plate, the tray. */
  function paintGlass() {
    var tubes = document.querySelectorAll(".g-tube");
    for (var i = 0; i < tubes.length; i++) paintSkin(tubes[i], "tube");
    paintSkin(document.querySelector(".plate"), "plate");
    paintSkin(document.querySelector(".sheet-tray"), "tray");
  }

  /** A print for the contact sheet: the paper (skin), then the subject on it. */
  function printOf(subject) {
    var p = document.createElement("div");
    p.className = "print";
    skinOf(p);
    p.appendChild(subject);
    return p;
  }

  /** The nine papers and the tray under them, once the grid is laid out. */
  function paintSheet(grid, tray) {
    var prints = grid.children;
    for (var i = 0; i < prints.length; i++) paintSkin(prints[i], "sheet-paper");
    paintSkin(tray, "tray");
  }

  /** The three theme keys, for the card's fragment (docs/theme-pack-plan.md §5). */
  function themeHash() {
    return "&theme=" + encodeURIComponent(cfg.theme || "") +
      "&pack=" + encodeURIComponent(cfg.pack || "") +
      "&packSlots=" + encodeURIComponent(cfg.packSlots || "");
  }

  /* ================= card mode =================

     Loaded with #card, this file is not an overlay at all: it draws one saved
     photo, at the size of its own source, and stops. OBS captures that source
     to write the framed file — the only way a page can put a border, a name and
     a badge into something on disk, since it cannot write to disk itself
     (docs/plan.md §6).

     It runs before everything else and returns, so the card never opens a
     socket, never talks to OBS, and never draws an effect. The overlay hands it
     each new photo by rewriting the fragment; a fragment change does not reload
     a browser source (measured), so the redraw hangs off hashchange.

     The card must sit in a scene OBS is currently rendering, parked outside the
     canvas: a source that is hidden, or in a scene nobody is showing, is drawn
     once and then frozen (measured — see §6). */
  if (/(^|&)card(=1)?($|&)/.test(String(location.hash || "").replace(/^#/, ""))) {
    document.documentElement.setAttribute("data-card", "");

    var cEl = document.getElementById("card");
    var cImg = document.getElementById("cardImg");
    var cShot = document.getElementById("cardShot");
    var cCap = document.getElementById("cardCap");
    var cWho = document.getElementById("cardWho");
    var cWhen = document.getElementById("cardWhen");

    /**
     * The contact sheet, drawn for the file rather than for the stream.
     *
     * The pictures arrive as file:// addresses, which is the only shape they
     * can take: this page cannot be handed pixels, because a file:// page is
     * refused the pixels of a file:// image (measured, §6) — so the overlay
     * cannot turn them into data. Drawing them is allowed, and drawing is all
     * this needs.
     */
    /**
     * The theme and the pack, the same way the overlay takes them.
     *
     * Read out of the fragment the overlay wrote (themeHash), held to the
     * same rules by the same functions (05-theme-pack.js), and resolved to
     * the same folder — this is the same file, so themes/<name>/ is the same
     * place. `done` runs once the images have answered; painting waits for
     * it and for the subject, whichever comes last.
     */
    var applyCardTheme = function (q, done) {
      document.documentElement.setAttribute("data-theme", themeId(q.get("theme")));
      loadPack(packOf(q.get("pack"), q.get("packSlots")), done);
    };

    var drawSheet = function () {
      var q = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
      document.documentElement.setAttribute("data-sheet", "");
      document.documentElement.setAttribute("data-accent", q.get("accent") || "safelight");

      var box = null;
      var raw = (q.get("crop") || "").split(",");
      if (raw.length === 4) {
        var n = raw.map(Number);
        if (n.every(function (v) { return isFinite(v) && v >= 0; }) && n[2] > 0 && n[3] > 0) {
          box = { x: n[0], y: n[1], w: n[2], h: n[3] };
        }
      }

      var grid = document.getElementById("sheetGrid");
      grid.textContent = "";
      // Read straight out of the hash rather than through URLSearchParams.
      //
      // The addresses are escaped one at a time and then joined with "|", so
      // decoding the whole field before the split decodes each address twice —
      // and the second decode undoes exactly what fileUrl() went out of its way
      // to do. A folder named with a "?" arrives as "%3F", comes back as a real
      // "?", and the browser then reads the address as ending there: the sheet
      // draws the wrong file, or nothing. Split first, decode each once.
      var imgsField = "";
      var hashParts = String(location.hash || "").replace(/^#/, "").split("&");
      for (var hp = 0; hp < hashParts.length; hp++) {
        if (hashParts[hp].slice(0, 5) === "imgs=") { imgsField = hashParts[hp].slice(5); break; }
      }
      var imgs = imgsField.split("|").filter(Boolean);
      // The papers are painted when the nine pictures have their shape AND
      // the pack has answered: a paper drawn before the picture under it has
      // settled would be stretched to the print's final height.
      var waiting = imgs.length + 1;
      var tray = document.querySelector(".sheet-tray");
      var settled = function () { if (--waiting === 0) paintSheet(grid, tray); };
      for (var i = 0; i < imgs.length; i++) {
        (function (url) {
          var c = document.createElement("canvas");
          c.className = "subject";
          c.width = box ? Math.round(box.w) : 16;
          c.height = box ? Math.round(box.h) : 9;
          var im = new Image();
          im.onload = function () {
            var b = clampBox(box, im.naturalWidth, im.naturalHeight);
            if (b.w > 0 && b.h > 0) {
              c.width = Math.round(b.w);
              c.height = Math.round(b.h);
              c.getContext("2d").drawImage(im, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
            }
            settled();
          };
          im.onerror = settled;
          im.src = decodeURIComponent(url);
          grid.appendChild(printOf(c));
        })(imgs[i]);
      }

      document.getElementById("sheetTime").textContent = q.get("when") || "";
      document.getElementById("sheetTally").textContent = q.get("tally") || "";
      document.getElementById("sheet").classList.add("on");
      applyCardTheme(q, settled);
    };

    var drawCard = function () {
      var q = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
      if (q.get("sheet")) return drawSheet();
      var src = q.get("img") || "";
      var who = q.get("name") || "";
      var bits = Number(q.get("bits") || 0);
      var sku = q.get("sku") || "";
      var people = Number(q.get("people") || 0);
      var accent = q.get("accent") || "safelight";
      var when = q.get("when") || "";

      document.documentElement.setAttribute("data-accent", accent);
      cWhen.textContent = when;
      // Both ways round. This source is reused: the fragment is rewritten and
      // the redraw hangs off hashchange, so a card left hidden would stay
      // hidden for every photograph after it. An empty span is not free either
      // — .ccap is a flex row with a gap, so nothing would be a hole.
      cWhen.hidden = !when;

      cEl.className = "card";
      cEl.removeAttribute("data-bits");     // the last photo's amount is not this one's
      cEl.removeAttribute("data-pattern");  // nor its frame
      var oldPat = cEl.querySelector(".pat");
      if (oldPat) oldPat.remove();
      // The paper is under everything and the pattern goes in over it: the
      // skin is the first child, and the pattern layer is inserted after it.
      var skin = skinOf(cEl);
      cWho.textContent = "";
      var oldTag = cCap.querySelector(".ctag");
      if (oldTag) oldTag.remove();

      if (bits > 0) {
        // A paid photo names its buyer and its price. The headcount is left off
        // on purpose: this one belongs to a person.
        cEl.classList.add("paid");
        cEl.setAttribute("data-bits", bitsTone(bits));
        // The saved file is the same print as the one that flew across the
        // stream, so it carries the same frame — otherwise two copies of one
        // purchase disagree about what was bought.
        var pattern = patternOf(sku);
        if (pattern) {
          cEl.setAttribute("data-pattern", pattern);
          var layer = patternLayer(pattern);
          if (layer) cEl.insertBefore(layer, skin.nextSibling);
        }
        cWho.textContent = who;
        var tb = document.createElement("span");
        tb.className = "ctag bits";
        tb.textContent = bits + " Bits";
        cCap.insertBefore(tb, cWhen);
      } else if (people > 1) {
        var tp = document.createElement("span");
        tp.className = "ctag";
        tp.textContent = "×" + people;
        cCap.insertBefore(tp, cWhen);
      } else {
        cEl.classList.add("plain");
      }

      // Which part of the picture is the subject. The overlay works it out
      // from the scene and passes it here; without it the whole frame is drawn,
      // margins and all, which is what used to happen.
      var box = null;
      var raw = (q.get("crop") || "").split(",");
      if (raw.length === 4) {
        var n = raw.map(Number);
        if (n.every(function (v) { return isFinite(v) && v >= 0; }) && n[2] > 0 && n[3] > 0) {
          box = { x: n[0], y: n[1], w: n[2], h: n[3] };
        }
      }

      // The paper waits for the picture and the pack, whichever is later: the
      // card fills its source, so its size is known, but a paper painted over
      // a stale card is a paper painted for the wrong photograph.
      var waiting = 2;
      var paper = function () { if (--waiting === 0) paintSkin(cEl, "paper"); };

      var paint = function () {
        var b = clampBox(box, cImg.naturalWidth, cImg.naturalHeight);
        if (b.w > 0 && b.h > 0) {
          cShot.width = Math.round(b.w);
          cShot.height = Math.round(b.h);
          // Reading these pixels back is refused for a file:// page, but drawing
          // them is not (measured) — and drawing is all this needs.
          cShot.getContext("2d").drawImage(cImg, b.x, b.y, b.w, b.h, 0, 0, cShot.width, cShot.height);
        }
        paper();
      };

      if (src && cImg.getAttribute("src") !== src) {
        cImg.onload = paint;
        cImg.onerror = paper;
        cImg.src = src;
      } else if (cImg.complete) {
        paint();
      } else {
        paper();
      }
      applyCardTheme(q, paper);
    };

    window.addEventListener("hashchange", drawCard);
    drawCard();
    return;
  }

     the obs-websocket password and the EBS pairing token. That is a file on
     disk in the browser profile, and it travels the way profiles travel —
     copied, backed up, synced — and it is on screen the moment anybody opens
     DevTools on a browser source, which on this product is a thing that
     happens while a stream is running.

     So they are kept as ciphertext, under a key that JS cannot read back.

     WHAT THIS DOES NOT PROTECT AGAINST — worth saying plainly, because the two
     get mixed up. It does NOT protect against code running in this document: a
     script here can take the key out of IndexedDB and call decrypt, exactly as
     this file does. Anybody who can change the page has already won (plan.md

     a backup, a sync, a screen share with the Local Storage pane open — gets

   * Either the setup page just wrote it into the URL, or it is still sitting in
   * the old plaintext config and is about to be migrated. Both are "a value
   * this page brought", and both have to end up in the store — the difference
   * between them is not one this page has to care about. */
  var broughtSecrets = {};
  SECRETS.forEach(function (k) { if (cfg[k]) broughtSecrets[k] = cfg[k]; });

  /**
   * Settle the two secrets, which is the one part of the config that is not
   * ready when the page is.
   *
   * Everything else in cfg is a string that was in the URL or in localStorage,
   * both of which answer immediately. The secrets come out of an encrypted
   * store, and opening it means IndexedDB and a decrypt — so the page starts
   * without them and the two things that need them wait on this
   * (99-go.js: connect() and ebsConnect()).
   *
   * The URL still wins, exactly as it does for every other setting: a value
   * this load brought is kept and written down, and the store only fills in
   * what was not brought.
   */
  var secretsSettled = (
    /* The sample asks for nothing, here as everywhere else.
     *
     * #demo runs inside the setup page, which means it runs in the
     * BROADCASTER'S OWN storage — the same bucket the setup page keeps its
     * encrypted secrets in. Opening the store from here would decrypt a real
     * password and a real token into a frame that exists to show what the
     * effects look like. It never uses them, and that is not the point: the
     * sample is told everything it may know in its URL (see DEMO above), and
     * this was the one line that had started asking. */
    DEMO ? Promise.resolve({ state: "demo", values: {} }) : secretsOpen()
  ).then(function (r) {
    SECRETS.forEach(function (k) {
      if (!broughtSecrets[k] && r.values[k]) cfg[k] = r.values[k];
    });
    var news = SECRETS.some(function (k) {
      return broughtSecrets[k] && r.values[k] !== broughtSecrets[k];
    });
    return news ? saveSecrets() : Promise.resolve(false);
  }).then(function () {
    return DEMO ? "demo" : secretState;
  });

  /* Settings ride in the fragment, and OBS does not reload a browser source when
     only the fragment changes (measured — §6). Everything read once at load
     therefore needs a reload to take effect, which is fine for appearance: the
     broadcaster is looking at it when they change it.

     It is not fine for the three that decide whether the shutter works at all.
     Those are read fresh on every press, so re-reading them here is enough, and
     it means a decision made on the setup page lands on the overlay at the
     moment it is made rather than the next time OBS happens to reload the page.
     Nothing else is touched: the rest of cfg has already been turned into
     colours, scale and a connection, and swapping it underneath them would
     leave the page describing settings it is not using. */
  window.addEventListener("hashchange", function () {
    var sent = fromHash();
    if (!sent) return;
    ["gateSet", "scenes", "testUntil"].forEach(function (k) {
      if (typeof sent[k] === "string") cfg[k] = sent[k];
    });
    saveCfg(cfg);
    // The window's end is the one change nothing else announces (52-obs-hooks).
    watchTestWindow();
    // Say the new answer even when it repeats the old one: this is the moment
    // the broadcaster is waiting to see confirmed.
    closedWhy = null;
    sceneOpen();
    // ...and tell the EBS, which is the half that decides. Saying it only in
    // the log leaves the buttons shut on an answer that has already changed:
    // nothing else reports until the overlay happens to notice something else
    // — a scene change, the stream going on or off, a capture succeeding or
    // failing — and a broadcaster who set the scenes after going live would
    // wait for one of those with no way of knowing that is what they are
    // waiting for. It re-asks sceneOpen() itself; the call above is what puts
    // the reason in the log even when there is no EBS link to report to.
    reportOverlayState();
  });
  saveCfg(cfg);

  /**
   * Settle the language, now that the settings are in hand.
   *
   * It is the broadcaster's choice and it arrives with everything else, because
   * everyone watching sees this one text — a caption in the wrong language is
   * wrong for the whole audience, not for one viewer (§4.8). navigator.language
   * is deliberately not consulted: it is whoever is sitting at this PC, which
   * on a borrowed or restreamed machine is not even the broadcaster.
   *
   * The tag arrives whole (pt-BR, zh-CN), so match on the primary subtag.
   * ?lang= wins, which is how all twelve get checked; anything unknown, and the
   * old configs written before this setting existed, fall to English.
   */
  function pickLanguage() {
    var asked = String(q.get("lang") || cfg.lang || "").toLowerCase().split("-")[0];
    if (I18N[asked]) lang = asked;
  }

  pickLanguage();

  /**
   * Take the secrets back out of the browser source's URL.
   *
   * Rewriting the URL makes OBS reload this page, so this must run at most once:
   * the reloaded page sees no secret in the fragment and does nothing.
   *
   * Each secret is dropped only once THAT secret is known to have been written
   * down, and they are decided one at a time: a browser that refuses storage
   * keeps a working URL rather than losing the only copy, and a password that
   * could not be stored does not take the token down with it.
   *
   * 2026-09-10: this used to be about the password alone, which had two costs.
   * The token stayed in the URL — and it is the one that is worth something to
   * somebody else. And the whole clean-up was skipped for a broadcaster running
   * obs-websocket without authentication: there was no password to take out, so
   * the function returned on its first line and the token stayed for ever.
   */
  function scrubSecretsFromUrl() {
    if (!pushed) return;
    var drop = SECRETS.filter(function (k) {
      return pushed[k] && secretIsStored(k, pushed[k]);
    });
    if (!drop.length) return;                      // nothing safe to take out
    /* A secret is left out when it is being dropped — and also when there is
     * nothing to say about it. Writing pw:"" or ebsToken:"" back into the URL
     * would be an instruction to forget, because the URL wins over storage on
     * the next load: the same shape as the 2026-09-03 outage, from the page
     * that is supposed to be cleaning up (setup: barConfig, overlayConfig). */
    var clean = {};
    for (var k in DEFAULTS) {
      if (drop.indexOf(k) !== -1) continue;
      if (SECRETS.indexOf(k) !== -1 && !cfg[k]) continue;
      clean[k] = cfg[k];
    }
    /* Everything else in the fragment is put back.
     *
     * The fragment is not only the settings: #debug turns the status chip on
     * and #preview draws the bar at full size, and both are how a broadcaster
     * is looking at this page at the moment they set it up. Rebuilding the URL
     * from the settings alone swept them away — which never showed while the
     * clean-up needed a password, because that is not the state you are in
     * while adjusting anything. */
    var rest = hashParts().filter(function (part) { return part.slice(0, 2) !== "c="; });
    var wanted = location.href.split("#")[0] + "#c=" + encodeURIComponent(JSON.stringify(clean)) +
      (rest.length ? "&" + rest.join("&") : "");

    request("GetInputList", { inputKind: "browser_source" })
      .then(function (d) {
        var names = (d.inputs || []).map(function (i) { return i.inputName; });
        return Promise.all(names.map(function (name) {
          return request("GetInputSettings", { inputName: name })
            .then(function (r) { return { name: name, url: (r.inputSettings || {}).url || "" }; })
            .catch(function () { return { name: name, url: "" }; });
        }));
      })
      .then(function (rows) {
        var mine = rows.filter(function (r) { return r.url === location.href; });
        /* All of them, not the one.
         *
         * This used to give up unless exactly one source matched, on the
         * reasoning that it could not tell which one it was. But a source
         * whose url is character-for-character this page's url IS this page,
         * settings and secrets and all, and the replacement built for one is
         * correct for every one of them. Giving up left a broadcaster who had
         * duplicated the browser source with the password and the token in
         * every copy — in the properties window and in the scene collection —
         * and nothing said so, because from here it looked like a clean-up
         * that had simply not happened yet (Codex 1巡目 HIGH). */
        if (!mine.length) return;                  // none of these is us
        return Promise.all(mine.map(function (row) {
          return request("SetInputSettings", {
            inputName: row.name,
            inputSettings: { url: wanted },
            overlay: true
          });
        }));
      })
      .catch(function () { /* the URL simply keeps the password */ });
  }


  /* ================= elements ================= */

  var el = {
    chip: document.getElementById("chip"),
    chipText: document.getElementById("chipText"),
    stage: document.getElementById("stage")
  };

  // There is no log pane here, and this page draws nothing but effects, so the
  // OBS log is the only place anyone can see what it is doing.
  //
  // Measured: OBS writes only Error-level console output from a browser source
  // into its log — every [obs-browser: ...] line in a log file is an Error, and
  // console.log never appears. So everything goes out at error level, and the
  // volume is kept low enough to deserve it: failures always, successes at most
  // once every few seconds.
  function log(msg, cls) {
    // A failure makes the next success worth hearing: it is the only signal
    // that whatever broke has stopped breaking. Without this, the throttle
    // swallowed exactly the line that said the fallback had run.
    if (cls === "bad") lastShotLog = 0;
    console.error("[SHUTTERPARTY] " + (cls ? "(" + cls + ") " : "") + msg);
  }

  var lastShotLog = 0;
  var SHOT_LOG_EVERY_MS = 5000;

  /* ---- how smooth the effects actually were ----

     Watches frame intervals for a moment after a shot and says something only
     when one was bad. A browser source that stutters is invisible to OBS's own
     statistics — OBS simply composites whatever frame the page last produced —
     so this is the only place the judder can be seen. */

  var JANK_WATCH_MS = 1500;
  var JANK_FLOOR_MS = 30;        // one dropped frame at 60fps is a ~33ms gap
  // One line per session, then only when something was wrong. The first line
  // matters because silence alone proves nothing — it says the instrument runs,
  // and gives the frame rate this machine actually achieves.
  var JANK_ALWAYS_FIRST = 1;
  var jankReports = 0;
  var jankUntil = 0;
  var jankWorst = 0;
  var jankFrames = 0;
  var jankPrev = 0;
  var jankWhat = "";

  function watchJank(what) {
    jankWhat = what;
    jankWorst = 0;
    jankFrames = 0;
    jankPrev = 0;
    var was = jankUntil;
    jankUntil = performance.now() + JANK_WATCH_MS;
    if (was > performance.now()) return;          // already watching
    requestAnimationFrame(jankTick);
  }

  function jankTick(now) {
    if (jankPrev) {
      var gap = now - jankPrev;
      jankFrames++;
      if (gap > jankWorst) jankWorst = gap;
    }
    jankPrev = now;
    if (now < jankUntil) { requestAnimationFrame(jankTick); return; }
    var bad = jankWorst >= JANK_FLOOR_MS;
    if (bad || jankReports < JANK_ALWAYS_FIRST) {
      jankReports++;
      log(t("log.jank", {
        ms: Math.round(jankWorst),
        n: jankFrames,
        fps: Math.round(jankFrames / (JANK_WATCH_MS / 1000)),
        what: jankWhat
      }), bad ? "warn" : "ok");
    }
  }


  function logShot(msg) {
    var now = Date.now();
    if (now - lastShotLog < SHOT_LOG_EVERY_MS) return;
    lastShotLog = now;
    log(msg, "ok");
  }

  var chipTimer = null;
  function status(state, text, sticky) {
    el.chip.dataset.state = state;
    el.chipText.textContent = text;
    el.chip.classList.add("show");
    clearTimeout(chipTimer);
    if (!sticky) chipTimer = setTimeout(function () { el.chip.classList.remove("show"); }, 4000);
  }


  /* ================= obs-websocket =================

     One client, two pages. The overlay photographs a scene and tells the EBS
     whether it can; the setup page reads a form and redraws itself. Everything
     else — the handshake, the SHA-256 challenge, matching a response to the
     request that asked for it, the backoff — is the same protocol answered the
     same way, and it was written out twice.

     The two copies had already drifted. 実測 2026-08-26: the overlay's
     teardown() rejects its pending requests, and the setup page's did not, so a
     disconnect there left them to time out ten seconds later — against whatever
     connection existed by then. Nothing errors; a scene list just arrives empty
     for a session that is connected and fine.

     A check could not have caught it. The two are legitimately different
     wherever the page's own behaviour differs, so comparing them either fails
     always or is loosened until it means nothing (docs/refactor-plan.md
     Stage 0). The difference has to stop existing instead.

     WHAT EACH PAGE STILL OWNS, as eight functions this file calls and neither
     defines. They are declarations in the same scope, so order does not matter:

       obsEvents()            which obs-websocket event categories to subscribe
                              to. The overlay watches the program scene and the
                              stream state; the setup page watches nothing.
       obsBeforeConnect()     last chance to decide where to connect. The setup
                              page reads its form into cfg here.
       obsSaying(url)         how this page announces the attempt in its log.
       obsNoPassword()        what to do when OBS asks for one and there is
                              none. The setup page can ask; the overlay cannot
                              — it has no UI, and the password lives elsewhere.
       obsOnEvent(m)          a subscribed event arrived (op 5).
       obsOnClosed()          the socket closed, identified already cleared.
       obsOnIdentified()      authenticated, and this page may start work.
       obsOnDisconnect()      a deliberate disconnect, sockets already down.

     WHAT EACH PAGE READS OUT OF HERE. Both parts end up in the same closure, so
     these are plain variables rather than getters — `identified` was already
     being read this way by the setup page's rail:

       identified             is there an authenticated session right now.
       failKey                why there is not, as an i18n KEY, or "" when the
                              socket is up or was never tried. A key and not a
                              sentence because the page is repainted whole on a
                              language change, and a stored sentence would come
                              back in the language it was written in.

     Everything below this line is the protocol. If you are changing it for one
     page, you are changing it for both — which is the point. */

  function b64(bytes) {
    var s = "";
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }

  function sha256b64(str) {
    return crypto.subtle
      .digest("SHA-256", new TextEncoder().encode(str))
      .then(function (buf) { return b64(new Uint8Array(buf)); });
  }

  var ws = null;
  var identified = false;
  var reqSeq = 0;
  var waiting = {};
  var retry = 0;
  var manualClose = false;
  /* Why the connection is not up, as an i18n key.
   *
   * The reason existed before this variable did — it was written to the log and
   * nowhere else, and the log has to be opened by pressing a button. What the
   * screen showed was the generic "not connected", which is the one thing the
   * broadcaster could already see (docs/onboarding-plan.md §2.D).
   *
   * It is state rather than an argument to status() because a single write does
   * not survive: obsOnClosed() repaints the rail, and so does every language
   * change, and both of those recompute the row from `identified` alone. The
   * needpw path made that visible — it closes the socket itself, so its own
   * status() call was overwritten by onclose a tick later (実測). Anything that
   * repaints now reads this. */
  var failKey = "";
  var retryTimer = null;
  // Bumped by every connect and disconnect, so a timer that was already in
  // flight when the user reconnected by hand can tell that it is stale.
  var connectGen = 0;

  function request(type, data) {
    return new Promise(function (resolve, reject) {
      if (!identified) return reject(new Error("not connected"));
      var id = "r" + ++reqSeq;
      waiting[id] = { resolve: resolve, reject: reject };
      ws.send(JSON.stringify({ op: 6, d: { requestType: type, requestId: id, requestData: data || {} } }));
      setTimeout(function () {
        if (waiting[id]) { delete waiting[id]; reject(new Error(type + " timed out")); }
      }, 10000);
    });
  }

  /* The handshake has a deadline, the same way a request does.
     op 6 requests time out after ten seconds, but the op 0 → op 1 → op 2 that
     comes before them had none: a socket that OPENS and then says nothing —
     OBS accepted the connection and never sent Hello, or never answered
     Identify — never fires onclose, so the backoff below never runs and the
     page sits on "connecting" for as long as the broadcast lasts. From here it
     looks exactly like a slow start, so it is given the same ten seconds and
     then closed, which hands it to onclose and the backoff that already exists
     (Codex 2026-09-15 round 7). OBS stalled on the graphics lock is one way in,
     which is the same failure the capture window guards against. */
  var handshakeTimer = null;
  function cancelHandshake() { clearTimeout(handshakeTimer); handshakeTimer = null; }

  function teardown() {
    cancelHandshake();
    if (!ws) return;
    ws.onopen = ws.onclose = ws.onerror = ws.onmessage = null;
    try { ws.close(); } catch (e) {}
    ws = null;
    // Nothing is coming back for these. Left alone they answer ten seconds
    // later, by which time the page can be connected again — and a failure
    // handler that reaches for another photograph would take it against
    // whatever is on air now rather than what the press was aimed at. The same
    // ten seconds on the setup page ended with a scene list arriving empty for
    // a connection that was healthy: the copy that did not do this is the
    // reason there is now only one copy.
    for (var id in waiting) {
      var w = waiting[id];
      delete waiting[id];
      w.reject(new Error("disconnected"));
    }
  }

  function connect() {
    teardown();
    cancelRetry();
    connectGen++;
    manualClose = false;
    identified = false;
    failKey = "";

    obsBeforeConnect();

    var url = "ws://" + cfg.host + ":" + cfg.port;
    status("wait", t("st.connecting"), true);
    obsSaying(url);

    var sock;
    try {
      sock = new WebSocket(url);
      ws = sock;
    } catch (e) {
      failKey = "st.failed";
      log(t("log.failed"), "bad");
      status("bad", t(failKey), true);
      scheduleRetry();
      return;
    }

    sock.onopen = function () {
      if (sock !== ws) return;
      retry = 0;
      // The clock on the handshake starts when the socket opens, not when it was
      // asked for: until then the failure is a refused connection, which onclose
      // already reports. Tied to the generation, like the retry below, so one
      // armed before the broadcaster reconnected by hand cannot close the new one.
      var gen = connectGen;
      cancelHandshake();
      handshakeTimer = setTimeout(function () {
        handshakeTimer = null;
        if (gen !== connectGen || identified || sock !== ws) return;
        // No word of its own: closing hands this to onclose, which already says
        // what a connection that did not come up says, in twelve languages.
        try { sock.close(); } catch (e) { /* onclose carries it on */ }
      }, 10000);
    };

    sock.onclose = function (ev) {
      if (sock !== ws) return; // a socket we already replaced
      var wasIdentified = identified;
      identified = false;

      /* Decided BEFORE obsOnClosed(), because that hook repaints the page and
       * the repaint reads failKey. A deliberate close keeps whatever reason
       * asked for it — the needpw path sets one, pressing Disconnect does not.
       *
       * `wasIdentified` is what separates the last two. Saying "dropped —
       * reconnecting" to somebody whose OBS was never running is a lie about
       * the one thing they need to fix, and it was the FIRST thing the page
       * said on a fresh machine: new WebSocket() does not throw when nothing is
       * listening, so an unstarted OBS arrives here rather than at the catch
       * above (docs/onboarding-plan.md §2.D). */
      if (!manualClose) {
        if (!wasIdentified && ev.code === 4009) failKey = "st.authfail";
        else if (!wasIdentified) failKey = "st.failed";
        else failKey = "st.lost";
      }

      obsOnClosed();
      status("bad", t(failKey || "st.idle"), true);

      if (manualClose) return;
      if (failKey === "st.authfail") {
        // obs-websocket closes with 4009 on a bad auth
        log(t("log.authfail"), "bad");
        return; // a wrong password will not fix itself; do not spin
      }
      if (!wasIdentified) log(t("log.failed"), "bad");
      scheduleRetry();
    };

    sock.onerror = function () { /* onclose carries the detail */ };

    sock.onmessage = function (ev) {
      if (sock !== ws) return;
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }

      if (m.op === 0) return onHello(sock, m.d);
      if (m.op === 2) return onIdentified();
      // Only what obsEvents() asked for arrives here. Anything else is not
      // subscribed to and is ignored rather than guessed at.
      if (m.op === 5) return obsOnEvent(m);
      if (m.op === 7) {
        var w = waiting[m.d.requestId];
        if (!w) return;
        delete waiting[m.d.requestId];
        var st = m.d.requestStatus || {};
        if (st.result) w.resolve(m.d.responseData || {});
        else w.reject(new Error(st.comment || st.code || "request failed"));
      }
    };
  }

  function onHello(sock, d) {
    log(t("log.hello", { v: d.obsWebSocketVersion || "?" }), "ok");
    var a = d.authentication;
    if (!a) {
      log(t("log.noauth"), "warn");
      sock.send(JSON.stringify({ op: 1, d: { rpcVersion: d.rpcVersion, eventSubscriptions: obsEvents() } }));
      return;
    }
    if (!cfg.pw) {
      // Closed by us, so onclose takes the manualClose branch — and that branch
      // used to write "not connected" over this. It reads failKey now.
      failKey = "st.needpw";
      log(t("log.needpw"), "bad");
      manualClose = true;
      try { sock.close(); } catch (e) {}
      obsNoPassword();
      return;
    }
    // Hashing is asynchronous, and the socket can be replaced while it runs.
    // Sending this challenge's answer to a socket that never saw the challenge
    // would fail authentication on a connection that was otherwise fine.
    sha256b64(cfg.pw + a.salt)
      .then(function (secret) { return sha256b64(secret + a.challenge); })
      .then(function (auth) {
        if (sock !== ws) return;
        sock.send(JSON.stringify({
          op: 1,
          d: { rpcVersion: d.rpcVersion, authentication: auth, eventSubscriptions: obsEvents() }
        }));
      })
      .catch(function (e) {
        if (sock !== ws) return;
        failKey = "st.failed";
        log(t("log.reqfail", { m: e.message }), "bad");
        status("bad", t(failKey), true);
        try { sock.close(); } catch (e2) {}
      });
  }

  function onIdentified() {
    identified = true;
    retry = 0;
    failKey = "";
    cancelHandshake();
    cancelRetry();
    log(t("log.auth"), "ok");
    obsOnIdentified();
  }

  function disconnect(silent) {
    manualClose = true;
    teardown();
    cancelRetry();
    connectGen++;
    identified = false;
    // Asked for. There is no reason to show, and the previous one is stale:
    // teardown() nulls the handlers, so onclose never runs to clear it.
    failKey = "";
    obsOnDisconnect();
    if (!silent) status("bad", t("st.idle"), true);
  }

  function cancelRetry() {
    clearTimeout(retryTimer);
    retryTimer = null;
  }

  function scheduleRetry() {
    if (manualClose) return;
    retry = Math.min(retry + 1, 6);
    var wait = Math.min(1000 * Math.pow(1.8, retry), 30000);
    var gen = connectGen;
    cancelRetry();
    // Without the generation check, a retry armed before the broadcaster hit
    // connect by hand would fire afterwards and tear the healthy socket down.
    retryTimer = setTimeout(function () {
      retryTimer = null;
      if (manualClose || gen !== connectGen) return;
      connect();
    }, wait);
  }
  /* ================= what this page does with a socket =================

     The eight functions src/shared/parts/obs-ws.js calls and does not define,
     plus the state only this page keeps: which scene is on air, whether OBS is
     streaming, and whether a photograph has ever actually come out. */

  // Whether the last capture actually produced a frame. OBS can be connected
  // and a source chosen, and the shot still fail — a renamed source, a source
  // that cannot render — and the EBS has to know, or viewers keep being told
  // "captured" for pictures that were never taken.
  // Starts false on purpose. "Connected to OBS with a source chosen" is not the
  // same as "can take a picture" — a renamed, deleted or non-rendering source
  // looks identical until something actually asks for a frame. Reporting
  // optimism here spends the first press of every session on finding that out,
  // and the viewer who spent it is told the shot was taken.
  var captureOk = false;
  var captureProbeTimer = null;
  var captureProbeWait = 0;
  // What is photographed has to be a scene. A source does not know which scene
  // it sits in, so everything the broadcaster does to hide something — the
  // crop, the cover, the bounding box — lives on the scene side and none of it
  // reaches a photograph of the source. The setup page only ever offers scenes,
  // but this page is driven by a URL that outlives it: one written before that
  // rule existed still names a source, and OBS would still photograph it.
  var srcIsScene = false;
  // Which proof of srcIsScene is current. A GetSceneList that was in flight
  // when the target stopped being a scene answers from before the change, and
  // an answer written to srcIsScene after reproveSceneTarget() withdrew the
  // question would turn the cached yes back on — for a name that is now an
  // input. Every asker notes this number and drops an answer to an older
  // question; every prover (probe and the two capture roads) does the same
  // before calling capture proved. Bumped on reprove and on every identify.
  var sceneProof = 0;

  /* ---- which scenes the button is allowed to work in ----

     A broadcaster who steps away puts up a "back soon" scene. The camera is
     still running, and the capture scene is still composited on demand — OBS
     photographs a scene whether or not it is on air (§6). So without this, a
     viewer can take a picture of someone who thinks they are off camera. That
     is the same privacy problem as photographing a source, arriving by a
     different door (§5.2).

     Empty means every scene, which is what an existing setup has. The names are
     kept as one string because the whole config rides in a URL fragment; scene
     names cannot contain a newline, so a newline separates them. */
  var EVENTS_SCENES = 4;            // obs-websocket: the Scenes event category
  var EVENTS_OUTPUTS = 64;          // ...and Outputs, which carries the stream state
  var EVENTS_WANTED = EVENTS_SCENES | EVENTS_OUTPUTS;
  var programScene = "";
  /* Whether OBS is streaming.

     The extension is on the channel page whether or not anybody is live, so
     a viewer can press while the broadcaster is off air — and OBS composites
     the capture scene on demand, so a photograph comes out of a machine whose
     owner believes nobody is watching. Being connected to OBS is not the same
     as being on air, and only the second one is consent.

     Unknown counts as not streaming, the same way an unknown scene counts as
     closed: a gate that opens itself while it is not looking is the accident
     it exists to prevent. */
  var streaming = false;

  var sceneProbeTimer = null;
  var sceneProbeWait = 0;

  /* ---- the target can stop being a scene while this page is looking ----

     srcIsScene is proved once per connection and then trusted, and the gate in
     front of every capture reads that cached yes. But scenes are removed and
     renamed while a connection is up: delete the capture scene, make an input
     with its name, and the cached yes points at a source — which is exactly
     the photograph that must never be taken (CLAUDE.md NEVER, §5.2). Whether
     OBS lets an input take a deleted scene's name is not measured [未確認];
     the proof is cheap and this page should not have to know. The Scenes category is
     already subscribed to, so these arrive for free; a press costs nothing
     extra. Only a change that touches the target's name is acted on — a
     broadcaster tidying other scenes does not get their capture re-proved,
     and re-proving is what would put a "ready" line in the log each time. */
  var SCENE_LIST_EVENTS = ["SceneCreated", "SceneRemoved", "SceneNameChanged", "SceneListChanged"];

  /** Whether a Scenes event changes the answer to "is the target a scene". */
  function sceneEventTouchesTarget(type, ev) {
    if (!cfg.src) return false;
    if (type === "SceneListChanged") {
      // The whole list rides in the event. An event without one is treated as
      // "something changed": one round trip to find out, never a wrong yes.
      if (!Array.isArray(ev.scenes)) return true;
      var listed = ev.scenes.some(function (s) { return s && s.sceneName === cfg.src; });
      return listed !== srcIsScene;
    }
    return ev.sceneName === cfg.src || ev.oldSceneName === cfg.src;
  }

  /**
   * Forget the proof and prove it again now.
   *
   * captureOk goes with it: a capture that worked on a scene which is now gone
   * proves nothing about the name it left behind. The EBS hears "not ready"
   * for the one round trip it takes to ask, and presses in flight meet the
   * gate that re-asks srcIsScene (captureToScreen / captureToDisk).
   */
  function reproveSceneTarget() {
    sceneProof++;                         // answers already in flight are stale
    srcIsScene = false;
    if (captureOk) setCaptureOk(false);   // tells the EBS; schedules a probe
    cancelCaptureProbe();                 // ...which is wanted now, not later
    probeCapture();
  }

  function allowedScenes() {
    return String(cfg.scenes || "").split("\n").filter(function (n) { return n; });
  }

  /**
   * True when a press may be honoured right now.
   *
   * Not knowing counts as closed once the broadcaster has named scenes. The
   * scene on air is unknown only between connecting and the first answer, or
   * after that answer failed — and a gate that opens itself while it is not
   * looking is exactly the accident it exists to prevent: the broadcaster
   * stepped away, the camera is still running, and the capture scene is
   * composited on demand whether or not it is on air.
   */
  var closedWhy = "";

  /**
   * Why the shutter is shut, said once each time the answer changes.
   *
   * Four states look identical from outside — the viewer is told "not shooting
   * right now" for every one of them — and the broadcaster is the only person
   * who can fix any of them. Without this the log says nothing at all, and a
   * page working exactly as told looks broken.
   */
  function noteClosed(why) {
    if (why === closedWhy) return;
    closedWhy = why;
    if (why) log(t("log.closed." + why), "warn");
  }

  function sceneOpen() {
    // Off air is closed, whatever the scenes say. The extension sits on the
    // channel page whether or not anybody is live, so without this a viewer
    // can photograph a machine whose owner believes nobody is watching.
    // A window the broadcaster opened deliberately, to look at the effects
    // without going live. It carries its own end (set on the setup page), so
    // nothing here has to remember to close it — and a stale config cannot hold
    // the shutter open, because the deadline is in the past by then.
    var testing = Number(cfg.testUntil || 0) > Date.now();
    if (!streaming && !testing) { noteClosed("notlive"); return false; }
    if (testing) noteClosed("");

    // Nothing is photographed until the broadcaster has answered the question.
    // An empty list means "every scene" only once they have said so: before
    // that it means the setup page has not been finished, and the two are not
    // the same thing.
    if (String(cfg.gateSet || "") !== "1") { noteClosed("nogate"); return false; }

    var list = allowedScenes();
    if (!list.length) { noteClosed(""); return true; }   // decided: all allowed
    if (!programScene) { noteClosed("unknown"); return false; }
    var ok = list.indexOf(programScene) !== -1;
    noteClosed(ok ? "" : "offscene");
    return ok;
  }

  /* ---- the test window closing ----

     sceneOpen() reads the deadline fresh every time, so the gate here shuts
     on the minute. But the deadline passing is not an event: nothing reports
     until this page notices something else — a scene change, the stream
     starting, a capture — and a broadcaster who opened the window, looked,
     and walked away sends none of those. The EBS then keeps the last "open"
     it heard, tells every button the shutter is open, and the presses are
     dropped at the gate. So the one moment that changes the answer gets one
     timer, re-armed whenever the deadline moves (hashchange), never periodic:
     the same shape as scheduleSceneProbe — "nothing else would". */
  var testEndTimer = null;

  function watchTestWindow() {
    clearTimeout(testEndTimer);
    testEndTimer = null;
    var left = Number(cfg.testUntil || 0) - Date.now();
    if (!(left > 0)) return;
    // A timer past 2^31-1 ms fires at once; a hand-edited deadline that far
    // out is re-armed from inside rather than reported early.
    testEndTimer = setTimeout(function () {
      testEndTimer = null;
      if (Number(cfg.testUntil || 0) > Date.now()) { watchTestWindow(); return; }
      sceneOpen();                 // puts the reason in the log, link or no link
      reportOverlayState();        // ...and tells the half that decides
    }, Math.min(left + 50, 0x7fffffff));
  }

  function cancelSceneProbe() {
    clearTimeout(sceneProbeTimer);
    sceneProbeTimer = null;
    sceneProbeWait = 0;
  }

  /**
   * Ask for the scene on air again after a failed answer.
   *
   * Nothing else would: the change event is the only other way this arrives,
   * and a broadcaster who stays on one scene never sends one. Without this the
   * gate stays shut for the whole stream on a single early failure.
   */
  function scheduleSceneProbe() {
    clearTimeout(sceneProbeTimer);
    sceneProbeWait = Math.min(sceneProbeWait ? sceneProbeWait * 2 : 1000, 30000);
    sceneProbeTimer = setTimeout(function () {
      sceneProbeTimer = null;
      if (identified) watchProgramScene();
    }, sceneProbeWait);
  }

  function watchProgramScene() {
    return request("GetCurrentProgramScene").then(function (d) {
      var name = d.currentProgramSceneName || d.sceneName || "";
      // An answer without a name is no answer: keep the gate shut and ask again.
      if (!name) return scheduleSceneProbe();
      cancelSceneProbe();
      if (name === programScene) return;
      programScene = name;
      reportOverlayState();
    }).catch(function () {
      // Asked too early, most likely — but the gate is closed until it is known.
      scheduleSceneProbe();
    });
  }

  /* ---- the eight ---- */

  function obsEvents() { return EVENTS_WANTED; }

  // Nothing to decide: the address rides in the URL this page was opened with.
  function obsBeforeConnect() {}

  function obsSaying(url) { log("→ " + url); }

  // Nothing to do about it from here: the setup page holds the password.
  function obsNoPassword() {}

  /**
   * Three things are listened for: the scene on air, whether OBS is
   * streaming, and the scene list changing under the target's name. Anything
   * else that arrives is not asked for and is ignored rather than guessed at.
   */
  function obsOnEvent(m) {
    if (!m.d) return;
    var type = m.d.eventType;
    var ev = m.d.eventData || {};
    if (type === "CurrentProgramSceneChanged") {
      var next = ev.sceneName || "";
      if (next !== programScene) {
        programScene = next;
        reportOverlayState();     // the EBS decides; this only reports
      }
    } else if (type === "StreamStateChanged") {
      var on = !!ev.outputActive;
      if (on !== streaming) {
        streaming = on;
        log(t(on ? "log.livestart" : "log.livestop"), on ? "ok" : "warn");
        reportOverlayState();
      }
    } else if (SCENE_LIST_EVENTS.indexOf(type) !== -1) {
      if (sceneEventTouchesTarget(type, ev)) reproveSceneTarget();
    }
  }

  function obsOnClosed() {
    reportOverlayState();          // the EBS must stop accepting presses
  }

  function obsOnIdentified() {
    captureOk = false;             // until this session has proved otherwise
    cancelCaptureProbe();
    // The scene on air and what the target is are facts about this connection,
    // not about the last one: scenes are created, renamed and switched while
    // this page is not looking.
    programScene = "";
    srcIsScene = false;
    sceneProof++;                  // nothing the last connection proved counts
    cancelSceneProbe();
    streaming = false;             // ...and so is whether OBS is on air
    status("ok", t("st.ok"));
    probeCapture();                // prove it before anyone spends a press
    watchProgramScene();           // and know whether this scene is allowed
    // Asked once here; StreamStateChanged carries every change after this.
    // A failure leaves it false, which is the safe way round: not knowing
    // whether anyone is watching is not a reason to photograph.
    request("GetStreamStatus").then(function (d) {
      streaming = !!(d && d.outputActive);
      reportOverlayState();
    }).catch(function () { /* older obs-websocket: stays off */ });
    reportOverlayState();
    scrubSecretsFromUrl();
  }

  function obsOnDisconnect() {
    cancelCaptureProbe();
    cancelSceneProbe();
    reportOverlayState();          // the EBS must stop accepting presses
  }
  /* ================= capture ================= */

  var DEDUPE_MS = 150;   // one capture per window, however many presses land in it
  var pending = 0;
  var dedupeTimer = null;

  // What else the window has collected besides the headcount. The EBS has
  // already aggregated on its side, so these usually hold one message's worth;
  // they matter when two pushes land inside the same local window.
  var pendingPaid = null;      // the biggest single payment of the window
  var pendingIgnition = null;
  var heldShots = [];          // paid windows waiting for a window of their own
  // Scene captures OBS is still holding the graphics lock for. One at a time —
  // see flush(). A count rather than a flag so a path that ever sends two knows
  // it, instead of the first answer clearing the second's guard.
  var shooting = 0;
  var ignitionShot = null;     // the frame that lit the party, held for the sheet
  var ignitionPaid = false;    // ...and whether it was bought, which the sheet ranks by

  /* Paid photographs asked for and not yet standing on the wall.
   *
   * Between the press and the print there is a 150ms window and an OBS round
   * trip, and for the whole of it a bought photograph is in neither of the two
   * places the drain looks at: the EBS has already taken it out of the queue,
   * and the wall has not received it yet. Without this count, the last purchase
   * of a party reports "nothing left to drain" the instant it is dispatched —
   * the EBS ends WRAPPING UP and the contact sheet goes up while the frame is
   * still in the camera (docs/plan.md Phase 6).
   *
   * Every capture path settles exactly once, on the wall or on the floor: a
   * debt that is never paid would hold the next party open too. */
  var paidOwed = 0;

  /** A paid capture reached the wall, or died on the way. Either ends the debt. */
  function settlePaidShot(paid) {
    if (!paid) return;
    paidOwed = Math.max(0, paidOwed - 1);
    updatePaidDraining();
  }

  function requestShot(n, extra) {
    // Owed from the press rather than from the capture, and before anything
    // below can send this one away to wait: the message that carries a paid
    // press is the same one that drops the queue number to zero.
    if (extra && extra.paid) {
      paidOwed++;
      updatePaidDraining();
    }
    // The EBS already gave each paid press a window of its own, precisely so
    // that a photo's name and amount belong to one person. Two of them arriving
    // inside one local window would merge into whichever paid more, and the
    // other purchase would vanish. So this one stands aside and takes a window
    // of its own — a whole one, starting when the current capture happens. OBS
    // blocks on every capture, and asking twice in a row is what stops a
    // broadcast (CLAUDE.md), so this must never turn into a burst.
    if (extra && extra.paid && pendingPaid) {
      heldShots.push({ people: n || 1, paid: extra.paid, ignition: extra.ignition || null });
      return;
    }
    pending += n || 1;
    if (extra) {
      if (extra.paid && (!pendingPaid || extra.paid.bits > pendingPaid.bits)) {
        pendingPaid = extra.paid;
      }
      if (extra.ignition) pendingIgnition = extra.ignition;
    }
    if (dedupeTimer === null) dedupeTimer = setTimeout(flush, DEDUPE_MS);
  }

  /* The two requests that photograph the SCENE for a press go through here, so
     that flush() can see one is out. Both settle the count — a capture that
     failed released the lock just the same, and a window left waiting on a
     failure would be a party that stops taking photographs. The card and the
     sheet are saved through request() directly: they photograph the card
     source, at the end of a print or of the party, not on a press. */
  function sceneShot(type, data) {
    shooting++;
    var done = function () { if (shooting > 0) shooting--; };
    return request(type, data).then(
      function (d) { done(); return d; },
      function (e) { done(); throw e; }
    );
  }

  function flush() {
    /* Not while one is still in OBS.
     *
     * The 150ms window aggregates ARRIVALS, and that is all it does. The next
     * window is armed when this one is DISPATCHED (below), not when the capture
     * comes back — so a capture slower than 150ms had the next one sent on top
     * of it. obs-websocket wraps the render and the GPU readback in
     * obs_enter_graphics(): the stream stops for the whole of one, and asking
     * twice in a row is what stops a broadcast, which is the reason the window
     * exists at all (CLAUDE.md「撮影リクエストは 150ms の窓で集約してから 1 回
     * だけ撮る」). The comment two screens down already said "this must never
     * turn into a burst"; nothing made it true (Codex 2026-09-15 round 7).
     *
     * Nothing is dropped — the window waits and is tried again. The wait is
     * bounded by the request's own ten seconds, after which shooting falls back
     * to zero whether OBS answered or not. */
    if (shooting) { dedupeTimer = setTimeout(flush, DEDUPE_MS); return; }
    dedupeTimer = null;
    var people = pending;
    var paid = pendingPaid;
    var ignition = pendingIgnition;
    pending = 0;
    pendingPaid = null;
    pendingIgnition = null;

    // Whatever had to stand aside becomes the next window, one full DEDUPE_MS
    // from this capture. Set up before the exits below: a window that turns out
    // to be uncapturable must not take the ones queued behind it with it.
    if (heldShots.length) {
      var next = heldShots.shift();
      pending = next.people;
      pendingPaid = next.paid;
      pendingIgnition = next.ignition;
      dedupeTimer = setTimeout(flush, DEDUPE_MS);
    }

    if (people <= 0) { settlePaidShot(paid); return; }

    // The sequence starts whatever the camera does. The EBS has already lit the
    // party — presses are free on its side from this moment — so a capture that
    // fails must not leave the channel with twenty silent seconds.
    if (ignition) ignite(ignition);
    if (party) party.people += people;

    // Each of the three refusals below is the end of this photograph, so each
    // one settles the debt. A party held open waiting for a print that was
    // never going to be taken is the same failure as one that ends too early.
    var source = cfg.src;
    if (!source) { log(t("log.picksrc"), "warn"); settlePaidShot(paid); return; }
    if (!identified) {
      // Reachable even though the EBS thinks we are ready: it only knows what
      // we last told it, and OBS can drop between the telling and the press.
      log(t("log.notidentified"), "bad");
      status("bad", t("st.lost"), true);
      settlePaidShot(paid);
      return;
    }
    // The last word about what this machine photographs belongs here, the same
    // way the scene gate does: a target that is not a scene is not photographed
    // at all, however it got into the settings.
    if (!srcIsScene) {
      log(t("log.notascene", { n: source }), "bad");
      setCaptureOk(false);         // and the EBS stops sending presses this way
      settlePaidShot(paid);
      return;
    }

    // One capture per photograph.
    //
    // obs-websocket runs both screenshot requests through the same helper, and
    // that helper wraps the render and the GPU readback in obs_enter_graphics().
    // The stream stops for the duration, and it stops for exactly as long
    // whether the pixels come back to us or go to a file — the JPEG encoding
    // happens after the graphics lock is released, so resolution costs CPU but
    // not stream time. Taking one frame for the screen and another for the disk
    // would therefore pay the only cost that matters twice, for one photograph.
    //
    // Whether THIS photograph is one the broadcaster asked to keep, and whether
    // a file is needed anyway. The two are different questions and the second
    // one is easy to miss: the contact sheet is assembled by pointing the card
    // source at addresses, so a party frame that never reached disk cannot be
    // in it (saveSheet refuses a set with any data: URL in it). Skipping saves
    // naively therefore takes the sheet down with the photographs.
    if (!cfg.saveDir || saveGaveUp) captureToScreen(source, people, paid, !!ignition);
    else if (keepThisShot(paid) || needScratch(!!ignition)) {
      captureToDisk(source, people, paid, !!ignition);
    } else captureToScreen(source, people, paid, !!ignition);
  }

  /* ---- what the broadcaster asked to keep ----
   *
   * Saving has always been all-or-nothing, and the thing that makes that a
   * problem is not the setting — it is that NOTHING HERE CAN DELETE A FILE
   * (docs/plan.md Phase 6: neither this page nor obs-websocket can). Every byte
   * written stays until somebody removes it by hand, so the only place to be
   * careful is at the moment of writing.
   *
   * Measured 2026-08-26 on a real broadcast frame: a kept photograph is about
   * 218 KB at the current size, one capture leaves per 150ms window, and a
   * SHUTTER PARTY is twenty seconds — so a single party can write 29 MB and a
   * busy hour can write gigabytes.
   */
  /* A dial and a switch, not two switches.
   *
   * A photograph is two independent things at once — worth some amount (free is
   * zero), and inside a party or outside one — so the space still has its four
   * corners and both axes are still ANDed. What changed is that the first axis
   * is no longer a switch:
   *
   *   from   party   keeps
   *   0      on      everything
   *   0      off     everything outside a party
   *   10     on      every bought photograph
   *   10     off     bought photographs outside a party
   *   500    off     the big ones, outside a party           <- the new reach
   *
   * The dial replaces the old free/paid switch rather than joining it: "keep
   * from 10 Bits up" is exactly what "do not keep free ones" meant, so there is
   * one setting where there were two and nothing is spelled twice.
   *
   * WHY AN AMOUNT AND NOT A LIST OF PRODUCTS. The catalogue grows in two
   * directions (docs/plan.md §4.4) — patterns at the same amount, and new
   * amounts — and a box per product would reach twenty-eight of them and ask
   * the broadcaster to decide again every time one is added. It is the same
   * reason §4.12 keyed the bundling of prints to the amount rather than the SKU.
   *
   * THE FLOOR MOVED, DELIBERATELY. This used to say that a bought photograph
   * outside a party is always kept, because it is the one somebody paid for.
   * That conflated two things: what the viewer bought is the print appearing on
   * the broadcast — the frame, the name, the seconds it stands — and that is
   * delivered whatever this says. The file is the BROADCASTER's copy, and its
   * cost scales with the size of their channel: ten parties of a hundred
   * purchases is 242 MB at the standard size, and 50 MB at "100 Bits and up,
   * small" (本人の指摘 2026-08-30). A cost that lands on one person is a cost
   * that person decides.
   */
  function keepThisShot(paid) {
    var from = Number(cfg.saveFrom || 0);
    if ((paid ? paid.bits : 0) < from) return false;
    if (party && cfg.saveParty === "0") return false;
    return true;
  }

  /**
   * Does a frame need to reach disk whatever the setting says?
   *
   * Only the ones the contact sheet will ask for by address: the frame that lit
   * the party, and the frames taken while it was open. These go to scratch
   * names — one fixed name for the ignition, and per-party numbering that
   * openParty() resets — so the folder stops growing at the size of the biggest
   * party rather than accumulating (see partySeq).
   */
  function needScratch(lit) {
    return !!(lit || party);
  }

  /* The size a kept photograph is written at.
   *
   * `std` is what shipped: 1280 wide, which is the card's own width, so the
   * framed copy is not resampled. The other two are for the broadcaster who has
   * decided that a keepsake does not need to be a master. Measured on a real
   * broadcast frame (2026-08-26): 137 KB / 93 KB / 40 KB against std's 218 KB.
   *
   * The width matters more than the quality and was the piece missing: the
   * unframed path passed no imageWidth at all, so it wrote the capture scene at
   * its full resolution — which made the UNFRAMED copy the heavier of the two,
   * the opposite of what the names suggest. */
/* @generated save-sizes — src/shared/save-sizes.json。手で書き換えない */
  var SAVE_SIZES = {
    std: { w: 1280, q: 90, kb: 186 },
    small: { w: 960, q: 80, kb: 87 },
    min: { w: 640, q: 70, kb: 37 },
  };
/* @end save-sizes */

  function saveSize() {
    return SAVE_SIZES[cfg.saveSize] || SAVE_SIZES.std;
  }

  /** Where a finished frame goes besides the screen. */
  function fileShot(url, lit, paid) {
    if (lit) { ignitionShot = url; ignitionPaid = !!paid; return; }
    if (!party) return;
    if (paid) party.paidAt.push(party.shots.length);
    party.shots.push(url);
  }

  function onCaptureFailed(e) {
    if (/render/i.test(e.message)) log(t("log.norender"), "bad");
    else log(t("log.reqfail", { m: e.message }), "bad");
    setCaptureOk(false);
  }

  /** Photograph the capture scene: what it composites IS the photo (§5.2). */
  function captureToScreen(source, people, paid, lit, proof) {
    // Also reached from the saving path when saving fails, and that failure can
    // arrive long after the press. Everything the press was allowed on is asked
    // again here rather than assumed: the target is still a scene, the scene on
    // air is still one the broadcaster allowed, and this is still a connection.
    //
    // The saving path also hands over the yes ITS press was allowed on. A yes
    // that has been withdrawn since (the target was re-proved, sceneProof
    // moved) is not renewed here: that press is settled and not taken again,
    // or an old press would be photographed on whatever the name is now.
    if (proof === undefined) proof = sceneProof;   // the yes this shot was allowed on
    if (proof !== sceneProof) { log(t("log.shotstale"), "warn"); settlePaidShot(paid); return; }
    if (!identified || !srcIsScene || !sceneOpen()) { settlePaidShot(paid); return; }
    sceneShot("GetSourceScreenshot", {
      sourceName: source,
      imageFormat: "jpg",
      imageWidth: 960,
      imageCompressionQuality: 75
    }).then(function (d) {
      if (!d.imageData) throw new Error("empty imageData");
      // A frame taken on a yes that has since been withdrawn is not shown and
      // not kept. The name was a scene when this was asked; if it stopped
      // being one while OBS was answering, what came back may be a source
      // photographed by that name — the one picture this page must never put
      // on air (CLAUDE.md NEVER). Marking it ready would be wrong for the
      // same reason: the probe that clears srcIsScene never runs while
      // captureOk is true.
      if (proof !== sceneProof) { log(t("log.shotstale"), "warn"); return null; }
      logShot(t("log.shot", { kb: Math.round(d.imageData.length / 1024) }));
      setCaptureOk(true);
      watchJank("screen x" + people);
      showPhoto(d.imageData, people, paid);
      return d.imageData;
    }).then(function (url) {
      // After the print is on the wall, never before: settling first would let
      // the drain see an empty wall and no debt in the same instant. A dropped
      // frame (null) still settles — the purchase happened — and files nothing.
      //
      // And in a step of its own, with the failure handler beside it rather
      // than in a catch below: a throw from here on would otherwise land in
      // that catch and settle the same debt twice, and the count has a floor
      // of zero, so it would simply be paid off early — silently.
      settlePaidShot(paid);
      if (url) fileShot(url, lit, paid);
    }, function (e) {
      settlePaidShot(paid);
      // A failure on a withdrawn yes says nothing about the name now. Marking
      // not-ready here would undo the probe the re-proof already ran.
      if (proof !== sceneProof) { log(t("log.shotstale"), "warn"); return; }
      onCaptureFailed(e);
    });
  }

  /* ---- keeping a copy ----

     A file:// page cannot write to disk, so OBS writes the file. What it wrote
     is then what goes on screen — measured to load in the OBS browser source,
     from another folder, without --allow-file-access-from-files.

     Saved at the source's own resolution: the broadcaster is keeping these, and
     the encode is outside the graphics lock, so a bigger file costs them
     nothing on stream.

     A folder OBS cannot write to would otherwise turn every press into two
     captures — the failed save and the fallback — for as long as the stream
     lasts. After a few in a row, saving stops being attempted at all. */

  var saveFails = 0;
  var saveGaveUp = false;
  var SAVE_QUIET_AFTER = 3;

  /* ---- the framed copy ----

     What OBS writes is the bare game frame; the border, the caption and the
     badge live in this page. A page cannot write to disk, so the only way to
     get them into a file is to have OBS capture a source that already contains
     them — this same file, loaded again with #card (docs/plan.md §6).

     Two rules came out of measuring it, and both are load-bearing:
       - the card has to sit in a scene OBS is currently rendering. Hidden, or
         in a scene nobody is showing, it draws once and then freezes.
       - it is parked outside the canvas, so it appears neither on the broadcast
         nor in the photo, while still being drawn.

     The bare frame goes to one fixed temporary name that is overwritten every
     time, so the folder collects framed photos rather than two of everything. */
  var CARD_SOURCE = "SHUTTERPARTY frame (do not delete)";
  // Scratch names, used in turn. A single fixed name would need a cache-buster
  // on the URL, and a query string on a file:// path is not something to rely
  // on; cycling means the next photo is always at an address the page has not
  // just read.
  //
  // Twelve of them rather than two, because the contact sheet reads NINE of
  // these at once when the party ends. With two names it drew the same two
  // pictures nine times — the earlier ones had been overwritten long before the
  // sheet went looking for them. Twelve keeps the nine alive with room to spare,
  // and it stops a photo still flying across the stream from being overwritten
  // underneath itself.
  var CARD_TEMP = "0123456789ab".split("").map(function (c) {
    return "_shutterparty-frame-" + c + ".jpg";
  });
  var CARD_DRAW_MS = 400;      // measured: 250ms was enough for a redraw
  // Only a source that has just been CREATED needs this long: it has a page to
  // load. One that was merely moved to another scene does not — it kept running
  // while it was off air and needed only a frame to be picked up again
  // (measured: 50ms was already enough, 0ms was not).
  var CARD_FIRST_MS = 1600;
  var CARD_W = 1280;
  var CARD_PAD = 0.019;        // the same padding the stylesheet uses
  // The caption band under the photo, a fixed depth. It carries the name of
  // whoever paid, and that name is the point of a paid photograph — at 155 it
  // was a strip with writing in it rather than a caption. Raising this makes
  // the source taller; the stylesheet fills it, since .ccap takes what is left
  // after the picture.
  var CARD_CAP = 210;
  /** How tall the card must be to hold a subject of this shape. */
  function cardHeightFor(ratio) {
    var pad = CARD_W * CARD_PAD;
    return Math.round(pad + (CARD_W - pad * 2) / ratio + CARD_CAP);
  }
  var CARD_H = cardHeightFor(16 / 9);   // 872 — what most captures come out as
  var cardRatio = 16 / 9;               // the shape the card is built for now
  var cardMeasured = false;             // ...and whether that has been checked
  var cardReady = false;       // the source exists and has been parked
  var cardFresh = false;       // just created: the page itself is still loading
  var cardScene = "";          // which scene it is currently parked in
  var cardSwept = false;       // the one-off look for cards left in other scenes
  var shotSeq = 0;
  // Numbered per party rather than cycling, so the sheet still finds what it
  // remembers. Reset when a party opens (see openParty).
  var partySeq = 0;

  /* Framing is not a choice any more.
    *
    * It was "framed or plain", and plain was the worse half of it in every way
    * that could be measured: it wrote the capture scene at its own resolution
    * (no imageWidth), which made the UNFRAMED copy the heavier one, and what it
    * saved was a picture with nothing on it saying whose it was, what it cost,
    * or when it happened. The frame is the thing the product is about — a print
    * with a name on it — so a setting that turned it off was offering to make
    * the keepsake worse (本人の判断 2026-08-26).
    *
    * What remains is the question the broadcaster actually has: whether to save
    * at all, which of them, and how large. */

  /** This file again, as a card. Same folder, same file, different mode. */
  function cardUrl(hash) {
    return location.href.split("#")[0] + "#card&" + hash;
  }

  function dropCardFrom(scene) {
    return request("GetSceneItemId", { sceneName: scene, sourceName: CARD_SOURCE })
      .then(function (found) {
        return request("RemoveSceneItem", { sceneName: scene, sceneItemId: found.sceneItemId });
      })
      .catch(function () { /* not in that scene, which is the point */ });
  }

  /**
   * Leave exactly one card behind.
   *
   * The card has to follow whichever scene is on air, and placing it somewhere
   * new does not take it out of where it was. Without this the broadcaster
   * collects one card per scene they visit — which reads badly for a source
   * they were asked not to delete.
   *
   * Clearing it out everywhere first is not an option: an input that belongs to
   * no scene at all is destroyed by OBS (measured), and rebuilding it costs a
   * page load. So it is always placed before it is removed.
   *
   * The full search runs once per session. After that the scene it came from is
   * known, and one request is enough.
   */
  function sweepCard(keep, prev) {
    if (cardSwept) {
      if (!prev || prev === keep) return Promise.resolve();
      return dropCardFrom(prev);
    }
    cardSwept = true;
    return request("GetSceneList").then(function (d) {
      return (d.scenes || []).reduce(function (chain, sc) {
        if (sc.sceneName === keep) return chain;
        return chain.then(function () { return dropCardFrom(sc.sceneName); });
      }, Promise.resolve());
    });
  }

  /**
   * Make sure the card source exists, wherever this channel's photos come from.
   *
   * Re-checked rather than remembered: a broadcaster who deletes it — and they
   * will, it is a source with no visible purpose — gets it back on the next
   * photo instead of silently losing the frames.
   */
  function ensureCard() {
    // The scene on air is the only place this works, and it can change under
    // us. Cheap to ask, and the answer is what decides whether anything else
    // needs doing.
    //
    // Not the capture scene, tempting as that is: a capture scene is often not
    // nested into the broadcast at all — it exists purely to be photographed —
    // and OBS does not render what it is not showing. A screenshot of a scene
    // still composes correctly in that state, which is why the photos work; a
    // browser source inside it does not, and freezes on its first frame.
    return request("GetCurrentProgramScene").then(function (d) {
      var host = d.currentProgramSceneName || d.sceneName;
      if (!host) throw new Error("no scene on air");
      if (cardReady && cardScene === host) return null;   // already parked there

      return request("GetSceneItemId", { sceneName: host, sourceName: CARD_SOURCE })
        .then(function (found) { return { host: host, id: found.sceneItemId }; })
        .catch(function () {
          // The input may exist already, just in a scene that is no longer on
          // air — OBS allows only one input per name, so it is placed again
          // rather than created again.
          return request("CreateSceneItem", { sceneName: host, sourceName: CARD_SOURCE, sceneItemEnabled: true })
            .then(function (made) { return { host: host, id: made.sceneItemId }; })
            .catch(function () {
              return request("CreateInput", {
                sceneName: host,
                inputName: CARD_SOURCE,
                inputKind: "browser_source",
                inputSettings: {
                  is_local_file: false,
                  url: cardUrl(""),
                  width: CARD_W, height: CARD_H,
                  shutdown: false,          // it has to keep running while unseen
                  // Off, and unlike the overlay's it stays off: this source
                  // draws one card for the disk and never calls ensureAudio().
                  // Routing silence into the mixer is a fader that does nothing
                  // on a source the broadcaster is not supposed to notice.
                  reroute_audio: false
                },
                sceneItemEnabled: true      // enabled, but about to be parked
              }).then(function (made) {
