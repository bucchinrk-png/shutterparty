                log(t("log.cardmade", { n: CARD_SOURCE }), "ok");
                cardFresh = true;   // nothing drawn yet; the first wait is longer
                return { host: host, id: made.sceneItemId };
              });
            });
        })
        .then(function (at) {
          return request("SetSceneItemTransform", {
            sceneName: at.host,
            sceneItemId: at.id,
            sceneItemTransform: { positionX: 4000, positionY: 4000 }
          }).then(function () { return at; });
        });
    }).then(function (at) {
      if (!at) return null;
      var prev = cardScene;
      cardScene = at.host;
      // A card left behind in another scene is untidy, not fatal. Never lose a
      // photo over the tidying.
      return sweepCard(at.host, prev).catch(function () { /* leave it */ });
    }).then(function () {
      cardReady = true;
      return true;
    }).catch(function (e) {
      cardReady = false;
      log(t("log.cardfail", { m: e.message }), "warn");
      return false;
    });
  }

  // The last box worked out for the capture scene. The photo that flies across
  // the stream and the one written to disk are the same picture and want the
  // same crop, but the screen gets it first — so it is kept here rather than
  // being a local of the save path.
  var subjectBox = null;

  function refreshSubject() {
    return subjectRect(cfg.src).then(function (r) {
      subjectBox = r;
      return r;
    });
  }

  /**
   * A captured frame, with only the subject drawn.
   *
   * What OBS hands over is always the whole canvas of the capture scene, so a
   * camera cropped square arrives with transparent margins around it. Two
   * places on screen show these — the print that flies across the stream and
   * the contact sheet — and both want what the broadcaster framed, not the
   * canvas it was sitting in.
   *
   * Sized from the known box before anything loads, so a print does not resize
   * underneath the animation carrying it.
   */
  function subjectCanvas(url) {
    var c = document.createElement("canvas");
    // Named, because the paper under it is a canvas too (shell.html .skin).
    c.className = "subject";
    var guess = subjectBox || { w: 16, h: 9 };
    c.width = Math.round(guess.w);
    c.height = Math.round(guess.h);
    var src = new Image();
    src.onload = function () {
      var b = clampBox(subjectBox, src.naturalWidth, src.naturalHeight);
      if (!(b.w > 0 && b.h > 0)) return;
      c.width = Math.round(b.w);
      c.height = Math.round(b.h);
      c.getContext("2d").drawImage(src, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
    };
    src.src = url;
    return c;
  }

  var canvasSize = null;
  function videoSize() {
    if (canvasSize) return Promise.resolve(canvasSize);
    return request("GetVideoSettings").then(function (d) {
      canvasSize = { w: d.baseWidth, h: d.baseHeight };
      return canvasSize;
    }).catch(function () { return null; });
  }

  /**
   * Where the subject sits inside the picture OBS hands over.
   *
   * A scene is always photographed at the full canvas, so a camera cropped
   * square arrives with transparent bars around it. Those bars cannot be found
   * by looking: a file:// page is refused the pixels of a file:// image
   * (getImageData, fetch and XHR all measured, all refused). So the box comes
   * from what OBS says it drew.
   *
   * Being wrong here is not dangerous, which is the only reason this is
   * acceptable. The scene has already composited by the time it is a file, so
   * anything the broadcaster hid is not in the picture at all — the worst case
   * is a photo with its margins still on. Anything not plainly understood
   * therefore gives up and returns null, and the whole frame is used, exactly
   * as before this existed.
   */
  function subjectRect(sceneName) {
    if (!sceneName) return Promise.resolve(null);
    return request("GetSceneItemList", { sceneName: sceneName }).then(function (d) {
      var items = (d.sceneItems || []).filter(function (i) {
        if (i.sceneItemEnabled === false) return false;
        // The card can end up in the very scene being photographed — the
        // broadcaster only has to put that scene on air, and it has to live
        // wherever OBS is rendering. It sits far outside the canvas on purpose,
        // so counting it would stretch the box to the far corner and drag the
        // transparent margin back into the photo (seen: a shot with black down
        // two sides). It is never in the picture, so it is never in the box.
        return i.sourceName !== CARD_SOURCE;
      });
      if (!items.length) return null;
      // A nested scene or group would need the parent's transform composed with
      // the child's, and getting that subtly wrong is not worth a margin.
      if (items.some(function (i) {
        return i.isGroup || i.sourceType === "OBS_SOURCE_TYPE_SCENE";
      })) return null;

      return Promise.all(items.map(function (i) {
        return request("GetSceneItemTransform", {
          sceneName: sceneName, sceneItemId: i.sceneItemId
        }).then(function (r) { return r.sceneItemTransform; })
          .catch(function () { return null; });
      })).then(function (list) {
        var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        for (var k = 0; k < list.length; k++) {
          var tf = list[k];
          if (!tf || tf.rotation) return null;          // rotated: give up
          // A bounding box refits the item after cropping and changes what the
          // numbers mean again; not worth guessing at for the sake of a margin.
          if (tf.boundsType && tf.boundsType !== "OBS_BOUNDS_NONE") return null;
          // width and height do NOT account for the crop — measured: with
          // cropLeft 420 and cropRight 420 on a 1920-wide source, width is
          // still 1920. What is drawn has to be derived from the crop itself.
          var w = Math.abs((tf.sourceWidth - tf.cropLeft - tf.cropRight) * tf.scaleX);
          var h = Math.abs((tf.sourceHeight - tf.cropTop - tf.cropBottom) * tf.scaleY);
          if (!(w > 0 && h > 0)) return null;
          // alignment says which point of the item positionX/Y refers to.
          var a = tf.alignment || 0;
          var x = tf.positionX - ((a & 1) ? 0 : ((a & 2) ? w : w / 2));
          var y = tf.positionY - ((a & 4) ? 0 : ((a & 8) ? h : h / 2));
          if (x < x0) x0 = x;
          if (y < y0) y0 = y;
          if (x + w > x1) x1 = x + w;
          if (y + h > y1) y1 = y + h;
        }
        if (!isFinite(x0) || !isFinite(y0)) return null;

        return videoSize().then(function (cv) {
          if (!cv) return null;
          // Out towards the margin, never in towards the subject: a hair of
          // transparent border costs nothing, a hair of missing face does not.
          var P = 2;
          var ax = Math.max(0, Math.floor(x0) - P);
          var ay = Math.max(0, Math.floor(y0) - P);
          var bx = Math.min(cv.w, Math.ceil(x1) + P);
          var by = Math.min(cv.h, Math.ceil(y1) + P);
          if (!(bx > ax && by > ay)) return null;
          // Filling the canvas already means there is nothing to trim.
          if (bx - ax >= cv.w && by - ay >= cv.h) return null;
          return { x: ax, y: ay, w: bx - ax, h: by - ay };
        });
      });
    }).catch(function () { return null; });
  }

  /**
   * Make the card the shape of the subject.
   *
   * The photo area is as wide as the card and as tall as the subject needs, so
   * a square camera produces a square photo rather than one cut to 16:9. What
   * is being captured does not change shape mid-stream, so this settles on the
   * first photo and then does nothing.
   */
  /**
   * What shape the card source actually is, rather than what this page assumes.
   *
   * The source outlives the page. A reload starts out believing the card is
   * built for 16:9 — and if an earlier session left it at some other shape,
   * nothing ever disagrees, because the measured subject is usually 16:9 too.
   * The resize is then skipped as unnecessary and every photo of that session
   * comes out with a band of dead space under it (seen on air: 1280x1164 cards
   * holding a 693px picture, for a session and a half, until something happened
   * to change the ratio).
   *
   * So the first fit of a session asks. Once.
   */
  function measureCard() {
    if (cardMeasured) return Promise.resolve();
    cardMeasured = true;
    return request("GetInputSettings", { inputName: CARD_SOURCE }).then(function (d) {
      var set = d.inputSettings || {};
      var h = Number(set.height);
      var w = Number(set.width);
      var pad = CARD_W * CARD_PAD;
      // A width we did not choose makes the height meaningless, and a height
      // with no room for a picture is not a card. Either way: resize.
      if (w !== CARD_W || !(h > pad + CARD_CAP)) { cardRatio = 0; return; }
      CARD_H = h;
      cardRatio = (CARD_W - pad * 2) / (h - pad - CARD_CAP);
    }).catch(function () {
      // Could not ask, so cannot claim to know.
      cardRatio = 0;
    });
  }

  function fitCardTo(ratio) {
    if (!(ratio > 0.05 && ratio < 20)) ratio = 16 / 9;        // nonsense: stay put
    return measureCard().then(function () {
      if (Math.abs(ratio - cardRatio) < 0.01) return;
      var h = cardHeightFor(ratio);
      return request("SetInputSettings", {
        inputName: CARD_SOURCE,
        inputSettings: { width: CARD_W, height: h },
        overlay: true
      }).then(function () {
        CARD_H = h;
        cardRatio = ratio;
        // Resizing a browser source reloads its page, so the next draw needs
        // the long wait rather than the redraw one.
        cardFresh = true;
      }).catch(function () { /* keep the shape we already had */ });
    });
  }

  /* One card source, two jobs.
   *
   * A framed photo and the contact sheet both work by rewriting the card's URL,
   * waiting for it to draw, and capturing it. Run two of those at once and the
   * second rewrite lands during the first one's wait, so the first captures the
   * second's picture. The party ends while a photo taken moments earlier may
   * still be in its wait, so this is not a theoretical overlap.
   *
   * They queue instead. A failure does not stall the queue: whatever is next
   * runs either way. */
  var cardChain = Promise.resolve();

  function onCard(fn) {
    var run = cardChain.then(fn, fn);
    cardChain = run.catch(function () {});
    return run;
  }

  /**
   * Nine out of however many, spread across the whole party.
   *
   * The last nine are the last nine seconds: everyone is doing the same thing
   * by then, and a sheet of nine near-identical frames is a worse souvenir than
   * one that reaches back to the countdown. Endpoints included on purpose — the
   * first shot of a party and its last are the two worth keeping.
   */
  function spread(list, n) {
    if (list.length <= n) return list.slice();
    var out = [];
    for (var i = 0; i < n; i++) {
      out.push(list[Math.round(i * (list.length - 1) / (n - 1))]);
    }
    return out;
  }

  /**
   * Nine for the sheet, paid ones first.
   *
   * A paid photograph is the one somebody put their name and their Bits on, and
   * the sheet is the thing that gets saved and reposted — so if nine have to
   * stand for a whole party, those are the nine. Free prints fill whatever is
   * left, spread across the party as before.
   *
   * Kept in the order they were taken: the sheet still reads left to right as
   * the party happened, rather than sorting the payers to the front. Positions
   * rather than addresses, because the scratch filenames cycle and the same
   * address can appear twice in one party.
   */
  function pickSheet(shots, paidAt, n) {
    if (shots.length <= n) return shots.slice();
    var paid = [], free = [];
    for (var i = 0; i < shots.length; i++) {
      (paidAt.indexOf(i) === -1 ? free : paid).push(i);
    }
    var keep = spread(paid, Math.min(paid.length, n));
    if (keep.length < n) keep = keep.concat(spread(free, n - keep.length));
    keep.sort(function (a, b) { return a - b; });
    return keep.map(function (i) { return shots[i]; });
  }

  /**
   * What the party added up to, in the corner of the sheet.
   *
   * English in every language, like SHUTTERPARTY and Bits (CLAUDE.md): the
   * sheet is a picture that gets saved and reposted, and a number beside a word
   * survives being read by somebody whose Twitch is set to something else.
   *
   * "presses" rather than "people" because that is what is counted — the
   * headcount of each capture, added up, so one viewer pressing three times is
   * three. Calling that a number of people would overstate the crowd on a file
   * that outlives the stream.
   */
  function sheetTally(shots, presses) {
    var s = shots + (shots === 1 ? " shot" : " shots");
    var p = presses + (presses === 1 ? " press" : " presses");
    return s + " · " + p;
  }

  /** The size the sheet source has to be to hold this many subjects.
   *
   * The same numbers as the sheet's CSS (shell.html, contact sheet), counted
   * in the tray's unit: the tray is SHEET_TRAY units wide, and in the card
   * source it fills the width less SHEET_PAD on each side. Change one side
   * and not the other and the bottom of the saved sheet is cut off. */
  var SHEET_PAD = 40;          // the ground around the tray, px (card mode: 100vw - 80px)
  var SHEET_TRAY = 900;        // .sheet-tray width, u
  var SHEET_BOX_X = 44;        // .sheet-tray side padding, u
  var SHEET_BOX_Y = 28 + 30;   // .sheet-tray top + bottom padding, u
  var SHEET_ROWS_GAP = 14;     // .sheet-tray row-gap (head / grid / foot), u
  var SHEET_HEAD = 52;         // .sheet-head height, u
  var SHEET_FOOT = 40;         // .sheet-foot height, u
  var SHEET_GAP_X = 16;        // .sheet-grid column gap, u
  var SHEET_GAP_Y = 18;        // .sheet-grid row gap, u
  var SHEET_PAPER = 8;         // a print's white margin (canvas padding), u
  var SHEET_COLS = 3;

  function sheetSizeFor(ratio, count) {
    var u = (CARD_W - 2 * SHEET_PAD) / SHEET_TRAY;
    var innerW = (SHEET_TRAY - 2 * SHEET_BOX_X) * u;
    var cellW = (innerW - (SHEET_COLS - 1) * SHEET_GAP_X * u) / SHEET_COLS;
    var paper = SHEET_PAPER * u;
    var cellH = (cellW - 2 * paper) / ratio + 2 * paper;
    var rows = Math.max(1, Math.ceil(count / SHEET_COLS));
    var gridH = rows * cellH + (rows - 1) * SHEET_GAP_Y * u;
    var trayH = (SHEET_BOX_Y + SHEET_HEAD + SHEET_FOOT + 2 * SHEET_ROWS_GAP) * u + gridH;
    return {
      w: CARD_W,
      // Up, never down: a pixel short is the row of the last prints cut off.
      h: Math.ceil(2 * SHEET_PAD + trayH)
    };
  }

  /**
   * Write the contact sheet to the folder, once per party.
   *
   * The same trick as a framed photo — the card source draws it and OBS
   * captures that — because the page still cannot write a file itself. What it
   * cannot do this time is hand over pixels: the shots are file:// addresses
   * and a file:// page may not read the pixels of a file:// image, so the sheet
   * is rebuilt from the same addresses inside the card and drawn there.
   *
   * Which is why the scratch names run twelve deep rather than two: by the time
   * a party ends, the nine on the sheet have to still be on disk.
   */
  function saveSheet(done) {
    if (!cfg.saveDir) return Promise.resolve();
    var picks = pickSheet(done.shots, done.paidAt || [], 9);
    if (!picks.length) return Promise.resolve();
    // Only what OBS wrote can be redrawn from an address. Without a folder the
    // shots are data: URLs, and those never reach here.
    if (picks.some(function (u) { return String(u).slice(0, 5) !== "file:"; })) return Promise.resolve();

    return onCard(function () {
      return ensureCard().then(function (ok) {
        if (!ok) return;
        return refreshSubject().then(function (box) {
          var ratio = box ? box.w / box.h : 16 / 9;
          var size = sheetSizeFor(ratio, picks.length);
          return request("SetInputSettings", {
            inputName: CARD_SOURCE,
            inputSettings: { width: size.w, height: size.h },
            overlay: true
          }).then(function () {
            // Resizing reloads the page, so the next framed photo has to resize
            // back and wait the long wait. Forget the shape we were holding —
            // and stay measured, because we are the ones who changed it.
            cardRatio = 0;
            cardMeasured = true;
            cardFresh = true;
            var hash = "sheet=1" +
              "&accent=" + encodeURIComponent(cfg.accent || "safelight") +
              themeHash() +
              "&when=" + encodeURIComponent(savedStamp()) +
              "&tally=" + encodeURIComponent(sheetTally(done.shots.length, done.people)) +
              (box ? "&crop=" + [box.x, box.y, box.w, box.h].join(",") : "") +
              "&imgs=" + picks.map(encodeURIComponent).join("|");
            return request("SetInputSettings", {
              inputName: CARD_SOURCE,
              inputSettings: { is_local_file: false, url: cardUrl(hash) },
              overlay: true
            });
          }).then(function () {
            // Nine pictures to decode rather than one, and the page has just
            // been reloaded by the resize.
            return new Promise(function (r) { setTimeout(r, CARD_FIRST_MS); });
          }).then(function () {
            cardFresh = false;
            var out = joinPath(cfg.saveDir, "shutterparty-sheet-" + fileStamp() + ".jpg");
            return request("SaveSourceScreenshot", {
              sourceName: CARD_SOURCE, imageFormat: "jpg", imageFilePath: out,
              imageCompressionQuality: 92
            }).then(function () { log(t("log.sheetsaved", { p: out }), "ok"); });
          });
        });
      }).catch(function (e) {
        cardReady = false;
        log(t("log.sheetfail", { m: e.message }), "warn");
      });
    });
  }

  /** Draw the photo into the card, then have OBS capture the card. */
  function saveFramed(tempUrl, people, paid) {
    return onCard(function () { return framedRun(tempUrl, people, paid); });
  }

  function framedRun(tempUrl, people, paid) {
    var box = null;
    return ensureCard().then(function (ok) {
      if (!ok) return "stop";                 // ensureCard has already said why
      // The subject's shape decides the card's, so both are settled before the
      // picture is handed across.
      return refreshSubject().then(function (r) {
        box = r;
        return fitCardTo(r ? r.w / r.h : 16 / 9);
      });
    }).then(function (stopped) {
      if (stopped === "stop") return;
      // The saved file is the same print as the one on the wall, so it wears
      // the same theme and the same pack (themeHash; docs/theme-pack-plan.md
      // §5). Left off, the wall would be patterned and the folder plain.
      var hash =
        "img=" + encodeURIComponent(tempUrl) +
        "&accent=" + encodeURIComponent(cfg.accent || "safelight") +
        themeHash() +
        "&when=" + encodeURIComponent(savedStamp()) +
        (paid ? "&bits=" + paid.bits + "&name=" + encodeURIComponent(paid.name || "") +
          "&sku=" + encodeURIComponent(paid.sku || "") : "") +
        (!paid && people > 1 ? "&people=" + people : "") +
        (box ? "&crop=" + [box.x, box.y, box.w, box.h].join(",") : "");

      return request("SetInputSettings", {
        inputName: CARD_SOURCE,
        inputSettings: { is_local_file: false, url: cardUrl(hash) },
        overlay: true
      }).then(function () {
        // The card has to decode the picture and lay out before there is
        // anything worth capturing. This wait is off the critical path: the
        // photo is already on screen by now. A source created moments ago is
        // still loading the page itself, which takes considerably longer than
        // redrawing one that is already up.
        var wait = cardFresh ? CARD_FIRST_MS : CARD_DRAW_MS;
        cardFresh = false;
        return new Promise(function (r) { setTimeout(r, wait); });
      }).then(function () {
        var sz = saveSize();
        var out = joinPath(cfg.saveDir, keepName(people, paid));
        return request("SaveSourceScreenshot", {
          sourceName: CARD_SOURCE, imageFormat: "jpg", imageFilePath: out,
          imageWidth: sz.w, imageCompressionQuality: sz.q
        }).then(function () { logShot(t("log.savedTo", { p: out })); });
      });
    }).catch(function (e) {
      // The photo itself was taken and shown; only the framed copy is missing.
      cardReady = false;        // it may have been deleted mid-stream
      log(t("log.cardfail", { m: e.message }), "warn");
    });
  }

  function captureToDisk(source, people, paid, lit) {
    // The same last word as captureToScreen: the target is still a scene, the
    // scene on air is still one the broadcaster allowed, and this is still a
    // connection. A press can be in flight while the broadcaster steps away,
    // and this path writes a file that outlives the moment.
    if (!identified || !srcIsScene || !sceneOpen()) { settlePaidShot(paid); return; }
    var proof = sceneProof;      // the yes this shot was allowed on
    // Started alongside the capture rather than awaited: the photo goes on
    // screen the moment the file lands, and this is only a few local requests.
    // Until the first one answers the box is null and the whole frame is used,
    // which is what happened before any of this existed.
    refreshSubject();
    // Where the bare frame goes.
    //
    // Outside a party the twelve names cycle: a photograph is on screen for a
    // few seconds and then only the framed copy matters, so twelve is more than
    // enough to keep one from being overwritten underneath itself.
    //
    // Inside a party it is not. The sheet reaches back across the whole party
    // and picks nine spread through it — which is to say it asks for the EARLY
    // ones, and a party runs twenty seconds at one capture per 150ms window.
    // Twelve names are used up in under two seconds, so by the time the sheet
    // went looking, the addresses it held pointed at photographs taken later.
    // Duplicates, and shots of a moment that was not the one being remembered.
    //
    // So a party numbers its own, and nothing it took is overwritten until the
    // next party starts. The count resets there, which is what keeps this from
    // growing without end: the folder holds as many as the largest party, not
    // as many as the broadcast.
    //
    // The frame that lit the party needs the same protection and does not get
    // it from the line above, because it is taken BEFORE the party opens: the
    // winner's name is on screen for 3s and the countdown for another 3s
    // (LASTHIT_MS + COUNTDOWN_MS), and presses keep landing through all six.
    // Twelve cycling names at one capture per 150ms window are used up in 1.8
    // seconds, so the address openParty() hands to the sheet as its lead frame
    // (§4.3) was pointing at a later photograph long before the party started.
    // A name of its own, and one is enough: the next ignition cannot happen
    // until the cooldown has run, which is some forty seconds after this one.
    /* Scratch or keeper.
     *
     * With framing on the bare frame is always scratch — the card is what the
     * broadcaster keeps — so the only question is which scratch name. Without
     * framing this file IS the keeper, and when the setting says not to keep
     * this one it has to go to a scratch name instead of simply not being
     * written: the contact sheet reads these back by address, and a party frame
     * that never landed cannot be in it.
     *
     * Outside a party a photograph nobody keeps never reaches here at all — the
     * fork above sends it to captureToScreen, which writes nothing. */
    var keep = keepThisShot(paid);
    var scratch = joinPath(cfg.saveDir, lit
      ? "_shutterparty-ignition.jpg"
      : party
        ? "_shutterparty-party-" + (partySeq++) + ".jpg"
        : CARD_TEMP[(shotSeq++) % CARD_TEMP.length]);
    // Always scratch now. The bare frame is never the keeper — the card is —
    // so this file exists to be re-photographed and then overwritten, and it
    // keeps its full width because the card and the sheet both draw FROM it.
    // Shrinking here would shrink twice.
    var path = scratch;
    sceneShot("SaveSourceScreenshot", {
      sourceName: source, imageFormat: "jpg", imageFilePath: path,
      imageCompressionQuality: 90
    }).then(function () {
      // The same last word as captureToScreen: a file written on a yes that
      // has since been withdrawn is neither shown nor kept. The debt is still
      // settled — the purchase happened — and the scratch name it went to is
      // overwritten by the next press, which is all this page can do about a
      // file (it cannot delete one, docs/plan.md Phase 6). Before the saving
      // tally, too: an answer to a withdrawn question says nothing about
      // whether saving works now.
      if (proof !== sceneProof) { log(t("log.shotstale"), "warn"); settlePaidShot(paid); return; }
      if (saveFails) log(t("log.saveok"), "ok");
      saveFails = 0;
      setCaptureOk(true);
      watchJank("saved x" + people);
      // The screen shows the bare frame; the border belongs to the file, not to
      // the photo flying across the stream (that one already has its own).
      //
      // Freshened, and this is not a nicety.
      //
      // The scratch names cycle through twelve, and OBS overwrites the file
      // underneath an address the page has already loaded. The browser answers
      // the second load from its cache, which is the picture that was at that
      // address BEFORE — a photograph taken minutes or hours earlier, of
      // whatever the broadcaster was doing then. Reloading the source makes it
      // certain rather than likely: the counter starts at zero again, so the
      // first press after a reload asks for the address most likely to be held.
      // 実測 2026-08-25: photographs from an off-air test window appeared on
      // the stream, on the first press after going live.
      //
      // A different address every time is the whole fix. The query is ignored
      // when the file is opened and counted when the cache is consulted, and it
      // goes on after fileUrl() rather than inside it — that function escapes
      // "?" on purpose, because a folder may be named with one.
      var shown = fileUrl(path) + "?v=" + freshId();
      showPhoto(shown, people, paid);
      settlePaidShot(paid);        // on the wall, so the drain can see it
      // Nothing past the settle may reach the catch below. It would settle the
      // same debt a second time — the count has a floor of zero, so that is
      // simply paid off early, silently — and then take a second photograph
      // for a save that did not fail. Caught here and said, instead; the shape
      // of the catch itself is what tools/overlay-invariants.mjs pins.
      try {
        fileShot(shown, lit, paid);
        // The card is the keeper — the only file that outlives this one — so
        // it is made for a photograph the broadcaster asked to keep, and not
        // otherwise.
        if (keep) saveFramed(shown, people, paid);
      } catch (e) {
        log(t("log.reqfail", { m: e.message }), "warn");
      }
    }).catch(function (e) {
      // Counted against saving only while the yes still stands: a save that
      // failed because the target was re-proved meanwhile (the name went away
      // under it) says nothing about the folder, and three such would give
      // saving up for the rest of the stream.
      if (proof === sceneProof) {
        saveFails++;
        // The path is the thing most likely to be wrong, so say which one failed.
        log(t("log.savefail", { m: e.message }) + " [" + path + "]", "bad");
        if (saveFails >= SAVE_QUIET_AFTER) {
          saveGaveUp = true;
          log(t("log.savegaveup"), "warn");
        }
      }
      // The show goes on: a second capture, but only while saving is broken.
      // The debt travels with the photograph and is settled there — settling it
      // here as well would count one purchase twice and let the party end while
      // the fallback capture was still running. The yes travels with it too:
      // the fallback refuses a press whose yes was withdrawn while the save
      // was failing, rather than taking it on a renewed one.
      captureToScreen(source, people, paid, lit, proof);
    });
  }

  /**
   * A value no address has carried before, in this page or a previous one.
   *
   * The clock alone repeats across a reload only if two shots land in the same
   * millisecond; the counter alone repeats on every reload, which is exactly
   * when the scratch names are reused. Together they cannot collide.
   */
  var freshSeq = 0;
  function freshId() {
    freshSeq += 1;
    return String(Date.now()) + "-" + freshSeq;
  }

  /** A path OBS understands, turned into one the page can load. */
  function fileUrl(p) {
    var slashed = String(p).replace(/\\/g, "/");
    // encodeURI leaves # and ? alone because they delimit a URL — but they are
    // ordinary characters in a Windows folder name, and left as they are the
    // browser would ask for everything before the # and find nothing there.
    var safe = encodeURI(slashed).replace(/#/g, "%23").replace(/\?/g, "%3F");
    if (slashed.slice(0, 2) === "//") return "file:" + safe;                 // \\server\share
    return "file:///" + safe.replace(/^\/+/, "");
  }

  function joinPath(dir, name) {
    // A path pasted from Explorer's "Copy as path" arrives quoted, and a config
    // written before that was handled would still carry them.
    dir = String(dir || "").trim();
    if (dir.length > 1 && dir.charAt(0) === "\"" && dir.charAt(dir.length - 1) === "\"") {
      dir = dir.slice(1, -1).trim();
    }
    var sep = dir.indexOf("/") >= 0 && dir.indexOf("\\") === -1 ? "/" : "\\";
    return dir.replace(/[\\/]+$/, "") + sep + name;
  }

  /**
   * Sortable, and legal in a Windows filename.
   *
   * Named for the file rather than for the time: this whole page is one scope,
   * and a plain stamp() here was silently replaced by the clock formatter the
   * photo caption uses, which puts colons in — a character Windows will not
   * accept in a filename. tools/dupe-check.mjs now looks for that class.
   */
  /* The name a kept photograph gets.
   *
   * The amount is in it because nothing here can delete a file (Phase 6), so
   * the folder is cleared by hand — and by hand means sorting by name and
   * selecting a run of them. Without a mark, "keep what was bought, drop the
   * rest" is a job of opening two hundred pictures. With one it is two clicks.
   *
   * The headcount stays for the free ones: it is what that photograph was, and
   * it was already in the name before this. */
  function keepName(people, paid) {
    return "shutterparty-" + fileStamp() + "-" +
      (paid ? "paid" + paid.bits : "free" + people) + ".jpg";
  }

  /**
   * What a saved print says underneath, in the shape the broadcaster chose.
   *
   * One function for both of the things that get saved — the photograph and
   * the contact sheet — because they are one choice. Written twice, "date"
   * would have meant a date on one and a time on the other, and the setting
   * would be lying in one of the two places.
   *
   * Nothing here says SHUTTERPARTY: the saved card already carries it in the
   * corner (.cmark in overlay/shell.html), so putting it in the caption too
   * would print it twice on the same card (docs/stamp-plan.md §1.C).
   *
   * Empty is a real answer, and the card hides the element rather than drawing
   * an empty one — see 10-card-mode.js.
   */
  function savedStamp() {
    var mode = cfg.stampSave || "datetime";
    if (mode === "off") return "";
    var d = new Date();
    var p = function (v) { return String(v).padStart(2, "0"); };
    var date = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    var time = p(d.getHours()) + ":" + p(d.getMinutes());
    if (mode === "date") return date;
    if (mode === "time") return time;
    return date + "  " + time;
  }

  function fileStamp() {
    var d = new Date();
    var p = function (v) { return String(v).padStart(2, "0"); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" +
      p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + "-" + p(d.getMilliseconds() / 10 | 0);
  }

  function setCaptureOk(ok) {
    if (captureOk === ok) return;
    captureOk = ok;
    reportOverlayState();
    if (ok) cancelCaptureProbe();
    else scheduleCaptureProbe();
  }

  function cancelCaptureProbe() {
    clearTimeout(captureProbeTimer);
    captureProbeTimer = null;
    captureProbeWait = 0;
  }

  /**
   * While capture is broken the EBS refuses presses, so nothing else would ever
   * try again — the overlay has to be the one that finds out it recovered.
   * A tiny screenshot is cheap, and this only runs while something is wrong.
   */
  function scheduleCaptureProbe() {
    clearTimeout(captureProbeTimer);
    captureProbeWait = Math.min(captureProbeWait ? captureProbeWait * 2 : 5000, 60000);
    captureProbeTimer = setTimeout(probeCapture, captureProbeWait);
  }

  /**
   * Take one tiny frame to find out whether taking frames works.
   *
   * Runs once on connecting, and again on a backoff while capture is broken —
   * the EBS refuses presses in the meantime, so nothing else would ever try.
   */
  function probeCapture() {
    captureProbeTimer = null;
    if (captureOk || !identified || !cfg.src) return;
    var proof = sceneProof;
    verifySceneTarget().then(function (ok) {
      // A reprove since this began has started a probe of its own; this one
      // would only race it, and its "ready" would be about the old target.
      if (proof !== sceneProof) return;
      if (!ok) { scheduleCaptureProbe(); return; }
      return request("GetSourceScreenshot", {
        sourceName: cfg.src, imageFormat: "jpg", imageWidth: 64, imageCompressionQuality: 20
      }).then(function (d) {
        if (proof !== sceneProof) return;
        if (!d.imageData) throw new Error("empty imageData");
        log(t("log.ready"), "ok");
        setCaptureOk(true);
      }).catch(function (e) {
        // The same for a failure: an answer to a withdrawn question must not
        // reset the retry that the reprove's own probe is already running.
        if (proof !== sceneProof) return;
        log(t("log.notready", { m: e.message }), "warn");
        scheduleCaptureProbe();
      });
    });
  }

  /**
   * Prove the target names a scene before anything photographs it.
   *
   * Only a yes is remembered. A name that is not a scene now may be one in a
   * moment — the broadcaster is being told to fix it — and this rides on the
   * capture probe's backoff, so asking again costs one request while nothing
   * is being photographed anyway.
   */
  function verifySceneTarget() {
    if (srcIsScene) return Promise.resolve(true);
    var proof = sceneProof;
    return request("GetSceneList").then(function (d) {
      // Asked before the target changed, answered after: the list is from
      // before, and writing it would turn the cached yes back on for a name
      // that may now be an input. The question has been asked again already.
      if (proof !== sceneProof) return false;
      var names = (d.scenes || []).map(function (s) { return s.sceneName; });
      srcIsScene = names.indexOf(cfg.src) !== -1;
      if (!srcIsScene) log(t("log.notascene", { n: cfg.src }), "bad");
      return srcIsScene;
    }).catch(function () {
      return false;                // unknown is refused, and asked again later
    });
  }

  /* ================= effects =================

     Ported from docs/prototype/overlay.html, which is where these numbers were
     decided by hand. The prototype drew over a fake canvas; here the frame comes
     from OBS, but the presentation is identical. */

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var W = window.innerWidth, H = window.innerHeight;

  /* How big a photograph is, and how big a spark is, on a frame of this size.
   *
   * NOT the width. Every size here used to count in W, which is right until the
   * frame stops being landscape: a 9:16 canvas has the same AREA as the 16:9
   * one it replaces (1080x1920 and 1920x1080 are both 2,073,600 px) and the
   * broadcaster is still one person on it, so a photograph that crossed the
   * stream at 227px was landing at 133px — 38% of the area — for no reason
   * anybody chose (docs/vertical-plan.md §5.3, 本人 2026-09-14:「通常時の
   * 撮った写真のサイズの占有比は横画面と同じにしたい」).
   *
   * So: the width of the 16:9 frame with the same area. On any 16:9 canvas
   * this is W exactly — sqrt(W * 9W/16) * 4/3 = W — so nothing in landscape
   * moves by a pixel, at 1920x1080 or at 1280x720. On 1080x1920 it is 1920,
   * which is 16/9 of the width, and the photographs come back to the size they
   * have in landscape. */
  function photoBase() { return Math.sqrt(W * H) * 4 / 3; }

  /* The band Twitch's own interface sits in, as pixels, read from where it is
   * decided rather than decided again here.
   *
   * The stylesheet owns the question "is this a vertical canvas, and how much
   * of it does Twitch draw over" — it answers it in a media query and two
   * custom properties (shell.html, the safe band). Asking the same question a
   * second time in JavaScript would mean two conditions to keep in step, and
   * the one that drifted would be invisible: the wall would be laid out for a
   * band the CSS had already moved. Reading the property means there is one
   * answer. On a landscape canvas the property is not set at all and these are
   * 0, which is what every measurement in this file was taken against. */
  var safeT = 0, safeB = 0;
  function readBand() {
    var cs = getComputedStyle(document.documentElement);
    var pct = function (name) {
      var v = String(cs.getPropertyValue(name) || "").trim();
      return v.slice(-1) === "%" ? H * parseFloat(v) / 100 : 0;
    };
    safeT = pct("--safe-top");
    safeB = pct("--safe-bottom");
  }
  function safeTop() { return safeT; }
  function safeBottom() { return safeB; }

  function measure() { W = window.innerWidth; H = window.innerHeight; readBand(); }
  readBand();
  window.addEventListener("resize", function () {
    measure();
    if (stack.length) layoutStack();
    // The wall and the free seat are placed from W, H and the band, and neither
    // had a way back: layoutPaid() ran only when a print entered or left, and
    // the free seat's transform was written once on the way in. A browser
    // source keeps the size it was created at, so this never showed — until a
    // broadcaster puts the same page in a 1080x1920 source, or resizes the one
    // they have, and the prints stay laid out for the old shape
    // (docs/vertical-plan.md §1.5).
    relayoutSeats();
  });

  var ovSparks = document.getElementById("ovSparks");
  var ovFlash = document.getElementById("ovFlash");

  var flashMode = reduceMotion ? "soft" : "full";   // full | soft | off
  var MAX_SPARKS = 40;            // concurrent point lights; overflow spills to the next burst
  var FULL_FLASH_MIN_MS = 334;    // <= 3Hz
  var FULL_FLASH_MAX_OPACITY = 0.35;
  var liveSparks = 0;
  var lastFullFlash = 0;

  // gold, when given, is the amount's colour step ("10" … "1000"): a paid
  // spark is drawn in the colour of what was bought.
  function spark(delay, gain, gold) {
    if (liveSparks >= MAX_SPARKS) return;
    liveSparks++;
    var el = document.createElement("div");
    el.className = gold ? "spark gold" : "spark";
    if (gold) el.style.setProperty("--glow-rgb", "var(--b" + gold + ")");
    var depth = Math.random();
    // In photoBase(), not H: a spark is a light in the crowd, and a crowd does
    // not get bigger because the frame got taller. Measured on H it went from
    // 22–56px to 35–102px on a vertical canvas while the vessels around it
    // shrank to 56%, which is about three times the size it should have been
    // against them (docs/vertical-plan.md §1.2). The factors are the old ones
    // divided by 16/9, so a 1920x1080 frame draws exactly what it drew.
    var size = ((photoBase() * 0.010125) + depth * (photoBase() * 0.02025)) * ovScale;
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.left = (Math.random() * 96 + 2) + "%";
    el.style.bottom = ((1 - depth) * 26 + Math.random() * 4) + "%";
    ovSparks.appendChild(el);

    var peak = flashMode === "off" ? 0 : (0.55 + depth * 0.45);
    var frames = reduceMotion
      ? [{ opacity: 0 }, { opacity: peak * 0.7 }, { opacity: 0 }]
      : [
          { opacity: 0, transform: "scale(.4)" },
          { opacity: peak, transform: "scale(1)", offset: 0.16 },
          { opacity: 0, transform: "scale(1.25)" }
        ];
    var a = el.animate(frames, { duration: 190, delay: delay, easing: "cubic-bezier(.2,.8,.4,1)" });
    a.onfinish = a.oncancel = function () { el.remove(); liveSparks--; };
    setTimeout(function () { shutter(gain); }, delay);
  }

  // Large-area luminance change is the photosensitivity risk, so this is the one
  // effect with a hard rate and opacity ceiling. Point lights are exempt.
  //
  // The ceiling is measured on the SCREEN, not per layer, and that is why the
  // claim below is split out of the paint. There are two whole-frame surfaces —
  // #ovFlash here and #ovGold (92-bar-and-party.js) — and a 250 Bits purchase
  // draws both. Each was under 0.35 on its own while the two together
  // composited to about 0.49, and only #ovFlash was on the clock, so a run of
  // queued purchases restarted the wash every 150ms: 6.7Hz on a layer whose
  // budget said 3. Both now pass through claimFullFrame(), so the rate is one
  // clock, and a caller that draws both splits one allowance between them.

  /**
   * May a whole-frame luminance change start now? Claims the window if so.
   *
   * Split from the paint because the caller that draws two surfaces has to ask
   * ONCE and then paint both — asking per layer is what let two layers each
   * take a full allowance, and put the sum over the ceiling.
   */
  function claimFullFrame() {
    if (flashMode === "off") return false;
    var now = performance.now();
    if (now - lastFullFlash < FULL_FLASH_MIN_MS) return false;
    lastFullFlash = now;
    return true;
  }

  /** Paint the white surface. The window must already be claimed. */
  function paintFlash(strength, ceiling) {
    var top = ceiling === undefined ? FULL_FLASH_MAX_OPACITY : ceiling;
    var cap = flashMode === "soft" ? top * 0.45 : top;
    ovFlash.animate(
      [{ opacity: 0 }, { opacity: Math.min(cap, cap * strength), offset: 0.12 }, { opacity: 0 }],
      { duration: 260, easing: "ease-out" }
    );
  }

  function fullFlash(strength) {
    if (!claimFullFrame()) return;
    paintFlash(strength);
  }

  /* ---- crowd level: how many shot in the last few seconds ---- */

  var ROLLING_MS = 3000;
  var recent = [];   // { at, n }

  function rollingCount() {
    var cutoff = performance.now() - ROLLING_MS;
    while (recent.length && recent[0].at < cutoff) recent.shift();
    var sum = 0;
    for (var i = 0; i < recent.length; i++) sum += recent[i].n;
    return sum;
  }

  function tierOf(n) {
    if (n >= 30) return 4;   // 殺到
    if (n >= 15) return 3;   // 撮影会
    if (n >= 5) return 2;    // 連写
    if (n >= 1) return 1;    // 単写
    return 0;
  }

  /* ---- counter ---- */

  var counterEl = document.getElementById("counter");
  var counterText = document.getElementById("counterText");
  var counterHide = null;
  var queueToastEl = document.getElementById("queueToast");
  var queueText = document.getElementById("queueText");
  var phaseStateEl = document.getElementById("phaseState");
  var phaseBadge = document.getElementById("phaseBadge");
  var phaseDesc = document.getElementById("phaseDesc");

  function fillNumbered(el, key, n) {
    var parts = String(t(key)).split("{n}");
    el.textContent = "";
    el.appendChild(document.createTextNode(parts[0]));
    var b = document.createElement("b");
    b.className = "n";
    b.textContent = n;
    el.appendChild(b);
    el.appendChild(document.createTextNode(parts.length > 1 ? parts[1] : ""));
  }

  function showCounter(n) {
    fillNumbered(counterText, "counter", n);

    counterEl.classList.add("on", "bump");
    setTimeout(function () { counterEl.classList.remove("bump"); }, 150);
    clearTimeout(counterHide);
    counterHide = setTimeout(function () { counterEl.classList.remove("on"); }, 2600);
  }

  function updateQueueToast() {
    if (BAR_ONLY || paidWaiting <= 0) {
      queueToastEl.classList.remove("on");
      placeCounter();
      return;
    }
    fillNumbered(queueText, "queue.toast", paidWaiting);
    queueToastEl.classList.add("on");
    placeCounter();
  }

  function updatePhaseState(phase) {
    if (BAR_ONLY || (phase !== "standby" && phase !== "wrapping_up")) {
      phaseStateEl.classList.remove("on");
      return;
    }
    phaseBadge.textContent = t("phase." + phase + ".badge");
    phaseDesc.textContent = t("phase." + phase + ".desc");
    phaseStateEl.classList.add("on");
  }

    voices++;
    var src = ac.createBufferSource();
    src.buffer = pool[(Math.random() * pool.length) | 0];
    src.playbackRate.value = 0.93 + Math.random() * 0.14;
    var g = ac.createGain();
    g.gain.value = Math.min(1, gain * SFX_GAIN);
    src.connect(g); g.connect(ac.destination);
    src.start();
    src.onended = function () { try { g.disconnect(); } catch (e) {} };
    setTimeout(function () { voices--; }, VOICE_HOLD_MS);
  }

  /* ---- the whole presentation for one capture ---- */

  function playEffects(people, paid) {
    measure();
    recent.push({ at: performance.now(), n: people });
    var rolling = rollingCount();
    var tier = tierOf(rolling);

    var perGain = volume * 0.5 / Math.sqrt(people);
    var sparks = Math.min(Math.ceil(people * P.sparkMul), MAX_SPARKS);
    for (var i = 0; i < sparks; i++) {
      spark(Math.random() * (people > 1 ? 320 : 0), perGain);
    }

    // A paid shot gets its own colour and its own sound, so that the channel
    // can tell money arrived without reading a number (§4.4). The point lights
    // are silent — gain 0 — or every purchase would fire extra shutters.
    if (paid && paid.bits > 0) {
      // The amount's colour, the same one its print is framed in. An amount
      // below every step still glows — in the lowest one.
      var tone = bitsTone(paid.bits) || String(BITS_STEPS[0]);
      var golds = Math.ceil((paid.bits >= 250 ? 22 : paid.bits >= 100 ? 13 : 7) * P.sparkMul);
      for (var g = 0; g < golds; g++) spark(100 + Math.random() * 420, 0, tone);
      chime(paid.bits);
      bitsPop(paid.bits, paid.name, tone);
      if (paid.bits >= 250) goldPulse(tone);
    }

    if (tier >= P.flashFromTier) fullFlash(Math.min(1, rolling / 40));
    if (tier >= 2) showCounter(rolling);
  }

  /* ================= broadcaster settings =================

     Streams differ in what they can afford to give an overlay. A preset moves
     every parameter at once, because nobody tunes eight numbers by hand.
     Size is deliberately independent: "Hype but small" has to be reachable. */

  /* @generated presets — src/shared/presets.json。手で書き換えない */
  var PRESETS = {
    standard: { flash: "full", vol: 55, mute: false, sparkCap: 40, flashFromTier: 3,  sparkMul: 1,    photo: 1,    dwell: 1500 },
    hype:     { flash: "full", vol: 70, mute: false, sparkCap: 56, flashFromTier: 2,  sparkMul: 1.4,  photo: 1.1,  dwell: 1800 },
    subtle:   { flash: "soft", vol: 32, mute: false, sparkCap: 18, flashFromTier: 99, sparkMul: 0.5,  photo: 0.78, dwell: 1200 },
    quiet:    { flash: "off",  vol: 0,  mute: true,  sparkCap: 10, flashFromTier: 99, sparkMul: 0.35, photo: 0.9,  dwell: 2200 }
  };
  /* @end presets */

  var P = PRESETS.standard;
  var ovScale = 1;
  var stackSide = "bl";


  function applyPreset(name) {
    P = PRESETS[name] || PRESETS.standard;
    cfg.preset = PRESETS[name] ? name : "standard";
    flashMode = P.flash;
    MAX_SPARKS = P.sparkCap;
    muted = P.mute;
    volume = P.vol / 100;
    saveCfg(cfg);
  }

  function applyAccent(name) {
    cfg.accent = name;
    document.documentElement.setAttribute("data-accent", name);
    saveCfg(cfg);
  }

  /**
   * What every piece of glass is made of — the goal bar's tube today, and the
   * party's plates as they move onto the same glass (one setting for all of
   * it, 本人の決定 2026-09-11).
   *
   * Clear by default: the glass is drawn by its rim, and the scene shows
   * through it. The two tints are for a channel whose layout wants the glass
   * to sit on something. Anything unknown is clear — a value from a
   * newer setup page must not leave the bar without glass at all.
   */
  var GLASS_KINDS = ["clear", "light", "dark"];
  function applyGlass(v) {
    cfg.glass = GLASS_KINDS.indexOf(v) !== -1 ? v : "clear";
    document.documentElement.setAttribute("data-glass", cfg.glass);
    saveCfg(cfg);
  }

  /**
   * Which theme the glass is drawn in, and which pack lies on top of it.
   *
   * Three settings, applied together because they only mean anything
   * together: a pack is a set of images FOR a theme, and the list of slots is
   * what says which of its images exist (05-theme-pack.js). The theme id is
   * held to the ones this build knows and the pack to the rules — anything
   * else falls to the default theme with no pack, and what is saved is what
   * was accepted, never what was sent. Then the images are read, and every
   * skin on the page is painted from whichever of them arrived: the three
   * cameras, the stopwatch, the two tubes, the plate and the tray. The
   * papers are painted as the prints are made (85-display.js, showSheet).
   */
  function applyTheme(theme, pack, packSlots) {
    cfg.theme = themeId(theme);
    document.documentElement.setAttribute("data-theme", cfg.theme);
    var p = packOf(pack, packSlots);
    cfg.pack = p ? p.name : "";
    cfg.packSlots = p ? Object.keys(p.slots).map(function (s) { return p.slots[s]; }).join(",") : "";
    saveCfg(cfg);
    loadPack(p, function () {
      paintIcons();
      paintGlass();
      // Prints already on the wall: a press that landed before the images
      // had answered was painted on plain paper (実測 OBS 2026-09-13: the
      // sample's first press). Their paper is drawn now, once, in place.
      paintPapers();
    });
  }

  function applyScale(v) {
    ovScale = Number(v) || 1;
    cfg.scale = String(ovScale);
    document.documentElement.style.setProperty("--ov-scale", String(ovScale));
    saveCfg(cfg);
    if (stack.length) layoutStack();
  }

  /**
   * The goal bar's own size, 0.7 to 2.5 of the drawn default.
   *
   * Separate from applyScale because the two answer different questions: how
   * big the photos should be, and how big a number has to be to be read from
   * where the audience sits. A channel with a busy layout wants a small bar and
   * large photos as readily as the other way round.
   */
  /**
   * Whether the bar is drawn at all.
   *
   * A channel that has no Bits coming in, or a layout with no room, is better
   * off without it — and the SHUTTER PARTY still happens either way, because the
   * threshold lives in the EBS rather than in what is on screen.
   */
  function applyPlace(side) {
    stackSide = side === "br" ? "br" : "bl";
    cfg.place = stackSide;
    saveCfg(cfg);
    if (stack.length) layoutStack();
  }


  /* ================= display ================= */

  var stack = [];
  var STACK_MAX = 5;
  var STACK_TTL_MS = 8000;
  var SCALE = 0.52;
  var STEP = 0.68;

  /* The stage seat.
   *
   * One place, at the left edge of the paid region — the same coordinates the
   * wall's hero stands on. Everything now enters from the left, so there is no
   * second spot for the crowd to land in: the upper left is the wall, and the
   * strip below it (0.76H down) is shorter than one free print.
   *
   * So the seat is shared, and who may sit in it is the whole of the free/paid
   * distinction in movement: a bought print takes it and holds it, a free one
   * only borrows it while nothing is bought. Free prints used to keep their own
   * spot on the right, which is the side the extension's button is anchored to
   * — the button now stands over an empty strip instead of over a photograph.
   *
   * Holds at most one, and the incumbent drops to the pile rather than being
   * covered: a print underneath another print is not seen at all, and that is
   * the same thing the wall spends its whole layout avoiding. */
  var freeSeat = null;   // { el, w, hh, tilt, cur, timer } or null

  /** Give the seat up: whoever is in it goes to the pile, now, from where it is. */
  function parkFreeSeat() {
    if (!freeSeat) return;
    var it = freeSeat;
    freeSeat = null;
    clearTimeout(it.timer);
    toStack(it.el, it.w, it.hh, it.cur);
  }

  /**
   * The hour and the minute, and not the second.
   *
   * The clock is the item in a caption that will not shrink, so what it costs
   * is charged to the name beside it (fitCaptionStamp). Seconds are three
   * characters of that, and measured on the real page they are 18, 23 and 29
   * pixels at the three size settings — 38% of the whole clock. Dropping them
   * lets the time stay up on prints that much narrower.
   *
   * Nothing was using the precision. The window releases up to seven prints a
   * second, so consecutive captures shared a second anyway; the file keeps a
   * full stamp of its own (captureToDisk names it to the hundredth); and what
   * this is here to say — the moment the shutter went off, rather than the
   * moment the print reached its spot — survives at minute resolution.
   *
   * The saved card had already decided this: captureToDisk writes its caption
   * as a date and an hour and a minute, and has since it was written. The print
   * on the stream was the one place still carrying seconds, and it was the one
   * place with no room for them.
   *
   * WHOSE CLOCK. The broadcaster's — this page runs inside their OBS, so
   * getHours() is their machine's wall clock (measured 2026-08-30: Asia/Tokyo
   * on the development machine, printing 12:54 where UTC read 03:54). There is
   * no other answer available: an overlay is drawn once for the whole
   * broadcast, so it cannot say a time per viewer, and UTC would mean nothing
   * to any of them. What is printed is the local time of the place the thing
   * happened, which is what a stamp on a photograph has always been.
   *
   * Twenty-four hours in every language. A locale-formatted time would be
   * idiomatic in some of the twelve, but "8:41 PM" is two characters wider than
   * "20:41" — which is most of what dropping the seconds just bought back —
   * and this is a mark on a print rather than a field in a form.
   *
   * **[要検討]** A machine whose clock or zone is wrong prints a wrong time on
   * every photograph, and nothing here notices.
   */
  function stamp() {
    var d = new Date();
    var p = function (v) { return String(v).padStart(2, "0"); };
    return p(d.getHours()) + ":" + p(d.getMinutes());
  }

  /**
   * Whether a bought print still has room for the clock.
   *
   * The caption's font does not follow the print. That is deliberate — a name
   * on a small print is the same size as a name on a large one — but it means
   * the caption cannot get smaller, only shorter, and what gets cut is the end
   * of the name, because the clock is the item that will not shrink. Measured
   * on the real page: at the size setting M, a name is already an ellipsis at
   * 152px and has nothing at all left by 90px, which is the floor the wall is
   * allowed to draw at (PAID_MIN_W). Without the clock the same name reads at
   * 83px, so the whole ladder of tiers stays legible instead of the top two.
   *
   * So the two things in the caption are ranked rather than shared. The name is
   * what the Bits bought; the time is what the caption can pay with. Sweeping
   * the four presets against the three size settings at the fastest the window
   * can deliver (6.67 prints a second), the clock costs 22% to 87% of the time
   * a name was readable, and dropping it when it does not fit returns every one
   * of the twelve to whole names (docs/plan.md §4.12).
   *
   * It is a threshold and not a taper because the caption is one line: either
   * the name ends in an ellipsis or it does not.
   */
  function fitCaptionStamp(e) {
    if (!e || !e.whenEl) return;
    // Off is off, whatever the width would have allowed. The rule below is the
    // one for a broadcaster who wants the clock: it appears when there is room
    // for it beside the name, and steps aside when there is not.
    e.whenEl.hidden = cfg.stampShot === "off" || e.w < e.capMinW;
  }

  // Handed from the measurement below to the entry built a few lines later,
  // which is the only thing between them.
  var capEntryMin = 0, nameEntryMin = 0;

  function showPhoto(dataUrl, people, paid, at) {
    // When the shutter went off, rather than when the print reaches the spot.
    // A paid photograph can wait several seconds for the spot, and a caption
    // written on arrival would say a time the photograph was not taken at.
    at = at || stamp();

    // Nothing waits. Every paid photograph goes up when it arrives and keeps
    // the whole time it was bought — the wall answers a crowd by making the
    // prints smaller, never by making anybody's shorter, because shortening one
    // print to make room for the next takes from one buyer to give to another
    // and both of them paid.
    // The presentation of one capture is one event, so the sound, the sparks,
    // the flash, the counter and the Bits pop start where the print does — not
    // where the frame came back. A purchase that waits for the spot used to
    // chime and name its buyer while the photograph it belonged to was still
    // in the queue, seconds from being seen.
    playEffects(people, paid);

    // A paid photo arrives bigger and stays longer, and the bigger the amount
    // the bigger it arrives. The effects are gone in a moment; this print is
    // the part the buyer actually gets (§4.4).
    var w = paid ? tierWidth(paid.bits) : freeWidth();

    var card = document.createElement("div");
    card.className = paid ? "photo paid" : "photo";
    if (paid) card.setAttribute("data-bits", bitsTone(paid.bits));
    card.style.width = w + "px";
    // The paper first, under everything: a pack's own paper is drawn into it
    // once the print has its size (below). Every print has one, bought or
    // free, patterned or plain (docs/theme-pack-plan.md §3.1).
    skinOf(card);

    // The amount decides the colour; the sku decides which frame at that
    // colour. Two products can share a price, so this is the only thing that
    // tells them apart (docs/plan.md §4.4). Absent — an older extension, a
    // press with no receipt — and the print is simply the plain one.
    var pattern = paid ? patternOf(paid.sku) : "";
    if (pattern) {
      card.setAttribute("data-pattern", pattern);
      var layer = patternLayer(pattern);
      if (layer) card.appendChild(layer);
    }

    card.appendChild(subjectCanvas(dataUrl));

    var cap = document.createElement("div");
    cap.className = "cap";
    var who = null, when = null;
    if (paid) {
      // textContent, never innerHTML: this is a name a viewer chose.
      who = document.createElement("span");
      who.className = "who";
      who.textContent = paid.name || t("someone");
      cap.appendChild(who);
      when = document.createElement("span");
      when.className = "when";
      when.textContent = at;
      cap.appendChild(when);
    } else {
      /* A free print says nothing.
       *
       * It used to print the time, and that was the only thing in its caption.
       * On the air it was never worth the space: the wall is already the
       * advertisement — prints flying and stacking is the product visibly
       * working — and a caption on every one of them says it again to nobody.
       * The moment it would matter most is the moment it cannot be read, since
       * a busy wall shrinks the prints and the caption with them.
       *
       * The strip stays. It is the white margin of an instant photo rather
       * than empty space, and a free print that lost it would sit differently
       * beside a paid one on the same wall — measured, the caption box halves
       * (29px to 14px at size M). The stylesheet keeps the height with a strut
       * on :empty, so nothing here has to know the number.
       *
       * The name still travels: the saved copy carries SHUTTERPARTY in the
       * corner (.cmark), which is the copy that leaves the broadcast at all
       * (docs/stamp-plan.md §1.C).
       */
    }
    card.appendChild(cap);

    if (paid) {
      var pb = document.createElement("div");
      pb.className = "badge bits";
      pb.textContent = paid.bits + " Bits";
      card.appendChild(pb);
    } else if (people > 1) {
      var b = document.createElement("div");
      b.className = "badge";
      b.textContent = "×" + people;
      card.appendChild(b);
    }
    el.stage.appendChild(card);

    var hh = card.offsetHeight;
    // The paper, in the same forced layout the height just paid for.
    paintSkin(card, "paper");
    // What the caption needs before the clock costs the name anything.
    //
    // Taken here because this is already the one forced layout a new print
    // pays, and because it is the only moment the caption is at its natural
    // size: from here on the wall writes widths and never reads them back
    // (applyPaidPlan). Nothing about the box is written down twice — the card's
    // padding and the caption's are whatever `w - cap.clientWidth` says they
    // are, and the gap is read from the rule that sets it, so moving any of
    // them in the stylesheet moves this with them.
    if (paid && who) {
      // clientWidth carries the caption's own padding, so the content box has
      // to be taken out of it explicitly. Left in, the threshold lands eight
      // pixels under the width the name is actually cut at and the clock stays
      // up for exactly the range it was supposed to step out of — measured, and
      // it bought nothing at all (docs/scratch/capmeasure2.html).
      var cs = getComputedStyle(cap);
      var inner = cap.clientWidth
        - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
      // scrollWidth is a whole number, so it can name a content half a pixel
      // narrower than it is. One pixel of slack, on the side that keeps a name
      // whole.
      var chrome = (w - inner) + 1;
      capEntryMin = chrome + who.scrollWidth
        + (parseFloat(cs.columnGap) || 0) + when.scrollWidth;
      // And the same without the clock, which is how narrow this print may be
      // drawn before the name itself starts losing its end. The wall consults
      // it when a queue is waiting: it may make prints smaller to seat more of
      // them, and this is where that stops (choosePaidCols).
      nameEntryMin = chrome + who.scrollWidth;
    }
    // The width is decided by the amount and the broadcaster's settings; the
    // height comes from whatever shape the subject was framed in, and until
    // this the two were never reconciled. A camera held portrait — ordinary for
    // an avatar — made a print taller than the canvas at the larger settings,
    // and what hung off the edge was the photograph itself. The paid wall
    // clamps its own (tierLid); this is the same reconciliation for the crowd.
    //
    // Against the region rather than the canvas, because the crowd sits in the
    // region now: the seat is the hero's coordinates, so a free print measured
    // against the full frame height would stand taller than the wall it shares
    // a place with.
    var regH = paidRegionH();
    if (!paid && hh > regH) {
      w = Math.max(paidMinW(), w * regH / hh);
      card.style.width = w + "px";
      hh = card.offsetHeight;
    }
    var tilt = (Math.random() * 12 - 6).toFixed(1);

    // One side, one seat.
    //
    // Every print enters from the left now, free and paid alike. The two used
    // to come from opposite edges and that was the difference between them at a
    // glance — but a difference made of "which way did it fly in" is one the
    // viewer has to have seen the other kind to read, and it cost the free
    // print the whole width of the frame to reach the right-hand side.
    //
    // What separates them instead is the seat: whether a print may stand in it,
    // and what happens when a bought one arrives. Everything else that told
    // them apart is untouched and none of it depends on having seen the other
    // kind — the frame colour (--pre-*), the ladder of widths (free 0.115,
    // then the five tiers from 0.140 to 0.235), the buyer's name in the
    // caption, the Bits badge, and the dwell.
    //
    // Sharing the seat is not sharing a spot in the old sense: what made that
    // unworkable was the crowd landing ON TOP of a print somebody had paid to
    // have looked at. Nothing is ever covered here. The seat holds one, and the
    // one leaving goes to the pile.
    var showY = (H - hh) / 2;
    var showT;
    var entry = null;
    var seat = null;

    if (paid) {
      // The seat belongs to whoever bought it. If the crowd is in it, it drops
      // to the pile now — before the push below, so layoutPaid() finds the
      // hero's coordinates empty.
      parkFreeSeat();
      // Off the LEFT edge to begin with; layoutPaid() animates it from there to
      // wherever the wall has room, and moves everybody else at the same time.
      // The tilt is the card's own and never changes, so a print that shifts
      // does not appear to spin.
      //
      // Left, because the wall is on the left now: the extension's button is
      // anchored to the right of the player and was standing on top of the
      // prints people had bought (paidRegion). A card should enter from the
      // side it is going to live on rather than cross the whole frame.
      entry = {
        el: card, paid: paid, w: w, hh: hh, tilt: tilt, fresh: true,
        whenEl: when, capMinW: capEntryMin, nameMinW: nameEntryMin,
        cur: "translate(" + (-(w + 40)) + "px," + showY + "px) rotate(" + tilt + "deg)"
      };
      // Before the wall has said anything, in case the name is long enough to
      // be clipped even at full tier width.
      fitCaptionStamp(entry);
      card.style.transform = entry.cur;
      // Measured from a real card rather than assumed: the shape follows what
      // the broadcaster framed, and the wall works out its rows from it. Only
      // ever upward, for the reason applyPaidPlan() gives — this one is taken
      // at full size, which is the shallowest a card ever is.
      if (hh > 0 && w > 0) paidAspect = Math.max(paidAspect, hh / w);
      paidLive.push(entry);
      layoutPaid();
      showT = entry.cur;
    } else {
      var reg = paidRegion();
      var offLeft = "translate(" + (-(w + 40)) + "px,";

      if (paidLive.length) {
        // Somebody has bought the seat, so this print does not go near it. It
        // does not queue for it either — a free press is answered while the
        // press is still remembered or it is not answered — so it travels from
        // the edge to the pile in one move and joins the crowd already there.
        //
        // On the pile's own line rather than the seat's, so the move is a slide
        // along the bottom instead of a dive across the wall.
        showY = H - safeBottom() - hh - H * 0.035;
        showT = offLeft + showY + "px) rotate(" + tilt + "deg)";
        card.style.transform = showT;
        // No dwell and no timer: this print never stood anywhere, so there is
        // nothing to take it down from. toStack() gives it the pile's eight
        // seconds like any other.
        toStack(card, w, hh, showT);
        return;
      }

      // The seat is free, so the crowd has it — at the hero's coordinates and
      // in from the same edge the hero comes in from.
      parkFreeSeat();
      showY = reg.y + (reg.h - hh) / 2;
      showT = "translate(" + reg.x + "px," + showY + "px) rotate(" + tilt + "deg)";
      var from = offLeft + showY + "px) rotate(" + tilt + "deg)";
      card.style.transform = from;
      card.animate(
        [{ transform: from, opacity: 0 }, { transform: showT, opacity: 1 }],
        { duration: 460, easing: "cubic-bezier(.16,1,.3,1)", fill: "forwards" }
      );
      seat = { el: card, w: w, hh: hh, tilt: tilt, cur: showT, timer: null };
      freeSeat = seat;
    }

    // How long the photograph stays before it goes to the stack.
    //
    // The dwell is part of what the Bits bought: a paid photograph carries a
    // name, and a name nobody had time to read was not worth paying for. So the
    // multiplier follows the amount rather than splitting at one point — 1.5s
    // free, and 6s at 1000, which is the length of a look rather than a glimpse.
    //
    // Above that the ladder keeps climbing, and the two rungs there are not a
    // longer look: 9s at 10000 is a hold. The amount is a hundred times the
    // cheapest frame and the wall has nothing else left to give it — the width
    // is already at TIER_TOP_F with tierLid() over it, so a tall subject drags
    // 10000 back down to the size of 1000 (docs/plan.md §4.4).
    //
    // WHY THIS DOES NOT LOOSEN THE RUNGS BELOW. §4.12 caps a bundle at 4.0x the
    // base, and it was tempting to read that 4.0 as "the top multiplier" — in
    // which case raising the top would raise every cap under it and rose and
    // gold would start bundling. It is not that. It is the length of a look, an
    // absolute, and §4.12 put it in as a constant for exactly this reason. So
    // the ceiling stays at 4.0 while the ladder goes past it, and every cap
    // below is untouched. The gap that opens is the point: a bundle of the
    // cheapest frames tops out at 6s and can no longer reach a single 5000.
    var hold = P.dwell;
    if (paid) {
      var b = paid.bits;
      hold *= b >= 10000 ? 6.0 : b >= 5000 ? 5.0
        : b >= 1000 ? 4.0 : b >= 500 ? 3.2 : b >= 250 ? 2.6 : b >= 100 ? 2.1 : 1.8;
      // And that is the whole of it. Congestion used to be answered by
      // trimming this, which paid for the wait with seconds somebody had
      // bought; the wall answers it by getting smaller instead. What an amount
      // buys is the same number of seconds on a quiet channel and a busy one.
    }

    var park = function () {
      if (entry) {
        var at = paidLive.indexOf(entry);
        if (at !== -1) paidLive.splice(at, 1);
        // Leaving is a change to the wall like arriving is: whoever is left
        // spreads back out, and the hero spot may pass to somebody else.
        layoutPaid();
        // Wherever it ended up, not where it first landed.
        toStack(card, entry.w, entry.hh, entry.cur);
        return;
      }
      // Whoever is in the seat leaves it the same way an evicted print does, so
      // there is one path out and one place that clears freeSeat. If the seat
      // has already changed hands this timer was cleared with it and never got
      // here.
      if (seat && freeSeat === seat) parkFreeSeat();
    };
    var timer = setTimeout(park, hold);
    if (seat) seat.timer = timer;
  }

  /* Put the seats back where the frame says they go now.
   *
   * Called from the resize handler (70-effects.js), which is the only moment
   * any of this changes: a browser source keeps the size it was made at, so
   * until a broadcaster puts this page in a 1080x1920 source — or resizes the
   * one they have — none of these numbers ever move. The wall and the free
   * seat had no path back at all; the pile already had layoutStack().
   *
   * paidAspect is left alone on purpose. It is remeasured from real cards as
   * they arrive and only ever rises (90-paid-wall.js), and the shape of a
   * photograph does not depend on the shape of the frame — the subject is
   * whatever the broadcaster framed. */
  function relayoutSeats() {
    if (paidLive.length) layoutPaid();
    if (freeSeat) {
      var reg = paidRegion();
      var it = freeSeat;
      it.hh = it.el.offsetHeight || it.hh;
      it.cur = "translate(" + reg.x + "px," + (reg.y + (reg.h - it.hh) / 2) +
        "px) rotate(" + it.tilt + "deg)";
      it.el.style.transform = it.cur;
    }
  }

  function layoutStack() {
    // The pile sits on the floor of the band, not the floor of the frame: on a
    // vertical canvas the bottom of the picture is behind Twitch's own chrome
    // (docs/vertical-plan.md §2). safeBottom() is 0 in landscape.
    var padX = W * 0.025, padY = safeBottom() + H * 0.035;
    for (var i = 0; i < stack.length; i++) {
      var it = stack[i];
      var h0 = it.el.offsetHeight || it.hh;
      it.hh = h0;
      var vw = it.w * SCALE, vh = h0 * SCALE;
      var vx = stackSide === "br"
        ? W - padX - vw - i * (vw * STEP)
        : padX + i * (vw * STEP);
      var vy = H - vh - padY;
      // transform-origin is the element centre, so compensate for the shrink
      var to = "translate(" + (vx - it.w * (1 - SCALE) / 2) + "px," +
        (vy - h0 * (1 - SCALE) / 2) + "px) rotate(" + it.tilt + "deg) scale(" + SCALE + ")";
      // By the handle, for both of the reasons placePaid() gives.
      //
      // The one already running is finished but never over — it fills forwards,
      // so it goes on holding the card and goes on being consulted at every
      // restyle. The stack is relaid every time a print arrives, and at the top
      // of a party that is six times in the second a card spends here before it
      // is pushed off the end; on a quiet channel it is a card's whole eight
      // seconds. The wall was given a handle and the stack was left without
      // one, so the pile the wall stopped making went on being made here.
      //
      // And by the handle rather than getAnimations(), because the fade-out
      // that removes the card from the document is on this same element: its
      // cancel handler is what does the removing, so cancelling by name would
      // delete the card where it stands.
      if (it.stackAnim) it.stackAnim.cancel();
      it.stackAnim = it.el.animate([{ transform: it.cur }, { transform: to }],
        { duration: 460, easing: "cubic-bezier(.42,0,.18,1)", fill: "forwards" });
      it.cur = to;
    }
  }

  function dropCard(it) {
    clearTimeout(it.timer);
    var a = it.el.animate(
      [{ opacity: 1, transform: it.cur }, { opacity: 0, transform: it.cur }],
      { duration: 340, easing: "ease-in", fill: "forwards" }
    );
    a.onfinish = a.oncancel = function () { it.el.remove(); };
  }

  /* ================= the paid wall =================

     Every purchase appears, and it appears while the party it belongs to is
     still running. Three fixed places could not do that: the display could
     retire one print every 0.9 to 2 seconds against a supply of one every
     150ms, so a busy party pushed the last photographs a minute past the end
     of the thing they were part of.

     So the places are a grid that densifies instead. The prints get smaller as
     more of them stand at once — never shorter, which would be taking back the
     seconds somebody bought — and the wall grows to fill the height as well as
     the width. The caption keeps its own font size, so the name on a small
     print is the same size as the name on a large one.

     The largest amount standing keeps the spot it has always had, on the right
     at full size. That is the one thing the wall does not compress: the biggest
     purchase of the moment is the biggest photograph on screen, and everything
     else arranges itself beside it. */

  // { el, paid, w, hh, tilt, cur, fresh, moveAnim } in arrival order
  var paidLive = [];

  // The narrowest a print is drawn when nothing is pressing on it: below this
  // the name in the caption is an ellipsis. It is a real floor on a print that
  // has room — one standing alone, and the hero in its seat — which is where
  // tierWidth() and the hero's clamp apply it. The wall's cells do not consult
  // it at all: when the room runs out they go under it rather than leave
  // somebody with nowhere to stand, and being shown small beats not being
  // shown.
  // In photoBase(), not pixels: every width below is a fraction of the frame,
  // and a floor that is not moves the ladder out from under them. Measured on
  // a 1080-wide vertical canvas at subtle × size 0.7, free came to 67.8px and
  // 10 Bits to 82.6px — both under 90, so both were drawn at 90 and the two
  // were the same size. "A paid print arrives bigger than a free one" is a
  // rule this file was changed to keep (本人の指摘 2026-08-26) and a fixed
  // floor quietly broke it on a narrow frame (docs/vertical-plan.md §1.2).
  // 0.046875 of 1920 is 90, so a landscape canvas keeps the number it had.
  function paidMinW() { return photoBase() * 0.046875; }

  var PAID_ASPECT_BASE = 1.22;
  var paidAspect = PAID_ASPECT_BASE;   // height / width, remeasured from real cards
  var paidCols = 2;                    // rises while a wall is standing, resets with it
  var paidWallRoom = true;             // whether the next paid print has somewhere to stand
  var paidDraining = false;             // whether accepted paid prints are still visible or waiting

  // The top of the table below, named because tierLid() has to measure its lid
  // against the same number the table starts at. Written twice, a change to the
  // table alone leaves the lid sized for the old top and the biggest print goes
  // straight back over the edge the lid was added to keep it inside: at 0.25
  // against a lid still computed from 0.235, the hero is drawn 6.4% taller than
  // the region — 827px in a 777.6px wall.
  var TIER_TOP_F = 0.235;

  // What an amount is worth in width. 1000 is the size a paid print has always
  // been; the rest step down from it, so the order is visible before any name
  // is read.
  function tierWidth(bits) {
    var f = bits >= 1000 ? TIER_TOP_F
      : bits >= 500 ? 0.205
      : bits >= 250 ? 0.180
      : bits >= 100 ? 0.158
      : 0.140;
    return Math.max(paidMinW(), photoBase() * f * ovScale * P.photo * tierLid());
  }

  /**
   * How far every amount has to come down for the tallest print to fit.
   *
   * A print's width is bought and its height comes from the shape the subject
   * was framed in, so a portrait camera — ordinary for an avatar — makes a card
   * taller than the canvas at the larger settings. Something has to give, and
   * it is the width.
   *
   * The point of doing it here rather than to the largest amount alone: a lid
   * laid on one tier is a lid every tier underneath eventually reaches, and
   * they arrive at the same number. Measured at 9:16 with the size and preset
   * both at their largest, 1000, 500 and 250 Bits all came out at 442.6px —
   * the amounts were still being charged and were no longer being shown. As a
   * ratio the steps survive: 442.6, 386.1, 339.0.
   *
   * One means nothing is clamped, which is every landscape subject.
   */
