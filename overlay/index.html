      // The EBS is unreachable, which is what an ordinary drop looks like.
      ebsScheduleRetry();
    });
  }

  var EBS_DEAD_RETRY_MS = 5 * 60 * 1000;

  function ebsScheduleRetry(fixedWait) {
    if (ebsManualClose) return;
    ebsRetry = Math.min(ebsRetry + 1, 6);
    var wait = fixedWait || Math.min(1000 * Math.pow(1.8, ebsRetry), 30000);
    clearTimeout(ebsRetryTimer);
    ebsRetryTimer = setTimeout(function () {
      if (!ebsManualClose) ebsConnect();
    }, wait);
  }

  /**
   * Why the shutter is off for a reason the gate does not cover.
   *
   * sceneOpen() answers one question — is the scene on air one the broadcaster
   * allowed — and it is the only one that reached the log. The EBS refuses a
   * press for two more: no capture scene chosen, and a chosen name that OBS
   * does not have. Both left the viewer at "not shooting right now" and the
   * broadcaster with a log that said nothing at all (実測 2026-08-25: the cause
   * was only found by adding temporary logging to the EBS).
   */
  var srcWhy = null;
  function noteSource() {
    var why = !cfg.src ? "nosource" : (identified && !srcIsScene ? "notscene" : "");
    if (why === srcWhy) return;
    srcWhy = why;
    if (why) log(t("log.closed." + why, { n: cfg.src }), "warn");
  }

  function reportOverlayState() {
    if (!ebsWs || ebsWs.readyState !== 1) return;
    noteSource();
    try {
      ebsWs.send(JSON.stringify({
        type: "state",
        // A bar source is a listener, not a camera. Saying so is what keeps the
        // EBS from counting it as somewhere a photograph could be taken — and
        // from telling the buttons the door is open because a bar is attached.
        kind: BAR_ONLY ? "bar" : "overlay",
        connected: BAR_ONLY ? false : identified,
        source: cfg.src, captureReady: BAR_ONLY ? false : captureOk,
        wallRoom: BAR_ONLY ? true : paidWallRoom,
        draining: BAR_ONLY ? false : paidDraining,
        // Reported, not decided here: the EBS is what refuses a press
        // (CLAUDE.md). This is a fact about the machine, like the other three.
        open: sceneOpen(),
        // Why it is shut, by name, when it is. The EBS passes it on to the
        // button instead of folding four causes into one sentence
        // (docs/events-plan.md 段1). After open on purpose: sceneOpen() is
        // what brings it up to date, and a literal is evaluated in order.
        closedWhy: BAR_ONLY ? "" : (closedWhy || ""),
        // Which release is drawing, and whether it is the one the address
        // asked for. Facts about this machine like the rest — the EBS records
        // them and decides nothing on them.
        //
        // A bar reports both too. It is the same file under the same cache,
        // and a broadcaster whose bar is stale has exactly the problem this is
        // for; skipping it here would hide half the sources.
        //
        // Neither is a guarantee: a hand-edited overlay can name any release
        // it likes (docs/plan.md §3.2.2). What they catch is the two things
        // that actually happen — a cache that answered with the old file, and
        // an accidental edit.
        build: BUILD,
        staleCache: buildMismatch()
      }));
    } catch (e) { /* the link is optional; local capture still works */ }
  }

  // Nothing on this page shows the link's state; the setup page tests it. The
  // hook stays so the state changes have somewhere to land if that changes.
  function renderEbs() {}

  /* ================= the sample =================

     Loaded with #demo, this page is the overlay — all of it, the same code that
     goes on the air — with the four wires to the outside cut (see DEMO in
     30-configuration.js). What is missing is the one thing the wires used to
     bring: presses. So the sample makes its own.

     WHY IT DRIVES showPhoto() RATHER THAN DRAWING ANYTHING. showPhoto() is the
     single door every real press comes through (60-capture.js is the only
     caller). Going in there means the sample gets the flash, the sparks, the
     sound routing, the wall, the widths, the caption and the paid frame from
     the code that draws them for viewers — and gets them wrong the moment that
     code is wrong, which is the point of showing it at all.

     THE ONE THING IT HAS TO INVENT is the photograph. There is no OBS here, so
     nothing can be captured; the subject is drawn below as a few hundred bytes
     of SVG. That is a second implementation, and it is allowed to be: a
     stand-in for the broadcaster's face is not an effect, and nothing breaks
     when it drifts from a real capture. */

  /* A subject, at the shape a real capture comes back in (16:9).
   *
   * Drawn rather than shipped: a file would go in the zip, and a photograph of
   * a person would put someone's face in the product. Neutral on purpose — it
   * stands where the broadcaster will be, so it must not compete with the
   * frame, the caption or the paid border, which are the things being judged.
   * No words in it, so it needs no dictionary. */
  var DEMO_SUBJECT =
    "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#2a3340"/><stop offset="1" stop-color="#141a22"/>' +
      '</linearGradient></defs>' +
      '<rect width="960" height="540" fill="url(#g)"/>' +
      '<circle cx="480" cy="232" r="86" fill="#4a5666"/>' +
      '<path d="M330 540c0-88 67-150 150-150s150 62 150 150z" fill="#4a5666"/>' +
      '</svg>');

  // Names for the paid frames. Short, obviously placeholders, and the same in
  // every language: a sample is not the place to invent a person, and a name
  // is the one thing on a paid print that is nobody's business but the buyer's.
  var DEMO_NAMES = ["AAA", "BBB", "CCC", "DDD"];
  var demoName = 0;

  /* How often a press lands.
   *
   * The flash is the constraint, not the pace. CLAUDE.md caps a full-screen
   * flash at 3Hz, and unlike the real thing — where a flash is one press by one
   * viewer — the sample repeats for as long as the tab is open. Measured at
   * this interval the wash peaks well under the cap; anything faster starts to
   * read as a strobe on a page somebody is reading (docs/look-tab-plan.md 未決6).
   */
  var DEMO_EVERY_MS = 2600;
  var demoTimer = null;
  var demoSeq = 0;

  /* A goal for the bar to fill.
   *
   * A round number rather than one out of the catalogue: the real one comes
   * from the EBS and is the broadcaster's own, so any figure here would be
   * somebody else's. What the sample is showing is the shape — a strip that
   * fills, changes colour near the top and empties — not an amount.
   */
  var DEMO_GOAL = 1000;

  /** One press, drawn the way a viewer's press is drawn. */
  function demoPress(bits) {
    var paid = null;
    if (bits) {
      demoName = (demoName + 1) % DEMO_NAMES.length;
      paid = { bits: bits, name: DEMO_NAMES[demoName] };
      /* The bar takes the money, and drops it all when it crosses.
       *
       * Emptying rather than carrying the remainder over is the product's own
       * rule (CLAUDE.md: 越えた分は持ち越さない), and following it here means
       * the sample shows what a broadcaster will actually see rather than a
       * bar that creeps past its own end. Crossing does not start a party —
       * that is a button, because it runs for forty-six seconds and nobody
       * choosing a colour wants to wait it out (未決2).
       */
      bar.pool += bits;
      if (bar.pool >= bar.goal) bar.pool = 0;
      updateBar();
    }
    // A believable crowd rather than one: the wall sizes prints by how many
    // arrived together, so a sample that always says 1 never shows that.
    var people = 1 + (demoSeq % 3);
    demoSeq++;
    showPhoto(DEMO_SUBJECT, people, paid);
    // Filed into the running party the way a real capture is (60-capture.js
    // fileShot), so the contact sheet at the end has the nine to show. Without
    // this the sample's party ended on an empty sheet, which is not what a
    // party looks like — and the theme's tray and papers were never seen.
    if (party) {
      if (paid) party.paidAt.push(party.shots.length);
      party.shots.push(DEMO_SUBJECT);
      party.people += people;
    }
  }

  /* The loop the broadcaster is actually judging.
   *
   * Free, free, paid, so all three widths and the paid frame turn up inside a
   * few seconds without anybody pressing anything. The amounts walk up the
   * catalogue so the colours the frames take are seen too. */
  var DEMO_LADDER = [0, 0, 100, 0, 500, 0, 0, 1000];
  var demoStep = 0;

  function demoTick() {
    demoPress(DEMO_LADDER[demoStep % DEMO_LADDER.length]);
    demoStep++;
  }

  function startDemo() {
    stopDemoLoop();
    // Before the first press, so the bar is on screen empty rather than
    // appearing out of nowhere when somebody happens to pay.
    bar.goal = DEMO_GOAL;
    bar.pool = 0;
    updateBar();
    demoTick();
    demoTimer = setInterval(demoTick, DEMO_EVERY_MS);
    // #demo&party: the whole cycle once, unasked, a moment after load. For
    // the tools that photograph a theme's five scenes on a clock
    // (tools/themes.mjs shots) — the setup page's sample keeps its button.
    if (hashFlag("party")) setTimeout(demoParty, DEMO_PARTY_AT_MS);
  }
  var DEMO_PARTY_AT_MS = 1500;

  function stopDemoLoop() {
    clearInterval(demoTimer);
    demoTimer = null;
  }

  /* The whole cycle, on request.
   *
   * Forty-six seconds is too long to sit through every time a colour changes,
   * so it is a button rather than the default (docs/look-tab-plan.md 未決2).
   * The sequence is the real one — ignite() runs the name card, the countdown,
   * the banner and the sheet from the same timers the EBS drives — and the
   * presses that arrive during it are the loop's own, which is what a party
   * looks like from here.
   *
   * The timeline is handed in rather than left to the default so the sample
   * cannot outlive the party: applyTimeline() is what closeParty() counts. */
  function demoParty() {
    // Emptied first, the way the real one is: the party is what the bar was
    // counting towards, so it cannot still be counting while the party runs.
    bar.pool = 0;
    updateBar();
    ignite({ name: DEMO_NAMES[0], timeline: null });
  }

  /* What the setup page is allowed to say.
   *
   * Only the four look settings and the language, and each is handed to the
   * same apply* the real page uses. Nothing here reads the message as a
   * command: a fragment cannot arrive and turn into a connection, because the
   * only verbs are "party" and "stop".
   *
   * The origin is not checked, and cannot be: both pages are file://, which is
   * an opaque origin — every message arrives from "null" (measured). That is
   * safe here because this page has nothing left to take. It holds no password,
   * no token, no storage and no socket; the worst a stray message can do is
   * change the colour of a sample. */
  window.addEventListener("message", function (e) {
    var m = e && e.data;
    if (!m || m.to !== "shutterparty-demo") return;
    if (m.act === "party") { demoParty(); return; }
    if (m.act === "stop") { stopDemoLoop(); return; }
    /* The theme site's pictures, for the skins and nothing else.
     *
     * Only the sample takes them: a page that is not #demo is the real overlay
     * on the air, and nothing may hand it images by message. Held to the
     * same rules as a pack from disk, with the length checked before a single
     * byte is decoded (05-theme-pack.js loadAssets); refused whole when any
     * part is off. Nothing here touches cfg or storage. */
    if (m.act === "assets") {
      if (!DEMO) return;
      loadAssets(m.slots, function (images) {
        if (!images) return;
        paintIcons();
        paintGlass();
        paintPapers();
      });
      return;
    }
    if (m.act !== "look") return;
    if (typeof m.preset === "string") applyPreset(m.preset);
    if (typeof m.accent === "string") applyAccent(m.accent);
    if (typeof m.place === "string") applyPlace(m.place);
    if (typeof m.scale === "string") applyScale(m.scale);
    // Straight onto cfg: the clock is read at the moment a caption is
    // built, so the next press comes out with it or without it.
    if (m.stampShot === "on" || m.stampShot === "off") cfg.stampShot = m.stampShot;
    if (typeof m.glass === "string") applyGlass(m.glass);
    // The three travel together (applyTheme): a pack means nothing without
    // its theme, and its slots say which of its images exist. Inside the
    // setup page's sandbox the images cannot be read (measured — a sandboxed
    // frame is refused file: images), so the sample shows the theme's own
    // drawing; the pack is seen in OBS or on the site.
    if (typeof m.theme === "string") applyTheme(m.theme, m.pack, m.packSlots);
    // No repaint call: every word on this page is fetched with t() at the
    // moment it is drawn, so the next press comes out in the new language
    // on its own. Nothing already on the wall changes, which is right —
    // those prints were taken in the old one.
    if (typeof m.lang === "string" && I18N[m.lang]) lang = m.lang;
  });
  /* ================= go ================= */

  // ?debug=1 or #debug turns the status chip on. It is off by default because
  // this page is on the air.
  // A broadcaster whose capture source is called "debug room" must not find a
  // status light on their stream.
  if (q.get("debug") === "1" || hashFlag("debug")) {
    document.documentElement.setAttribute("data-debug", "");
  }

  /* ---- #bar ----

     This page becomes the goal bar and nothing else: no OBS connection, no
     photographs, no sound. It still talks to the EBS, because the bar is drawn
     from what the EBS says, but it reports itself as a listener rather than a
     camera so the EBS never counts it as somewhere a photo could be taken.

     The bar left the overlay so that OBS could own its placement — including
     putting it in one scene and not another, which is the thing a bar inside
     the overlay could never do (docs/plan.md §4.11).

     The flag itself is read in 30-configuration.js, where storage is decided:
     a bar must not write to the key the overlay keeps its password in, and
     that has to be known before the first save rather than by the time the
     page finishes starting. */
  if (BAR_ONLY) document.documentElement.setAttribute("data-baronly", "");

  // Never the secrets themselves — only whether there are any. The two of them
  // are missing from this line on purpose: they are not settled yet, and a
  // boot line saying EMPTY about a password that arrives half a tick later is
  // worse than not mentioning it (see the secrets line below).
  log("boot" +
    " src=" + (cfg.src || "(none)") +
    " obs=" + cfg.host + ":" + cfg.port +
    " ebs=" + (cfg.ebs || "(none)") +
    " ch=" + (cfg.ch || "(none)") +
    " save=" + (cfg.saveDir || "(off)") +
    " config=" + (pushed ? "from URL" : "from storage"));

  applyPreset(cfg.preset);
  applyAccent(cfg.accent);
  applyScale(cfg.scale);
  applyPlace(cfg.place);
  applyGlass(cfg.glass);
  applyTheme(cfg.theme, cfg.pack, cfg.packSlots);
  updateBar();            // hidden until the EBS says what the goal is

  // #preview draws the bar at full size with a stand-in goal, so the
  // broadcaster can size and place it against their own layout in the OBS
  // preview without waiting for a viewer to press anything. Like #debug, it is
  // a URL flag and never a default — the setup page removes it when finished.
  // It overrides "off" on purpose: the setting is what is being adjusted.
  if (hashFlag("preview")) {
    bar.pool = 320;
    bar.goal = 1000;
    barForced = true;
    updateBar();
  }

  /* Say it out loud when the address asked for a release these bytes are not.
   *
   * The EBS is told the same thing, but nothing in production reads that back
   * yet, and the setup page's dock — which compares the ADDRESS — calls this
   * exact case clean, because the address is fine; it is the file behind it
   * that is old. So the OBS log is where a stale overlay can actually be
   * caught while a stream is running, and it is the one surface this page has
   * that costs nothing and is already where anybody looks when something is
   * wrong (docs/plan.md §3.2.2 手当て2).
   *
   * Once, at load, at "bad" level so OBS keeps it: this is a fact about the
   * file, so repeating it would only push the useful lines out of the log.
   * Never from the sample or a bare open — askedBuild() is empty there, and
   * buildMismatch() is false for it. */
  if (buildMismatch()) log(t("log.stale", { a: askedBuild(), b: BUILD }), "bad");

  renderEbs();
  watchTestWindow();               // a window already open when this page loads

  /* Both connections wait for the secrets.
   *
   * They are the only part of the config that is not ready when the page is:
   * the store is IndexedDB and a decrypt (shared: secret-store.js). Connecting
   * before it answers means authenticating with an empty password against an
   * OBS that has one, and opening the EBS socket with an empty token — two
   * failures that look exactly like a wrong password and a revoked pairing
   * code, which is the wrong thing to tell a broadcaster whose settings are
   * fine and half a tick away.
   *
   * secretsSettled never rejects, so there is no path where this page simply
   * does not start: a store that cannot be opened resolves to "locked" and a
   * browser without one resolves to "nostore", and both go on to connect with
   * whatever the URL brought — which, for a page whose secrets were never
   * scrubbed out of its URL, is everything it needs. */
  secretsSettled.then(function (state) {
    // Said once, after the answer exists. "locked" is the line that has to be
    // distinguishable: it means there IS a password saved and this profile can
    // no longer open it, which is not the same as never having had one and
    // must not be left to look like 「パスワードが違います」.
    if (state === "locked") log(t("log.secret.locked"), "bad");
    else if (state === "nostore") log(t("log.secret.nostore"), "warn");
    log("secrets " + state +
      " pw=" + (cfg.pw ? "set" : "EMPTY") +
      " token=" + (ebsTokenNow() ? "set" : "EMPTY"));

    // Never from the sample: it has no channel worth reporting and nothing to
    // photograph, and the token it would carry is not in its URL anyway.
    if (!DEMO && cfg.ebs && cfg.ch) ebsConnect();
    if (!DEMO && !BAR_ONLY) connect();
  });

  // The bar source stops here. It has nothing to photograph with, nothing to
  // play, and no reason to hold a socket open to OBS.
  if (DEMO) {
    // The sample is not connected to anything, so the status light would sit
    // on "waiting" for ever with nothing to wait for.
    document.documentElement.setAttribute("data-demo", "");
    startDemo();
  } else if (!BAR_ONLY) {
    ensureAudio();        // decode the shutter samples before the first press
    status("wait", t("st.idle"), true);
    /* Always, and not `if (cfg.pw)`.
     *
     * The same wrong comment stood on the setup page, where it cost a button
     * press per visit. Here it cost the product: this is the ONLY call to
     * connect() on this page, so a broadcaster running OBS with authentication
     * switched off had an overlay that never opened a socket and could never
     * photograph anything. The EBS was told as much — 94-ebs-link.js reports
     * `connected: identified` — so the viewers' button reads "not shooting
     * right now" for ever, and the only trace is a log line inside a browser
     * source nobody opens.
     *
     * obs-websocket does allow authentication to be turned off, and onHello()
     * identifies straight away when no challenge is offered
     * (src/shared/parts/obs-ws.js). There was never a guaranteed failure here.
     *
     * Failing on load is cheap on this page: OBS is by definition running (the
     * page is one of its browser sources), and anything else backs off and
     * retries, so a WebSocket server switched on later is picked up instead of
     * needing the source to be reloaded.
     *
     * The call itself moved up into secretsSettled — the password is not in
     * hand yet at this point in the file, and connecting without it is how a
     * broadcaster with authentication switched ON gets told their password is
     * wrong by a page that simply had not finished reading it. */
  }
})();

</script>
