  /* The stage seat.
   *
   * One place, at the left edge of the paid region — the same coordinates the
   * wall's hero stands on. Everything now enters from the left, so there is no
   * second spot for the crowd to land in: the upper left is the wall, and the
   * strip below it (0.76H down) is shorter than one free print.
   *
   * So the seat is shared, and who may sit in it is the whole of the free/paid
   * distinction in movement: a bought print takes it and holds it, a free one
   * only borrows it while nothing is bought. Free prints used to keep their own
   * spot on the right, which is the side the extension's button is anchored to
   * — the button now stands over an empty strip instead of over a photograph.
   *
   * Holds at most one, and the incumbent drops to the pile rather than being
   * covered: a print underneath another print is not seen at all, and that is
   * the same thing the wall spends its whole layout avoiding. */
  var freeSeat = null;   // { el, w, hh, tilt, cur, timer } or null

  /** Give the seat up: whoever is in it goes to the pile, now, from where it is. */
  function parkFreeSeat() {
    if (!freeSeat) return;
    var it = freeSeat;
    freeSeat = null;
    clearTimeout(it.timer);
    toStack(it.el, it.w, it.hh, it.cur);
  }

  function stamp() {
    var d = new Date();
    var p = function (v) { return String(v).padStart(2, "0"); };
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  function showPhoto(dataUrl, people, paid, at) {
    // When the shutter went off, rather than when the print reaches the spot.
    // A paid photograph can wait several seconds for the spot, and a caption
    // written on arrival would say a time the photograph was not taken at.
    at = at || stamp();

    // Nothing waits. Every paid photograph goes up when it arrives and keeps
    // the whole time it was bought — the wall answers a crowd by making the
    // prints smaller, never by making anybody's shorter, because shortening one
    // print to make room for the next takes from one buyer to give to another
    // and both of them paid.
    // The presentation of one capture is one event, so the sound, the sparks,
    // the flash, the counter and the Bits pop start where the print does — not
    // where the frame came back. A purchase that waits for the spot used to
    // chime and name its buyer while the photograph it belonged to was still
    // in the queue, seconds from being seen.
    playEffects(people, paid);

    // A paid photo arrives bigger and stays longer, and the bigger the amount
    // the bigger it arrives. The effects are gone in a moment; this print is
    // the part the buyer actually gets (§4.4).
    var w = paid ? tierWidth(paid.bits) : freeWidth();

    var card = document.createElement("div");
    card.className = paid ? "photo paid" : "photo";
    if (paid) card.setAttribute("data-bits", bitsTone(paid.bits));
    card.style.width = w + "px";

    // The amount decides the colour; the sku decides which frame at that
    // colour. Two products can share a price, so this is the only thing that
    // tells them apart (docs/plan.md §4.4). Absent — an older extension, a
    // press with no receipt — and the print is simply the plain one.
    var pattern = paid ? patternOf(paid.sku) : "";
    if (pattern) {
      card.setAttribute("data-pattern", pattern);
      var layer = patternLayer(pattern);
      if (layer) card.appendChild(layer);
    }

    card.appendChild(subjectCanvas(dataUrl));

    var cap = document.createElement("div");
    cap.className = "cap";
    if (paid) {
      // textContent, never innerHTML: this is a name a viewer chose.
      var who = document.createElement("span");
      who.className = "who";
      who.textContent = paid.name || t("someone");
      cap.appendChild(who);
      var when = document.createElement("span");
      when.textContent = at;
      cap.appendChild(when);
    } else {
      cap.textContent = at;
    }
    card.appendChild(cap);

    if (paid) {
      var pb = document.createElement("div");
      pb.className = "badge bits";
      pb.textContent = paid.bits + " Bits";
      card.appendChild(pb);
    } else if (people > 1) {
      var b = document.createElement("div");
      b.className = "badge";
      b.textContent = "×" + people;
      card.appendChild(b);
    }
    el.stage.appendChild(card);

    var hh = card.offsetHeight;
    // The width is decided by the amount and the broadcaster's settings; the
    // height comes from whatever shape the subject was framed in, and until
    // this the two were never reconciled. A camera held portrait — ordinary for
    // an avatar — made a print taller than the canvas at the larger settings,
    // and what hung off the edge was the photograph itself. The paid wall
    // clamps its own (tierLid); this is the same reconciliation for the crowd.
    //
    // Against the region rather than the canvas, because the crowd sits in the
    // region now: the seat is the hero's coordinates, so a free print measured
    // against the full frame height would stand taller than the wall it shares
    // a place with.
    var regH = paidRegionH();
    if (!paid && hh > regH) {
      w = Math.max(PAID_MIN_W, w * regH / hh);
      card.style.width = w + "px";
      hh = card.offsetHeight;
    }
    var tilt = (Math.random() * 12 - 6).toFixed(1);

    // One side, one seat.
    //
    // Every print enters from the left now, free and paid alike. The two used
    // to come from opposite edges and that was the difference between them at a
    // glance — but a difference made of "which way did it fly in" is one the
    // viewer has to have seen the other kind to read, and it cost the free
    // print the whole width of the frame to reach the right-hand side.
    //
    // What separates them instead is the seat: whether a print may stand in it,
    // and what happens when a bought one arrives. Everything else that told
    // them apart is untouched and none of it depends on having seen the other
    // kind — the frame colour (--pre-*), the ladder of widths (free 0.115,
    // then the five tiers from 0.140 to 0.235), the buyer's name in the
    // caption, the Bits badge, and the dwell.
    //
    // Sharing the seat is not sharing a spot in the old sense: what made that
    // unworkable was the crowd landing ON TOP of a print somebody had paid to
    // have looked at. Nothing is ever covered here. The seat holds one, and the
    // one leaving goes to the pile.
    var showY = (H - hh) / 2;
    var showT;
    var entry = null;
    var seat = null;

    if (paid) {
      // The seat belongs to whoever bought it. If the crowd is in it, it drops
      // to the pile now — before the push below, so layoutPaid() finds the
      // hero's coordinates empty.
      parkFreeSeat();
      // Off the LEFT edge to begin with; layoutPaid() animates it from there to
      // wherever the wall has room, and moves everybody else at the same time.
      // The tilt is the card's own and never changes, so a print that shifts
      // does not appear to spin.
      //
      // Left, because the wall is on the left now: the extension's button is
      // anchored to the right of the player and was standing on top of the
      // prints people had bought (paidRegion). A card should enter from the
      // side it is going to live on rather than cross the whole frame.
      entry = {
        el: card, paid: paid, w: w, hh: hh, tilt: tilt, fresh: true,
        cur: "translate(" + (-(w + 40)) + "px," + showY + "px) rotate(" + tilt + "deg)"
      };
      card.style.transform = entry.cur;
      // Measured from a real card rather than assumed: the shape follows what
      // the broadcaster framed, and the wall works out its rows from it. Only
      // ever upward, for the reason applyPaidPlan() gives — this one is taken
      // at full size, which is the shallowest a card ever is.
      if (hh > 0 && w > 0) paidAspect = Math.max(paidAspect, hh / w);
      paidLive.push(entry);
      layoutPaid();
      showT = entry.cur;
    } else {
      var reg = paidRegion();
      var offLeft = "translate(" + (-(w + 40)) + "px,";

      if (paidLive.length) {
        // Somebody has bought the seat, so this print does not go near it. It
        // does not queue for it either — a free press is answered while the
        // press is still remembered or it is not answered — so it travels from
        // the edge to the pile in one move and joins the crowd already there.
        //
        // On the pile's own line rather than the seat's, so the move is a slide
        // along the bottom instead of a dive across the wall.
        showY = H - hh - H * 0.035;
        showT = offLeft + showY + "px) rotate(" + tilt + "deg)";
        card.style.transform = showT;
        // No dwell and no timer: this print never stood anywhere, so there is
        // nothing to take it down from. toStack() gives it the pile's eight
        // seconds like any other.
        toStack(card, w, hh, showT);
        return;
      }

      // The seat is free, so the crowd has it — at the hero's coordinates and
      // in from the same edge the hero comes in from.
      parkFreeSeat();
      showY = reg.y + (reg.h - hh) / 2;
      showT = "translate(" + reg.x + "px," + showY + "px) rotate(" + tilt + "deg)";
      var from = offLeft + showY + "px) rotate(" + tilt + "deg)";
      card.style.transform = from;
      card.animate(
        [{ transform: from, opacity: 0 }, { transform: showT, opacity: 1 }],
        { duration: 460, easing: "cubic-bezier(.16,1,.3,1)", fill: "forwards" }
      );
      seat = { el: card, w: w, hh: hh, tilt: tilt, cur: showT, timer: null };
      freeSeat = seat;
    }

    // How long the photograph stays before it goes to the stack.
    //
    // The dwell is part of what the Bits bought: a paid photograph carries a
    // name, and a name nobody had time to read was not worth paying for. So the
    // multiplier follows the amount rather than splitting at one point — 1.5s
    // free, and up to 6s at the top, which is the length of a look rather than
    // a glimpse.
    var hold = P.dwell;
    if (paid) {
      var b = paid.bits;
      hold *= b >= 1000 ? 4.0 : b >= 500 ? 3.2 : b >= 250 ? 2.6 : b >= 100 ? 2.1 : 1.8;
      // And that is the whole of it. Congestion used to be answered by
      // trimming this, which paid for the wait with seconds somebody had
      // bought; the wall answers it by getting smaller instead. What an amount
      // buys is the same number of seconds on a quiet channel and a busy one.
    }

    var park = function () {
      if (entry) {
        var at = paidLive.indexOf(entry);
        if (at !== -1) paidLive.splice(at, 1);
        // Leaving is a change to the wall like arriving is: whoever is left
        // spreads back out, and the hero spot may pass to somebody else.
        layoutPaid();
        // Wherever it ended up, not where it first landed.
        toStack(card, entry.w, entry.hh, entry.cur);
        return;
      }
      // Whoever is in the seat leaves it the same way an evicted print does, so
      // there is one path out and one place that clears freeSeat. If the seat
      // has already changed hands this timer was cleared with it and never got
      // here.
      if (seat && freeSeat === seat) parkFreeSeat();
    };
    var timer = setTimeout(park, hold);
    if (seat) seat.timer = timer;
  }

  function layoutStack() {
    var padX = W * 0.025, padY = H * 0.035;
    for (var i = 0; i < stack.length; i++) {
      var it = stack[i];
      var h0 = it.el.offsetHeight || it.hh;
      it.hh = h0;
      var vw = it.w * SCALE, vh = h0 * SCALE;
      var vx = stackSide === "br"
        ? W - padX - vw - i * (vw * STEP)
        : padX + i * (vw * STEP);
      var vy = H - vh - padY;
      // transform-origin is the element centre, so compensate for the shrink
      var to = "translate(" + (vx - it.w * (1 - SCALE) / 2) + "px," +
        (vy - h0 * (1 - SCALE) / 2) + "px) rotate(" + it.tilt + "deg) scale(" + SCALE + ")";
      // By the handle, for both of the reasons placePaid() gives.
      //
      // The one already running is finished but never over — it fills forwards,
      // so it goes on holding the card and goes on being consulted at every
      // restyle. The stack is relaid every time a print arrives, and at the top
      // of a party that is six times in the second a card spends here before it
      // is pushed off the end; on a quiet channel it is a card's whole eight
      // seconds. The wall was given a handle and the stack was left without
      // one, so the pile the wall stopped making went on being made here.
      //
      // And by the handle rather than getAnimations(), because the fade-out
      // that removes the card from the document is on this same element: its
      // cancel handler is what does the removing, so cancelling by name would
      // delete the card where it stands.
      if (it.stackAnim) it.stackAnim.cancel();
      it.stackAnim = it.el.animate([{ transform: it.cur }, { transform: to }],
        { duration: 460, easing: "cubic-bezier(.42,0,.18,1)", fill: "forwards" });
      it.cur = to;
    }
  }

  function dropCard(it) {
    clearTimeout(it.timer);
    var a = it.el.animate(
      [{ opacity: 1, transform: it.cur }, { opacity: 0, transform: it.cur }],
      { duration: 340, easing: "ease-in", fill: "forwards" }
    );
    a.onfinish = a.oncancel = function () { it.el.remove(); };
  }

  /* ================= the paid wall =================

     Every purchase appears, and it appears while the party it belongs to is
     still running. Three fixed places could not do that: the display could
     retire one print every 0.9 to 2 seconds against a supply of one every
     150ms, so a busy party pushed the last photographs a minute past the end
     of the thing they were part of.

     So the places are a grid that densifies instead. The prints get smaller as
     more of them stand at once — never shorter, which would be taking back the
     seconds somebody bought — and the wall grows to fill the height as well as
     the width. The caption keeps its own font size, so the name on a small
     print is the same size as the name on a large one.

     The largest amount standing keeps the spot it has always had, on the right
     at full size. That is the one thing the wall does not compress: the biggest
     purchase of the moment is the biggest photograph on screen, and everything
     else arranges itself beside it. */

  // { el, paid, w, hh, tilt, cur, fresh, moveAnim } in arrival order
  var paidLive = [];

  // The narrowest a print is drawn when nothing is pressing on it: below this
  // the name in the caption is an ellipsis. It is a real floor on a print that
  // has room — one standing alone, and the hero in its seat — which is where
  // tierWidth() and the hero's clamp apply it. The wall's cells do not consult
  // it at all: when the room runs out they go under it rather than leave
  // somebody with nowhere to stand, and being shown small beats not being
  // shown.
  var PAID_MIN_W = 90;

  var PAID_ASPECT_BASE = 1.22;
  var paidAspect = PAID_ASPECT_BASE;   // height / width, remeasured from real cards
  var paidCols = 2;                    // rises while a wall is standing, resets with it
  var paidWallRoom = true;             // whether the next paid print has somewhere to stand
  var paidDraining = false;             // whether accepted paid prints are still visible or waiting

  // The top of the table below, named because tierLid() has to measure its lid
  // against the same number the table starts at. Written twice, a change to the
  // table alone leaves the lid sized for the old top and the biggest print goes
  // straight back over the edge the lid was added to keep it inside: at 0.25
  // against a lid still computed from 0.235, the hero is drawn 6.4% taller than
  // the region — 827px in a 777.6px wall.
  var TIER_TOP_F = 0.235;

  // What an amount is worth in width. 1000 is the size a paid print has always
  // been; the rest step down from it, so the order is visible before any name
  // is read.
  function tierWidth(bits) {
    var f = bits >= 1000 ? TIER_TOP_F
      : bits >= 500 ? 0.205
      : bits >= 250 ? 0.180
      : bits >= 100 ? 0.158
      : 0.140;
    return Math.max(PAID_MIN_W, W * f * ovScale * P.photo * tierLid());
  }

  /**
   * How far every amount has to come down for the tallest print to fit.
   *
   * A print's width is bought and its height comes from the shape the subject
   * was framed in, so a portrait camera — ordinary for an avatar — makes a card
   * taller than the canvas at the larger settings. Something has to give, and
   * it is the width.
   *
   * The point of doing it here rather than to the largest amount alone: a lid
   * laid on one tier is a lid every tier underneath eventually reaches, and
   * they arrive at the same number. Measured at 9:16 with the size and preset
   * both at their largest, 1000, 500 and 250 Bits all came out at 442.6px —
   * the amounts were still being charged and were no longer being shown. As a
   * ratio the steps survive: 442.6, 386.1, 339.0.
   *
   * One means nothing is clamped, which is every landscape subject.
   */
  function tierLid() {
    var top = W * TIER_TOP_F * ovScale * P.photo;
    var lid = paidRegionH() / paidAspect;
    return lid < top ? lid / top : 1;
  }

  /**
   * How wide a free print is — and, by inheritance, how wide the strip the wall
   * leaves for the extension's button is (paidRegion).
   *
   * In one place, because two places is a wall whose right edge and whose
   * clearance disagree: a change made to one copy and not the other moves one
   * of them without the other.
   */
  function freeWidth() {
    // Below the cheapest amount, which is what "a paid print arrives bigger"
    // has always claimed and did not do. At 0.20 a free print was wider than
    // 10, 100 AND 250 Bits (0.140 / 0.158 / 0.180) — three of the five amounts
    // bought a SMALLER photograph than pressing for nothing, and the sizes read
    // as random rather than as a ladder (本人の指摘 2026-08-26).
    //
    // 0.115 sits a clear step under the cheapest tier, so the six sizes run in
    // one direction: free 0.115, then 0.140, 0.158, 0.180, 0.205, 0.235.
    return Math.max(PAID_MIN_W, W * 0.115 * ovScale * P.photo);
  }

  // ...and how much of its cell it fills once the cells are smaller than the
  // widths above. Without this the order disappears exactly when the wall is
  // busiest, which is when it is worth the most.
  function tierFill(bits) {
    return bits >= 1000 ? 1
      : bits >= 500 ? 0.96
      : bits >= 250 ? 0.92
      : bits >= 100 ? 0.88
      : 0.84;
  }

  /**
   * How tall the wall is.
   *
   * In one place for the same reason freeWidth() is: tierLid() sizes every
   * amount so the tallest print fits this, and if the two numbers were written
   * separately, moving the wall alone would move the lid nowhere. Taking the
   * wall down to 0.68H and leaving the lid at 0.72H puts the hero 43.2px past
   * the bottom of it; letting the wall out to 0.76H and leaving the lid draws
   * the hero 10.8px narrower than the room it now has.
   */
  function paidRegionH() {
    return H * 0.72;
  }

  /* Where the wall may draw: from the left edge to the button's clearance,
   * above the stack.
   *
   * The wall used to be on the right, and the right is where the extension
   * sits. Twitch anchors a video component to the RIGHT of the player, so the
   * wall — the prints somebody paid for — was the half of the canvas covered by
   * a button (本人の指摘 2026-08-26: the paid photographs could not be seen in
   * a desktop browser).
   *
   * The strip that was given up is kept empty rather than handed back. It held
   * the free prints for a day, and now that everything enters from the left and
   * shares one seat (85-display.js) nothing stands in it at all — which is what
   * a strip under a button should hold. Widening the wall into it would put
   * bought photographs back where they could not be seen, for 13% more room.
   *
   * Its width is still freeWidth()'s, and deliberately: every measurement in
   * this file — the column counts, the drain simulations, the worst-case floor
   * of 38.5px — was taken against a wall that ends here. A clearance written as
   * its own number would be the same number with nothing tying it to them. */
  function paidRegion() {
    var freeW = freeWidth();
    return {
      x: W * 0.045,
      r: W - (W * 0.02 + freeW + W * 0.01),
      y: H * 0.04,
      h: paidRegionH()
    };
  }

  /* Ten, and the last two are not decoration.
   *
   * The wall is measured in pixels while the prints scale with the
   * broadcaster's size and preset, and a caption keeps its own font however
   * small the print gets — so the shape the rows have to clear is taller on a
   * small setting than a large one, and fewer rows fit. Stopped at eight, the
   * worst of those combinations held 32 of a full party's 41 and put the other
   * nine underneath prints already standing, where nothing of them is seen.
   * That is a purchase that bought no photograph, which is the one outcome
   * this is all arranged to prevent.
   *
   * Ten is where widening stops paying: past it the cells are narrower than the
   * caption needs and the wall is better served by another row. It is not by
   * itself enough — a subject cropped upright makes cells the region cannot
   * stack, and the rows have to come down in height as well, which is what
   * layoutPaid() does below. Ten columns and however many rows it takes is what
   * holds every combination. */
  var WALL_COLS_MAX = 10;
  // Seven is the smallest busy floor that buys time instead of just spending
  // size. Without it, sixteen 1000 Bits prints leave the last one at 30.0s
  // (ten seconds after the party ends); with seven seats they come back to
  // 12.2s and only pay 451px -> 296px. Raising the floor to nine pays the
  // next drop, 296px -> 218px, but from a hundred buyers up it gives the same
  // answer as seven, so it is only taking size from the moments that are not
  // the worst case.
  var WALL_MIN_SEATS_BUSY = 7;

  function setPaidWallRoom(room) {
    room = !!room;
    if (room === paidWallRoom) return;
    paidWallRoom = room;
    reportOverlayState();
  }

  function setPaidDraining(draining) {
    draining = !!draining;
    if (draining === paidDraining) return;
    paidDraining = draining;
    reportOverlayState();
    maybeShowPendingSheet();
  }

  /**
   * Three places a bought photograph can be, and the party is not over until
   * all three are empty: standing on the wall, still queued at the EBS, or in
   * the camera between the two (paidOwed). Leaving the third out is what let
   * the sheet cover the last purchase of a party.
   */
  function updatePaidDraining() {
    setPaidDraining(!BAR_ONLY && (paidLive.length > 0 || paidWaiting > 0 || paidOwed > 0));
  }

  /**
   * Pick the wall density from two separate promises: keep every paid print on
   * screen, and when a queue exists, drain it inside the same budget that the
   * party and EBS use for closing the door.
   *
   * This is not a cosmetic choice. The solver has to know the hero is outside
   * the grid, that waiting purchases do not yet carry their Bits tier in the
   * overlay, and that a party may be allowed to run forty seconds past the
   * banner while it drains. The comments below stay next to the branches where
   * those facts matter, because each one looks removable until the measured
   * failure is remembered.
   */
  function choosePaidCols(restCount, standingCount, waitingCount, currentCols, aspect, wallW, regionH, gap, budgetMs, dwellMs) {
    var cols = WALL_COLS_MAX, colW = 0, cellH = 0, rows = 1, capC = WALL_COLS_MAX;
    if (restCount <= 0) return 2;
    // The fewest columns that hold the non-hero prints already standing. More
    // columns means smaller cells, which also means more rows fit, so the
    // ladder climbs in both directions at once. Forty is as many as can ever
    // stand at the same time: one capture per 150ms against a six second dwell
    // is forty-one, and the hero is one of them. A landscape subject is inside
    // ten columns before that, and the upright cases that still do not fit are
    // handed to layoutPaid()'s row-shrinking block after this function returns.
    for (var c = 2; c <= WALL_COLS_MAX; c++) {
      colW = (wallW - (c - 1) * gap) / c;
      cellH = colW * aspect;
      rows = Math.max(1, Math.floor((regionH + gap) / (cellH + gap)));
      if (c * rows >= restCount) { capC = c; break; }
      capC = c;
    }
    cols = capC;
    waitingCount = Math.max(0, waitingCount || 0);
    // If nobody is waiting, capacity is the only reason to shrink. The drain
    // formula has "standing" in its numerator, so it would still tighten the
    // wall as the party clock ran down: a lone 1000 Bits print arriving at
    // 19.8s in the measured standard/default case fell from 451px to 78px even
    // though no queued purchase could be helped by that.
    if (waitingCount > 0) {
      colW = (wallW - (currentCols - 1) * gap) / currentCols;
      cellH = colW * aspect;
      rows = Math.max(1, Math.floor((regionH + gap) / (cellH + gap)));
      // Seats are not columns and not just grid cells. layoutPaid() places the
      // hero as plan[0] outside the wall and only spreads rest across the grid,
      // so the number that drains the overlay is one hero seat plus cols*rows.
      var wallFull = standingCount >= 1 + currentCols * rows;
      // A queue does not prove the wall is full. EBS releases one paid capture
      // per 150ms, so three people pressing together can make waiting > 0 for a
      // moment even though the two-column wall has exactly three seats. If the
      // seven-seat floor were applied there, the grow-only hysteresis below
      // would keep that three-column, 296px wall around for the rest of the
      // party. Four people are the first case where the seats are actually
      // short, and that is where the floor starts doing useful work.
      var minSeats = wallFull ? WALL_MIN_SEATS_BUSY : 0;
      var need = standingCount + waitingCount;
      var found = false;
      cols = WALL_COLS_MAX;
      for (c = capC; c <= WALL_COLS_MAX; c++) {
        colW = (wallW - (c - 1) * gap) / c;
        cellH = colW * aspect;
        rows = Math.max(1, Math.floor((regionH + gap) / (cellH + gap)));
        var seats = 1 + c * rows;
        if (seats < minSeats) continue;
        // dwellMs is the maximum dwell, not the tier's exact dwell. The queued
        // purchases have not reached this overlay yet, so their amounts are not
        // available here; using P.dwell*4.0 makes standard 6.0s and quiet 8.8s.
        // In mixed tiers that maximum is about 1.46x the average, which is a
        // deliberate bias toward a denser wall instead of a late one.
        if (need * dwellMs <= seats * budgetMs) { cols = c; found = true; break; }
      }
      if (!found && minSeats) {
        // No column count can satisfy the time budget. If the wall is already
        // full, choose the smallest count that satisfies the busy floor, because
        // that preserves the most width while still fixing the "large but
        // nobody can enter" wall. If the floor is not active, the default left
        // above is maximum density; once that still cannot hold everybody,
        // layoutPaid() opens the last gate with ceil(rest.length/cols), making
        // the prints smaller rather than hiding paid cards underneath others.
        for (c = capC; c <= WALL_COLS_MAX; c++) {
          colW = (wallW - (c - 1) * gap) / c;
          cellH = colW * aspect;
          rows = Math.max(1, Math.floor((regionH + gap) / (cellH + gap)));
          if (1 + c * rows >= minSeats) { cols = c; break; }
        }
      }
    }
    // The column count only rises while a wall is standing. applyPaidPlan()
    // writes every card's width when the count changes, and without hysteresis
    // the longer forty-second drain budget made a party rebuild the wall up to
    // 52 times, 35 of them direction reversals. Grow-only was 0-4 rebuilds and
    // 0-1 reversals, with no worse peak column count or minimum width.
    if (cols < currentCols) cols = currentCols;
    return cols;
  }

  /**
   * Lay every standing paid print out again.
   *
   * Called whenever one arrives or leaves, so twice per capture — about
   * thirteen times a second at the top of a party. Nothing is measured or moved
   * here: the whole wall is worked out as numbers first and handed to
   * applyPaidPlan(), which is where the one costly thing happens and where the
   * reason it only happens once is written down. OBS is drawing this.
   */
  function layoutPaid() {
    if (!paidLive.length) {
      // Nothing is standing, so nothing moves and nothing blinks — which makes
      // this the one moment the shape can be forgotten. It only ever rises
      // while a wall is up, and it is measured off cards the wall has already
      // shrunk, so carrying the tallest reading of a crowded party into the
      // next one would keep answering with a shape no card on screen has.
      paidAspect = PAID_ASPECT_BASE;
      paidCols = 2;
      setPaidWallRoom(true);
      updatePaidDraining();
      return;
    }
    var reg = paidRegion();

    // The hero: the biggest amount standing. Ties go to whoever arrived first,
    // so the spot does not swap back and forth between two equal purchases.
    var hero = paidLive[0];
    for (var i = 1; i < paidLive.length; i++) {
      if (paidLive[i].paid.bits > hero.paid.bits) hero = paidLive[i];
    }
    // The amount says how wide, and the subject says how tall — so on its own
    // the width can name a print taller than the canvas it is drawn on. A
    // camera cropped upright is enough: at the largest size a broadcaster can
    // pick, a 9:16 subject makes the 1000 Bits print 1114px on a 1080px canvas,
    // and a narrower crop than that runs 793px past the bottom edge. What hangs
    // off the screen is the photograph, which is the whole of what was bought.
    // So the tiers keep their order and their proportions, and the largest of
    // them stops at the height of the region rather than the height of the
    // frame. A landscape subject never reaches this and is drawn exactly as
    // before.
    // tierWidth() already carries the region's lid, so the biggest amount
    // standing is as wide as it can be and the ones below it keep their steps.
    var heroW = tierWidth(hero.paid.bits);
    // The outer edge of the wall, which is now the left one. The hero sits
    // against it and the grid fills inward, so the biggest amount standing is
    // the furthest thing from the extension's button rather than the nearest
    // (本人の指摘 2026-08-26: the region moved left but the hero stayed pinned
    // to its right edge, which put it back under the button).
    var plan = [{ e: hero, w: heroW, x: reg.x, boxY: reg.y, boxH: reg.h }];

    var rest = [];
    for (var r = 0; r < paidLive.length; r++) if (paidLive[r] !== hero) rest.push(paidLive[r]);
    if (!rest.length) { paidCols = 2; setPaidWallRoom(true); applyPaidPlan(plan); updatePaidDraining(); return; }

    // Start with the fewest columns that hold the prints already standing. When
    // there is a queue behind them, raise that only as far as the party's drain
    // budget requires. The count never falls while the wall is up: changing it
    // writes every card's width, and bouncing around a boundary rebuilds the
    // wall over and over.
    // The grid starts where the hero ends, and runs to the region's inner edge.
    var wallL = reg.x + heroW + W * 0.012;
    var wallW = Math.max(120, reg.r - wallL);
    var gap = W * 0.008;
    var budgetMs = Math.max(0, party && party.endsAt ? party.endsAt - Date.now() : 0) + TIMELINE.drainMaxMs;
    var cols = choosePaidCols(
      rest.length,
      paidLive.length,
      paidWaiting,
      paidCols,
      paidAspect,
      wallW,
      reg.h,
      gap,
      budgetMs,
      P.dwell * 4.0
    );
    paidCols = cols;
    var colW = (wallW - (cols - 1) * gap) / cols;
    var cellH = colW * paidAspect;
    var rows = Math.max(1, Math.floor((reg.h + gap) / (cellH + gap)));
    // One row of cells taller than the wall is still one row, but the print
    // drawn in it is sized off the cell — so without this a wall holding two or
    // three upright prints draws them at full tier width and hangs them off the
    // bottom of the canvas, for the same reason the hero did.
    //
    // This is the EBS gate's fact, not the decision. A paid print is released
    // to every ready overlay, so EBS waits until every visible overlay reports
    // room. At maximum density the answer deliberately opens again: with quiet
    // k=0.9, a 1:4 subject and a 5px caption, ten columns can expose only
    // eleven seats, and holding the gate closed there drained 120 queued
    // purchases in 116.5s. Letting layoutPaid() take the overflow with
    // ceil(rest.length / cols) returns that same case to 17.9s, supply-limited,
    // with no over-budget states (docs/scratch/p412-sim.mjs).
    setPaidWallRoom(paidLive.length < 1 + cols * rows || cols >= WALL_COLS_MAX);
    cellH = Math.min(cellH, reg.h);

    // Ten columns is as dense as the wall goes across, so when ten columns of
    // cells the subject's own shape still do not hold everybody, the cells come
    // down in height instead and the prints come down with them.
    //
    // Without this the leftovers were laid on top of prints already standing,
    // and the one underneath is not seen at all — which is the whole of what
    // the Bits bought. It was not a corner: the wall is measured in pixels
    // while the prints scale with the broadcaster's size and preset, and the
    // caption keeps its font however small the print gets, so the small
    // settings leave the cells too tall to stack. At ovScale x P.photo of 0.61,
    // 0.70 and 0.78 a full party of 1000 Bits fitted 32 of its 40 and buried
    // the other eight. Smaller again, rather than hidden.
    if (cols * rows < rest.length) {
      // As many rows as it takes, and no fewer.
      //
      // Keeping a print wide enough for its caption to be read is worth having,
      // and it is only worth having: the alternative here was to lay the
      // leftovers on top of prints already standing, in the same cell at the
      // same coordinates, where nothing whatever of the one underneath is seen.
      // A subject cropped upright is all it takes — measured over the twelve
      // size settings a broadcaster can pick and eight subject shapes, a
      // subject taller than about 1:2.2 buried ten to twenty of a full party's
      // forty. Being shown the print at all is what the Bits bought.
      //
      // The wall is only ever this short of room at ten columns — a narrower
      // wall that held everybody would have broken the loop above — so this is
      // ceil(n/10) and comes to four rows at the fullest a party gets. The
      // floor it lands on is a cell 182.9px tall and a print 38.5px wide at the
      // worst of the twelve settings: small, and on screen.
      rows = Math.ceil(rest.length / cols);
      cellH = (reg.h + gap) / rows - gap;
    }
    // The columns keep their pitch; only what is drawn in them narrows, so the
    // wall stays a grid rather than bunching to the left.
    var cellW = Math.min(colW, cellH / paidAspect);

    for (var n = 0; n < rest.length; n++) {
      // cols * rows >= rest.length is now guaranteed above, so this never wraps
      // and no two prints are ever given the same cell. Kept as the statement
      // of what must hold rather than removed.
      var cell = n % (cols * rows);
      var col = cell % cols, row = Math.floor(cell / cols);
      var e = rest[n];
      var w = Math.min(tierWidth(e.paid.bits), cellW * tierFill(e.paid.bits));
      // From where the grid starts, not where the region does — the hero has
      // the region's first heroW pixels now.
      var cx = wallL + col * (colW + gap);
      var cy = reg.y + row * (cellH + gap);
      plan.push({ e: e, w: w, x: cx + (colW - w) / 2, boxY: cy, boxH: cellH });
    }
    applyPaidPlan(plan);
    updatePaidDraining();
  }

  /**
   * Carry a whole layout out: every width, then every height, then every move.
   *
   * The width has to be applied before the height is read, because the height
   * decides the vertical centring and a card measured at its old size lands a
   * few pixels out — on a wall where every card resizes at once that reads as a
   * row that will not sit straight.
   *
   * But writing a width and reading a height back on the same card makes the
   * page lay itself out again on the spot, and doing it card by card makes it
   * happen once per card. The wall reaches forty-one cards and relays twice per
   * capture, so that was up to five hundred forced layouts a second on the
   * machine that is also encoding the stream. The cells only change size when
   * the column count does, which is exactly what a party crossing a boundary
   * does over and over — so the worst case was also the common one.
   *
   * Separated into passes, every read falls after every write and the whole
   * wall costs one layout instead of forty-one.
   */
  function applyPaidPlan(plan) {
    var i, t;
    for (i = 0; i < plan.length; i++) {
      t = plan[i];
      t.resized = Math.abs(t.e.w - t.w) > 0.5;
      if (t.resized) {
        t.e.el.style.width = t.w + "px";
        t.e.w = t.w;
      }
    }
    for (i = 0; i < plan.length; i++) {
      t = plan[i];
      if (!t.resized) continue;
      t.e.hh = t.e.el.offsetHeight;
      // Taken at the size the card is actually drawn at, and never allowed to
      // fall: a caption keeps its own font however small the print gets, so a
      // small card is proportionally taller than a large one. Letting the
      // number move both ways meant the hero's shape and a cell's shape
      // answered in turn, the row count flipped between the two answers, and
      // the whole wall jumped every time somebody arrived. Rising only, it
      // settles on the tallest shape seen and stays there — which is the one
      // the rows have to clear.
      if (t.e.hh > 0 && t.w > 0) paidAspect = Math.max(paidAspect, t.e.hh / t.w);
    }
    for (i = 0; i < plan.length; i++) placePaid(plan[i]);
  }

  /** Move one print to where the plan put it, animating from wherever it is. */
  function placePaid(t) {
    var e = t.e;
    var y = t.boxY + (t.boxH - e.hh) / 2;
    var to = "translate(" + t.x + "px," + y + "px) rotate(" + e.tilt + "deg)";
    if (to === e.cur && !e.fresh) return;
    // The one it was already running is finished but never over: it fills
    // forwards, so it goes on holding the card and goes on being consulted at
    // every restyle. On a wall that rearranges a dozen times a second they pile
    // up on every card for as long as the card stands.
    //
    // This one, by the handle, rather than everything getAnimations() finds on
    // the element. The card outlives the wall — it goes to the stack, and the
    // stack fades it out with an animation whose cancel handler removes it from
    // the document. Cancelling by name cannot reach that one, whatever a later
    // change does to the order the wall and the stack are called in.
    if (e.moveAnim) e.moveAnim.cancel();
    // The first move is an arrival and fades up; the rest are the wall settling
    // and must not blink the cards that were already standing.
    var from = e.fresh ? 0 : 1;
    e.fresh = false;
    e.moveAnim = e.el.animate(
      [{ transform: e.cur, opacity: from }, { transform: to, opacity: 1 }],
      { duration: 460, easing: "cubic-bezier(.16,1,.3,1)", fill: "forwards" });
    e.cur = to;
  }

  function toStack(cardEl, w, hh, from) {
    if (!cardEl.isConnected) return;
    var it = { el: cardEl, w: w, hh: hh, tilt: (Math.random() * 7 - 3.5).toFixed(1),
               cur: from, timer: null, stackAnim: null };
    it.timer = setTimeout(function () {
      var i = stack.indexOf(it);
      if (i === -1) return;
      stack.splice(i, 1);
      dropCard(it);
      layoutStack();
    }, STACK_TTL_MS);
    stack.push(it);
    while (stack.length > STACK_MAX) dropCard(stack.shift());
    layoutStack();
  }

  /* ================= the goal bar and the SHUTTER PARTY =================

     Nothing here decides anything. The EBS owns the arithmetic — the threshold,
     what a press is worth, whether the party may light — and this page is handed
     the outcome and plays it: bar, name, 3-2-1, banner, contact sheet.

     The sequence runs on local timers from the moment the ignition arrives. The
     EBS is judging presses off its own clock at the same time, so the two drift
     by the length of one aggregation window at most; over a twenty second party
     that is invisible, and the alternative — asking who is right, twice a second
     — would put the object back in the loop for no gain. */

  var elBar = document.getElementById("bitsBar");
  var elBarLabel = document.getElementById("bbLabel");
  var elBarRemain = document.getElementById("bbRemain");
  var elBarFill = document.getElementById("bbFill");
  var elLastHit = document.getElementById("lastHit");
  var elLhName = document.getElementById("lhName");
  var elLhSub = document.getElementById("lhSub");
  var elCd = document.getElementById("countdown");
  var elCdName = document.getElementById("cdName");
  var elCdEyebrow = document.getElementById("cdEyebrow");
  var elCdNum = document.getElementById("cdNum");
  var elCdSub = document.getElementById("cdSub");
  var elBanner = document.getElementById("banner");
  var elBannerLede = document.getElementById("bannerLede");
  var elBannerBar = document.getElementById("bannerBar");
  var elSheet = document.getElementById("sheet");
  var elSheetGrid = document.getElementById("sheetGrid");
  var elSheetTime = document.getElementById("sheetTime");
  var elSheetTally = document.getElementById("sheetTally");
  var ovGold = document.getElementById("ovGold");

  // Replaced by whatever the EBS sends; these only matter for the seconds
  // between the page loading and the greeting arriving.
  // The built-in timings, and how far the EBS is allowed to move each of them.
  // A range rather than "any positive number": a name card shown for 20ms is
  // not a shorter card, it is a card nobody saw, and a ten-minute party is a
  // cooldown that never comes back. The EBS sends fixed values today; this is
  // what keeps a future one from being able to break the effect from outside.
  var TIMELINE_RANGE = {
    lastHitMs:   { def: 3000,  min: 1000, max: 10000 },
    countdownMs: { def: 3000,  min: 1000, max: 10000 },
    partyMs:     { def: 20000, min: 5000, max: 60000 },
    // 40s is the default full drain, not the floor. Keep the floor at one
    // longest photo residence (quiet: 8.8s) so visible paid photos can cycle
    // off the wall while the EBS and overlay still share smaller valid drains.
    drainMaxMs:  { def: 40000, min: 8800, max: 120000 },
    sheetMs:     { def: 5000,  min: 1000, max: 15000 }
  };
  var TIMELINE = { lastHitMs: 3000, countdownMs: 3000, partyMs: 20000, drainMaxMs: 40000, sheetMs: 5000 };

  /**
   * Take a timeline from the EBS one field at a time.
   *
   * Replacing the whole object would trust it to be complete, and an incomplete
   * one is worse than a wrong one: setTimeout(fn, undefined) fires on the next
   * tick, so half a timeline would run the name, the countdown and the party in
   * a single frame. Each field is a duration or it is the built-in value.
   */
  function applyTimeline(t) {
    if (!t || typeof t !== "object") return;
    for (var k in TIMELINE_RANGE) {
      var r = TIMELINE_RANGE[k];
      var v = Number(t[k]);
      TIMELINE[k] = (isFinite(v) && v >= r.min && v <= r.max) ? v : r.def;
    }
  }

  var bar = { pool: 0, goal: 0 };
  var barForced = false;     // #preview: drawn regardless, to be sized against
  var party = null;          // { name, shots: [], people: 0, endsAt } while it is open
  var paidWaiting = 0;
  var pendingSheet = null;
  var pendingSheetTimer = null;
  var seqTimers = [];

  function seqDelay(fn, ms) { seqTimers.push(setTimeout(fn, ms)); }

  function clearSequence() {
    for (var i = 0; i < seqTimers.length; i++) clearTimeout(seqTimers[i]);
    seqTimers.length = 0;
    clearTimeout(pendingSheetTimer);
    pendingSheetTimer = null;
    pendingSheet = null;
  }

  function updateBar() {
    elBarLabel.textContent = t("bar.label");
    var remain = Math.max(0, bar.goal - bar.pool);
    elBarRemain.textContent = remain;
    var ratio = bar.goal > 0 ? Math.min(1, bar.pool / bar.goal) : 0;
    elBarFill.style.transform = "scaleX(" + ratio + ")";
    elBar.classList.toggle("near", ratio >= 0.8);
    // Hidden while the party is running: the bar has nothing to count towards
    // and the banner is standing where it sits.
    // Only the bar source draws it. In the overlay the element still exists —
    // the two share this file — but it is never shown: the bar belongs to the
    // source OBS can place, and two of them would disagree the moment one
    // source was hidden.
    elBar.classList.toggle("on", BAR_ONLY && (barForced || bar.goal > 0) && !party);
  }

  /** Take the bar the EBS just sent. It is the only thing that knows. */
  function applyBarState(m) {
    if (typeof m.pool === "number") bar.pool = m.pool;
    if (typeof m.goal === "number") bar.goal = m.goal;
    updateBar();
  }

  function applyWaiting(m) {
    var before = paidWaiting;
    if (m && typeof m.waiting === "number" && isFinite(m.waiting)) {
      paidWaiting = Math.max(0, Math.floor(m.waiting));
    }
    // Keep the last value when an old EBS omits waiting. Treating absence as
    // zero would erase a newer queue report if mixed messages arrive out of
    // order during a rolling overlay/EBS update.
    //
    // A full wall is the one case where waiting can change without a shoot
    // message. Re-layout on the changed fact so the wall can raise its density
    // and report room again; otherwise the EBS would correctly wait forever for
    // an overlay state change that never comes.
    if (paidWaiting !== before && paidLive.length) layoutPaid();
    updateQueueToast();
    updatePaidDraining();
  }

  function applyPhaseState(m) {
    if (m && typeof m.phase === "string") updatePhaseState(m.phase);
  }

  /**
   * Rejoin a party already in progress — OBS restarted, or the scene reloaded.
   *
   * Only the banner and the clock come back. The name and the frames belong to
   * the sequence that has already played, and inventing them would put a made
   * up contact sheet on the air.
   */
  function resumeParty(remainMs) {
    if (party || !(remainMs > 0)) return;
    party = { name: "", shots: [], people: 0, endsAt: Date.now() + remainMs };
    updatePhaseState("party");
    updateBar();
    elBannerLede.textContent = t("banner.lede");
    elBanner.classList.add("on");
    placeCounter();
    elBannerBar.animate(
      [{ transform: "scaleX(" + Math.min(1, remainMs / TIMELINE.partyMs) + ")" }, { transform: "scaleX(0)" }],
      { duration: remainMs, easing: "linear", fill: "forwards" }
    );
    seqDelay(closeParty, remainMs);
  }

  function bitsPop(amount, name) {
    var el = document.createElement("div");
    el.className = "bitspop";
    el.textContent = "+" + amount + " Bits  " + (name || t("someone"));
    el.style.left = (W * 0.035) + "px";
    el.style.top = (H * 0.12) + "px";
    ovSparks.appendChild(el);
    var a = el.animate(
      [
        { opacity: 0, transform: "translateY(8px)" },
        { opacity: 1, transform: "translateY(0)", offset: 0.2 },
        { opacity: 0, transform: "translateY(-24px)" }
      ],
      { duration: reduceMotion ? 1 : 1400, easing: "ease-out" }
    );
    a.onfinish = a.oncancel = function () { el.remove(); };
  }

  /* ---- the sounds that are not a shutter ---- */

  function blip(freq, dur, level) {
    if (muted) return;
    var ac = ensureAudio();
    if (!ac) return;
    var at = ac.currentTime;
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(Math.min(1, volume * level), at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, at + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(at);
    o.stop(at + dur + 0.03);
    o.onended = function () { try { g.disconnect(); } catch (e) {} };
  }

  // Rising notes, so the room hears that somebody paid without reading anything.
  function chime(amount) {
    if (muted) return;
    var notes = amount >= 250 ? [880, 1175, 1568] : amount >= 100 ? [988, 1319] : [1175];
    for (var i = 0; i < notes.length; i++) {
      (function (f, k) { setTimeout(function () { blip(f, 0.24, 0.3); }, k * 90); })(notes[i], i);
    }
  }

  /* The 250 Bits treatment: a white hit, then a warm afterglow and a ring.
   *
   * TWO of these cover the whole frame — #ovFlash and #ovGold — and §4.6
   * measures what lands on the SCREEN, not what each layer carries. So they
   * share one allowance and one clock (claimFullFrame, 70-effects.js) rather
   * than each taking 0.35 and each keeping its own rate.
   *
   * That is the correction, and both halves of it were wrong before:
   *
   *   the ceiling — white at 0.35 under a wash at .6 × .58 = .348 composites to
   *   1-(1-.35)(1-.348) ≈ 0.49. Each layer's own number was under the limit and
   *   the picture was not, because the peaks land 84ms apart inside one 260ms
   *   flash. Now 0.18 over 0.18 = 1-(.82)(.82) = 0.328.
   *
   *   the rate — only fullFlash was on the 334ms clock. The wash had no gate at
   *   all, and paid photos leave the queue one per 150ms window, so a run of
   *   250+ purchases restarted it at about 6.7Hz. Worse than it reads: Web
   *   Animations gives the newest animation on a property the last word, so
   *   each restart dropped the wash to 0 and ramped it back to full.
   *
   * The wash is a gradient whose centre is rgba(...,.6), so the ELEMENT opacity
   * that puts 0.18 on screen is .18/.6 = .30. Raising either number alone
   * breaks the ceiling silently, which is why tools/overlay-invariants.mjs
   * reads them both out of this file and does the compositing arithmetic.
   *
   * The ring is outside the claim on purpose. §4.6 excludes small-area points
   * of light, so a purchase that lands inside an already-claimed window still
   * gets its own mark — the budget takes away the flash, not the feedback. */
  var GOLD_WHITE = 0.18;       // #ovFlash: this caller's share of the allowance
  var GOLD_WASH = 0.30;        // #ovGold element opacity; × .6 gradient = .18
  var GOLD_WASH_TAIL = 0.22;   // the afterglow it settles to; the white is gone by then

  function goldPulse() {
    if (flashMode === "off") return;
    var soft = flashMode === "soft";

    // Asked once for the pair. Asking per layer is what let two layers each
    // take a full allowance and put the sum over the ceiling.
    if (claimFullFrame()) {
      paintFlash(1, GOLD_WHITE);
      ovGold.animate(
        [
          { opacity: 0 },
          { opacity: soft ? GOLD_WASH * 0.45 : GOLD_WASH, offset: 0.1 },
          { opacity: soft ? GOLD_WASH_TAIL * 0.45 : GOLD_WASH_TAIL, offset: 0.34 },
          { opacity: 0 }
        ],
        { duration: reduceMotion ? 1 : 1150, easing: "cubic-bezier(.1,.6,.3,1)" }
      );
    }

    var ring = document.createElement("div");
    ring.className = "goldring";
    ovSparks.appendChild(ring);
    var a = ring.animate(
      [
        { opacity: 0, transform: "translate(-50%,-50%) scale(.12)" },
        { opacity: soft ? 0.5 : 0.85, transform: "translate(-50%,-50%) scale(.5)", offset: 0.3 },
        { opacity: 0, transform: "translate(-50%,-50%) scale(1.35)" }
      ],
      { duration: reduceMotion ? 1 : 900, easing: "cubic-bezier(.15,.7,.3,1)" }
    );
    a.onfinish = a.oncancel = function () { ring.remove(); };
  }

  /* ---- last hit -> 3 2 1 -> party -> contact sheet ---- */

  function ignite(ign) {
    clearSequence();
    // The last sequence may still be on screen. The contact sheet hangs for
    // five seconds after a party closes, and the bar can be full again before
    // it goes — clearSequence() only stops the timers that would have taken
    // these away, so the new last-hit card would draw over the old sheet.
    elSheet.classList.remove("on");
    elBanner.classList.remove("on");
    elCd.classList.remove("on");
    elLastHit.classList.remove("on");
    if (ign) applyTimeline(ign.timeline);
    // Empty rather than "someone": a party lit by free presses has nobody to
    // name, and the card below says so by naming the event instead.
    var name = (ign && ign.name) || "";

    showLastHit(name);
    seqDelay(function () {
      runCountdown(name, function () { openParty(name); });
    }, TIMELINE.lastHitMs);
  }

  /**
   * The three seconds before the countdown, whoever they belong to.
   *
   * With a name they belong to a person: the name, and what they did. Without
   * one — a party filled by free presses, which is most of them on a channel
   * earning no Bits — they belong to the event, and the card says SHUTTER PARTY
   * rather than a stand-in word. "Someone opened the SHUTTER PARTY" spends the
   * biggest card the overlay has on the fact that nobody is being named.
   *
   * The three seconds themselves do not move. The EBS holds the clock for the
   * whole channel (CLAUDE.md: the EBS decides, the overlay plays), and its
   * party opens at LASTHIT_MS + COUNTDOWN_MS whatever is drawn here — skipping
   * the card locally would put the free-for-all on screen three seconds before
   * the buttons were told it had started, and take it away three seconds early.
   */
  function showLastHit(name) {
    elLhName.textContent = name || "SHUTTER PARTY";
    elLhSub.textContent = name ? t("lasthit.sub") : "";
    elLastHit.classList.add("on");
    var a = elLastHit.animate(
      [
        { opacity: 0, transform: "scale(.86)" },
        { opacity: 1, transform: "scale(1)", offset: 0.11 },
        { opacity: 1, transform: "scale(1)", offset: 0.86 },
        { opacity: 0, transform: "scale(1.05)" }
      ],
      { duration: reduceMotion ? 1 : TIMELINE.lastHitMs, easing: "cubic-bezier(.2,1.1,.3,1)" }
    );
    a.onfinish = a.oncancel = function () { elLastHit.classList.remove("on"); };
  }

  function runCountdown(name, done) {
    // The count is derived from the length the EBS sent rather than fixed at
    // three, so the two cannot disagree about when the party opens.
    var step = 1000;
    var n = Math.max(1, Math.round(TIMELINE.countdownMs / step));
    elCdName.textContent = name;
    // Both, because the eyebrow is the label for the name below it.
    elCdName.hidden = !name;
    elCdEyebrow.hidden = !name;
    elCdSub.textContent = t("countdown.sub");
    elCd.classList.add("on");

    (function tick() {
      if (n <= 0) {
        elCd.classList.remove("on");
        blip(1080, 0.34, 0.42);      // the party is open
        done();
        return;
      }
      elCdNum.textContent = n;
      elCdNum.animate(
        [
          { opacity: 0, transform: "scale(1.5)" },
          { opacity: 1, transform: "scale(1)", offset: 0.22 },
          { opacity: 1, transform: "scale(1)", offset: 0.78 },
          { opacity: 0.15, transform: "scale(.94)" }
        ],
        { duration: reduceMotion ? 1 : 950, easing: "cubic-bezier(.2,1,.3,1)" }
      );
      blip(720, 0.13, 0.34);
      n--;
      seqDelay(tick, step);
    })();
  }

  // The banner takes the top strip, which is where the counter normally sits.
  // Push the counter below it for as long as the banner is down.
  function placeCounter() {
    if (party) counterEl.style.top = (elBanner.offsetHeight + 8) + "px";
    else if (queueToastEl.classList.contains("on")) counterEl.style.top = (queueToastEl.offsetHeight + 20) + "px";
    else counterEl.style.top = "";
  }

  function openParty(name) {
    party = { name: name, shots: [], paidAt: [], people: 0, endsAt: Date.now() + TIMELINE.partyMs };
    updatePhaseState("party");
    // From zero again: the last party's frames are what this one overwrites, so
    // the folder stops growing at the size of the biggest one.
    partySeq = 0;
    // The frame whose press lit the party leads the sheet (§4.3). It was
    // captured moments ago, while the name was still on screen.
    if (ignitionShot) {
      if (ignitionPaid) party.paidAt.push(party.shots.length);
      party.shots.push(ignitionShot);
      ignitionShot = null;
      ignitionPaid = false;
    }
    updateBar();

    elBannerLede.textContent = t("banner.lede");
    elBanner.classList.add("on");
    placeCounter();
    elBannerBar.animate(
      [{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }],
      { duration: TIMELINE.partyMs, easing: "linear", fill: "forwards" }
    );
    seqDelay(closeParty, TIMELINE.partyMs);
  }

  function closeParty() {
    if (!party) return;
    var done = party;
    party = null;
    elBanner.classList.remove("on");
    placeCounter();
    updateBar();
    waitForSheet(done);
  }

  function waitForSheet(done) {
    pendingSheet = done;
    clearTimeout(pendingSheetTimer);
    if (!paidDraining) { maybeShowPendingSheet(); return; }
    updatePhaseState("wrapping_up");
    pendingSheetTimer = setTimeout(function () { maybeShowPendingSheet(true); }, TIMELINE.drainMaxMs);
  }

  function maybeShowPendingSheet(force) {
    if (!pendingSheet) return;
    if (paidDraining && !force) return;
    // Forced means the drain budget ran out. Anything still owed at that point
    // is not coming, and carrying the count forward would hold the NEXT party
    // open for a photograph that belonged to this one.
    if (force) paidOwed = 0;
    clearTimeout(pendingSheetTimer);
    pendingSheetTimer = null;
    var done = pendingSheet;
    pendingSheet = null;
    updatePhaseState("sheet");
    showSheet(done);
  }

  function showSheet(done) {
    elSheetGrid.textContent = "";
    var picks = pickSheet(done.shots, done.paidAt || [], 9);
    for (var i = 0; i < picks.length; i++) {
      elSheetGrid.appendChild(subjectCanvas(picks[i]));
    }
    // A party where nothing was captured has nothing to print. Showing an empty
    // frame would only tell the channel that something went wrong.
    if (!picks.length) return;

    elSheetTally.textContent = sheetTally(done.shots.length, done.people);
    elSheetTime.textContent = stamp();
    elSheet.classList.add("on");
    seqDelay(function () { elSheet.classList.remove("on"); }, TIMELINE.sheetMs);
    // Off the critical path: the sheet is already on the channel, and this only
    // decides whether a copy of it also lands in the folder.
    saveSheet(done);
  }

  /* ================= EBS link =================

     The extension button reaches the overlay through the EBS. Only the press
     travels; the picture never leaves this machine.

     WebSocket rather than SSE: the EBS runs on Cloudflare Durable Objects, whose
     hibernation — the thing that makes an idle broadcaster socket free — is
     WebSocket-only. EventSource gave us reconnection for nothing, so that part
     is hand-written here, with backoff. */

  var ebsWs = null;
  var esState = "off";       // off | connecting | live | error
  var ebsRetry = 0;
  var ebsRetryTimer = null;
  var ebsManualClose = false;

  function ebsSocketUrl() {
    var base = String(cfg.ebs || "").trim().replace(/\/+$/, "");
    if (!base) return "";
    var scheme = base.indexOf("https://") === 0 ? "wss://"
      : base.indexOf("http://") === 0 ? "ws://"
      : "wss://";
    var host = base.replace(/^https?:\/\//, "");
    return scheme + host + "/stream?ch=" + encodeURIComponent(cfg.ch) +
      "&t=" + encodeURIComponent(cfg.ebsToken || "");
  }

  function ebsSetState(s) {
    esState = s;
    renderEbs();
    if (s === "live") status("ok", t("st.ebs.live"));
    else if (s === "dead") status("bad", t("st.ebs.dead"), true);
    else if (s === "error") status("bad", t("st.ebs.error"), true);
  }

  function ebsTeardown() {
    if (ebsWs) {
      ebsWs.onopen = ebsWs.onclose = ebsWs.onerror = ebsWs.onmessage = null;
      try { ebsWs.close(); } catch (e) {}
      ebsWs = null;
    }
    clearTimeout(ebsRetryTimer);
    ebsRetryTimer = null;
  }

  function ebsDisconnect() {
    ebsManualClose = true;
    ebsTeardown();
    ebsSetState("off");
  }

  function ebsConnect() {
    ebsTeardown();
    ebsManualClose = false;
    if (!cfg.ebs || !cfg.ch) { ebsSetState("off"); return; }

    var url = ebsSocketUrl();
    ebsSetState("connecting");
    log(t("log.ebs.connecting", { u: cfg.ebs }));

    var sock;
    try { sock = new WebSocket(url); ebsWs = sock; }
    catch (e) { ebsSetState("error"); log(t("log.ebs.failed", { m: e.message }), "bad"); return; }

    sock.onopen = function () {
      if (sock !== ebsWs) return;      // a socket we already replaced
      ebsRetry = 0;
      ebsSetState("live");
      log(t("log.ebs.live"), "ok");
      reportOverlayState();
    };

    sock.onmessage = function (ev) {
      if (sock !== ebsWs) return;
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === "hello") {
        // The bar as the channel actually stands, so a source reloaded mid
        // stream does not draw an empty one over live Bits.
        applyTimeline(m.timeline);
        applyWaiting(m);
        applyPhaseState(m);
        applyBarState(m);
        // Mid-party when we arrived: show the banner for what is left of it.
        // The name and the 3-2-1 have been and gone; only the clock is left.
        // openMs, not remainMs — the latter ends the current phase rather than the
        // party, and would take the banner away seconds after putting it up.
        if (m.openMs > 0) resumeParty(Number(m.openMs) || 0);
      } else if (m.type === "shoot") {
        // A scene can close while a press is in flight, and by the time this
        // arrives the EBS has already moved the bar and may have spent the goal
        // on a party. Dropping the whole message would leave the channel with a
        // bar that disagrees with the EBS and a party that never appeared. What
        // a closed scene withholds is the photograph, and that is refused where
        // the photograph is taken — both capture paths ask sceneOpen() again.
        var people = Math.max(1, Number(m.people) || 1);
        logShot(t("log.ebs.shoot", { n: people }));
        // Asked for before the queue number is taken, and that order is the
        // whole point. This one message says both "here is a purchase" and
        // "none are waiting any more"; applying the second half first left an
        // instant where the wall was empty, the queue was empty and nothing was
        // owed — which is exactly what the EBS reads as "drained".
        //
        // The bar source has no camera, so it only ever takes the number.
        if (!BAR_ONLY) {
          requestShot(people, {
            paid: m.paid && m.paid.bits > 0 ? m.paid : null,
            ignition: m.ignition || null
          });
        }
        applyWaiting(m);
        applyPhaseState(m);
        applyBarState(m);
      } else if (m.type === "queue") {
        applyWaiting(m);
        applyPhaseState(m);
      } else if (m.type === "bar") {
        // The bar moved without a press: the broadcaster changed a setting.
        // Only the bar and the phase — no timeline, and above all no openMs,
        // because this can arrive mid-party and resuming one that is already
        // running would put the banner back up.
        applyBarState(m);
        applyPhaseState(m);
      }
    };

    sock.onerror = function () { /* onclose carries the outcome */ };

    sock.onclose = function () {
      if (sock !== ebsWs) return;
      if (ebsManualClose) { ebsSetState("off"); return; }
      ebsSetState("error");
      log(t("log.ebs.lost"), "warn");
      ebsWhyClosed();
    };
  }

  /**
   * Ask why the socket would not stay up, and say so if the answer is the code.
   *
   * A browser never tells a page the HTTP status behind a failed WebSocket
   * handshake — a revoked code and an unplugged network are the same event here.
   * So the same address is asked again as a plain GET, where the status is
   * readable: 401 means the code is dead, and anything else means the code was
   * fine and something below it was not.
   *
   * A dead code is not worth retrying every thirty seconds. Nothing will change
   * until the broadcaster pastes a new one, and pasting one reconnects on its
   * own, so the retry backs off to a slow heartbeat instead.
   */
  function ebsWhyClosed() {
    var base = String(cfg.ebs || "").trim().replace(/\/+$/, "");
    if (!base) return ebsScheduleRetry();
    var probe = base + "/stream?ch=" + encodeURIComponent(cfg.ch) +
      "&t=" + encodeURIComponent(cfg.ebsToken || "");
    fetch(probe, { method: "GET" }).then(function (res) {
      if (res.status === 401) {
        ebsSetState("dead");
        log(t("log.ebs.dead"), "bad");
        ebsScheduleRetry(EBS_DEAD_RETRY_MS);
        return;
      }
      ebsScheduleRetry();
    }).catch(function () {
      // The EBS is unreachable, which is what an ordinary drop looks like.
      ebsScheduleRetry();
    });
  }

  var EBS_DEAD_RETRY_MS = 5 * 60 * 1000;

  function ebsScheduleRetry(fixedWait) {
    if (ebsManualClose) return;
    ebsRetry = Math.min(ebsRetry + 1, 6);
    var wait = fixedWait || Math.min(1000 * Math.pow(1.8, ebsRetry), 30000);
    clearTimeout(ebsRetryTimer);
    ebsRetryTimer = setTimeout(function () {
      if (!ebsManualClose) ebsConnect();
    }, wait);
  }

  /**
   * Why the shutter is off for a reason the gate does not cover.
   *
   * sceneOpen() answers one question — is the scene on air one the broadcaster
   * allowed — and it is the only one that reached the log. The EBS refuses a
   * press for two more: no capture scene chosen, and a chosen name that OBS
   * does not have. Both left the viewer at "not shooting right now" and the
   * broadcaster with a log that said nothing at all (実測 2026-08-25: the cause
   * was only found by adding temporary logging to the EBS).
   */
  var srcWhy = null;
  function noteSource() {
    var why = !cfg.src ? "nosource" : (identified && !srcIsScene ? "notscene" : "");
    if (why === srcWhy) return;
    srcWhy = why;
    if (why) log(t("log.closed." + why, { n: cfg.src }), "warn");
  }

  function reportOverlayState() {
    if (!ebsWs || ebsWs.readyState !== 1) return;
    noteSource();
    try {
      ebsWs.send(JSON.stringify({
        type: "state",
        // A bar source is a listener, not a camera. Saying so is what keeps the
        // EBS from counting it as somewhere a photograph could be taken — and
        // from telling the buttons the door is open because a bar is attached.
        kind: BAR_ONLY ? "bar" : "overlay",
        connected: BAR_ONLY ? false : identified,
        source: cfg.src, captureReady: BAR_ONLY ? false : captureOk,
        wallRoom: BAR_ONLY ? true : paidWallRoom,
        draining: BAR_ONLY ? false : paidDraining,
        // Reported, not decided here: the EBS is what refuses a press
        // (CLAUDE.md). This is a fact about the machine, like the other three.
        open: sceneOpen()
      }));
    } catch (e) { /* the link is optional; local capture still works */ }
  }

  // Nothing on this page shows the link's state; the setup page tests it.
  function renderEbs() {
    var m = { off: t("ebs.off"), connecting: t("ebs.connecting"), live: t("ebs.live"), error: t("ebs.error") };
  }

  /* ================= go ================= */

  // ?debug=1 or #debug turns the status chip on. It is off by default because
  // this page is on the air.
  // A broadcaster whose capture source is called "debug room" must not find a
  // status light on their stream.
  if (q.get("debug") === "1" || hashFlag("debug")) {
    document.documentElement.setAttribute("data-debug", "");
  }

  /* ---- #bar ----

     This page becomes the goal bar and nothing else: no OBS connection, no
     photographs, no sound. It still talks to the EBS, because the bar is drawn
     from what the EBS says, but it reports itself as a listener rather than a
     camera so the EBS never counts it as somewhere a photo could be taken.

     The bar left the overlay so that OBS could own its placement — including
     putting it in one scene and not another, which is the thing a bar inside
     the overlay could never do (docs/plan.md §4.11). */
  var BAR_ONLY = hashFlag("bar");
  if (BAR_ONLY) document.documentElement.setAttribute("data-baronly", "");

  // Never the password itself — only whether there is one.
  log("boot" +
    " src=" + (cfg.src || "(none)") +
    " obs=" + cfg.host + ":" + cfg.port +
    " pw=" + (cfg.pw ? "set" : "EMPTY") +
    " ebs=" + (cfg.ebs || "(none)") +
    " ch=" + (cfg.ch || "(none)") +
    " token=" + (cfg.ebsToken ? "set" : "EMPTY") +
    " save=" + (cfg.saveDir || "(off)") +
    " config=" + (pushed ? "from URL" : "from storage"));

  applyPreset(cfg.preset);
  applyAccent(cfg.accent);
  applyScale(cfg.scale);
  applyPlace(cfg.place);
  updateBar();            // hidden until the EBS says what the goal is

  // #preview draws the bar at full size with a stand-in goal, so the
  // broadcaster can size and place it against their own layout in the OBS
  // preview without waiting for a viewer to press anything. Like #debug, it is
  // a URL flag and never a default — the setup page removes it when finished.
  // It overrides "off" on purpose: the setting is what is being adjusted.
  if (hashFlag("preview")) {
    bar.pool = 320;
    bar.goal = 1000;
    barForced = true;
    updateBar();
  }

  renderEbs();
  if (cfg.ebs && cfg.ch) ebsConnect();
  // The bar source stops here. It has nothing to photograph with, nothing to
  // play, and no reason to hold a socket open to OBS.
  if (!BAR_ONLY) {
    ensureAudio();        // decode the shutter samples before the first press
    status("wait", t("st.idle"), true);
    // Connecting without a password only produces a guaranteed failure in the log.
    if (cfg.pw) connect();
  }
})();

</script>
