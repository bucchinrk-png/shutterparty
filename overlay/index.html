<!doctype html>
<meta charset="utf-8">
<title>SHUTTERPARTY overlay</title>
<!--
  Phase 1 — the vertical slice.

  Runs as an OBS browser source loaded from disk (file://). Connects straight to
  obs-websocket, captures one frame of a chosen scene, and shows it on stream.
  The extension button does not exist yet; a local test button stands in for it.

  Why file:// and not a hosted page: an HTTPS origin cannot reach ws://127.0.0.1
  (measured; see docs/plan.md §2.2). file:// can, and is a secure context, so
  crypto.subtle is available for the obs-websocket SHA-256 challenge.

  The obs-websocket password never leaves this page.
-->

<style>
  :root {
    --acc-rgb: 176, 62, 52;
    --pre-rgb: 224, 176, 96;
    --ink: #e7eaf0;
    --dim: #98a2b2;
    --panel: rgba(14, 17, 22, .92);
    --line: rgba(255, 255, 255, .12);
    --ok: #4cbc86;
    --bad: #ff7a6a;
    --warn: #d9a03e;
    --font: "Segoe UI", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }

  /* ---------- concept colours ----------
     --acc is the brand / session colour, --pre is the "someone paid" treatment.
     Every preset keeps the two distinct, or the paid frame dissolves into the
     background once Phase 4 lands. Values are the desaturated set from the
     prototype; a broadcast overlay at full chroma is fatiguing to watch. */
  /* Each preset carries a deep and a bright end of both colours. The bar, the
     gold wash and the paid photo all need a gradient rather than a flat fill,
     and mixing those shades in code would put six palettes in JavaScript. */
  /* Bits, by amount — the same five the viewer's button wears (§4.10), and
     outside the presets on purpose. A broadcaster's colour changes the session;
     it does not change what somebody's Bits bought. The frame is where this
     shows: the effects are gone in three seconds and the print is what is left
     (§4.4), so the amount has to be legible on the print itself. */
  /* @generated bits-colours — src/shared/skus.json。手で書き換えない */
  :root {
    --b10:   142,168,198;
    --b100:   86,156,255;
    --b250:  168,116,255;
    --b500:  255,108,158;
    --b1000: 255,182,72;
  }
  /* @end bits-colours */

  /* @generated accents — src/shared/accents.json。手で書き換えない */
  :root, :root[data-accent="safelight"] {
    --acc-rgb: 176,62,52;   --acc-deep-rgb: 104,32,26;  --acc-hi-rgb: 244,208,150;
    --pre-rgb: 224,176,96;  --pre-deep-rgb: 168,102,26; --pre-hi-rgb: 240,206,140;
    --pre-ink: #7d5c15;
  }
  :root[data-accent="neon"] {
    --acc-rgb: 198,72,140;  --acc-deep-rgb: 100,26,72;  --acc-hi-rgb: 240,182,216;
    --pre-rgb: 116,202,218; --pre-deep-rgb: 30,116,136; --pre-hi-rgb: 156,224,236;
    --pre-ink: #17606e;
  }
  :root[data-accent="ocean"] {
    --acc-rgb: 44,118,142;  --acc-deep-rgb: 14,56,72;   --acc-hi-rgb: 178,218,230;
    --pre-rgb: 226,178,102; --pre-deep-rgb: 156,104,26; --pre-hi-rgb: 240,206,150;
    --pre-ink: #74561a;
  }
  :root[data-accent="forest"] {
    --acc-rgb: 64,118,80;   --acc-deep-rgb: 22,54,36;   --acc-hi-rgb: 190,220,180;
    --pre-rgb: 206,172,104; --pre-deep-rgb: 132,98,34;  --pre-hi-rgb: 228,202,150;
    --pre-ink: #66501c;
  }
  :root[data-accent="violet"] {
    --acc-rgb: 120,90,188;  --acc-deep-rgb: 54,34,100;  --acc-hi-rgb: 204,190,238;
    --pre-rgb: 230,196,124; --pre-deep-rgb: 154,114,26; --pre-hi-rgb: 240,214,158;
    --pre-ink: #6f561a;
  }
  :root[data-accent="mono"] {
    --acc-rgb: 88,94,106;   --acc-deep-rgb: 28,32,40;   --acc-hi-rgb: 224,228,236;
    --pre-rgb: 226,186,108; --pre-deep-rgb: 150,106,26; --pre-hi-rgb: 238,208,150;
    --pre-ink: #6a5015;
  }
  /* @end accents */

  /* overlay scale: the broadcaster's S / M / L, and the goal bar's own */
  :root { --ov-scale: 1; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    /* transparent: OBS composites this over the scene */
    background: transparent;
    color: var(--ink);
    font-family: var(--font);
    user-select: none;
  }

  #stage { position: fixed; inset: 0; }

  /* ---------- status chip ---------- */
  .chip {
    position: fixed;
    left: clamp(12px, 1vw, 26px); bottom: clamp(12px, 1vw, 26px);
    display: flex; align-items: center; gap: clamp(7px, .5vw, 12px);
    padding: clamp(6px, .5vw, 12px) clamp(12px, .9vw, 22px);
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    font-family: var(--mono);
    font-size: clamp(12px, .85vw, 19px);
    letter-spacing: .03em;
    opacity: 0;
    transition: opacity .4s ease;
    pointer-events: none;
  }
  .chip.show { opacity: 1; }
  .chip .dot {
    width: clamp(8px, .55vw, 13px); height: clamp(8px, .55vw, 13px); border-radius: 50%;
    background: var(--dim);
    flex: none;
  }
  .chip[data-state="ok"]   .dot { background: var(--ok); }
  .chip[data-state="bad"]  .dot { background: var(--bad); }
  .chip[data-state="wait"] .dot { background: var(--warn); animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }

  /* ---------- effect layers ----------
     Separate stacking layers so the flash never composites over the photos and
     the photos never inherit the flash's animated opacity. */
  .ov { position: fixed; inset: 0; pointer-events: none; }

  /* Audience flashes: many small point lights read as a crowd, where repeated
     full-frame flashes would just white out the picture. */
  .spark {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,246,224,.85) 32%, rgba(255,230,180,0) 70%);
    opacity: 0;
    will-change: opacity, transform;
  }
  .spark.gold {
    background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(var(--pre-hi-rgb),.9) 30%, rgba(var(--pre-rgb),0) 70%);
  }

  /* Full-frame flash. Peak opacity and rate are capped in JS; see docs/plan.md §4.6. */
  #ovFlash {
    background: #fff;
    opacity: 0;
    will-change: opacity;
  }

  /* ---------- crowd counter ---------- */
  .counter {
    position: fixed;
    top: clamp(12px, 1.1vw, 26px); left: 50%;
    transform: translateX(-50%) translateY(clamp(-14px, -1vw, -8px));
    display: flex; align-items: center; gap: clamp(6px, .5vw, 12px);
    padding: clamp(6px, .5vw, 12px) clamp(12px, .95vw, 24px) clamp(6px, .5vw, 12px) clamp(10px, .8vw, 20px);
    border-radius: 999px;
    background: rgba(10,12,16,.72);
    backdrop-filter: blur(8px);
    color: #fff;
    font-family: var(--mono);
    font-size: calc(clamp(13px, 1vw, 22px) * var(--ov-scale));
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    box-shadow: 0 4px 20px rgba(0,0,0,.45);
    opacity: 0;
    transition: opacity .22s ease, transform .22s cubic-bezier(.2,1.5,.4,1);
    pointer-events: none;
  }
  .counter.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .counter.bump { transform: translateX(-50%) translateY(0) scale(1.13); }
  .counter svg { width: clamp(15px, 1.1vw, 24px); height: clamp(15px, 1.1vw, 24px); flex: none; }
  .counter .n { color: rgb(var(--pre-rgb)); }

  @media (prefers-reduced-motion: reduce) {
    .counter { transition-duration: .01ms; }
  }

  /* ---------- queue and phase notices ---------- */
  .queue-toast {
    position: fixed;
    top: clamp(12px, 1.1vw, 26px); left: 50%;
    transform: translateX(-50%) translateY(clamp(-14px, -1vw, -8px));
    display: flex; align-items: center; justify-content: center;
    padding: clamp(7px, .55vw, 13px) clamp(13px, 1vw, 26px);
    border-radius: 999px;
    background: rgba(10,12,16,.76);
    border: 1px solid rgba(var(--pre-rgb), .55);
    color: #fff;
    font-family: var(--mono);
    font-size: calc(clamp(13px, 1vw, 22px) * var(--ov-scale));
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    box-shadow: 0 4px 20px rgba(0,0,0,.45), 0 0 24px rgba(var(--pre-rgb), .18);
    opacity: 0;
    transition: opacity .22s ease, transform .22s cubic-bezier(.2,1.5,.4,1);
    pointer-events: none;
  }
  .queue-toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .queue-toast .n { color: rgb(var(--pre-rgb)); }

  .phase-state {
    position: fixed;
    top: clamp(12px, 1.1vw, 26px); right: clamp(12px, 1.1vw, 26px);
    display: flex; flex-direction: column; align-items: flex-end; gap: clamp(5px, .45vw, 10px);
    opacity: 0;
    transform: translateY(clamp(-10px, -.7vw, -6px));
    transition: opacity .22s ease, transform .22s cubic-bezier(.2,1.5,.4,1);
    pointer-events: none;
  }
  .phase-state.on { opacity: 1; transform: translateY(0); }
  .phase-badge {
    padding: clamp(5px, .42vw, 10px) clamp(10px, .8vw, 20px);
    border-radius: 999px;
    background: rgb(var(--acc-rgb));
    color: #fff;
    font-family: var(--mono);
    font-size: calc(clamp(12px, .9vw, 20px) * var(--ov-scale));
    font-weight: 800;
    letter-spacing: .08em;
    box-shadow: 0 4px 18px rgba(0,0,0,.38);
  }
  .phase-desc {
    max-width: min(34vw, 520px);
    padding: clamp(6px, .5vw, 12px) clamp(10px, .8vw, 18px);
    border-radius: 6px;
    background: rgba(10,12,16,.74);
    color: rgba(255,255,255,.92);
    font-size: calc(clamp(12px, .82vw, 18px) * var(--ov-scale));
    font-weight: 600;
    line-height: 1.3;
    text-align: right;
    text-shadow: 0 1px 2px rgba(0,0,0,.55);
  }

  @media (prefers-reduced-motion: reduce) {
    .queue-toast, .phase-state { transition-duration: .01ms; }
  }

  /* ---------- captured photo ---------- */
  .photo {
    position: absolute;
    top: 0; left: 0;
    background: #fbfaf6;
    padding: 7px 7px 0;
    border-radius: 3px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.3);
    will-change: transform, opacity;
  }
  /* A canvas, for the same reason the card uses one: what OBS hands over is the
     whole capture-scene canvas, and a cropped camera sits in the middle of it
     with transparent margins. Only the subject is drawn, so the print that
     flies across the stream has the shape the broadcaster framed. */
  .photo canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 1px;
    background: #222;
    /* Above the pattern layer. See .pat — this is the half of the rule that
       keeps a printed shape off the broadcaster's face. */
    position: relative;
    z-index: 1;
  }

  /* Where a pattern prints, on a print and on the saved card alike.
     ---------------------------------------------------------------
     It covers the whole paper and sits UNDER the subject, which is the whole
     of the safety: a grain that strays inside the picture is covered by the
     photograph rather than trusted to have been placed correctly. The subject
     is the broadcaster's face (docs/plan.md §4.4), and nothing prints on it.

     The same stacking is the effect. A shape that crosses the edge of the
     photograph is cut in half by it and reads as printed on the paper the
     print is lying on: the guard and the flourish are one mechanism.

     Empty in this build: the first catalogue sells the five plain frames, and
     the shapes arrive with the second. What is reserved here is the place. */
  .photo .pat, .card .pat {
    position: absolute;
    inset: 0;
    z-index: 0;
    color: rgb(var(--tone));
    pointer-events: none;
  }
  .photo .pat svg, .card .pat svg { position: absolute; }
  .photo .cap {
    font-family: var(--mono);
    font-size: calc(clamp(11px, .68vw, 17px) * var(--ov-scale));
    color: #5c5850;
    text-align: center;
    padding: calc(6px * var(--ov-scale)) 3px calc(8px * var(--ov-scale));
    font-variant-numeric: tabular-nums;
  }
  .photo .badge {
    position: absolute;
    top: calc(-11px * var(--ov-scale)); right: calc(-11px * var(--ov-scale));
    background: rgb(var(--acc-rgb));
    color: #fff;
    font-family: var(--mono);
    font-size: calc(clamp(14px, 1vw, 24px) * var(--ov-scale));
    font-weight: 700;
    padding: calc(4px * var(--ov-scale)) calc(11px * var(--ov-scale));
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 3px 10px rgba(0,0,0,.45);
  }

  /* ---------- a paid shot (docs/plan.md §4.4) ----------
     The effects are gone in three seconds; the photo with a name on it is what
     is left. So the difference has to be on the print, not only in the flash. */
  /* The frame carries the amount. --tone falls back to the session's own paid
     colour, so a photo that arrives without an amount — an older EBS, a receipt
     whose value did not survive — still looks bought rather than unfinished. */
  .photo.paid, .card.paid { --tone: var(--pre-rgb); }
  /* .paid on these, not the attribute alone: the fallback above is a class and
     would otherwise outrank them. */
  /* @generated bits-tones — src/shared/skus.json。手で書き換えない */
  .paid[data-bits="10"]   { --tone: var(--b10); }
  .paid[data-bits="100"]  { --tone: var(--b100); }
  .paid[data-bits="250"]  { --tone: var(--b250); }
  .paid[data-bits="500"]  { --tone: var(--b500); }
  .paid[data-bits="1000"] { --tone: var(--b1000); }
  /* @end bits-tones */

  /* The margin carries the amount here too, and for the same reason it does on
     the saved card: the frame is two pixels of colour and the badge is small,
     so at the size a photograph crosses a stream two tiers looked alike. Flat
     rather than a gradient — the margin begins wherever the picture ends, and
     that moves with the subject's shape. Two elements, one table: the card
     version below is generated from the same src/shared/skus.json, so they can
     no longer be kept in step by hand and then stop being.
     --wash here is the fallback for a paid photo that arrived with NO amount,
     which is a different question from what the lowest tier is worth. The two
     share a number today; the generated ladder still writes its own. */
  .photo.paid {
    --wash: .16;
    background:
      linear-gradient(rgba(var(--tone), var(--wash)), rgba(var(--tone), var(--wash))),
      #fdfbf6;
    box-shadow: 0 12px 34px rgba(0,0,0,.55), 0 0 0 2px rgb(var(--tone));
  }
  /* @generated bits-wash-photo — src/shared/skus.json。手で書き換えない */
  .photo.paid[data-bits="10"]   { --wash: .16; }
  .photo.paid[data-bits="100"]  { --wash: .21; }
  .photo.paid[data-bits="250"]  { --wash: .27; }
  .photo.paid[data-bits="500"]  { --wash: .35; }
  .photo.paid[data-bits="1000"] { --wash: .44; }
  /* @end bits-wash-photo */
  .photo.paid .cap { color: #3b3226; display: flex; justify-content: space-between; gap: 8px; padding-inline: 4px; }
  .photo.paid .cap .who { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The badge wears the frame's colour, or the frame reads as one photo and the
     price as another. Flat rather than the old gradient: the amounts have no
     deep end of their own, and dark ink carries every one of them — white does
     not survive the gold. */
  .photo .badge.bits {
    background: rgb(var(--tone));
    color: #16130c;
  }

  /* ---------- the goal bar ---------- */
  /* Sizes here follow the canvas, not a fixed pixel count. The prototype was
     drawn at 1920×1080 and its px values read fine there — on a real stream, at
     the distance people watch from and after the encoder has been at it, the
     same numbers are unreadable. The counter already scaled this way; the bar
     and the badges were the two places that did not. */
  .bitsbar {
    position: fixed;
    top: 14px; left: 14px;
    /* The bar has its own scale and its own corner, separate from --ov-scale
       and the photo stack. It is the one thing on screen that has to be legible
       at a glance from a couch, and where it can go depends on what the
       channel's layout already occupies — not on where the photos land. */
    width: min(38%, 560px);
    padding: 11px 15px 12px;
    border-radius: 8px;
    background: rgba(10,12,16,.68);
    border: 1px solid rgba(255,255,255,.09);
    color: #fff;
    opacity: 0;
    transform: translateY(-8px);
    /* visibility, not just opacity: an element that is merely transparent is
       still part of the page's text, and "nothing is on screen" is checked by
       reading that text (tools/overlay-invariants.mjs). */
    visibility: hidden;
    transition: opacity .25s ease, transform .25s ease, visibility .25s;
    pointer-events: none;
  }
  .bitsbar.on { opacity: 1; transform: translateY(0); visibility: visible; }

  /* ---- #bar: this page IS the bar ----

     A browser source of its own, so OBS can place it, size it, and put it in
     one scene and not another. A bar drawn inside the overlay could do none of
     those things: it lived wherever the overlay's canvas put it, at whatever
     size the settings allowed, in every scene the overlay was in.

     Here it fills the source instead of sitting in a corner of a 1920x1080
     canvas, and everything else the overlay draws is not in this source at
     all. */
  /* The bar as a source of its own, where the strip IS the viewport.
   *
   * Everything above is sized in `vw`, and `vw` is whatever the SOURCE is wide.
   * Those numbers were written for 1920, where .95vw is 18px. This source is
   * created 560 wide (setup page), so the same rules resolve to 5.3px and every
   * one of them lands on its clamp floor: 14px label, 16px number, 8px track
   * (実測 2026-08-26). The bar is the longest-lived thing this extension puts on
   * a broadcast and it was the smallest thing on it.
   *
   * Worth saying plainly, because it makes the rules above misleading to read:
   * the bar is only ever DRAWN here. `.bitsbar.on` is toggled with BAR_ONLY in
   * the condition (92-bar-and-party.js), so inside the overlay the element
   * exists and is never shown. The 1920 sizes those clamps were tuned for are
   * not a smaller version of this — they are a state nobody sees.
   *
   * Two things were wrong and only one of them was the units. The other was
   * that 23px of the 64px strip went to padding — 36% of the height spent on
   * empty space — so there was nowhere for the type to grow into even if the
   * units had been right.
   *
   * So the strip sizes itself off its own box. Height leads — that is the
   * dimension that decides how big type can be on a strip — but every size is
   * min()'d against a width term as well, because height alone is not enough:
   * at 560x128 the label grew to 42px, outgrew the 560 it had to fit across,
   * wrapped, and the bar rendered 167px tall inside a 128px source (実測
   * 2026-08-26). The two terms are equal at the created 560x64, so the default
   * is unaffected and either dimension can only ever hold the other back.
   *
   * It scales with whatever the broadcaster sets the source to, and an existing
   * 560x64 gets bigger type without anybody touching OBS. */
  :root[data-baronly] .bitsbar {
    position: relative;
    width: 100%;
    max-width: none;
    padding: min(6.25vh, 0.71vw) min(6.25vh, 0.71vw) min(6.25vh, 0.71vw);
    /* No panel. The reference this was measured against (Sticker Party) carries
       no card at all — every piece of it is legible because it is OUTLINED, not
       because it sits on a slab. A slab is the safer-looking answer and the
       worse one: it puts a dark rectangle on the broadcast for as long as the
       channel is live, and it still fails over a bright scene wherever the type
       is thin. Outlines cost nothing and work on any background. */
    background: none;
    border: 0;
    border-radius: 0;
  }

  /* The title, above the pill. */
  :root[data-baronly] .bb-row {
    font-size: min(25vh, 2.86vw);
    /* Height and line-height written down rather than left to the content.
       The row is baseline-aligned and holds an SVG, so its intrinsic height
       depends on the mark and the font's metrics — and the strip's total has to
       be predictable, because it has to fit a source of a size somebody else
       chose. Left to itself it came to 129px inside a 128px source (実測). */
    height: min(28vh, 3.2vw);
    line-height: min(28vh, 3.2vw);
    align-items: center;
    margin-bottom: min(3.1vh, 0.36vw);
    justify-content: flex-start;
    gap: .4em;
    letter-spacing: .04em;
    text-shadow: none;                 /* replaced by the outline below */
  }
  :root[data-baronly] .bb-cam {
    width: min(25vh, 2.86vw); height: min(25vh, 2.86vw);
    align-self: center;
  }

  /* The pill, and the number inside it.
   *
   * Inside, not beside. That is the whole of why the reference reads at a
   * glance: the value is bounded by the height of the bar rather than by
   * whatever is left over above it, so it is the biggest thing in the strip
   * instead of the smallest. Ours was a 25px number over an 8px line; this is a
   * 22px number inside a 33px pill, on a 64px source. */
  :root[data-baronly] .bb-track {
    height: min(50vh, 5.71vw);
    border-radius: 999px;
    background: rgba(8,10,14,.72);
    box-shadow: inset 0 0 0 max(1px, .12em) rgba(0,0,0,.55);
    overflow: hidden;
  }
  :root[data-baronly] .bb-track i {
    border-radius: 999px;
    /* The two tokens, kept apart on purpose: a single colour makes the paid end
       of the bar disappear into the free end (CLAUDE.md). */
    background: linear-gradient(90deg, rgb(var(--acc-rgb)), rgb(var(--pre-hi-rgb)));
    box-shadow: inset 0 .35em .5em rgba(255,255,255,.22);
  }
  :root[data-baronly] .bb-num {
    position: absolute;
    left: 0; right: 0;
    bottom: min(6.25vh, 0.71vw);
    height: min(50vh, 5.71vw);
    /* Centred with line-height, not with flex. The number and its unit are
       `<b>500</b> pt` — a text node with a leading space — and a flex container
       turns that into an anonymous item with the whitespace stripped, so it
       came out as "500pt" (実測 2026-08-26, first render). */
    display: block; text-align: center;
    line-height: min(50vh, 5.71vw);
    font-size: min(34.4vh, 3.93vw);
    /* Above the pill. In the markup the number sits inside .bb-row, which comes
       BEFORE .bb-track — so without this the fill paints over it and all that
       shows is whatever hangs past the fill's right edge (実測 2026-08-26). */
    z-index: 2;
    /* The number is the reading, so it does not take the premium colour the
       way it does inside the overlay — white over the fill, outlined. */
    color: #fff;
    pointer-events: none;
  }

  /* One outline, applied to every piece of type in the strip.
   *
   * text-shadow rather than -webkit-text-stroke + paint-order: the stroke
   * property is centred on the glyph edge, so without paint-order it eats into
   * the letterforms, and paint-order on HTML text is the newer of the two. This
   * costs eight shadows and works everywhere. `em` so it scales with the type,
   * which is itself scaling with the source. */
  :root[data-baronly] .bb-row,
  :root[data-baronly] .bb-num {
    --edge: .075em;
    text-shadow:
      calc(var(--edge) * -1) 0 0 #05070a,  var(--edge) 0 0 #05070a,
      0 calc(var(--edge) * -1) 0 #05070a,  0 var(--edge) 0 #05070a,
      calc(var(--edge) * -0.7) calc(var(--edge) * -0.7) 0 #05070a,
      var(--edge) calc(var(--edge) * -0.7) 0 #05070a,
      calc(var(--edge) * -0.7) var(--edge) 0 #05070a,
      var(--edge) var(--edge) 0 #05070a,
      0 .09em .22em rgba(0,0,0,.7);
  }
  /* The mark gets the same treatment, as a shadow rather than a stroke. */
  :root[data-baronly] .bb-cam {
    filter:
      drop-shadow(1px 0 0 #05070a) drop-shadow(-1px 0 0 #05070a)
      drop-shadow(0 1px 0 #05070a) drop-shadow(0 -1px 0 #05070a);
  }

  /* The mark sits with the label; the number is pushed to the far end. With
     three children, space-between would spread all three evenly and put the
     camera at one edge of its own. */
  .bb-cam {
    flex: none;
    align-self: center;              /* the row is baseline-aligned; an icon has none */
    width: clamp(15px, 1vw, 24px);
    height: clamp(15px, 1vw, 24px);
    color: rgb(var(--pre-hi-rgb));
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.85));
  }
  .bb-num { margin-left: auto; }

  .bb-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    /* The label is a phrase, not a readout, so it takes the body face rather
       than the monospace one — letterforms over column alignment. Only the
       number needs to line up with itself between updates. */
    font-family: var(--font);
    font-size: clamp(14px, .95vw, 23px);
    font-weight: 700;
    letter-spacing: .02em;
    color: #fff;
    margin-bottom: 7px;
    text-shadow: 0 2px 6px rgba(0,0,0,.85);
  }
  .bb-row .bb-num {
    font-family: var(--mono);
    color: rgb(var(--pre-hi-rgb));
    font-size: clamp(16px, 1.15vw, 28px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .bb-track {
    height: clamp(8px, .58vw, 14px);
    border-radius: 99px;
    background: rgba(255,255,255,.16);
    overflow: hidden;
  }
  .bb-track i {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, rgb(var(--pre-rgb)), rgb(var(--pre-hi-rgb)));
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform .5s cubic-bezier(.2,.9,.3,1);
  }
  .bitsbar.near { border-color: rgba(var(--pre-rgb),.5); }
  .bitsbar.near .bb-track i { background: linear-gradient(90deg, rgb(var(--acc-rgb)), rgb(var(--pre-hi-rgb))); }

  /* the receipt that floats up when somebody pays */
  .bitspop {
    position: absolute;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: rgb(var(--pre-hi-rgb));
    text-shadow: 0 2px 8px rgba(0,0,0,.8);
    white-space: nowrap;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- last hit ---------- */
  .lasthit {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    text-align: center;
    color: #fff;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .lasthit.on { opacity: 1; visibility: visible; }
  .lh-eyebrow {
    font-family: var(--mono);
    font-size: clamp(12px, 1.8vw, 20px);
    letter-spacing: .3em;
    color: rgb(var(--pre-hi-rgb));
  }
  .lh-name {
    /* The whole point of the moment: one person's name, on a full screen, for
       three seconds. At 5.6vw it read as a caption rather than an announcement. */
    font-size: clamp(34px, 8vw, 96px);
    font-weight: 900;
    line-height: 1.1;
    text-shadow: 0 4px 24px rgba(0,0,0,.7);
    word-break: break-all;
  }
  .lh-sub {
    font-size: clamp(14px, 2.2vw, 26px);
    font-weight: 700;
    text-shadow: 0 2px 12px rgba(0,0,0,.7);
  }

  /* ---------- 3 - 2 - 1 ---------- */
  .countdown {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    color: #fff;
    background: radial-gradient(circle at 50% 48%, rgba(0,0,0,.5), rgba(0,0,0,0) 62%);
    opacity: 0;
    visibility: hidden;
    transition: opacity .22s ease, visibility .22s;
    pointer-events: none;
  }
  .countdown.on { opacity: 1; visibility: visible; }
  /* A party nobody bought has nobody to name, and the two lines above the
     number are about a person. Hidden rather than blank: "LAST HIT" over an
     empty line announces somebody who is not there. */
  .countdown [hidden] { display: none; }
  .cd-eyebrow {
    font-family: var(--mono);
    font-size: clamp(9px, 1.1vw, 12px);
    letter-spacing: .3em;
    color: rgb(var(--pre-hi-rgb));
    text-shadow: 0 2px 10px rgba(0,0,0,.85);
  }
  .cd-name {
    font-size: clamp(18px, 3.4vw, 38px);
    font-weight: 900;
    line-height: 1.15;
    text-shadow: 0 3px 20px rgba(0,0,0,.8);
    word-break: break-all;
    margin-bottom: 2px;
  }
  .cd-num {
    font-size: clamp(52px, 12vw, 138px);
    font-weight: 900;
    line-height: 1.05;
    color: rgb(var(--acc-hi-rgb));
    font-variant-numeric: tabular-nums;
    text-shadow: 0 6px 44px rgba(0,0,0,.8);
  }
  .cd-sub {
    font-family: var(--mono);
    font-size: clamp(11px, 1.7vw, 17px);
    letter-spacing: .24em;
    text-shadow: 0 2px 14px rgba(0,0,0,.85);
  }

  /* ---------- the party banner ---------- */
  .banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 16px 20px 13px;
    background: linear-gradient(180deg, rgba(var(--acc-rgb),.86) 0%, rgba(var(--acc-deep-rgb),.74) 70%, rgba(var(--acc-deep-rgb),0) 100%);
    color: #fff;
    transform: translateY(-100%);
    visibility: hidden;
    transition: transform .42s cubic-bezier(.2,.9,.3,1), visibility .42s;
    pointer-events: none;
  }
  .banner.on { transform: translateY(0); visibility: visible; }
  .banner .ttl {
    font-size: clamp(19px, 2.9vw, 30px);
    font-weight: 900;
    letter-spacing: .06em;
    text-shadow: 0 2px 12px rgba(0,0,0,.4);
    margin: 0;
    line-height: 1.2;
  }
  .banner .lede { font-family: var(--mono); font-size: clamp(11px, 1.3vw, 13px); opacity: .92; margin-top: 2px; }
  .banner .bar { height: 4px; margin-top: 10px; background: rgba(255,255,255,.28); border-radius: 2px; overflow: hidden; }
  .banner .bar i { display: block; height: 100%; width: 100%; background: rgb(var(--acc-hi-rgb)); transform-origin: left center; }

  /* ---------- contact sheet ---------- */
  .sheet {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6,8,11,.78);
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility .3s;
    pointer-events: none;
  }
  .sheet.on { opacity: 1; visibility: visible; }
  .sheet-inner {
    background: #14120f;
    border: 1px solid #3a332a;
    padding: clamp(12px, 2vw, 20px);
    border-radius: 4px;
    width: min(78%, 640px);
    transform: scale(.92);
    transition: transform .34s cubic-bezier(.2,1.2,.35,1);
  }
  .sheet.on .sheet-inner { transform: scale(1); }
  .sheet-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono);
    font-size: clamp(10px, 1.2vw, 12px);
    color: rgb(var(--pre-rgb));
    letter-spacing: .12em;
    margin-bottom: 9px;
    text-transform: uppercase;
  }
  .sheet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  /* No object-fit and no aspect-ratio: each cell is already just the subject,
     and every cell comes from the same capture, so they line up. */
  /* Scattered rather than ruled. A contact sheet is a printer's object and
     this is the end of a party — the nine came out of twenty seconds of
     everybody shooting at once, and a perfect grid says the opposite.
     The tilt is per-cell and fixed, not random: the sheet is drawn twice, once
     on the broadcast and once inside the card source that gets saved, and the
     two have to be the same picture.
     Only rotation and shadow, so the grid keeps its measurements — sheetSizeFor()
     computes the saved source's height from SHEET_GAP and the cell size, and
     anything that moved the boxes would have to be repeated there. At 3 degrees
     a cell overhangs by about a quarter of the gap. */
  .sheet-grid canvas {
    display: block; width: 100%; height: auto; background: #222;
    position: relative;
    transform: rotate(var(--tilt, 0deg));
    /* The first shadow is the print's white edge; the second lifts it off the
       one underneath, which is what makes the overlap read as a pile. */
    box-shadow: 0 0 0 3px #fbf8f2, 0 4px 12px rgba(0,0,0,.55);
  }
  .sheet-grid canvas:nth-child(1) { --tilt: -3deg;  z-index: 3; }
  .sheet-grid canvas:nth-child(2) { --tilt: 1.8deg; z-index: 6; }
  .sheet-grid canvas:nth-child(3) { --tilt: -1.2deg; z-index: 2; }
  .sheet-grid canvas:nth-child(4) { --tilt: 2.6deg; z-index: 7; }
  .sheet-grid canvas:nth-child(5) { --tilt: -2.2deg; z-index: 9; }
  .sheet-grid canvas:nth-child(6) { --tilt: 1.4deg; z-index: 4; }
  .sheet-grid canvas:nth-child(7) { --tilt: -2.7deg; z-index: 8; }
  .sheet-grid canvas:nth-child(8) { --tilt: 2.2deg; z-index: 5; }
  .sheet-grid canvas:nth-child(9) { --tilt: -1.6deg; z-index: 1; }
  .sheet-foot {
    margin-top: 10px;
    color: #f3ece0;
    font-family: var(--mono);
    font-size: clamp(11px, 1.4vw, 14px);
    font-variant-numeric: tabular-nums;
    display: flex; justify-content: flex-end;
  }
  .sheet-foot b { color: rgb(var(--pre-hi-rgb)); }

  /* ---------- card mode (docs/plan.md §6, framed saving) ----------

     The same file, loaded a second time with #card, draws one finished photo
     filling the whole source and nothing else — no effects, no sockets. OBS
     captures THAT source to produce a saved file with the frame, the caption
     and the badge already in it, which a page could never write to disk itself.

     Kept in this file rather than a second one so the distributed artefact
     stays a single HTML (§3.1). Everything below only applies under #card. */
  :root[data-card] { background: transparent; }
  :root[data-card] .ov,
  :root[data-card] #stage,
  :root[data-card] .counter,
  :root[data-card] .queue-toast,
  :root[data-card] .phase-state,
  :root[data-card] .bitsbar,
  :root[data-card] .lasthit,
  :root[data-card] .countdown,
  :root[data-card] .banner,
  :root[data-card] .sheet { display: none !important; }

  /* The contact sheet has a second life as a file. Same markup, same layout —
     what is saved is what the channel just watched — but sized to fill its own
     source, opened rather than faded in, and on a solid ground: the version on
     stream is a scrim over the video, and a scrim over nothing is just muddy. */
  :root[data-card][data-sheet] .card { display: none !important; }
  :root[data-card][data-sheet] .sheet {
    display: flex !important;
    opacity: 1; visibility: visible; transition: none;
    background: #0b0d10;
    padding: 26px;
  }
  :root[data-card][data-sheet] .sheet-inner {
    width: 100%; transform: none; transition: none; padding: 22px;
  }
  /* Fixed sizes, not the stream's clamp()/vw: the source is measured in JS to
     hold exactly this, and a font that resizes with the viewport would make
     that measurement a guess. */
  :root[data-card][data-sheet] .sheet-head { font-size: 15px; margin-bottom: 12px; }
  :root[data-card][data-sheet] .sheet-grid { gap: 8px; }
  :root[data-card][data-sheet] .sheet-foot { font-size: 18px; margin-top: 14px; }

  .card { display: none; }
  :root[data-card] .card {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    /* Thin at the top and sides, deep at the bottom: the shape a print has,
       and the shape the caption lives in. */
    padding: 1.9% 1.9% 0;
    background: #fbfaf6;
    font-family: var(--mono);
    overflow: hidden;
  }
  /* A canvas rather than an <img>: the picture OBS hands over is the whole
     canvas of the capture scene, and the subject may be a square in the middle
     of it. The canvas is sized to the subject and the rest is never drawn, so
     nothing has to be cropped away visually and no aspect ratio is imposed —
     a square camera yields a square photo. */
  .card > canvas {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: auto;
    flex: none;
    background: #222;
  }
  /* Loaded so the canvas has something to draw; never shown itself. */
  .card > img { display: none; }
  .card .ccap {
    flex: 1 1 auto;
    display: flex; align-items: center; gap: 3%;
    padding: 0 1.2%;
    color: #6a655c;
  }
  .card .cwho {
    flex: 1 1 auto;
    font-size: 4.3vw;
    font-weight: 700;
    color: #3b372f;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .cwhen { flex: none; font-size: 2.6vw; font-variant-numeric: tabular-nums; }
  /* Nothing bought, nobody else pressing: one line, centred, quiet. */
  .card.plain .ccap { justify-content: center; }
  .card.plain .cwho { display: none; }

  .card .ctag {
    flex: none;
    font-size: 2.9vw;
    font-weight: 700;
    color: #fff;
    background: rgb(var(--acc-rgb));
    padding: .5% 1.5%;
    border-radius: 999px;
  }

  /* The margin carries the amount, not just the border.
     A 1.1vw frame and a small badge are a few percent of the card, and at the
     size these are actually seen — a photo on a stream, a thumbnail in a repost
     — two tiers looked alike (実測 2026-08-24: 100 と 500 が並んでも見分けが
     つかなかった). The deep margin an instant print has is the largest surface
     on the card, so it is the one that should say what was paid.
     The wash sits over a near-white ground rather than replacing it: the print
     has to stay a print. It deepens with the tier as well as changing hue, so
     the order of the amounts reads even where the hue does not. */
  /* :root[data-card] on the selector because that is what the card's own
     background is set with, and without it this loses the cascade to it —
     (0,2,1) against (0,2,0). The paid background had never once been applied
     (実測 2026-08-24): every paid photo came out on the plain white ground,
     and the tint was invisible for a reason that had nothing to do with its
     value. */
  :root[data-card] .card.paid {
    --wash: .16;
    /* Flat, not a gradient. A gradient has to be aimed at where the margin
       starts, and the margin starts wherever the photograph happens to end —
       a square subject and a wide one put it in different places, so the tint
       landed under the picture on one and in the caption on the other.
       Two layers rather than color-mix(): OBS ships whatever CEF its build
       carries, and a declaration that version does not understand is dropped
       silently, leaving no tint at all. */
    background:
      linear-gradient(rgba(var(--tone), var(--wash)), rgba(var(--tone), var(--wash))),
      #fdfbf6;
  }
  /* @generated bits-wash-card — src/shared/skus.json。手で書き換えない */
  :root[data-card] .card.paid[data-bits="10"]   { --wash: .16; }
  :root[data-card] .card.paid[data-bits="100"]  { --wash: .21; }
  :root[data-card] .card.paid[data-bits="250"]  { --wash: .27; }
  :root[data-card] .card.paid[data-bits="500"]  { --wash: .35; }
  :root[data-card] .card.paid[data-bits="1000"] { --wash: .44; }
  /* @end bits-wash-card */
  .card.paid .cwho { color: #3b3226; }
  .card.paid .cwhen { color: #6e6354; }
  /* Drawn inside the source, and thick: a hairline disappears the moment this
     is looked at as a thumbnail, which is most of where it will be seen.
     In vw, not %: a percentage border-width is invalid CSS, so the whole
     declaration is dropped and the frame silently never appears (measured in
     OBS — the first framed photo came out with no border at all). The card
     fills the source, so vw is the source's own width. */
  .card.paid::after {
    content: "";
    position: absolute; inset: 0;
    border: 1.1vw solid rgb(var(--tone));
    pointer-events: none;
  }
  .card .ctag.bits {
    background: rgb(var(--tone));
    color: #16130c;
    box-shadow: inset 0 .08em 0 rgba(255,255,255,.45);
  }
  /* The badge grows with the tier. Colour alone asks the viewer to remember
     which hue was worth more; size does not have to be learned. Only the top
     two grow — every tier growing would just be five sizes to compare. */
  .card.paid[data-bits="500"] .ctag.bits  { font-size: 2.7vw; }
  .card.paid[data-bits="1000"] .ctag.bits {
    font-size: 3.2vw;
    box-shadow: inset 0 .08em 0 rgba(255,255,255,.55), 0 0 1.2vw rgba(var(--tone), .5);
  }

  /* Small, in the margin, the way a print carries the lab's name. This file
     gets reposted; it should say where it came from. */
  .card .cmark {
    position: absolute;
    /* vw, not %: a percentage bottom is read against the card's height, which
       is no longer fixed — a tall card would push the mark up the page. */
    left: 3.1%; bottom: 1.63vw;
    font-size: 1.35vw;
    letter-spacing: .22em;
    color: rgba(0,0,0,.26);
  }
  .card.paid .cmark { color: rgba(59,50,38,.38); }

  /* hosted outside #ovGold: a child would inherit the wash's animated opacity */
  .goldring {
    position: absolute;
    left: 50%; top: 52%;
    width: 58%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%) scale(.12);
    border-radius: 50%;
    border: 7px solid rgba(var(--pre-hi-rgb),.95);
    box-shadow: 0 0 60px rgba(var(--pre-rgb),.85), inset 0 0 40px rgba(var(--pre-rgb),.55);
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
  }

  /* the gold afterglow of a large purchase; the white punch is #ovFlash */
  #ovGold {
    background: radial-gradient(circle at 50% 55%, rgba(var(--pre-hi-rgb),.6), rgba(var(--pre-rgb),.28) 45%, rgba(var(--pre-deep-rgb),0) 72%);
    opacity: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .bitsbar, .banner, .sheet, .sheet-inner, .countdown { transition: none; }
  }

  /* The status chip is the only thing this page can draw that is not an effect,
     and a broadcast is no place for a status light. It stays hidden unless the
     URL asks for it, which is how the broadcaster debugs without going on air. */
  /* Hide the status light, not the stage — #stage is where the photos land.
     Hiding the whole layer silenced the pictures and left only the sound. */
  .chip { display: none; }
  :root[data-debug] .chip { display: flex; }
</style>

<div class="ov" id="ovSparks"></div>
<div class="ov" id="ovFlash"></div>
<div class="ov" id="ovGold"></div>

<!-- The bar, and the sequence it sets off. Everything here is driven by the
     EBS: this page owns none of the arithmetic, only the playback. -->
<div class="bitsbar" id="bitsBar">
  <div class="bb-row">
    <!-- The one mark on the broadcast that says what this bar is for. The bar
         is the longest-lived thing this extension puts on screen, and without
         it the strip is a number counting down to a phrase. -->
    <svg class="bb-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14.5 4h-5L8 6.5H4.5A1.5 1.5 0 0 0 3 8v10a1.5 1.5 0 0 0 1.5 1.5h15A1.5 1.5 0 0 0 21 18V8a1.5 1.5 0 0 0-1.5-1.5H16z"/>
      <circle cx="12" cy="12.5" r="3.4"/>
    </svg>
    <span id="bbLabel"></span>
    <!-- pt, not Bits. A free press moves this bar too (freeWeight), so the
         number is a total of both and calling it Bits was wrong: a viewer could
         read "380 Bits" and conclude that only Bits get there. Not translated,
         for the same reason Bits is not — it is a unit, and one that has to
         mean the same thing on every channel. -->
    <span class="bb-num"><b id="bbRemain">0</b> pt</span>
  </div>
  <div class="bb-track"><i id="bbFill"></i></div>
</div>

<div class="lasthit" id="lastHit">

  <span class="lh-sub" id="lhSub"></span>
</div>

<div class="countdown" id="countdown">
  <span class="cd-eyebrow" id="cdEyebrow">LAST HIT</span>
  <span class="cd-name" id="cdName"></span>
  <span class="cd-num" id="cdNum">3</span>
  <span class="cd-sub" id="cdSub"></span>
</div>

<div class="banner" id="banner">
  <p class="ttl">SHUTTER PARTY</p>
  <p class="lede" id="bannerLede"></p>
  <div class="bar"><i id="bannerBar"></i></div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <div class="sheet-head">
      <span>SHUTTER PARTY</span>
      <span id="sheetTime"></span>
    </div>
    <div class="sheet-grid" id="sheetGrid"></div>
    <div class="sheet-foot">
      <span id="sheetTally"></span>
    </div>
  </div>
</div>

<div class="counter" id="counter">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14.5 4h-5L8 6.5H4.5A1.5 1.5 0 0 0 3 8v10a1.5 1.5 0 0 0 1.5 1.5h15A1.5 1.5 0 0 0 21 18V8a1.5 1.5 0 0 0-1.5-1.5H16z"/>
    <circle cx="12" cy="12.5" r="3.4"/>
  </svg>
  <span id="counterText"></span>
</div>

<div class="queue-toast" id="queueToast"><span id="queueText"></span></div>

<div class="phase-state" id="phaseState">
  <div class="phase-badge" id="phaseBadge"></div>
  <div class="phase-desc" id="phaseDesc"></div>
</div>

<div id="stage">
  <div class="chip" id="chip" data-state="wait">
    <span class="dot"></span><span id="chipText"></span>
  </div>
</div>

<!-- Only drawn under #card; see the card-mode block in the stylesheet. -->
<div class="card" id="card">
  <canvas id="cardShot"></canvas>
  <img id="cardImg" alt="" hidden>
  <div class="ccap" id="cardCap">
    <span class="cwho" id="cardWho"></span>
    <span class="cwhen" id="cardWhen"></span>
  </div>
  <span class="cmark">SHUTTERPARTY</span>
</div>
<script>
(function () {
  "use strict";

  /**
   * A subject box clamped to the picture it is about to be drawn from.
   *
   * The box is measured from the scene; the picture is a file written a moment
   * earlier. If the scene changed in between, drawImage would be asked for
   * pixels that are not there. Falling back to the whole frame just means the
   * margins come back for one photo.
   *
   * Declared out here so card mode can reach it: function declarations hoist,
   * and card mode returns before any of the overlay below it runs.
   */
  function clampBox(box, iw, ih) {
    var whole = { x: 0, y: 0, w: iw, h: ih };
    if (!box || !(iw > 0 && ih > 0)) return whole;
    var x = Math.min(Math.max(0, box.x), iw - 1);
    var y = Math.min(Math.max(0, box.y), ih - 1);
    var w = Math.min(box.w, iw - x);
    var h = Math.min(box.h, ih - y);
    if (!(w > 0 && h > 0)) return whole;
    return { x: x, y: y, w: w, h: h };
  }

  /**
   * Which of the paid frame colours an amount wears.
   *
   * The steps are the catalogue's own (docs/plan.md §4.4), and an amount
   * between two of them takes the step below — so a price added to the
   * catalogue later still arrives with a colour instead of none. Zero means no
   * amount, and the frame falls back to the session's paid colour.
   *
   * Out here for the same reason clampBox is: card mode draws the saved file
   * and returns before the overlay below it runs.
   */
  /* @generated bits-steps — src/shared/skus.json。手で書き換えない */
  var BITS_STEPS = [10, 100, 250, 500, 1000];
  /* @end bits-steps */

  /**
   * Which pattern a purchase was printed with, read out of its own sku.
   *
   * The rule is `sp-frame-<pattern>-<colour>`, with the five plain ones keeping
   * the older `sp-frame-<colour>` (docs/plan.md §4.4). Read here rather than
   * looked up in a table, because a table is a thing every broadcaster would
   * have to re-download before a new frame could be drawn — and the whole point
   * of the catalogue is that adding one costs neither a review nor an update.
   *
   * An unknown pattern draws nothing extra: the paper, the colour and the wash
   * still come from the amount, so a frame this build has never heard of
   * arrives as the plain one at its price rather than as nothing at all.
   */
  function patternOf(sku) {
    var m = /^sp-frame-([a-z0-9]+)-[a-z0-9]+$/.exec(String(sku || ""));
    return m ? m[1] : "";
  }

  /**
   * The layer a pattern prints on, and the reason it is a layer at all.
   *
   * It goes UNDER the subject (the stylesheet puts the canvas above it), which
   * is not a nicety: the subject is the broadcaster's face, and a pattern
   * across it is vandalism (docs/plan.md §4.4). Stacking is what guarantees it
   * — a grain that strays inside the picture is covered rather than trusted to
   * have been positioned correctly. The same order is what makes the pattern
   * look printed on the paper and slipped under the photograph.
   *
   * Empty in this build: the first catalogue sells the five plain frames. What
   * exists here is the place, so that adding a shape is adding a path.
   */
  function patternLayer(pattern) {
    if (!pattern) return null;
    var el = document.createElement("i");
    el.className = "pat";
    return el;
  }

  function bitsTone(bits) {
    var n = Number(bits) || 0;
    var step = 0;
    for (var i = 0; i < BITS_STEPS.length; i++) if (n >= BITS_STEPS[i]) step = BITS_STEPS[i];
    return step ? String(step) : "";
  }

  /* ================= card mode =================

     Loaded with #card, this file is not an overlay at all: it draws one saved
     photo, at the size of its own source, and stops. OBS captures that source
     to write the framed file — the only way a page can put a border, a name and
     a badge into something on disk, since it cannot write to disk itself
     (docs/plan.md §6).

     It runs before everything else and returns, so the card never opens a
     socket, never talks to OBS, and never draws an effect. The overlay hands it
     each new photo by rewriting the fragment; a fragment change does not reload
     a browser source (measured), so the redraw hangs off hashchange.

     The card must sit in a scene OBS is currently rendering, parked outside the
     canvas: a source that is hidden, or in a scene nobody is showing, is drawn
     once and then frozen (measured — see §6). */
  if (/(^|&)card(=1)?($|&)/.test(String(location.hash || "").replace(/^#/, ""))) {
    document.documentElement.setAttribute("data-card", "");

    var cEl = document.getElementById("card");
    var cImg = document.getElementById("cardImg");
    var cShot = document.getElementById("cardShot");
    var cCap = document.getElementById("cardCap");
    var cWho = document.getElementById("cardWho");
    var cWhen = document.getElementById("cardWhen");

    /**
     * The contact sheet, drawn for the file rather than for the stream.
     *
     * The pictures arrive as file:// addresses, which is the only shape they
     * can take: this page cannot be handed pixels, because a file:// page is
     * refused the pixels of a file:// image (measured, §6) — so the overlay
     * cannot turn them into data. Drawing them is allowed, and drawing is all
     * this needs.
     */
    var drawSheet = function () {
      var q = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
      document.documentElement.setAttribute("data-sheet", "");
      document.documentElement.setAttribute("data-accent", q.get("accent") || "safelight");

      var box = null;
      var raw = (q.get("crop") || "").split(",");
      if (raw.length === 4) {
        var n = raw.map(Number);
        if (n.every(function (v) { return isFinite(v) && v >= 0; }) && n[2] > 0 && n[3] > 0) {
          box = { x: n[0], y: n[1], w: n[2], h: n[3] };
        }
      }

      var grid = document.getElementById("sheetGrid");
      grid.textContent = "";
      // Read straight out of the hash rather than through URLSearchParams.
      //
      // The addresses are escaped one at a time and then joined with "|", so
      // decoding the whole field before the split decodes each address twice —
      // and the second decode undoes exactly what fileUrl() went out of its way
      // to do. A folder named with a "?" arrives as "%3F", comes back as a real
      // "?", and the browser then reads the address as ending there: the sheet
      // draws the wrong file, or nothing. Split first, decode each once.
      var imgsField = "";
      var hashParts = String(location.hash || "").replace(/^#/, "").split("&");
      for (var hp = 0; hp < hashParts.length; hp++) {
        if (hashParts[hp].slice(0, 5) === "imgs=") { imgsField = hashParts[hp].slice(5); break; }
      }
      var imgs = imgsField.split("|").filter(Boolean);
      for (var i = 0; i < imgs.length; i++) {
        (function (url) {
          var c = document.createElement("canvas");
          c.width = box ? Math.round(box.w) : 16;
          c.height = box ? Math.round(box.h) : 9;
          var im = new Image();
          im.onload = function () {
            var b = clampBox(box, im.naturalWidth, im.naturalHeight);
            if (!(b.w > 0 && b.h > 0)) return;
            c.width = Math.round(b.w);
            c.height = Math.round(b.h);
            c.getContext("2d").drawImage(im, b.x, b.y, b.w, b.h, 0, 0, c.width, c.height);
          };
          im.src = decodeURIComponent(url);
          grid.appendChild(c);
        })(imgs[i]);
      }

      document.getElementById("sheetTime").textContent = q.get("when") || "";
      document.getElementById("sheetTally").textContent = q.get("tally") || "";
      document.getElementById("sheet").classList.add("on");
    };

    var drawCard = function () {
      var q = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
      if (q.get("sheet")) return drawSheet();
      var src = q.get("img") || "";
      var who = q.get("name") || "";
      var bits = Number(q.get("bits") || 0);
      var sku = q.get("sku") || "";
      var people = Number(q.get("people") || 0);
      var accent = q.get("accent") || "safelight";
      var when = q.get("when") || "";

      document.documentElement.setAttribute("data-accent", accent);
      cWhen.textContent = when;

      cEl.className = "card";
      cEl.removeAttribute("data-bits");     // the last photo's amount is not this one's
      cEl.removeAttribute("data-pattern");  // nor its frame
      var oldPat = cEl.querySelector(".pat");
      if (oldPat) oldPat.remove();
      cWho.textContent = "";
      var oldTag = cCap.querySelector(".ctag");
      if (oldTag) oldTag.remove();

      if (bits > 0) {
        // A paid photo names its buyer and its price. The headcount is left off
        // on purpose: this one belongs to a person.
        cEl.classList.add("paid");
        cEl.setAttribute("data-bits", bitsTone(bits));
        // The saved file is the same print as the one that flew across the
        // stream, so it carries the same frame — otherwise two copies of one
        // purchase disagree about what was bought.
        var pattern = patternOf(sku);
        if (pattern) {
          cEl.setAttribute("data-pattern", pattern);
          var layer = patternLayer(pattern);
          if (layer) cEl.insertBefore(layer, cEl.firstChild);
        }
        cWho.textContent = who;
        var tb = document.createElement("span");
        tb.className = "ctag bits";
        tb.textContent = bits + " Bits";
        cCap.insertBefore(tb, cWhen);
      } else if (people > 1) {
        var tp = document.createElement("span");
        tp.className = "ctag";
        tp.textContent = "×" + people;
        cCap.insertBefore(tp, cWhen);
      } else {
        cEl.classList.add("plain");
      }

      // Which part of the picture is the subject. The overlay works it out
      // from the scene and passes it here; without it the whole frame is drawn,
      // margins and all, which is what used to happen.
      var box = null;
      var raw = (q.get("crop") || "").split(",");
      if (raw.length === 4) {
        var n = raw.map(Number);
        if (n.every(function (v) { return isFinite(v) && v >= 0; }) && n[2] > 0 && n[3] > 0) {
          box = { x: n[0], y: n[1], w: n[2], h: n[3] };
        }
      }

      var paint = function () {
        var b = clampBox(box, cImg.naturalWidth, cImg.naturalHeight);
        if (!(b.w > 0 && b.h > 0)) return;
        cShot.width = Math.round(b.w);
        cShot.height = Math.round(b.h);
        // Reading these pixels back is refused for a file:// page, but drawing
        // them is not (measured) — and drawing is all this needs.
        cShot.getContext("2d").drawImage(cImg, b.x, b.y, b.w, b.h, 0, 0, cShot.width, cShot.height);
      };

      if (src && cImg.getAttribute("src") !== src) {
        cImg.onload = paint;
        cImg.src = src;
      } else if (cImg.complete) {
        paint();
      }
    };

    window.addEventListener("hashchange", drawCard);
    drawCard();
    return;
  }

     line was translated except the two added last, which nobody noticed

     twelve languages now. A note that excuses a gap outlives the gap, so the
