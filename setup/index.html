<!doctype html>
<meta charset="utf-8">
<title>SHUTTERPARTY — setup</title>
<!--
  The broadcaster's setup page.

  Opened in the broadcaster's own browser — never in OBS. It holds an
  obs-websocket connection and writes the overlay's settings into the browser
  source's own URL, so nothing about this configuration is ever on the canvas.

  Why file:// and not a hosted page: an HTTPS origin cannot reach ws://127.0.0.1
  (measured; see docs/plan.md §2.2). file:// can, and is a secure context, so
  crypto.subtle is available for the obs-websocket SHA-256 challenge.

  The obs-websocket password never leaves this page.

  Layout: a rail of three areas, one shown at a time, over a docked bar that
  writes to OBS from wherever the broadcaster happens to be. The page used to be
  seven numbered steps stacked vertically, which meant the one control that made
  any of it take effect was the one furthest from the setting being changed.
-->

<style>
  :root {
    --acc-rgb: 176, 62, 52;
    --pre-rgb: 224, 176, 96;
    --ink: #e7eaf0;
    --dim: #97a1b1;
    --line: rgba(255, 255, 255, .11);
    --bg: #0b0e13;
    --bg2: #141a22;
    --bg3: #1b212a;
    --ok: #4cbc86;
    --bad: #ff7a6a;
    --warn: #d9a03e;
    --font: "Segoe UI", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --r: 9px;
  }

  /* ---------- concept colours ----------
     --acc is the brand / session colour, --pre is the "someone paid" treatment.
     Every preset keeps the two distinct, or the paid frame dissolves into the
     background. Values are the desaturated set from the prototype; a broadcast
     overlay at full chroma is fatiguing to watch. */
  /* @generated accents — src/shared/accents.json。手で書き換えない */
  :root, :root[data-accent="safelight"] { --acc-rgb: 176,62,52;  --pre-rgb: 224,176,96; }
  :root[data-accent="neon"]             { --acc-rgb: 198,72,140; --pre-rgb: 116,202,218; }
  :root[data-accent="ocean"]            { --acc-rgb: 44,118,142; --pre-rgb: 226,178,102; }
  :root[data-accent="forest"]           { --acc-rgb: 64,118,80;  --pre-rgb: 206,172,104; }
  :root[data-accent="violet"]           { --acc-rgb: 120,90,188; --pre-rgb: 230,196,124; }
  :root[data-accent="mono"]             { --acc-rgb: 88,94,106;  --pre-rgb: 226,186,108; }
  /* @end accents */

  * { box-sizing: border-box; }

  /* Fixed sizes, not clamp(vw). The rules here were written for a 1920x1080 OBS
     canvas the broadcaster sees scaled down; this page is only ever read in a
     normal browser window, where type that resizes with the window is just
     type that will not hold still. */
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ---------- shell ---------- */
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  .top {
    position: sticky; top: 0; z-index: 6;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 13px 24px;
    background: rgba(11, 14, 19, .96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .top h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .01em; }
  .top .grow { flex: 1 1 auto; }
  /* Below the header rather than inside it: the header is sticky, and a
     paragraph that never scrolls away costs the same two lines on every
     screen for a sentence that is read once. */
  /* Wide enough to read a scene name in full: these are the broadcaster's own
     names and a truncated one is not recognisable. */
  .dest { max-width: 420px; margin: 10px 0 14px; }
  .dest select { width: 100%; }

  .lede {
    margin: 0 0 18px;
    padding: 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--dim);
    max-width: 1080px;
  }

  /* ---------- connection chip ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--bg3);
    border: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12px;
    white-space: nowrap;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .chip[data-state="ok"]   .dot { background: var(--ok); }
  .chip[data-state="bad"]  .dot { background: var(--bad); }
  .chip[data-state="wait"] .dot { background: var(--warn); animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .chip[data-state="wait"] .dot { animation: none; } }

  .langpick { display: flex; align-items: center; gap: 8px; }
  .langpick select {
    font-family: var(--font);
    font-size: 13px;
    padding: 5px 9px;
    border-radius: var(--r);
    border: 1px solid var(--line);
    background: var(--bg3);
    color: var(--ink);
  }
  .langpick .globe { color: var(--dim); font-size: 14px; }

  /* ---------- rail ---------- */
  .body { flex: 1 1 auto; display: grid; grid-template-columns: 234px minmax(0, 1fr); }

  /* The column, not the tablist, is what sticks — so the foot of it can sit at
     the bottom of the screen while the tabs stay at the top. */
  .railCol {
    /* --topH is the header's measured height, set on load and whenever it
       changes size. It wraps on a narrow window, so a constant here is wrong
       by a whole row exactly when the screen can least afford it.

       --logH is the same idea at the other end: the open log is a fixed panel
       at bottom: 0, up to 34vh, and this column's foot sits flush with the
       bottom of the screen. Without subtracting it, opening the log put BOTH
       of the foot's buttons underneath the panel — the one that closes the log,
       and the primary write-to-OBS button (実測 2026-08-26: log at y531-805,
       the two buttons at y718-746 and y754-793, elementFromPoint returning the
       log's own lines). It is 0px whenever the log is shut. */
    position: sticky; top: var(--topH, 58px); align-self: start;
    height: calc(100vh - var(--topH, 58px) - var(--logH, 0px));
    display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
  }

  .rail {
    display: flex; flex-direction: column; gap: 4px;
    padding: 18px 12px;
    /* Yield to the foot when the window is short: the tabs can scroll, the
       write button may not go off the bottom of the screen. */
    min-height: 0; overflow-y: auto;
  }

  .railFoot {
    margin-top: auto;
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--line);
  }
  .railFoot .dockRow { padding: 0 2px 2px; }
  .railFoot button { width: 100%; }
  .railBtn {
    display: flex; flex-direction: column; gap: 1px;
    width: 100%; text-align: left;
    padding: 9px 12px;
    border: 1px solid transparent;
    border-radius: var(--r);
    background: transparent;
    color: var(--ink);
    font-family: var(--font);
    cursor: pointer;
  }
  .railBtn:hover { background: #151b23; }
  .railBtn[aria-selected="true"] { background: var(--bg2); border-color: var(--line); }
  .railBtn[aria-selected="true"] .rTitle { color: rgb(var(--acc-rgb)); }
  .rTitle { font-size: 14px; font-weight: 640; }
  .rState { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .02em; }
  .railBtn[data-ok="1"] .rState { color: var(--ok); }

  /* ---------- panes ---------- */
  /* The same subtraction for the reading column: the panel is fixed, so without
     this the last step of whichever tab is open sits under it and cannot be
     scrolled to. */
  .pane { padding: 20px 26px calc(48px + var(--logH, 0px)); max-width: 880px; min-width: 0; }
  .tabpane[hidden] { display: none; }

  .step { padding: 20px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 11px; }
  .step:first-child { border-top: 0; padding-top: 4px; }
  .step > h2 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .01em; }

  .note { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.6; max-width: 78ch; }
  .note.warn { color: var(--warn); border-left: 2px solid var(--warn); padding-left: 10px; }
  .note.good { color: var(--ok); border-left: 2px solid var(--ok); padding-left: 10px; font-family: var(--mono); font-size: 12.5px; }
  /* Not background information: the one line that says what a photograph will
     actually show. */
  .note.contents { color: var(--ink); border-left: 2px solid rgb(var(--acc-rgb)); padding-left: 10px; overflow-wrap: anywhere; }
  .notice {
    margin: 0;
    padding: 9px 13px;
    border-radius: var(--r);
    background: rgba(217, 160, 62, .13);
    border: 1px solid var(--warn);
    color: var(--warn);
    font-size: 13px;
  }

  /* ---------- fields ---------- */
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .row .wide { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field.port { max-width: 130px; }
  .field > label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .field input, .field select {
    font-family: var(--mono);
    font-size: 14px;
    padding: 9px 11px;
    border-radius: var(--r);
    border: 1px solid var(--line);
    background: var(--bg3);
    color: var(--ink);
    width: 100%;
    min-width: 0;
  }
  .field select[multiple] { height: auto; min-height: 132px; font-size: 13px; }
  .field input:focus-visible, .field select:focus-visible,
  .langpick select:focus-visible {
    outline: 2px solid rgb(var(--acc-rgb));
    outline-offset: 1px;
  }
  /* A checkbox is not a labelled field: the words sit beside it and are part
     of the target, and it must not take the width a text input would. */
  label.check {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 14px; color: var(--ink); cursor: pointer;
  }
  label.check input { width: 17px; height: 17px; flex: none; accent-color: rgb(var(--acc-rgb)); }

  /* ---------- buttons ---------- */
  .btns { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  button {
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 17px;
    border-radius: var(--r);
    border: 1px solid var(--line);
    background: #232935;
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { background: #2d3543; }
  button.primary { background: rgb(var(--acc-rgb)); border-color: transparent; color: #fff; }
  button.primary:hover { filter: brightness(1.12); }
  button.ghost { background: transparent; }
  button.ghost:hover { background: #151b23; }
  button.big { font-size: 15px; padding: 12px 26px; }
  button.mini { font-family: var(--mono); font-size: 11.5px; font-weight: 500; padding: 6px 11px; }
  button:disabled { opacity: .42; cursor: default; }
  button:disabled:hover { background: #232935; filter: none; }
  button.primary:disabled:hover { background: rgb(var(--acc-rgb)); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .ebs-badge {
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--dim);
  }
  .ebs-badge [data-state="live"] { color: var(--ok); }
  .ebs-badge [data-state="error"] { color: var(--bad); }
  .ebs-badge [data-state="connecting"] { color: var(--warn); }

  /* ---------- disclosure ---------- */
  details.more { border: 1px solid var(--line); border-radius: var(--r); background: #0f141a; }
  details.more > summary {
    cursor: pointer;
    padding: 9px 13px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    list-style: none;
  }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "\25B8  "; }
  details.more[open] > summary::before { content: "\25BE  "; }
  details.more > summary:hover { color: var(--ink); }
  details.more .inner { padding: 0 13px 13px; }

  /* ---------- look controls ---------- */
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .grp { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .grp > label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .opts { display: flex; gap: 7px; flex-wrap: wrap; }
  .opts button { font-family: var(--mono); font-size: 12.5px; font-weight: 500; padding: 7px 13px; }
  .opts button[aria-pressed="true"] { background: rgb(var(--acc-rgb)); border-color: transparent; color: #fff; }
  /* swatches show both colours of a preset, because the pair is the point */
  .opts button.sw { display: inline-flex; align-items: center; gap: 4px; padding: 8px 11px; }
  .opts button.sw i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .opts button.sw .a { background: rgb(var(--sw-a)); }
  .opts button.sw .p { background: rgb(var(--sw-p)); }
  /* @generated accent-swatches — src/shared/accents.json。手で書き換えない */
  .opts button.sw[data-accent="safelight"] { --sw-a: 176,62,52;  --sw-p: 224,176,96; }
  .opts button.sw[data-accent="neon"]      { --sw-a: 198,72,140; --sw-p: 116,202,218; }
  .opts button.sw[data-accent="ocean"]     { --sw-a: 44,118,142; --sw-p: 226,178,102; }
  .opts button.sw[data-accent="forest"]    { --sw-a: 64,118,80;  --sw-p: 206,172,104; }
  .opts button.sw[data-accent="violet"]    { --sw-a: 120,90,188; --sw-p: 230,196,124; }
  .opts button.sw[data-accent="mono"]      { --sw-a: 88,94,106;  --sw-p: 226,186,108; }
  /* @end accent-swatches */
  .opts button.sw[aria-pressed="true"] { background: #232935; border-color: #fff; }

  .preview {
    width: 100%;
    max-width: 520px;
    border-radius: var(--r);
    border: 1px solid var(--line);
    display: block;
  }

  /* ---------- dock ----------
     Writing to OBS is what makes any setting take effect, so it cannot be a
     step at the bottom of the page. It is here, always, saying whether what is
     on screen has reached OBS yet. */
  .logdock {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 8;
    background: rgba(11, 14, 19, .97);
    backdrop-filter: blur(10px);
  }
  .dockRow { display: flex; align-items: center; gap: 12px; padding: 11px 24px; flex-wrap: wrap; }
  .dockDot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; margin-top: 4px; align-self: flex-start; }
  /* Addressed by id rather than class: the state lives on whichever element
     carries the dock now, and that moved into the rail. */
  #dock[data-state="dirty"] .dockDot { background: var(--warn); }
  #dock[data-state="stale"] .dockDot { background: var(--warn); }
  #dock[data-state="none"]  .dockDot { background: var(--dim); }
  .dockText { display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto; min-width: 0; }
  #dockState { font-size: 12.5px; line-height: 1.45; }
  #dock[data-state="dirty"] #dockState, #dock[data-state="stale"] #dockState { color: var(--warn); }
  #dockLast { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  /* The way out, and the label that says what this is. Outside the scroller so
     it cannot scroll away from the person looking for it. */
  .logbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 7px 24px;
    border-top: 1px solid var(--line);
  }
  .logbarTtl { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  .logwrap { max-height: 34vh; overflow: auto; border-top: 1px solid var(--line); }
  .log {
    padding: 12px 24px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.75;
    color: var(--dim);
    word-break: break-word;
  }
  .log .ok   { color: var(--ok); }
  .log .bad  { color: var(--bad); }
  .log .warn { color: var(--warn); }

  /* ---------- overwrite confirmation ----------
     A page-owned panel rather than confirm(): a native modal blocks every
     event the page is in the middle of, and this one interrupts a run of
     obs-websocket requests. */
  .modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(4, 6, 9, .74); }
  .modal[hidden] { display: none; }
  .modalCard {
    width: min(560px, 92vw);
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
  }
  .modalCard h2 { margin: 0; font-size: 16px; }
  .modalCard p { margin: 0; font-size: 13.5px; line-height: 1.65; color: var(--ink); overflow-wrap: anywhere; }
  .modalCard .btns { justify-content: flex-end; }

  /* Settings are written as they are touched. Without a word for it, the page
     looks like it is waiting for a save button that does not exist. */
  #toast {
    position: fixed;
    left: 50%; bottom: 76px;
    transform: translate(-50%, 12px);
    padding: 9px 20px;
    border-radius: 999px;
    background: var(--bg3);
    border: 1px solid var(--line);
    font-size: 13px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 20;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { #toast { transition: opacity .18s ease; } }

  /* .field and .row set display, which outranks the browser's own
     [hidden] { display: none } — so every "hidden" field stayed on screen and
     choices that are exclusive read as if they were all offered at once. */
  [hidden] { display: none !important; }

  /* ---------- narrow windows ----------
     The rail becomes a row of tabs rather than disappearing: the three areas
     are the only way to know how much of this there is. */
  @media (max-width: 880px) {
    .body { grid-template-columns: minmax(0, 1fr); }
    /* One column, so the rail lies down as a row of tabs and its foot becomes a
       row under them rather than a column beside the page. */
    .railCol {
      position: static;
      height: auto;
      top: auto;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .rail {
      flex-direction: row;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 14px;
    }
    .railBtn { flex: 0 0 auto; width: auto; }
    .railFoot {
      flex-direction: row; align-items: center; flex-wrap: wrap;
      padding: 10px 16px;
    }
    .railFoot .dockRow { flex: 1 1 200px; padding: 0; }
    .railFoot button { width: auto; }
    .pane { padding: 16px 16px calc(48px + var(--logH, 0px)); }
    .top, .dockRow, .log { padding-left: 16px; padding-right: 16px; }
    .railFoot .dockRow { padding-left: 0; padding-right: 0; }
  }
</style>

<div id="toast" role="status" aria-live="polite"></div>

<div class="app">
  <header class="top">
    <h1 id="ttl"></h1>
    <!-- Beside the title, not pushed to the right edge. Both of these are read
         at a glance or not at all, and at the far end of a wide header the eye
         goes straight past them (report from the first real run, 2026-08-26). -->
    <div class="chip" id="chip" data-state="wait"><span class="dot"></span><span id="chipText"></span></div>
    <div class="langpick">
      <span class="globe" aria-hidden="true">&#127760;</span>
      <label for="uiLang" id="lLang" class="rState"></label>
      <select id="uiLang"></select>
    </div>
    <span class="grow"></span>
  </header>

  <div class="body">
    <div class="railCol">
    <nav class="rail" id="rail" role="tablist" aria-orientation="vertical">
      <button class="railBtn" type="button" role="tab" data-pane="obs" aria-selected="true" aria-controls="paneObs">
        <span class="rTitle" id="rObs"></span><span class="rState" id="rObsSt"></span>
      </button>
      <button class="railBtn" type="button" role="tab" data-pane="ext" aria-selected="false" aria-controls="paneExt">
        <span class="rTitle" id="rExt"></span><span class="rState" id="rExtSt"></span>
      </button>
      <button class="railBtn" type="button" role="tab" data-pane="look" aria-selected="false" aria-controls="paneLook">
        <span class="rTitle" id="rLook"></span><span class="rState" id="rLookSt"></span>
      </button>
    </nav>

      <!-- Outside the tablist on purpose: a tablist's children are tabs, and
           these two are not. Inside the COLUMN, though, because that is where
           the broadcaster is already looking — in the page footer they were the
           last two things anybody found (report, 2026-08-26). -->
      <div class="railFoot" id="dock" data-state="none">
        <div class="dockRow">
          <span class="dockDot"></span>
          <span class="dockText">
            <span id="dockState"></span>
            <span id="dockLast"></span>
          </span>
        </div>
        <button class="ghost mini" id="btnLog" aria-expanded="false"></button>
        <button class="primary" id="btnPush"></button>
      </div>
    </div>

    <main class="pane">

      <p class="lede" id="lede"></p>

      <!-- ================= OBS =================
           Connecting, building the pieces, and deciding when the shutter
           works are all conversations with the same program, so they are
           one area. They used to be steps 1, 2, 3 and 7, with the extension
           and the appearance settings in between. -->
      <section class="tabpane" id="paneObs" role="tabpanel" aria-labelledby="rObs">
        <section class="step">
          <h2 id="sObs"></h2>
          <p class="note" id="nObs"></p>
          <div class="row">
            <div class="field"><label for="host" id="lHost"></label><input id="host" value="127.0.0.1" spellcheck="false"></div>
            <div class="field port"><label for="port" id="lPort"></label><input id="port" value="4455" inputmode="numeric" spellcheck="false"></div>
            <div class="field"><label for="pw" id="lPw"></label><input id="pw" type="password" spellcheck="false"></div>
          </div>
          <div class="btns"><button class="primary" id="btnConnect"></button></div>
        </section>

        <!-- One button, because there is one right answer.
             Choosing an existing scene to photograph was a way to point the
             camera at the live scene by accident, and choosing an existing
             browser source was a way to overwrite something else. Both are
             made here now, and a name that is already taken asks first. -->
        <section class="step">
          <h2 id="sBuild"></h2>
          <p class="note" id="nBuild"></p>
          <!-- Above the button, because it is what the button will do. -->
          <div class="field dest">
            <label for="newSrcScene" id="lHostScene"></label>
            <select id="newSrcScene"></select>
            <p class="note" id="hHostScene"></p>
          </div>
          <div class="btns">
            <button class="primary big" id="btnBuild"></button>
            <button class="mini" id="btnRefresh"></button>
            <button class="mini" id="btnShot" disabled></button>
          </div>
          <p class="note good" id="buildReady" hidden></p>
          <p class="notice" id="notice" hidden></p>
          <!-- What a photograph of the capture scene would contain. The gate
               decides when the shutter works; this says what it takes. -->
          <p class="note contents" id="contents" hidden></p>
          <img class="preview" id="preview" hidden alt="">
          <details class="more" id="dNames">
            <summary id="sNames"></summary>
            <div class="inner row">
              <div class="field"><label for="capName" id="lCapName"></label><input id="capName" spellcheck="false"></div>
              <div class="field"><label for="newSrcName" id="lNewSrcName"></label><input id="newSrcName" spellcheck="false"></div>
            </div>
          </details>
        </section>

        <!-- When the button works, kept apart from what it photographs. The
             two answer different questions and one of them decides what ends
             up in a picture, so reading them as one setting is how a scene
             gets allowed that was never meant to be. -->
        <section class="step">
          <h2 id="sGate"></h2>
          <p class="note" id="nGate"></p>
          <label class="check"><input id="gateAll" type="checkbox"> <span id="lGateAll"></span></label>
          <div class="field">
            <label for="gateScenes" id="lGate"></label>
            <select id="gateScenes" multiple size="6"></select>
          </div>
          <!-- Shown until the question is answered, because until then the
               shutter is closed and nothing else on this page says why. -->
          <p class="note warn" id="warnGate"></p>
          <p class="note" id="hGate"></p>
          <p class="note" id="hLive"></p>
          <!-- A way to see the effects without going live. Time-limited on
               purpose: a switch that turns the shutter on off-air is exactly
               the thing nobody should be able to leave on by mistake. -->
          <div class="btns"><button id="btnTest" type="button"></button></div>
          <p class="note" id="hTest"></p>
        </section>
      </section>

      <!-- ================= Twitch ================= -->
      <section class="tabpane" id="paneExt" role="tabpanel" aria-labelledby="rExt" hidden>
        <section class="step">
          <h2 id="sExt"></h2>
          <p class="note" id="nExt"></p>
          <div class="row">
            <div class="field wide">
              <label for="pairCode" id="lPair"></label>
              <input id="pairCode" spellcheck="false" placeholder="sp1…">
            </div>
          </div>
          <p class="note" id="hPair"></p>
          <p class="note" id="pairInfo" hidden></p>
          <div class="btns">
            <button id="btnEbs"></button>
            <span class="ebs-badge"><span id="ebsState"></span></span>
          </div>
        </section>
      </section>

      <!-- ================= look and saving ================= -->
      <section class="tabpane" id="paneLook" role="tabpanel" aria-labelledby="rLook" hidden>
        <section class="step">
          <h2 id="sLook"></h2>
          <p class="note" id="nLook"></p>
          <div class="settings">
            <div class="grp">
              <label id="lPreset"></label>
              <div class="opts" id="grpPreset">
                <!-- Labels come from the dictionary, like every other word here. -->
                <button type="button" data-preset="standard" aria-pressed="true"></button>
                <button type="button" data-preset="hype"></button>
                <button type="button" data-preset="subtle"></button>
                <button type="button" data-preset="quiet"></button>
              </div>
            </div>
            <div class="grp">
              <label id="lAccent"></label>
              <div class="opts" id="grpAccent">
                <!-- These are swatches with no text of their own, so the name is
                     the only thing a screen reader has: title and aria-label are
                     both filled in from the dictionary. -->
                <button type="button" class="sw" data-accent="safelight" aria-pressed="true"><i class="a"></i><i class="p"></i></button>
                <button type="button" class="sw" data-accent="neon"><i class="a"></i><i class="p"></i></button>
                <button type="button" class="sw" data-accent="ocean"><i class="a"></i><i class="p"></i></button>
                <button type="button" class="sw" data-accent="forest"><i class="a"></i><i class="p"></i></button>
                <button type="button" class="sw" data-accent="violet"><i class="a"></i><i class="p"></i></button>
                <button type="button" class="sw" data-accent="mono"><i class="a"></i><i class="p"></i></button>
              </div>
            </div>
            <div class="grp">
              <label id="lPlace"></label>
              <div class="opts" id="grpPlace">
                <button type="button" data-place="bl" aria-pressed="true">&#9723;&#8601;</button>
                <button type="button" data-place="br">&#8600;&#9723;</button>
              </div>
            </div>
            <div class="grp">
              <label id="lScale"></label>
              <div class="opts" id="grpScale">
                <button type="button" data-scale="0.78">S</button>
                <button type="button" data-scale="1" aria-pressed="true">M</button>
                <button type="button" data-scale="1.24">L</button>
              </div>
            </div>
          </div>
        </section>

        <section class="step">
          <h2 id="sSave"></h2>
          <p class="note" id="nSave"></p>
          <div class="row">
            <div class="field">
              <label for="saveMode" id="lSaveMode"></label>
              <select id="saveMode">
                <option value="off" id="oSaveOff"></option>
                <option value="dir" id="oSaveDir"></option>
              </select>
            </div>
            <!-- What is kept, and how heavy each one is. Two questions rather
                 than one because they trade against different things: the first
                 decides how many files exist, the second how big each is, and a
                 broadcaster who wants every photograph can still want small
                 ones. Nothing here can delete a file (docs/plan.md Phase 6), so
                 both of them only ever act at the moment of writing. -->
            <div class="field" id="fSaveFree" hidden>
              <label for="saveFree" id="lSaveFree"></label>
              <select id="saveFree">
                <option value="1" id="oFreeKeep"></option>
                <option value="0" id="oFreeDrop"></option>
              </select>
            </div>
            <div class="field" id="fSaveParty" hidden>
              <label for="saveParty" id="lSaveParty"></label>
              <select id="saveParty">
                <option value="1" id="oPartyKeep"></option>
                <option value="0" id="oPartyDrop"></option>
              </select>
            </div>
            <div class="field" id="fSaveSize" hidden>
              <label for="saveSize" id="lSaveSize"></label>
              <select id="saveSize">
                <option value="std" id="oSizeStd"></option>
                <option value="small" id="oSizeSmall"></option>
                <option value="min" id="oSizeMin"></option>
              </select>
            </div>
            <div class="field wide" id="fSaveDir" hidden>
              <label for="saveDir" id="lSaveDir"></label>
              <input id="saveDir" spellcheck="false">
            </div>
          </div>
          <p class="note" id="saveEstimate" hidden></p>
          <p class="note" id="hSaveWhat" hidden></p>
          <p class="note" id="hFramed" hidden></p>
          <p class="note" id="hSaveDir" hidden></p>
          <div class="btns">
            <button class="mini" id="btnRecDir" hidden></button>
            <button class="mini" id="btnSaveTest" hidden></button>
          </div>
        </section>

        <section class="step">
          <div class="btns"><button class="ghost" id="btnReset"></button></div>
        </section>
      </section>

    </main>
  </div>

  <!-- The log needs the width of the page, so it stays down here and the
       button that opens it lives in the rail.

       It therefore carries its own way out. The opener is in the rail, which on
       a narrow window is at the TOP of the page and scrolled away by the time
       anybody reads the log — and on a wide one the rail's foot sits at the
       bottom of the viewport, exactly where this panel lands. A panel that can
       cover its own switch has to have a switch of its own (報告 2026-08-26).

       The bar is outside the scroller on purpose: inside it, the way out would
       scroll off the top the moment the log had anything in it. -->
  <footer class="logdock">
    <div id="logpanel" hidden>
      <div class="logbar">
        <span class="logbarTtl" id="logTtl"></span>
        <button class="ghost mini" id="btnLogClose"></button>
      </div>
      <div class="logwrap" id="logwrap"><div class="log" id="log"></div></div>
    </div>
  </footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="modalCard">
    <h2 id="modalTitle"></h2>
    <p id="modalBody"></p>
    <div class="btns" id="modalBtns"></div>
  </div>
</div>
